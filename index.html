  get stars() {
    if (G.rep >= 90) return 5; if (G.rep >= 70) return 4;
    if (G.rep >= 45) return 3; if (G.rep >= 22) return 2;
    if (G.rep >= 8)  return 1; return 0;
  },
  get timeStr() {
    const h = Math.floor(G.gameTime / 60);
    const m = Math.floor(G.gameTime % 60);
    const h12 = h === 0 ? 12 : h > 12 ? h - 12 : h;
    return `${h12}:${String(m).padStart(2,'0')} ${h >= 12 ? 'PM' : 'AM'}`;
  },
  get unlockedMenu() { return MENU.filter(m => m.day <= G.day); },
};

window._gameG = G; // bridge for IIFE animated customers

// init inv/cart
SHOP.forEach(s => { G.inv[s.id] = 0; G.cart[s.id] = 0; });

// ─────────────────────────────────────────────
// GAME LOOP
// ─────────────────────────────────────────────
let rafId = null, lastTs = null, lastRender = 0;

function startLoop() {
  lastTs = null; lastRender = 0;
  function tick(ts) {
    const dt = lastTs ? Math.min((ts - lastTs) / 1000, 0.12) : 0;
    lastTs = ts;
    try { if (G.screen === 'service' && G.isOpen) updateService(dt); } catch(e) { console.error('update err', e); }
    try { if (ts - lastRender >= 80) { lastRender = ts; renderService(); } } catch(e) { console.error('render err', e); }
    rafId = requestAnimationFrame(tick);
  }
  rafId = requestAnimationFrame(tick);
}

function stopLoop() {
  if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
  lastTs = null;
}

function updateService(dt) {
  G.gameTime += dt * TIME_SPEED;
  if (G.gameTime >= SERVICE_END) { endService(); return; }

  // cooking
  for (let i = 0; i < G.cookSlots.length; i++) {
    const s = G.cookSlots[i];
    if (s && s.state === 'cooking') {
      s.elapsed += dt;
      s.progress = Math.min(s.elapsed / s.item.cook, 1);
      if (s.progress >= 1) {
        s.state = 'ready';
        toast(`${s.item.icon} ${s.item.en} is ready!`, 'info');
        AUDIO.playReady();
        autoServe(i);
        try { const area = document.getElementById('cook-area'); if (area) area.innerHTML = buildCookSlots(); } catch(_) {}
      }
    }
  }

  // spawn customers
  G.spawnTimer -= dt;
  if (G.spawnTimer <= 0) {
    const base = 8 + Math.random() * 16;
    G.spawnTimer = base / (G.weather?.custMult || 1);
    try { spawnCust(); } catch(e) { console.error('spawn err', e); }
  }

  // patience
  for (let i = G.customers.length - 1; i >= 0; i--) {
    const c = G.customers[i];
    if (c.state === 'wait') {
      c.patLeft -= dt;
      if (c.patLeft <= 0) {
        c.state = 'gone';
        G.todayLost++;
        G.rep = Math.max(0, G.rep - 3);
        AUDIO.playLeave();
        toast(`${c.icon} ${c.en} left unhappy`, 'err');
        try { const mg = document.getElementById('menu-grid'); if (mg) mg.innerHTML = buildMenuItems(); } catch(_) {}
        setTimeout(() => {
          const idx = G.customers.indexOf(c);
          if (idx !== -1) G.customers.splice(idx, 1);
        }, 600);
      }
    }
  }
}

function autoServe(slotIdx) {
  const slot = G.cookSlots[slotIdx];
  if (!slot || slot.state !== 'ready') return;
  const cust = G.customers.find(c => c.state === 'wait' && c.order && c.order.id === slot.item.id);
  if (cust) doServe(cust, slotIdx);
}

function doServe(cust, slotIdx) {
  const slot = G.cookSlots[slotIdx];
  const price = Math.round(slot.item.price * (G.weather?.tipMult || 1));
  cust.state = 'served';
  G.cookSlots[slotIdx] = null;
  G.money += price;
  G.todayEarned += price;
  G.todayServed++;
  G.rep = Math.min(100, G.rep + 2);
  AUDIO.playServe();
  floatYen(`+¥${price}`);
  try { if (window._iifeMasterServe) window._iifeMasterServe(slot.item.id); } catch(_) {}
  try { const area = document.getElementById('cook-area'); if (area) area.innerHTML = buildCookSlots(); } catch(_) {}
  try { const mg = document.getElementById('menu-grid'); if (mg) mg.innerHTML = buildMenuItems(); } catch(_) {}
  setTimeout(() => {
    if (!cust.reordered && Math.random() < 0.35) {
      const claimed = {};
      G.customers.filter(c => c.state === 'wait' && c.order).forEach(c => { claimed[c.order.id] = (claimed[c.order.id] || 0) + 1; });
      const available = MENU.filter(m => {
        const s = SHOP.find(x => x.forItem === m.id);
        return s && G.inv[s.id] - (claimed[m.id] || 0) > 0;
      });
      if (available.length > 0) {
        cust.order = available[Math.floor(Math.random() * available.length)];
        cust.patLeft = cust.patMax * 0.75;
        cust.reordered = true;
        cust.state = 'wait';
        AUDIO.playArrive();
        toast(`${cust.icon} ${cust.en} wants another round! ${cust.order.icon}`, 'info');
        const rid = cust.order.id;
        if (window._iifeOrderSpeech) setTimeout(() => { try { window._iifeOrderSpeech(rid); } catch(_) {} }, 400);
        try { const cl = document.getElementById('customer-list'); if (cl) cl.innerHTML = buildCustList(); } catch(_) {}
        try { const mg = document.getElementById('menu-grid'); if (mg) mg.innerHTML = buildMenuItems(); } catch(_) {}
        // Serve immediately if matching food is already ready
        for (let si = 0; si < G.cookSlots.length; si++) {
          const s = G.cookSlots[si];
          if (s && s.state === 'ready' && s.item.id === cust.order.id) { autoServe(si); break; }
        }
        return;
      }
    }
    const idx = G.customers.indexOf(cust);
    if (idx !== -1) G.customers.splice(idx, 1);
  }, 700);
}

function spawnCust() {
  const waitingList = G.customers.filter(c => c.state === 'wait');
  if (waitingList.length >= 4) return;

  // Count how many of each item are already claimed by waiting customers
  const claimed = {};
  waitingList.filter(c => c.order).forEach(c => { claimed[c.order.id] = (claimed[c.order.id] || 0) + 1; });

  const canOrder = pid => {
    const m = MENU.find(x => x.id === pid);
    if (!m || m.day > G.day) return false;
    const s = SHOP.find(x => x.forItem === pid);
    if (!s) return false;
    return G.inv[s.id] - (claimed[pid] || 0) > 0;
  };

  const type = CUST_TYPES[Math.floor(Math.random() * CUST_TYPES.length)];
  const avail = type.prefs.filter(canOrder);

  let order;
  if (avail.length > 0) {
    order = MENU.find(m => m.id === avail[Math.floor(Math.random() * avail.length)]);
  } else {
    const any = MENU.filter(m => canOrder(m.id));
    if (!any.length) return;
    order = any[Math.floor(Math.random() * any.length)];
  }

  const pat = type.patience * (0.85 + Math.random() * 0.3);
  G.customers.push({
    id: G.nextId++,
    type: type.type, jp: type.jp, en: type.en, icon: type.icon,
    order, patMax: pat, patLeft: pat, state: 'wait'
  });
  AUDIO.playArrive();
  if (order && window._iifeOrderSpeech) setTimeout(() => { try { window._iifeOrderSpeech(order.id); } catch(_) {} }, 400);
  try { const mg = document.getElementById('menu-grid'); if (mg) mg.innerHTML = buildMenuItems(); } catch(_) {}
}

function playOutro(onDone) {
  const ic = document.createElement('canvas');
  ic.style.cssText = 'position:fixed;inset:0;z-index:500;pointer-events:all;';
  ic.width = window.innerWidth; ic.height = window.innerHeight;
  document.body.appendChild(ic);

  const skipBtn = document.createElement('button');
  skipBtn.textContent = 'SKIP ›';
  skipBtn.style.cssText = 'position:fixed;bottom:28px;right:24px;z-index:501;' +
    'background:rgba(0,0,0,.42);color:rgba(255,255,255,.40);' +
    'border:1px solid rgba(255,255,255,.15);border-radius:4px;' +
    'padding:7px 16px;font-size:12px;letter-spacing:1px;cursor:pointer;font-family:inherit;';
  document.body.appendChild(skipBtn);

  const g = ic.getContext('2d');
  const W = ic.width, H = ic.height;
  let t0 = null, done = false, doneFired = false;
  const TOTAL = 8.5;

  const eo3 = t => 1 - Math.pow(1 - t, 3);
  const lr   = (a, b, t) => a + (b - a) * t;
  const c01  = t => Math.max(0, Math.min(1, t));
  const ph   = (s, e, T) => eo3(c01((T - s) / (e - s)));

  function finish() {
    if (done) return; done = true;
    if (!doneFired) { doneFired = true; onDone(); }
    let a = 1;
    const id = setInterval(() => {
      a -= 0.06; ic.style.opacity = Math.max(0, a).toFixed(2);
      if (a <= 0) { clearInterval(id); ic.remove(); skipBtn.remove(); }
    }, 16);
  }
  skipBtn.onclick = finish;

  // ── STARS ────────────────────────────────────
  const STARS = Array.from({length:90}, (_,i) => ({
    x: ((i*137+41)%997)/997,
    y: ((i*79+23)%997)/997 * 0.55,
    r: i%5===0 ? 1.4 : 0.55,
    a: 0.2 + (i%9)/18,
  }));

  function drawScene(T, offsetX) {
    const CX = W*0.50 + offsetX;
    const sw = Math.min(W*0.60, 420);
    const sx = CX - sw/2, ex = CX + sw/2;
    const roofPeak = H*0.26, eaveY = H*0.39;
    const counterY = H*0.57, baseY = H*0.67, wheelCY = H*0.715;
    const wheelR = H*0.046;

    // Ground
    g.fillStyle = '#09080a';
    g.fillRect(0, wheelCY + wheelR*0.6, W, H - wheelCY - wheelR*0.6);
    g.strokeStyle = 'rgba(60,40,20,0.25)'; g.lineWidth = 1;
    g.beginPath(); g.moveTo(0, wheelCY + wheelR*0.6); g.lineTo(W, wheelCY + wheelR*0.6); g.stroke();

    // ── WHEELS ──
    const wheelXs = [sx + sw*0.14, ex - sw*0.14];
    const spokeA = offsetX * 0.025;
    wheelXs.forEach(wx => {
      g.fillStyle = 'rgba(0,0,0,0.35)';
      g.beginPath(); g.ellipse(wx+3, wheelCY + wheelR*0.15, wheelR*1.05, wheelR*0.28, 0, 0, Math.PI*2); g.fill();
      g.fillStyle = '#18100a';
      g.beginPath(); g.arc(wx, wheelCY, wheelR, 0, Math.PI*2); g.fill();
      g.strokeStyle = '#3a2008'; g.lineWidth = 2.5;
      g.beginPath(); g.arc(wx, wheelCY, wheelR, 0, Math.PI*2); g.stroke();
      for (let sp=0;sp<6;sp++) {
        const a = spokeA + sp*Math.PI/3;
        g.strokeStyle = '#2e1a08'; g.lineWidth = 1.5;
        g.beginPath(); g.moveTo(wx,wheelCY); g.lineTo(wx+Math.cos(a)*wheelR*0.82, wheelCY+Math.sin(a)*wheelR*0.82); g.stroke();
      }
      g.fillStyle = '#6a3a14'; g.beginPath(); g.arc(wx,wheelCY,wheelR*0.13,0,Math.PI*2); g.fill();
    });

    // ── CART BODY ──
    g.fillStyle = '#1e1006';
    g.fillRect(sx, baseY, sw, wheelCY - baseY + wheelR*0.2);
    g.fillStyle = '#2a1808';
    g.fillRect(sx - 4, counterY + H*0.025, sw + 8, baseY - counterY - H*0.025);
    // Vertical planks
    g.strokeStyle = 'rgba(60,35,12,0.6)'; g.lineWidth = 1;
    for (let pl=1;pl<5;pl++) {
      const px = sx + sw*pl/5;
      g.beginPath(); g.moveTo(px, counterY+H*0.03); g.lineTo(px, baseY); g.stroke();
    }

    // ── COUNTER ──
    g.fillStyle = '#3d2008';
    g.beginPath();
    g.moveTo(sx - 6, counterY);
    g.lineTo(ex + 6, counterY);
    g.lineTo(ex + 6, counterY + H*0.028);
    g.lineTo(sx - 6, counterY + H*0.028);
    g.closePath(); g.fill();
    g.fillStyle = '#5c3212';
    g.fillRect(sx-6, counterY, sw+12, H*0.006);

    // ── INTERIOR GLOW (fades as lights go out) ──
    const lightFade = Math.max(0, 1 - ph(0.8, 2.5, T));
    if (lightFade > 0) {
      const ig = g.createLinearGradient(sx, eaveY, sx, counterY);
      ig.addColorStop(0, `rgba(255,180,60,${lightFade*0.18})`);
      ig.addColorStop(1, `rgba(255,140,30,${lightFade*0.06})`);
      g.fillStyle = ig;
      g.fillRect(sx+2, eaveY, sw-4, counterY-eaveY);
    }

    // ── SIDE POSTS ──
    g.fillStyle = '#2a1608';
    g.fillRect(sx, eaveY, sw*0.045, counterY - eaveY);
    g.fillRect(ex - sw*0.045, eaveY, sw*0.045, counterY - eaveY);

    // ── NOREN ──
    const norenRise = ph(2.2, 3.8, T);
    const norenTopY = eaveY + H*0.008;
    const norenBotY = lr(counterY - H*0.015, norenTopY + H*0.005, norenRise);
    if (norenBotY > norenTopY + 4) {
      const panelW = sw * 0.27, gap = sw * 0.035;
      const totalPW = 3*panelW + 2*gap;
      const npx = CX - totalPW/2;
      [0,1,2].forEach(pi => {
        const px = npx + pi*(panelW+gap);
        const col = pi===1 ? '#a01818' : '#8a1212';
        g.fillStyle = col;
        g.beginPath();
        g.moveTo(px, norenTopY);
        g.lineTo(px+panelW, norenTopY);
        g.lineTo(px+panelW, norenBotY - H*0.008);
        g.quadraticCurveTo(px+panelW*0.5, norenBotY+H*0.006, px, norenBotY - H*0.008);
        g.closePath(); g.fill();
        // White stripe near top
        g.fillStyle = 'rgba(255,240,220,0.15)';
        g.fillRect(px, norenTopY, panelW, H*0.005);
        if (pi===1) {
          g.fillStyle = 'rgba(255,220,140,0.85)';
          g.font = `bold ${Math.round((norenBotY-norenTopY)*0.55)}px serif`;
          g.textAlign = 'center';
          g.fillText('夜台', px+panelW/2, (norenTopY+norenBotY)*0.5 + (norenBotY-norenTopY)*0.18);
        }
      });
      // Noren rod
      g.strokeStyle = '#7a5020'; g.lineWidth = 3;
      g.beginPath(); g.moveTo(npx - 4, norenTopY); g.lineTo(npx+totalPW+4, norenTopY); g.stroke();
    }

    // ── ROOF ──
    // Underside
    g.fillStyle = '#1a0e06';
    g.beginPath();
    g.moveTo(sx - sw*0.06, eaveY);
    g.lineTo(CX, roofPeak);
    g.lineTo(ex + sw*0.06, eaveY);
    g.closePath(); g.fill();
    // Top surface
    g.fillStyle = '#221208';
    g.beginPath();
    g.moveTo(sx - sw*0.06, eaveY - H*0.008);
    g.lineTo(CX, roofPeak - H*0.01);
    g.lineTo(ex + sw*0.06, eaveY - H*0.008);
    g.closePath(); g.fill();
    // Ridge cap
    g.fillStyle = '#3a2010';
    g.fillRect(CX - sw*0.04, roofPeak - H*0.018, sw*0.08, H*0.018);
    // Eave edge
    g.strokeStyle = '#5c3010'; g.lineWidth = 3;
    g.beginPath(); g.moveTo(sx - sw*0.07, eaveY); g.lineTo(ex + sw*0.07, eaveY); g.stroke();
    // Roof tiles (horizontal lines)
    g.strokeStyle = 'rgba(80,48,18,0.45)'; g.lineWidth = 1;
    for (let ti=1; ti<7; ti++) {
      const t2 = ti/7;
      const ty = lr(roofPeak, eaveY, t2);
      const tx = sw*0.5 * t2;
      g.beginPath(); g.moveTo(CX-tx - sw*0.06*t2, ty); g.lineTo(CX+tx + sw*0.06*t2, ty); g.stroke();
    }

    // ── LANTERNS ──
    const lampXs = [CX - sw*0.32, CX, CX + sw*0.32];
    const dimTimes = [1.4, 0.7, 1.9];
    lampXs.forEach((lx, li) => {
      const dimT = dimTimes[li];
      const lAl = Math.max(0, 1 - ph(dimT, dimT+0.55, T));
      const ly = eaveY - H*0.075;
      const lr2 = H*0.038;

      // Hanging cord
      g.strokeStyle = 'rgba(80,50,20,0.55)'; g.lineWidth = 1.2;
      g.beginPath(); g.moveTo(lx, eaveY - H*0.004); g.lineTo(lx, ly - lr2); g.stroke();

      // Glow halo
      if (lAl > 0.05) {
        const gl = g.createRadialGradient(lx, ly, 0, lx, ly, lr2*5);
        gl.addColorStop(0, `rgba(255,130,30,${lAl*0.38})`);
        gl.addColorStop(0.5, `rgba(255,90,10,${lAl*0.10})`);
        gl.addColorStop(1, 'rgba(0,0,0,0)');
        g.beginPath(); g.arc(lx, ly, lr2*5, 0, Math.PI*2);
        g.fillStyle = gl; g.fill();
      }

      // Body
      const bodyR = lAl > 0 ? Math.round(lr(30, 220, lAl)) : 40;
      const bodyG2 = lAl > 0 ? Math.round(lr(12, 80, lAl)) : 15;
      const bodyB  = lAl > 0 ? Math.round(lr(5,  18, lAl)) : 8;
      g.fillStyle = `rgb(${bodyR},${bodyG2},${bodyB})`;
      g.beginPath(); g.ellipse(lx, ly, lr2*0.62, lr2, 0, 0, Math.PI*2); g.fill();

      // Ribs
      g.strokeStyle = 'rgba(20,8,2,0.6)'; g.lineWidth = 0.9;
      for (let rb=-2;rb<=2;rb++) {
        const ry2 = ly + rb*lr2*0.38;
        const rw = lr2*0.62 * Math.sqrt(1 - Math.pow(rb*0.38,2));
        g.beginPath(); g.moveTo(lx-rw, ry2); g.lineTo(lx+rw, ry2); g.stroke();
      }

      // Top & bottom caps
      g.fillStyle = '#7a4010';
      g.beginPath(); g.ellipse(lx, ly-lr2+H*0.002, lr2*0.3, H*0.006, 0, 0, Math.PI*2); g.fill();
      g.beginPath(); g.ellipse(lx, ly+lr2-H*0.002, lr2*0.3, H*0.006, 0, 0, Math.PI*2); g.fill();

      // 夜 kanji
      if (lAl > 0.2) {
        g.fillStyle = `rgba(255,210,80,${lAl*0.92})`;
        g.font = `bold ${Math.round(lr2*0.82)}px serif`;
        g.textAlign = 'center';
        g.fillText('夜', lx, ly + lr2*0.30);
      }
    });

    // ── CLOSING TEXT ──
    const txtA = Math.min(1, ph(0.2,0.9,T)) * Math.max(0, 1-ph(4.2,5.0,T));
    if (txtA > 0) {
      g.save(); g.globalAlpha = txtA;
      g.fillStyle = 'rgba(255,200,100,0.95)';
      g.font = `bold ${Math.round(H*0.072)}px serif`;
      g.textAlign = 'center';
      g.shadowColor = 'rgba(255,120,20,0.7)'; g.shadowBlur = 28;
      g.fillText('閉店', W*0.5, H*0.165);
      g.shadowBlur = 0;
      g.font = `${Math.round(H*0.024)}px serif`;
      g.fillStyle = 'rgba(200,170,110,0.75)';
      g.fillText('Thank you for tonight', W*0.5, H*0.215);
      g.restore();
    }
  }

  function frame(ts) {
    if (done) return;
    if (!t0) t0 = ts;
    const T = (ts - t0) / 1000;
    if (T >= TOTAL) { finish(); return; }

    // Sky
    const skyFade = ph(6.8, 8.2, T);
    const skyR = Math.round(lr(3, 0, skyFade)), skyG = Math.round(lr(5, 0, skyFade)), skyB = Math.round(lr(8, 0, skyFade));
    g.fillStyle = `rgb(${skyR},${skyG},${skyB})`;
    g.fillRect(0, 0, W, H);

    // Stars
    STARS.forEach(s => {
      const twink = s.a * (0.7 + 0.3*Math.sin(T*1.8 + s.x*6));
      g.fillStyle = `rgba(255,255,255,${(twink*(1-skyFade)).toFixed(2)})`;
      g.beginPath(); g.arc(s.x*W, s.y*H, s.r, 0, Math.PI*2); g.fill();
    });

    // Stall slides right starting at t=4.2
    const slide = ph(4.2, 7.2, T);
    const offsetX = slide * W * 1.35;

    drawScene(T, offsetX);

    // Final fade to black
    if (T > 6.8) {
      g.fillStyle = `rgba(0,0,0,${ph(6.8, 8.0, T)})`;
      g.fillRect(0, 0, W, H);
    }

    requestAnimationFrame(frame);
  }

  requestAnimationFrame(frame);
}

function endService() {
  G.isOpen = false;
  window.stallOpen = false;
  stopLoop();
  AUDIO.stopService();
  playOutro(() => {
    G.screen = 'review';
    fullRender();
  });
}

// ─────────────────────────────────────────────
// ACTIONS (called from HTML onclick)
// ─────────────────────────────────────────────
// ─────────────────────────────────────────────
// INTRO CUTSCENE
// ─────────────────────────────────────────────
function playIntro(onDone) {
  const ic = document.createElement('canvas');
  ic.style.cssText = 'position:fixed;inset:0;z-index:500;pointer-events:all;';
  ic.width = window.innerWidth; ic.height = window.innerHeight;
  document.body.appendChild(ic);

  const skipBtn = document.createElement('button');
  skipBtn.textContent = 'SKIP ›';
  skipBtn.style.cssText = 'position:fixed;bottom:28px;right:24px;z-index:501;' +
    'background:rgba(0,0,0,.42);color:rgba(255,255,255,.40);' +
    'border:1px solid rgba(255,255,255,.15);border-radius:4px;' +
    'padding:7px 16px;font-size:12px;letter-spacing:1px;cursor:pointer;font-family:inherit;';
  document.body.appendChild(skipBtn);

  const g = ic.getContext('2d');
  const W = ic.width, H = ic.height;
  let t0 = null, done = false, doneFired = false;
  const TOTAL = 13.5;

  const eo3 = t => 1 - Math.pow(1 - t, 3);
  const lr   = (a, b, t) => a + (b - a) * t;
  const c01  = t => Math.max(0, Math.min(1, t));
  const ph   = (s, e, T) => eo3(c01((T - s) / (e - s)));

  function finish() {
    if (done) return; done = true;
    if (!doneFired) { doneFired = true; onDone(); }
    let a = 1;
    const id = setInterval(() => {
      a -= 0.06; ic.style.opacity = Math.max(0, a).toFixed(2);
      if (a <= 0) { clearInterval(id); ic.remove(); skipBtn.remove(); }
    }, 16);
  }
  skipBtn.onclick = finish;

  function drawStars(alpha) {
    for (let i = 0; i < 110; i++) {
      const sx = ((i*137+41)%997)/997*W, sy = ((i*79+23)%997)/997*H*0.42;
      const sr = i%5===0?1.5:0.65, sa = (0.25+(i%9)/18)*alpha;
      g.fillStyle = `rgba(255,255,255,${sa.toFixed(2)})`;
      g.beginPath(); g.arc(sx,sy,sr,0,Math.PI*2); g.fill();
    }
  }

  function drawBldgs() {
    g.fillStyle = '#020508';
    [[0,.20,.13],[.10,.30,.09],[.07,.14,.055],[.78,.18,.13],[.87,.27,.13],[.82,.11,.065]]
      .forEach(([x,y,w]) => g.fillRect(x*W,y*H,w*W,H));
    g.fillStyle = '#030609';
    [[.22,.36,.07],[.66,.33,.09]].forEach(([x,y,w]) => g.fillRect(x*W,y*H,w*W,H));
  }

  function drawRoad() {
    const gr = g.createLinearGradient(0,H*.68,0,H);
    gr.addColorStop(0,'#070b14'); gr.addColorStop(1,'#040710');
    g.fillStyle = gr; g.fillRect(0,H*.68,W,H*.32);
    const rf = g.createRadialGradient(W*.5,H*.71,0,W*.5,H*.71,W*.42);
    rf.addColorStop(0,'rgba(255,130,40,.06)'); rf.addColorStop(1,'rgba(0,0,0,0)');
    g.fillStyle = rf; g.fillRect(0,H*.68,W,H*.32);
  }

  function drawWheel(cx, cy, r, rot) {
    g.save();
    g.fillStyle = '#2a1408'; g.beginPath(); g.arc(cx,cy,r,0,Math.PI*2); g.fill();
    g.strokeStyle = '#5c3010'; g.lineWidth = r*.22;
    g.beginPath(); g.arc(cx,cy,r,0,Math.PI*2); g.stroke();
    g.strokeStyle = '#4a2808'; g.lineWidth = r*.09;
    for (let i = 0; i < 8; i++) {
      const a = rot + i/8*Math.PI*2;
      g.beginPath(); g.moveTo(cx,cy); g.lineTo(cx+Math.cos(a)*r*.88, cy+Math.sin(a)*r*.88); g.stroke();
    }
    g.fillStyle = '#7a3818'; g.beginPath(); g.arc(cx,cy,r*.14,0,Math.PI*2); g.fill();
    g.restore();
  }

  function drawCartYatai(cx, gndY, rollPh, setupPh) {
    const cW      = lr(W*.20, W*.88, setupPh);
    const wr      = H*.048;
    const bodyH   = H*.22;
    const bodyTop = gndY - bodyH;
    const roofEdgeY = bodyTop;
    const roofPeakY = lr(bodyTop - H*.025, bodyTop - H*.19, setupPh);
    const wRot    = -(rollPh * W * 1.2) / (wr * 2);

    // Wheels (fade out as stall unfolds)
    const wfa = c01(1 - setupPh*3.5);
    if (wfa > 0) {
      g.globalAlpha = wfa;
      drawWheel(cx - cW*.44, gndY - wr, wr, wRot);
      drawWheel(cx + cW*.44, gndY - wr, wr, wRot);
      g.globalAlpha = 1;
    }

    // Tow pole (fades as cart stops)
    const pfa = c01(1 - rollPh*1.6 - setupPh*5);
    if (pfa > 0) {
      g.globalAlpha = pfa;
      g.strokeStyle = '#5c3010'; g.lineWidth = W*.008; g.lineCap = 'round';
      g.beginPath(); g.moveTo(cx-cW*.44, gndY-H*.08); g.lineTo(cx-cW*.44-W*.18, gndY-H*.035); g.stroke();
      g.globalAlpha = 1;
    }

    // Back wall
    const wall = g.createLinearGradient(0,bodyTop,0,gndY);
    wall.addColorStop(0,'#1c1005'); wall.addColorStop(1,'#120c04');
    g.fillStyle = wall; g.fillRect(cx-cW*.50, bodyTop, cW, bodyH);

    // Tarp/cover (canvas wrap when folded)
    const tfa = c01(1 - setupPh*8);
    if (tfa > 0) {
      g.globalAlpha = tfa;
      g.fillStyle = '#2a3a28';
      g.beginPath(); g.moveTo(cx-cW*.50,roofEdgeY); g.lineTo(cx,roofPeakY+H*.01); g.lineTo(cx+cW*.50,roofEdgeY); g.closePath(); g.fill();
      g.strokeStyle = '#c8a860'; g.lineWidth = 1.5;
      [-cW*.30, 0, cW*.30].forEach(dx => {
        g.beginPath(); g.moveTo(cx+dx,roofEdgeY); g.lineTo(cx+dx*.35,roofPeakY+H*.006); g.stroke();
      });
      g.globalAlpha = 1;
    }

    // Roof (rises as stall opens)
    const roofGr = g.createLinearGradient(0,roofPeakY,0,roofEdgeY);
    roofGr.addColorStop(0,'#180e04'); roofGr.addColorStop(1,'#281605');
    g.fillStyle = roofGr;
    g.beginPath(); g.moveTo(cx-cW*.52,roofEdgeY); g.lineTo(cx,roofPeakY); g.lineTo(cx+cW*.52,roofEdgeY); g.closePath(); g.fill();
    g.strokeStyle = '#3a2010'; g.lineWidth = 2.5;
    g.beginPath(); g.moveTo(cx-cW*.52,roofEdgeY); g.lineTo(cx,roofPeakY); g.lineTo(cx+cW*.52,roofEdgeY); g.stroke();

    // Interior warm glow
    if (setupPh > .25) {
      const ia = c01((setupPh-.25)/.30);
      const ctrY = bodyTop + bodyH*.54;
      const ig = g.createRadialGradient(cx,ctrY-H*.04,0,cx,ctrY,cW*.44);
      ig.addColorStop(0,`rgba(255,140,50,${(.15*ia).toFixed(2)})`); ig.addColorStop(1,'rgba(0,0,0,0)');
      g.fillStyle = ig; g.fillRect(cx-cW*.5,roofEdgeY,cW,bodyH);
    }

    // NOREN strips drop in
    if (setupPh > .32) {
      const np = c01((setupPh-.32)/.44);
      const nH = lr(0, H*.13, np);
      const strips = 9, sw2 = cW/strips;
      for (let i = 0; i < strips; i++) {
        const nx = cx-cW*.50+i*sw2+sw2*.08, nw = sw2*.84;
        const ng2 = g.createLinearGradient(nx,roofEdgeY,nx,roofEdgeY+nH);
        ng2.addColorStop(0,'#18154a'); ng2.addColorStop(1,'#100e38');
        g.fillStyle = ng2; g.fillRect(nx,roofEdgeY,nw,nH);
        g.strokeStyle = 'rgba(255,255,255,.04)'; g.lineWidth = .8;
        g.beginPath(); g.moveTo(nx,roofEdgeY); g.lineTo(nx,roofEdgeY+nH); g.stroke();
      }
      if (np > .58 && nH > 0) {
        g.globalAlpha = c01((np-.58)/.42) * .40;
        g.fillStyle = 'rgba(180,170,240,1)';
        g.font = `bold ${Math.floor(nH*.55)}px serif`;
        g.textAlign = 'center';
        g.fillText('拉', cx-cW*.22, roofEdgeY+nH*.65);
        g.fillText('麺', cx+cW*.22, roofEdgeY+nH*.65);
        g.globalAlpha = 1;
      }
    }

    // Counter top extends outward
    if (setupPh > .40) {
      const cp = c01((setupPh-.40)/.35);
      g.globalAlpha = cp;
      const ctrY = bodyTop + bodyH*.54;
      const ctGr = g.createLinearGradient(0,ctrY,0,ctrY+H*.04);
      ctGr.addColorStop(0,'#604818'); ctGr.addColorStop(1,'#3c2a0a');
      g.fillStyle = ctGr; g.fillRect(cx-cW*.52, ctrY, cW*1.04, H*.04);
      g.fillStyle = 'rgba(255,200,80,.14)'; g.fillRect(cx-cW*.52, ctrY, cW*1.04, 2);
      g.globalAlpha = 1;
    }

    // Support posts
    if (setupPh > .15) {
      g.globalAlpha = c01((setupPh-.15)/.25);
      g.fillStyle = '#311505';
      [cx-cW*.47, cx+cW*.47].forEach(px => g.fillRect(px-W*.007, roofEdgeY, W*.012, bodyH+H*.04));
      g.globalAlpha = 1;
    }

    // Lanterns light up one by one
    [cx-cW*.36, cx, cx+cW*.36].forEach((lx, i) => {
      const ls = .60 + i*.13;
      const lp = c01((setupPh-ls)/.18);
      if (lp <= 0) return;
      const ly = roofEdgeY, lrx = W*.016, lry = H*.032;
      g.globalAlpha = lp;
      g.strokeStyle = '#3a2010'; g.lineWidth = 1.5;
      g.beginPath(); g.moveTo(lx,ly-8); g.lineTo(lx,ly); g.stroke();
      g.fillStyle = '#c03010';
      g.beginPath(); g.ellipse(lx,ly+lry*.5,lrx,lry*.52,0,0,Math.PI*2); g.fill();
      const ig2 = g.createRadialGradient(lx,ly+lry*.5,0,lx,ly+lry*.5,lrx*.85);
      ig2.addColorStop(0,'rgba(255,215,90,.90)'); ig2.addColorStop(1,'rgba(255,100,10,0)');
      g.fillStyle = ig2; g.beginPath(); g.ellipse(lx,ly+lry*.5,lrx*.85,lry*.44,0,0,Math.PI*2); g.fill();
      const glowR = W*.10*lp;
      const gr2 = g.createRadialGradient(lx,ly,0,lx,ly,glowR);
      gr2.addColorStop(0,`rgba(255,160,50,${(.22*lp).toFixed(2)})`); gr2.addColorStop(1,'rgba(0,0,0,0)');
      g.fillStyle = gr2; g.beginPath(); g.arc(lx,ly,glowR,0,Math.PI*2); g.fill();
      g.globalAlpha = 1;
    });
  }

  function drawMaster(cx, gndY, walking, T, faceRight) {
    const bH = H*.17;
    const stride = walking ? Math.sin(T*5.5)*.32 : 0;
    const waistY = gndY - bH*.42, shldrY = gndY - bH*.70;
    const headCy = gndY - bH + W*.018;
    const hr = W*.019;

    g.save(); g.translate(cx, 0);
    if (faceRight) g.scale(-1, 1);

    // Back leg
    const bkKX = Math.sin(-stride*.3)*bH*.22, bkKY = waistY+bH*.22;
    g.strokeStyle = '#1a1a2a'; g.lineWidth = W*.013; g.lineCap = 'round';
    g.beginPath(); g.moveTo(W*.003,waistY); g.lineTo(bkKX,bkKY); g.stroke();
    g.lineWidth = W*.010;
    g.beginPath(); g.moveTo(bkKX,bkKY); g.lineTo(bkKX+Math.sin(-stride*.15)*bH*.22, gndY); g.stroke();
    g.fillStyle = '#120e0e';
    g.beginPath(); g.ellipse(bkKX+Math.sin(-stride*.15)*bH*.22+W*.009, gndY, W*.012,H*.005,.1,0,Math.PI*2); g.fill();

    // Body + apron
    g.fillStyle = '#1e2850';
    g.beginPath(); g.moveTo(-W*.015,shldrY); g.lineTo(-W*.017,waistY); g.lineTo(W*.017,waistY); g.lineTo(W*.015,shldrY); g.closePath(); g.fill();
    g.fillStyle = '#ddd8c8';
    g.beginPath(); g.moveTo(-W*.007,shldrY+H*.022); g.lineTo(-W*.007,waistY); g.lineTo(W*.007,waistY); g.lineTo(W*.007,shldrY+H*.022); g.closePath(); g.fill();

    // Front leg
    const frKX = Math.sin(stride*.3)*bH*.22, frKY = waistY+bH*.22;
    g.strokeStyle = '#1a1a2a'; g.lineWidth = W*.015; g.lineCap = 'round';
    g.beginPath(); g.moveTo(-W*.003,waistY+H*.003); g.lineTo(frKX,frKY); g.stroke();
    g.lineWidth = W*.012;
    g.beginPath(); g.moveTo(frKX,frKY); g.lineTo(frKX+Math.sin(stride*.15)*bH*.22, gndY); g.stroke();
    g.fillStyle = '#120e0e';
    g.beginPath(); g.ellipse(frKX+Math.sin(stride*.15)*bH*.22+W*.010, gndY, W*.014,H*.005,.1,0,Math.PI*2); g.fill();

    // Arms
    g.strokeStyle = '#1e2850'; g.lineWidth = W*.011; g.lineCap = 'round';
    const aA = stride*.30, fwdX = walking ? -W*.04 : 0;
    g.beginPath(); g.moveTo(W*.009,shldrY+H*.008); g.lineTo(W*.009+Math.sin(-aA)*bH*.16, waistY+H*.01); g.stroke();
    g.beginPath(); g.moveTo(-W*.009,shldrY+H*.008); g.lineTo(-W*.009+Math.sin(aA)*bH*.16+fwdX, waistY+H*.01); g.stroke();

    // Neck
    g.fillStyle = '#c09870'; g.fillRect(-W*.007, shldrY-H*.013, W*.014, H*.020);

    // Head (profile facing left)
    g.fillStyle = '#c09870'; g.beginPath(); g.arc(0,headCy,hr,0,Math.PI*2); g.fill();
    g.beginPath();
    g.moveTo(-hr*.30,headCy-hr*.80);
    g.quadraticCurveTo(-hr*.90,headCy-hr*.42,-hr*1.0,headCy-hr*.04);
    g.quadraticCurveTo(-hr*1.14,headCy+hr*.20,-hr*.92,headCy+hr*.48);
    g.quadraticCurveTo(-hr*.86,headCy+hr*.72,-hr*.56,headCy+hr*.84);
    g.lineTo(-hr*.08,headCy+hr*.92); g.closePath(); g.fill();
    // Hachimaki headband
    g.fillStyle = '#c03010';
    g.beginPath();
    g.moveTo(-hr*.30,headCy-hr*.76);
    g.quadraticCurveTo(hr*.10,headCy-hr*1.04,hr*.90,headCy-hr*.84);
    g.lineTo(hr*.90,headCy-hr*.63);
    g.quadraticCurveTo(hr*.10,headCy-hr*.83,-hr*.30,headCy-hr*.55);
    g.closePath(); g.fill();
    // Eye
    g.fillStyle = '#28180e'; g.beginPath(); g.arc(-hr*.72,headCy-hr*.08,hr*.07,0,Math.PI*2); g.fill();

    g.restore();
  }

  let ttsDone = false;
  function maybeTTS() {
    if (ttsDone || !window.speechSynthesis) return;
    ttsDone = true;
    const utt = new SpeechSynthesisUtterance('いらっしゃいませ！');
    utt.lang = 'ja-JP'; utt.rate = 0.90; utt.pitch = 0.82; utt.volume = 0.85;
    const voices = (window.speechSynthesis.getVoices()||[]).filter(v=>v.lang.startsWith('ja'));
    if (voices.length) utt.voice = voices[voices.length-1];
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(utt);
  }

  function frame(T) {
    g.clearRect(0,0,W,H);

    // Sky
    const sky = g.createLinearGradient(0,0,0,H*.72);
    sky.addColorStop(0,'#010306'); sky.addColorStop(.55,'#05091a'); sky.addColorStop(1,'#0a0f22');
    g.fillStyle = sky; g.fillRect(0,0,W,H);
    drawStars(c01(T/1.5));

    // Horizon glow
    const hg = g.createLinearGradient(0,H*.28,0,H*.50);
    hg.addColorStop(0,'rgba(0,0,0,0)'); hg.addColorStop(.5,'rgba(255,90,20,.04)'); hg.addColorStop(1,'rgba(0,0,0,0)');
    g.fillStyle = hg; g.fillRect(0,H*.28,W,H*.22);

    drawBldgs();
    drawRoad();

    const gndY = H*.69;

    // ── CART ROLLING IN + SETUP ──────────────────
    if (T >= 2.0) {
      const rollPh  = ph(2.0, 7.0, T);
      const cartX   = lr(W*1.22, W*.50, rollPh);
      const setupPh = ph(7.0, 10.8, T);

      drawCartYatai(cartX, gndY, rollPh, setupPh);

      // Master ahead of cart while rolling, transitions behind counter during setup
      const mSep    = lr(W*.20, 0, c01((T-6.6)/.80));
      const mX      = cartX - mSep;
      const rolling = rollPh < .96;
      const mSetPh  = c01((setupPh-.55)/.30);

      if (mSetPh < .85) {
        g.globalAlpha = 1 - c01((mSetPh-.50)/.35);
        drawMaster(mX, gndY, rolling, T, false);
        g.globalAlpha = 1;
      }
      if (mSetPh > .10) {
        g.globalAlpha = c01((mSetPh-.10)/.45);
        drawMaster(W*.50, gndY, false, T, true);
        g.globalAlpha = 1;
      }
    }

    // ── TITLE (0 – 3.5s) ─────────────────────────
    if (T < 3.5) {
      const ta = T < 1.2 ? c01(T/.90) : c01(1-(T-2.5)/1.0);
      if (ta > 0) {
        g.save();
        g.globalAlpha = ta;
        g.shadowColor = 'rgba(255,140,58,.85)'; g.shadowBlur = 32;
        g.fillStyle = '#ff8c3a';
        g.font = `bold ${Math.floor(H*.088)}px serif`;
        g.textAlign = 'center'; g.textBaseline = 'middle';
        g.fillText('夜台', W*.50, H*.40);
        g.shadowBlur = 0;
        g.font = `${Math.floor(H*.022)}px 'Segoe UI',sans-serif`;
        g.fillStyle = 'rgba(253,240,222,.60)';
        g.fillText('YATAI MASTER', W*.50, H*.40+H*.10);
        g.restore();
      }
    }

    // ── GREETING (10.2 – 11.8s) ──────────────────
    if (T > 10.2) {
      const ta = c01((T-10.2)/.80) * c01(1-(T-11.6)/.90);
      if (ta > 0) {
        maybeTTS();
        g.save();
        g.globalAlpha = ta;
        g.shadowColor = 'rgba(255,140,58,.50)'; g.shadowBlur = 20;
        g.fillStyle = '#fdf0de';
        g.font = `bold ${Math.floor(H*.044)}px serif`;
        g.textAlign = 'center'; g.textBaseline = 'middle';
        g.fillText('いらっしゃいませ！', W*.50, H*.22);
        g.shadowBlur = 0;
        g.font = `${Math.floor(H*.018)}px 'Segoe UI',sans-serif`;
        g.fillStyle = 'rgba(253,240,222,.42)';
        g.fillText('Welcome — your stall is open', W*.50, H*.22+H*.055);
        g.restore();
      }
    }

    // ── FADE TO PREP ──────────────────────────────
    if (T > 12.0) {
      g.fillStyle = `rgba(2,4,10,${c01((T-12.0)/1.4).toFixed(2)})`;
      g.fillRect(0,0,W,H);
    }
  }

  function tick(ts) {
    if (done) return;
    if (!t0) t0 = ts;
    const T = (ts - t0) / 1000;
    if (T >= TOTAL) { finish(); return; }
    if (T >= 11.8 && !doneFired) { doneFired = true; onDone(); }
    frame(T);
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

window.startGame = function() {
  AUDIO.init();
  G.day = 1; G.money = 10000; G.rep = 8;
  SHOP.forEach(s => { G.inv[s.id] = 10; G.cart[s.id] = 0; });
  G.weather = WEATHER[0];
  playIntro(() => { G.screen = 'prep'; fullRender(); });
};

window.adjustCart = function(id, delta) {
  const item = SHOP.find(s => s.id === id);
  if (!item) return;
  const spent = SHOP.reduce((n, s) => n + (G.cart[s.id] || 0) * s.price, 0);
  if (delta > 0 && G.money - spent < item.price) { toast('Not enough ¥!','err'); return; }
  G.cart[id] = Math.max(0, (G.cart[id] || 0) + delta);
  renderPrep();
};

window.openStall = function() {
  let cost = 0;
  SHOP.forEach(s => {
    const q = G.cart[s.id] || 0;
    if (q > 0) { G.inv[s.id] += q * s.qty; cost += q * s.price; G.cart[s.id] = 0; }
  });
  G.money -= cost;
  G.todayEarned = 0; G.todayServed = 0; G.todayLost = 0;
  G.gameTime = SERVICE_START;
  G.customers = [];
  G.cookSlots = [null, null, null];
  G.spawnTimer = 10;
  G.screen = 'service';
  G.isOpen = true;
  window.stallOpen = true;
  fullRender();
  startLoop();
  AUDIO.startService(G.weather?.id === 'rainy');
};

window.cookItem = function(id) {
  const item = MENU.find(m => m.id === id);
  if (!item) return;
  const shopItem = SHOP.find(s => s.forItem === id);
  if (!shopItem || G.inv[shopItem.id] <= 0) { toast('Out of stock!', 'err'); return; }
  const empty = G.cookSlots.findIndex(s => s === null);
  if (empty === -1) { toast('All slots busy!', 'err'); return; }
  G.inv[shopItem.id]--;
  G.cookSlots[empty] = { item, state:'cooking', elapsed:0, progress:0 };
  toast(`${item.icon} Cooking ${item.en}…`, 'info');
  try { AUDIO.playSizzle(); } catch(_) {}
  try { const el = document.getElementById('cook-area'); if (el) el.innerHTML = buildCookSlots(); } catch(_) {}
  try { const el = document.getElementById('menu-grid'); if (el) el.innerHTML = buildMenuItems(); } catch(_) {}
};

window.tapSlot = function(i) {
  const slot = G.cookSlots[i];
  if (!slot || slot.state !== 'ready') return;
  const cust = G.customers.find(c => c.state === 'wait' && c.order && c.order.id === slot.item.id);
  if (cust) {
    doServe(cust, i);
  } else {
    G.cookSlots[i] = null;
    toast(`${slot.item.icon} Discarded — no one waiting`, 'info');
  }
  try { const el = document.getElementById('cook-area'); if (el) el.innerHTML = buildCookSlots(); } catch(_) {}
};

window.toggleMute = function() { AUDIO.toggle(); };

window.nextDay = function() {
  G.day++;
  const r = Math.random();
  if (r < 0.05 && G.day > 2) G.weather = WEATHER[3];
  else if (r < 0.20) G.weather = WEATHER[2];
  else if (r < 0.40) G.weather = WEATHER[1];
  else G.weather = WEATHER[0];
  G.screen = 'prep';
  fullRender();
};

// ─────────────────────────────────────────────
// RENDER SYSTEM
// ─────────────────────────────────────────────
function fullRender() {
  stopLoop();
  const root = document.getElementById('root');
  switch (G.screen) {
    case 'title':  root.innerHTML = buildTitle();  break;
    case 'prep':   root.innerHTML = buildPrepShell(); break;
    case 'service': root.innerHTML = buildServiceShell(); break;
    case 'review': root.innerHTML = buildReview(); break;
  }
}

// Called from game loop — fast partial update
function renderService() {
  if (G.screen !== 'service') return;

  // HUD
  const hudTime = document.getElementById('hud-time');
  const hudMoney = document.getElementById('hud-money');
  const hudRep = document.getElementById('hud-rep');
  if (hudTime) hudTime.textContent = G.timeStr;
  if (hudMoney) hudMoney.textContent = `¥${G.money.toLocaleString()}`;
  if (hudRep) hudRep.textContent = '⭐'.repeat(G.stars) + '☆'.repeat(5 - G.stars);

  // Time bar
  const tf = document.getElementById('time-bar-fill');
  if (tf) {
    const pct = (G.gameTime - SERVICE_START) / (SERVICE_END - SERVICE_START);
    tf.style.width = `${Math.min(pct * 100, 100)}%`;
  }

  // Cook slots — only update progress bars in-place; full rebuild happens on state changes
  for (let i = 0; i < G.cookSlots.length; i++) {
    const s = G.cookSlots[i];
    if (s && s.state === 'cooking') {
      const bar = document.getElementById('slot-prog-' + i);
      if (bar) bar.style.width = (s.progress * 100) + '%';
    }
  }

  // Customers
  try { const cl = document.getElementById('customer-list'); if (cl) cl.innerHTML = buildCustList(); } catch(_) {}

  // Stats
  const sr = document.getElementById('stats-row');
  if (sr) sr.innerHTML = buildStatsRow();
}

function renderPrep() {
  // Quick re-render prep screen in-place
  const root = document.getElementById('root');
  root.innerHTML = buildPrepShell();
}

// ─────────────────────────────────────────────
// BUILDERS
// ─────────────────────────────────────────────
function buildTitle() {
  return `<div class="screen" id="title-screen">
    <div class="lantern-row">
      <span>🏮</span><span>🏮</span><span>🏮</span>
    </div>
    <div class="title-kanji">夜台</div>
    <div class="title-en">Yatai Master</div>
    <p class="title-tagline">
      Run your own Japanese street food stall.<br>
      Cook dishes, serve customers, earn your reputation.<br>
      Will your yatai become legendary in Fukuoka?
    </p>
    <button class="btn btn-primary" onclick="startGame()">🍜 Open Your Stall</button>
    <div style="margin-top:18px; font-size:12px; color:var(--dim)">
      Click menu items to cook · Tap ready dishes to serve
    </div>
  </div>`;
}

function buildPrepShell() {
  const spent = SHOP.reduce((n, s) => n + (G.cart[s.id] || 0) * s.price, 0);
  const remaining = G.money - spent;
  const w = G.weather || WEATHER[0];

  const shopHtml = SHOP.map(item => {
    const menuItem = MENU.find(m => m.id === item.forItem);
    const unlocked = menuItem && menuItem.day <= G.day;
    const qty = G.cart[item.id] || 0;
    const curStock = G.inv[item.id] || 0;
    const canBuy = remaining >= item.price;

    if (!unlocked) return `
      <div class="shop-item locked">
        <div class="shop-icon">${item.icon}</div>
        <div class="shop-info">
          <div class="shop-name">${item.name}</div>
          <div class="shop-jp">${item.jp}</div>
          <div class="shop-price">Unlocks Day ${menuItem?.day || '?'}</div>
        </div>
      </div>`;

    return `
      <div class="shop-item">
        <div class="shop-icon">${item.icon}</div>
        <div class="shop-info">
          <div class="shop-name">${item.name}</div>
          <div class="shop-jp">${item.jp}</div>
          <div class="shop-price">¥${item.price} → ${item.qty} serving${item.qty > 1 ? 's' : ''}</div>
          <div class="shop-stock">Stock: ${curStock + qty * item.qty}</div>
        </div>
        <div class="qty-ctrl">
          <button class="qty-btn" onclick="adjustCart('${item.id}',1)" ${!canBuy?'disabled':''}>+</button>
          <span class="qty-val">${qty}</span>
          <button class="qty-btn" onclick="adjustCart('${item.id}',-1)" ${qty<=0?'disabled':''}>−</button>
        </div>
      </div>`;
  }).join('');

  return `<div class="screen">
    <div id="prep-wrap">
      <div class="prep-hdr">
        <h2>🌅 Day ${G.day} — Morning Prep</h2>
        <p>Purchase ingredients before evening service</p>
        <div class="weather-badge">${w.icon} ${w.name}${w.desc ? ' — ' + w.desc : ''}</div>
      </div>

      <div class="money-big">¥${G.money.toLocaleString()}</div>

      <div class="shop-grid">${shopHtml}</div>

      <div class="cart-summary">
        <div class="cart-row"><span>Spent</span><span class="cart-val gold">¥${spent.toLocaleString()}</span></div>
        <div class="cart-row"><span>Remaining</span><span class="cart-val">¥${remaining.toLocaleString()}</span></div>
      </div>

      ${G.day > 1 ? `<div style="text-align:center; font-size:12px; color:var(--dim)">
        Reputation: ${'⭐'.repeat(G.stars)}${'☆'.repeat(5-G.stars)} (${G.rep}/100)
      </div>` : ''}

      <button class="btn btn-primary btn-full" onclick="openStall()">🏮 Open for Evening Service →</button>
    </div>
  </div>`;
}

function buildServiceShell() {
  return `
    <div id="hud">
      <div class="hud-brand">🏮 夜台</div>
      <div class="hud-stats">
        <div class="hud-stat">
          <span class="hud-val orange" id="hud-time">${G.timeStr}</span>
          <span class="hud-label">Time</span>
        </div>
        <div class="hud-stat">
          <span class="hud-val">Day ${G.day}</span>
          <span class="hud-label">Day</span>
        </div>
        <div class="hud-stat">
          <span class="hud-val gold" id="hud-money">¥${G.money.toLocaleString()}</span>
          <span class="hud-label">Money</span>
        </div>
        <div class="hud-stat">
          <span class="hud-val" id="hud-rep">${'⭐'.repeat(G.stars)}${'☆'.repeat(5-G.stars)}</span>
          <span class="hud-label">Rep</span>
        </div>
        <button id="mute-btn" onclick="toggleMute()" title="Toggle sound">🔊</button>
      </div>
    </div>

    <div id="time-bar-wrap"><div id="time-bar-fill" style="width:0%"></div></div>

    <div id="game-wrap">
      <div class="card" id="card-cook">
        <div class="card-title">🔥 Cook</div>
        <div id="cook-area">${buildCookSlots()}</div>
      </div>

      <div class="card" id="card-menu">
        <div class="card-title">📋 Menu</div>
        <div id="menu-grid">${buildMenuItems()}</div>
      </div>

      <div class="card" id="card-custs">
        <div class="card-title">👥 Waiting</div>
        <div id="customer-list">${buildCustList()}</div>
      </div>

      <div class="card" id="card-stats">
        <div class="card-title">📊 Tonight</div>
        <div id="stats-row">${buildStatsRow()}</div>
      </div>
    </div>`;
}

function buildCookSlots() {
  return G.cookSlots.map((slot, i) => {
    if (!slot) return `<div class="cook-slot empty">
      <div style="font-size:20px;opacity:.25">＋</div>
      <div>Empty</div>
    </div>`;

    if (slot.state === 'cooking') return `<div class="cook-slot cooking">
      <div class="slot-icon">${slot.item.icon}</div>
      <div class="slot-name">${slot.item.en}</div>
      <div class="slot-tag cooking">Preparing…</div>
      <div class="prog-bar"><div class="prog-fill" id="slot-prog-${i}" style="width:${slot.progress*100}%"></div></div>
    </div>`;

    return `<button class="cook-slot ready" data-tap="${i}" onclick="window.tapSlot(${i})">
      <div class="slot-icon">${slot.item.icon}</div>
      <div class="slot-name">${slot.item.en}</div>
      <div class="slot-tag ready">READY — Tap!</div>
    </button>`;
  }).join('');
}

function buildMenuItems() {
  const hasEmpty = G.cookSlots.some(s => s === null);
  const waiting = {};
  G.customers.filter(c => c.state === 'wait' && c.order).forEach(c => {
    waiting[c.order.id] = (waiting[c.order.id] || 0) + 1;
  });
  return G.unlockedMenu.map(item => {
    const si = SHOP.find(s => s.forItem === item.id);
    const stock = si ? G.inv[si.id] : 0;
    const canCook = stock > 0 && hasEmpty;
    const w = waiting[item.id] || 0;
    let cls = '';
    if (stock <= 0) cls = 'no-stock';
    else if (!hasEmpty) cls = 'no-slot';
    return `<button class="menu-btn ${cls}" data-cook="${item.id}" onclick="window.cookItem('${item.id}')">
      <div class="icon">${item.icon}</div>
      <div class="en">${item.en}</div>
      <div class="jp">${item.name}</div>
      <div class="price">¥${item.price}</div>
      <div class="stock">${stock > 0 ? stock + ' left' : 'Out of stock'}</div>
      ${w > 0 ? `<div style="font-size:10px;font-weight:700;color:var(--red-l);margin-top:1px">${w} waiting</div>` : ''}
    </button>`;
  }).join('');
}

function buildCustList() {
  const waiting = G.customers.filter(c => c.state === 'wait' && c.order);
  if (!waiting.length) {
    const msg = G.gameTime < (SERVICE_START + 30)
      ? 'Waiting for the first customers…'
      : 'No customers right now — keep cooking!';
    return `<div class="no-cust">${msg}</div>`;
  }
  return waiting.map(c => {
    const pct = (c.patLeft / c.patMax) * 100;
    const col = pct > 55 ? '#27ae60' : pct > 28 ? '#f39c12' : '#e74c3c';
    const urgent = pct < 25 ? 'urgent' : '';
    return `<div class="cust-card ${urgent}">
      <div class="cust-icon">${c.icon}</div>
      <div class="cust-info">
        <div class="cust-type">${c.jp} · ${c.en}</div>
        <div class="cust-order">${c.order.icon} ${c.order.en} <span style="color:var(--dim);font-size:11px">${c.order.name}</span></div>
      </div>
      <div class="pat-wrap">
        <div class="pat-bar"><div class="pat-fill" style="width:${pct}%;background:${col}"></div></div>
        <div class="pat-time">${Math.ceil(c.patLeft)}s</div>
      </div>
    </div>`;
  }).join('');
}

function buildStatsRow() {
  return `
    <div class="stat-cell">
      <div class="stat-val" style="color:var(--gold)">¥${G.todayEarned.toLocaleString()}</div>
      <div class="stat-lbl">Earned</div>
    </div>
    <div class="stat-cell">
      <div class="stat-val" style="color:var(--green)">${G.todayServed}</div>
      <div class="stat-lbl">Served</div>
    </div>
    <div class="stat-cell">
      <div class="stat-val" style="color:var(--red-l)">${G.todayLost}</div>
      <div class="stat-lbl">Left</div>
    </div>
    <div class="stat-cell">
      <div class="stat-val" style="color:var(--teal)">${G.weather?.icon || '🌙'}</div>
      <div class="stat-lbl">${G.weather?.name || ''}</div>
    </div>`;
}

function buildReview() {
  const total = G.todayServed + G.todayLost;
  const sat = total > 0 ? Math.round((G.todayServed / total) * 100) : 0;
  const satCol = sat >= 75 ? 'good' : sat >= 45 ? 'ok' : 'bad';
  const newItems = MENU.filter(m => m.day === G.day + 1);

  return `<div class="screen"><div id="review-wrap">
    <div class="review-icon">🌅</div>
    <div class="review-title">End of Day ${G.day}</div>
    <div class="review-sub">The stall is closed. Count your earnings.</div>

    <div class="review-stats">
      <div class="rev-row"><span>💴 Tonight's Earnings</span><span class="rev-val good">+¥${G.todayEarned.toLocaleString()}</span></div>
      <div class="rev-row"><span>✅ Customers Served</span><span class="rev-val">${G.todayServed}</span></div>
      <div class="rev-row"><span>😤 Customers Lost</span><span class="rev-val bad">${G.todayLost}</span></div>
      <div class="rev-row"><span>😊 Satisfaction</span><span class="rev-val ${satCol}">${sat}%</span></div>
      <div class="rev-row"><span>⭐ Reputation</span><span class="rev-val">${'⭐'.repeat(G.stars)}${'☆'.repeat(5-G.stars)} (${G.rep}/100)</span></div>
      <div class="rev-row" style="border-top:1px solid rgba(255,255,255,.08);margin-top:6px;padding-top:10px">
        <span>💰 Total Savings</span><span class="rev-val good">¥${G.money.toLocaleString()}</span>
      </div>
    </div>

    ${newItems.length ? `<div class="unlock-box">
      <div class="unlock-title">🎉 New Items Unlocked Tomorrow!</div>
      ${newItems.map(m => `<div class="unlock-item">${m.icon} ${m.en} (${m.name})</div>`).join('')}
    </div>` : ''}

    <button class="btn btn-primary btn-full" onclick="nextDay()">🌅 Start Day ${G.day + 1}</button>
  </div></div>`;
}

// ─────────────────────────────────────────────
// UI HELPERS
// ─────────────────────────────────────────────
let toastTimer = null;
function toast(msg, type = '') {
  const old = document.querySelector('.toast');
  if (old) old.remove();
  if (toastTimer) clearTimeout(toastTimer);
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.textContent = msg;
  document.body.appendChild(el);
  toastTimer = setTimeout(() => el.remove(), 2400);
}

function floatYen(txt) {
  const el = document.createElement('div');
  el.className = 'float-yen';
  el.textContent = txt;
  el.style.left = (30 + Math.random() * 40) + '%';
  el.style.bottom = '220px';
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 1500);
}

// ─────────────────────────────────────────────
// BOOT
// ─────────────────────────────────────────────
fullRender();
</script>
</body>
</html>
