<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>夜台 — Yatai Master v7</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏮</text></svg>">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --night: #06090f;
  --deep: #0d1420;
  --panel: #111825;
  --wood: #5c3010;
  --wood-l: #7a4520;
  --lantern: #ff8c3a;
  --lantern-glow: rgba(255,140,58,0.12);
  --red: #c0392b;
  --red-l: #e74c3c;
  --cream: #fdf0de;
  --gold: #f0c040;
  --green: #27ae60;
  --teal: #1abc9c;
  --blue: #2980b9;
  --text: #d4c4a8;
  --dim: #786858;
}

html, body {
  height: 100%;
  background: var(--night);
  color: var(--text);
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  overflow: hidden;
  user-select: none;
}

/* ── STARS BG ── */
#kag-bg {
  position: fixed; inset: 0; z-index: -1;
  background: url('sakurajima.jpg') center 85%/cover no-repeat;
}
#stars-canvas {
  position: fixed; inset: 0;
  pointer-events: none;
  z-index: 0;
  background: url('sakurajima.jpg') center 85%/cover no-repeat;
}
#street-canvas {
  position: fixed; inset: 0;
  pointer-events: none;
  z-index: 1;
  display: none;
  background: url('sakurajima.jpg') center 85%/cover no-repeat;
}

/* ── SUBTITLES ── */
#subtitle {
  position: fixed; top: 64px; left: 50%;
  transform: translateX(-50%);
  z-index: 300; pointer-events: none;
  text-align: center;
  opacity: 0; transition: opacity 0.30s;
  white-space: nowrap;
}
#subtitle.visible { opacity: 1; }
.subtitle-inner {
  display: inline-block;
  background: rgba(0,0,0,0.72);
  color: #fff; font-size: 60px; font-weight: 500;
  padding: 8px 28px; border-radius: 4px;
  letter-spacing: 0.3px;
  text-shadow: 0 1px 3px rgba(0,0,0,0.9);
}
/* Floating mode — centered on the chest of whichever customer is speaking, instead of
   the fixed top banner (which stays reserved for the master's own lines). */
#subtitle.subtitle-floating {
  top: 0; left: 0; transform: translate(-50%, -50%);
  white-space: normal; max-width: 640px;
}
#subtitle.subtitle-floating .subtitle-inner {
  font-size: 44px; padding: 10px 28px;
}

/* ── SCREENS ── */
.screen {
  position: absolute; inset: 0;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  z-index: 10;
  overflow-y: auto;
  background: url('sakurajima.jpg') center 85%/cover no-repeat;
}

/* ── TITLE ── */
#title-screen {
  text-align: center;
  padding: 40px 24px;
  background: url('sakurajima.jpg') center 85%/cover no-repeat;
}

.lantern-row {
  font-size: 48px;
  display: flex; gap: 16px; justify-content: center;
  margin-bottom: 20px;
}
.lantern-row span { animation: sway 3s ease-in-out infinite; display: inline-block; }
.lantern-row span:nth-child(2) { animation-delay: -1s; }
.lantern-row span:nth-child(3) { animation-delay: -2s; }
@keyframes sway { 0%,100%{transform:rotate(-5deg)} 50%{transform:rotate(5deg)} }

.title-kanji {
  font-size: 86px; line-height: 1;
  color: var(--lantern);
  text-shadow: 0 0 40px rgba(255,140,58,.9), 0 0 80px rgba(255,140,58,.4);
  margin-bottom: 6px;
}
.title-en {
  font-size: 22px; letter-spacing: 8px;
  color: var(--cream); margin-bottom: 12px;
  text-transform: uppercase;
}
.title-tagline {
  font-size: 14px; color: var(--dim);
  line-height: 1.7; max-width: 380px;
  margin: 0 auto 36px;
}

/* ── BUTTONS ── */
.btn {
  padding: 13px 30px; border: none; border-radius: 4px;
  font-size: 15px; cursor: pointer; font-weight: 700;
  letter-spacing: 0.5px; transition: all .18s;
  display: inline-flex; align-items: center; gap: 8px;
}
.btn-primary { background: var(--red); color: var(--cream); box-shadow: 0 4px 18px rgba(192,57,43,.5); }
.btn-primary:hover { background: var(--red-l); transform: translateY(-2px); box-shadow: 0 6px 24px rgba(231,76,60,.55); }
.btn-wood { background: var(--wood); color: var(--cream); }
.btn-wood:hover { background: var(--wood-l); transform: translateY(-1px); }
.btn-gold { background: var(--gold); color: #111; font-weight: 800; }
.btn-gold:hover { background: #f5d262; transform: translateY(-2px); }
.btn-green { background: var(--green); color: #fff; }
.btn-green:hover { filter: brightness(1.15); }
.btn:disabled { opacity: .3; cursor: not-allowed; transform: none !important; filter: none !important; }
.btn-full { width: 100%; justify-content: center; padding: 16px; font-size: 16px; }

/* ── HUD ── */
#hud {
  position: fixed; top: 0; left: 0; right: 0;
  height: 54px;
  background: rgba(6,9,15,.82);
  border-bottom: 1px solid var(--wood);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 18px; z-index: 200;
}
.hud-brand { font-size: 22px; font-weight: 800; color: var(--lantern); letter-spacing: 2px; }
.hud-stats { display: flex; gap: 18px; }
.hud-stat { display: flex; flex-direction: column; align-items: center; }
.hud-val { font-size: 15px; font-weight: 700; color: var(--cream); }
.hud-val.gold { color: var(--gold); }
.hud-val.orange { color: var(--lantern); }
.hud-label { font-size: 9px; text-transform: uppercase; letter-spacing: 1px; color: var(--dim); }

/* ── TIME BAR ── */
#time-bar-wrap {
  position: fixed; top: 54px; left: 0; right: 0;
  height: 3px; background: rgba(255,255,255,.06); z-index: 200;
}
#time-bar-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--lantern), var(--red));
  transition: width .4s linear;
}

/* ── GAME LAYOUT — horizontal bottom bar ── */
#game-wrap {
  position: fixed; bottom: 0; left: 0; right: 0; top: auto;
  height: 216px;
  display: flex; flex-direction: row; align-items: stretch;
  gap: 6px; padding: 6px 8px;
  background: rgba(4,7,12,.84);
  border-top: 1px solid var(--wood);
  overflow-x: auto; overflow-y: hidden;
  z-index: 10;
}

#card-cook  { flex: 0 0 260px; overflow-y: auto; }
#card-menu  { flex: 1 1 0;    min-width: 200px; overflow-y: auto; }
#card-custs { flex: 0 0 210px; overflow-y: auto; }
#card-stats { flex: 0 0 130px; overflow-y: auto; }

/* ── CARDS ── */
.card {
  background: var(--panel);
  border: 1px solid rgba(255,255,255,.07);
  border-radius: 8px; padding: 8px 10px;
}
.card-title {
  font-size: 9px; text-transform: uppercase; letter-spacing: 1.5px;
  color: var(--dim); margin-bottom: 7px;
  display: flex; align-items: center; gap: 6px;
}
.card-title::after { content:''; flex:1; height:1px; background:rgba(255,255,255,.06); }

/* ── TONIGHT STATS — 2×2 in narrow column ── */
#card-stats #stats-row { display: grid; grid-template-columns: 1fr 1fr; gap: 0; }
#card-stats .stat-cell { padding: 5px 2px; border-right: 1px solid rgba(255,255,255,.05); border-bottom: 1px solid rgba(255,255,255,.05); }
#card-stats .stat-cell:nth-child(2n) { border-right: none; }
#card-stats .stat-cell:nth-last-child(-n+2) { border-bottom: none; }
#card-stats .stat-val { font-size: 15px; }
#card-stats .stat-lbl { font-size: 8px; }

/* ── COOKING SLOTS ── */
#cook-area { display: grid; grid-template-columns: repeat(3,1fr); gap: 5px; }

.cook-slot {
  background: rgba(0,0,0,.3);
  border: 1px dashed rgba(255,255,255,.12);
  border-radius: 6px; padding: 7px 4px;
  text-align: center; min-height: 72px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  transition: all .2s;
  font-family: inherit; color: inherit; width: 100%;
  touch-action: manipulation; -webkit-tap-highlight-color: transparent;
}
.cook-slot.empty { color: var(--dim); font-size: 11px; }
.cook-slot.cooking { border-color: var(--lantern); border-style: solid; background: rgba(255,140,58,.04); }
.cook-slot.ready {
  border-color: var(--green); border-style: solid;
  background: rgba(39,174,96,.05);
  cursor: pointer; animation: pulse-g 1.4s ease-in-out infinite;
}
.cook-slot.ready:hover { background: rgba(39,174,96,.12); transform: scale(1.02); }
@keyframes pulse-g { 0%,100%{box-shadow:0 0 0 0 rgba(39,174,96,.4)} 50%{box-shadow:0 0 0 8px rgba(39,174,96,0)} }

.slot-icon { font-size: 22px; }
.slot-name { font-size: 9px; color: var(--dim); }
.slot-tag { font-size: 10px; font-weight: 700; }
.slot-tag.cooking { color: var(--lantern); }
.slot-tag.ready { color: var(--green); }

.prog-bar { width: 100%; height: 3px; background: rgba(255,255,255,.1); border-radius: 2px; overflow:hidden; margin-top: 2px; }
.prog-fill { height:100%; background: var(--lantern); border-radius: 2px; transition: width .12s linear; }

/* ── MENU ── */
#menu-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); gap: 5px; }

.menu-btn {
  background: rgba(0,0,0,.28);
  border: 1px solid rgba(255,255,255,.09);
  border-radius: 6px; padding: 6px 4px;
  cursor: pointer; text-align: center;
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  transition: all .18s; color: var(--text);
  font-family: inherit; width: 100%;
  touch-action: manipulation; -webkit-tap-highlight-color: transparent;
}
.menu-btn:hover { border-color: var(--lantern); background: rgba(255,140,58,.06); transform: translateY(-1px); }
.menu-btn.no-stock { border-color: rgba(192,57,43,.4); opacity: .45; cursor: not-allowed; transform: none !important; }
.menu-btn.no-slot { opacity: .4; cursor: not-allowed; transform: none !important; }
.menu-btn.locked { opacity: .18; cursor: not-allowed; }
.menu-btn .icon { font-size: 20px; }
.menu-btn .en { font-size: 10px; font-weight: 600; color: var(--cream); }
.menu-btn .jp { font-size: 9px; color: var(--dim); }
.menu-btn .price { font-size: 11px; font-weight: 700; color: var(--gold); }
.menu-btn .stock { font-size: 9px; color: var(--dim); }

/* ── CUSTOMERS ── */
#customer-list { display: flex; flex-direction: column; gap: 5px; }

.cust-card {
  background: rgba(0,0,0,.25);
  border: 1px solid rgba(255,255,255,.08);
  border-radius: 6px; padding: 6px 9px;
  display: flex; align-items: center; gap: 8px;
  transition: all .3s;
}
.cust-card.urgent { border-color: var(--red); animation: urgpulse 1s ease-in-out infinite; }
@keyframes urgpulse { 0%,100%{background:rgba(0,0,0,.25)} 50%{background:rgba(192,57,43,.08)} }
.cust-card.gone { opacity: 0; transform: translateX(60px); }

.cust-icon { font-size: 20px; }
.cust-info { flex: 1; min-width: 0; }
.cust-type { font-size: 9px; color: var(--dim); }
.cust-order { font-size: 11px; color: var(--cream); display: flex; align-items: center; gap: 4px; margin-top: 1px; }

.pat-wrap { min-width: 56px; display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
.pat-bar { width: 56px; height: 3px; background: rgba(255,255,255,.1); border-radius: 2px; overflow:hidden; }
.pat-fill { height:100%; border-radius: 2px; transition: width .5s linear; }
.pat-time { font-size: 9px; color: var(--dim); }

.no-cust { text-align:center; padding: 18px; color: var(--dim); font-size: 13px; }

/* ── TONIGHT STATS ── */
#stats-row { display: flex; gap: 0; }
.stat-cell {
  flex:1; text-align:center; padding: 8px 4px;
  border-right: 1px solid rgba(255,255,255,.05);
}
.stat-cell:last-child { border-right: none; }
.stat-val { font-size: 22px; font-weight: 700; }
.stat-lbl { font-size: 10px; color: var(--dim); text-transform: uppercase; letter-spacing: 1px; }

/* ── PREP SCREEN ── */
#prep-wrap {
  max-width: 640px; width: 100%;
  padding: 24px 16px; display: flex; flex-direction: column; gap: 14px;
}
.prep-hdr { text-align: center; }
.prep-hdr h2 { font-size: 22px; color: var(--cream); margin-bottom: 4px; }
.prep-hdr p { font-size: 13px; color: var(--dim); }
.weather-badge {
  display: inline-flex; align-items: center; gap: 6px;
  background: rgba(255,255,255,.05); border-radius: 20px;
  padding: 5px 14px; font-size: 13px; color: var(--text);
  margin-top: 10px;
}
.money-big { font-size: 32px; font-weight: 800; color: var(--gold); text-align: center; }

.shop-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; }
.shop-item {
  background: var(--panel); border: 1px solid rgba(255,255,255,.07);
  border-radius: 8px; padding: 12px;
  display: flex; align-items: center; gap: 10px;
}
.shop-item.locked { opacity: .28; }
.shop-icon { font-size: 30px; }
.shop-info { flex: 1; }
.shop-name { font-size: 13px; font-weight: 600; color: var(--cream); }
.shop-jp { font-size: 10px; color: var(--dim); }
.shop-price { font-size: 11px; color: var(--gold); margin-top: 3px; }
.shop-stock { font-size: 14px; font-weight: 600; color: var(--dim); }
.shop-stock.low { color: #f1c40f; font-weight: 700; }
.shop-stock.out { color: #e74c3c; font-weight: 700; }
.qty-ctrl { display: flex; flex-direction: column; align-items: center; gap: 3px; }
.qty-val { font-size: 17px; font-weight: 700; color: var(--cream); min-width: 20px; text-align: center; }
.qty-btn {
  width: 26px; height: 26px; border: 1px solid rgba(255,255,255,.18);
  background: rgba(255,255,255,.05); color: var(--cream);
  border-radius: 4px; cursor: pointer; font-size: 15px; line-height: 1;
  transition: all .15s;
}
.qty-btn:hover:not(:disabled) { background: rgba(255,255,255,.18); border-color: var(--lantern); }
.qty-btn:disabled { opacity: .25; cursor: not-allowed; }

.cart-summary {
  background: rgba(0,0,0,.3); border-radius: 8px; padding: 14px;
}
.cart-row { display: flex; justify-content: space-between; padding: 6px 0;
  border-bottom: 1px solid rgba(255,255,255,.04); font-size: 13px; }
.cart-row:last-child { border-bottom: none; }
.cart-val { font-weight: 700; color: var(--cream); }
.cart-val.gold { color: var(--gold); }

/* ── REVIEW SCREEN ── */
#review-wrap {
  max-width: 480px; width: 100%;
  padding: 24px 16px; text-align: center;
}
.review-icon { font-size: 48px; margin-bottom: 12px; }
.review-title { font-size: 24px; color: var(--cream); margin-bottom: 4px; }
.review-sub { font-size: 13px; color: var(--dim); margin-bottom: 22px; }
.review-stats {
  background: var(--panel); border-radius: 10px; padding: 18px;
  margin-bottom: 18px; text-align: left;
}
.rev-row { display: flex; justify-content: space-between; padding: 7px 0;
  border-bottom: 1px solid rgba(255,255,255,.05); font-size: 13px; }
.rev-row:last-child { border-bottom: none; }
.rev-val { font-weight: 700; color: var(--cream); }
.rev-val.good { color: var(--gold); }
.rev-val.bad { color: var(--red-l); }
.rev-val.ok { color: var(--teal); }
.unlock-box {
  background: rgba(255,140,58,.08); border: 1px solid var(--lantern);
  border-radius: 8px; padding: 14px; margin-bottom: 18px;
}
.unlock-title { font-size: 14px; font-weight: 700; color: var(--lantern); margin-bottom: 8px; }
.unlock-item { font-size: 13px; color: var(--cream); margin: 4px 0; }

/* ── DISH TOOLTIP ── */
#dish-tooltip {
  position: fixed; z-index: 950; pointer-events: none; display: none;
  background: rgba(6,9,15,.97); border: 1px solid rgba(255,140,58,.45);
  border-radius: 8px; padding: 10px 14px; max-width: 210px;
  box-shadow: 0 6px 24px rgba(0,0,0,.7);
}
#dish-tooltip .tip-name { font-size: 13px; font-weight: 700; color: var(--lantern); margin-bottom: 5px; }
#dish-tooltip .tip-desc { font-size: 11px; color: var(--cream); line-height: 1.55; }
#dish-tooltip .tip-meta { font-size: 10px; color: var(--dim); margin-top: 6px; display: flex; gap: 10px; }

/* ── SIGN-IN SCREEN ── */
.signin-section { width: 100%; max-width: 320px; margin: 0 auto 16px; }
.signin-label { font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--dim); margin-bottom: 8px; }
.signin-accounts { display: flex; flex-direction: column; gap: 6px; }
.signin-account-btn {
  display: flex; align-items: center; gap: 6px;
  background: rgba(255,140,58,.08); border: 1px solid rgba(255,140,58,.25);
  border-radius: 8px; padding: 10px 14px;
  color: var(--cream); font-family: inherit; font-size: 14px; font-weight: 600;
  transition: all .15s; text-align: left; width: 100%;
  touch-action: manipulation;
}
.signin-account-btn:hover { background: rgba(255,140,58,.18); border-color: rgba(255,140,58,.5); }
.signin-account-btn .acct-name { flex: 1; }
.signin-account-click { display: flex; align-items: center; gap: 12px; flex: 1; min-width: 0; cursor: pointer; }
.signin-delete-btn {
  background: none; border: none; color: var(--dim); font-size: 15px; line-height: 1;
  cursor: pointer; padding: 4px 6px; border-radius: 6px; flex-shrink: 0; opacity: .55; transition: all .15s;
}
.signin-delete-btn:hover { opacity: 1; background: rgba(255,80,80,.15); color: #ff8080; }
.signin-row { display: flex; gap: 8px; align-items: flex-start; }
.signin-input {
  flex: 1; background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.15);
  border-radius: 6px; padding: 10px 12px; color: var(--cream); font-family: inherit;
  font-size: 14px; outline: none; transition: border-color .15s;
}
.signin-input:focus { border-color: rgba(255,140,58,.6); }
.signin-input::placeholder { color: var(--dim); }
.signin-or { text-align: center; color: var(--dim); font-size: 12px; margin: 14px 0; }
.signin-err { color: var(--red-l); font-size: 12px; min-height: 16px; margin-top: 6px; }

/* ── TOAST / FLOATS ── */
.toast {
  position: fixed; bottom: 226px; left: 50%; transform: translateX(-50%);
  background: rgba(27,188,156,.92); color: #fff;
  padding: 9px 20px; border-radius: 20px; font-size: 13px; font-weight: 600;
  z-index: 999; pointer-events: none; white-space: nowrap;
  animation: toastin .25s ease;
}
.toast.err { background: rgba(192,57,43,.92); }
.toast.info { background: rgba(41,128,185,.88); }
@keyframes toastin { from{opacity:0;transform:translateX(-50%) translateY(12px)} to{opacity:1;transform:translateX(-50%) translateY(0)} }

.float-yen {
  position: fixed; font-size: 16px; font-weight: 700; color: var(--gold);
  pointer-events: none; z-index: 600;
  animation: floatup 1.4s ease forwards;
}
@keyframes floatup { 0%{opacity:1;transform:translateY(0)} 100%{opacity:0;transform:translateY(-55px)} }

/* ── MUTE BUTTON ── */
#mute-btn {
  background: none; border: 1px solid rgba(255,255,255,.15);
  color: var(--text); border-radius: 4px; padding: 3px 8px;
  cursor: pointer; font-size: 16px; line-height: 1;
  transition: all .18s;
}
#mute-btn:hover { border-color: var(--lantern); background: rgba(255,140,58,.08); }

#mic-btn {
  background: none; border: 1px solid rgba(255,255,255,.15);
  color: var(--text); border-radius: 4px; padding: 3px 8px;
  cursor: pointer; font-size: 16px; line-height: 1;
  transition: all .18s; touch-action: manipulation;
}
#mic-btn:hover { border-color: var(--lantern); }
#mic-btn.listening { background: rgba(255,60,60,.22); border-color: rgba(255,80,80,.55); animation: micpulse 1.2s ease-in-out infinite; }
@keyframes micpulse { 0%,100%{box-shadow:0 0 0 rgba(255,60,60,.4)} 50%{box-shadow:0 0 10px rgba(255,60,60,.5)} }

.auto-cook-label {
  display: flex; align-items: center; gap: 4px;
  cursor: pointer; font-size: 11px; color: var(--dim);
  border: 1px solid rgba(255,255,255,.15); border-radius: 4px;
  padding: 3px 7px; transition: all .18s; user-select: none;
  white-space: nowrap;
}
.auto-cook-label:has(input:checked) {
  color: #4fc; border-color: rgba(80,255,180,.45);
  background: rgba(80,255,180,.07);
}
.auto-cook-label input { accent-color: #4fc; width: 12px; height: 12px; cursor: pointer; }

.hud-btn {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 3px 9px; border-radius: 4px; border: 1px solid rgba(255,255,255,.15);
  background: rgba(255,255,255,.05); color: var(--dim);
  font-size: 11px; font-weight: 600; cursor: pointer;
  transition: all .18s; white-space: nowrap; user-select: none;
  font-family: inherit; letter-spacing: 0.3px;
}
.hud-btn:hover { background: rgba(255,255,255,.10); color: #eee; border-color: rgba(255,255,255,.28); }
.hud-btn.hud-btn-gold { color: var(--gold); border-color: rgba(255,200,60,.35); background: rgba(255,200,60,.06); }
.hud-btn.hud-btn-gold:hover { background: rgba(255,200,60,.14); border-color: rgba(255,200,60,.6); }

<script>
// Polyfill roundRect for browsers that don't support it (Safari <15.4, older Chrome)
try {
  if (typeof CanvasRenderingContext2D !== 'undefined' && !CanvasRenderingContext2D.prototype.roundRect) {
    CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
      const radius = Array.isArray(r) ? r[0] : (r || 0);
      const rr = Math.min(radius, Math.abs(w) / 2, Math.abs(h) / 2);
      this.moveTo(x + rr, y);
      this.lineTo(x + w - rr, y);
      this.arcTo(x + w, y, x + w, y + rr, rr);
      this.lineTo(x + w, y + h - rr);
      this.arcTo(x + w, y + h, x + w - rr, y + h, rr);
      this.lineTo(x + rr, y + h);
      this.arcTo(x, y + h, x, y + h - rr, rr);
      this.lineTo(x, y + rr);
      this.arcTo(x, y, x + rr, y, rr);
      this.closePath();
      return this;
    };
  }
} catch(_) {}

// ─────────────────────────────────────────────
// YATAI SCENE — ANIMATED BACKGROUND
// ─────────────────────────────────────────────
(function() {
  'use strict';
  const c = document.getElementById('stars-canvas');
  const ctx = c.getContext('2d');
  let off = null;

  // ── BACKGROUND PHOTO (drawn directly onto canvas) ────────────
  const _bgNormal  = new Image(); _bgNormal.src  = 'sakurajima.jpg';
  const _bgErupt   = new Image(); _bgErupt.src   = 'sakurajima-eruption.jpg';
  let _bgCurrent = _bgNormal;

  // ── LIVE GEOMETRY (updated each frame) ──────────────────────
  const G = {};
  function refreshGeo() {
    G.W = c.width; G.H = c.height;
    G.sx = G.W*0.04; G.sw = G.W*0.92;
    G.midX = G.W*0.50;
    G.roofPeak = G.H*0.36; G.roofEdge = G.H*0.48;
    G.norenBot = G.roofEdge + (G.H*0.655 - G.roofEdge)*0.58;
    G.counterY  = G.H*0.655; G.stallBot = G.H*0.77;
    G.lamps = [G.sx+G.sw*0.18, G.sx+G.sw*0.50, G.sx+G.sw*0.82];
    G.tvW = G.W*0.224; G.tvH = G.tvW*0.62;
    G.tvCX = G.tvW*0.5 + G.W*0.01; G.tvTop = G.H*0.08;
  }

  // ── STATIC BACKGROUND (drawn once to offscreen canvas) ──────
  function buildOff() {
    refreshGeo();
    off = document.createElement('canvas');
    off.width = c.width; off.height = c.height;
    const g = off.getContext('2d');
    drawStaticScene(g);
  }

  function drawStaticScene(g) {
    const { W, H, sx, sw, midX, roofPeak, roofEdge, norenBot, counterY, stallBot, lamps } = G;

    // Clear canvas so photo background shows through
    g.clearRect(0, 0, W, H);
    // Subtle dark tint to keep stall readable
    g.fillStyle = 'rgba(1,3,8,0.04)';
    g.fillRect(0, 0, W, H);

    // HORIZON CITY GLOW
    const hg = g.createLinearGradient(0, H * 0.36, 0, H * 0.58);
    hg.addColorStop(0, 'rgba(0,0,0,0)');
    hg.addColorStop(0.5, 'rgba(255,90,20,0.045)');
    hg.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = hg; g.fillRect(0, H * 0.36, W, H * 0.22);

    // STREET
    const gr = g.createLinearGradient(0, H*0.76, 0, H);
    gr.addColorStop(0, '#070b14'); gr.addColorStop(1, '#040710');
    g.fillStyle = gr; g.fillRect(0, H*0.76, W, H*0.24);

    // Wet pavement reflection (warm)
    const ref = g.createRadialGradient(W*0.50, H*0.79, 0, W*0.50, H*0.79, W*0.42);
    ref.addColorStop(0, 'rgba(255,130,40,0.09)');
    ref.addColorStop(0.5,'rgba(255,90,20,0.04)');
    ref.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = ref; g.fillRect(0, H*0.76, W, H*0.24);

    // YATAI
    drawYatai(g, W, H);

    // Ground-level fog
    const fog = g.createLinearGradient(0, H*0.74, 0, H*0.88);
    fog.addColorStop(0,'rgba(10,14,28,0)');
    fog.addColorStop(0.45,'rgba(10,14,28,0.18)');
    fog.addColorStop(1,'rgba(8,11,22,0)');
    g.fillStyle = fog; g.fillRect(0, H*0.74, W, H*0.14);
  }

  function drawYatai(g, W, H) {
    const { sx, sw, midX, roofPeak, roofEdge, norenBot, counterY, stallBot, lamps } = G;

    // Interior warmth
    const intGlow = g.createRadialGradient(midX, counterY-H*0.06, 0, midX, counterY, W*0.32);
    intGlow.addColorStop(0,'rgba(255,140,50,0.18)');
    intGlow.addColorStop(1,'rgba(0,0,0,0)');
    g.fillStyle = intGlow; g.fillRect(sx, roofEdge, sw, counterY-roofEdge);

    // ROOF
    g.beginPath();
    g.moveTo(sx-W*0.025, roofEdge+3);
    g.lineTo(midX, roofPeak);
    g.lineTo(sx+sw+W*0.025, roofEdge+3);
    g.closePath();
    const roofGr = g.createLinearGradient(0, roofPeak, 0, roofEdge);
    roofGr.addColorStop(0,'#180e04'); roofGr.addColorStop(1,'#281605');
    g.fillStyle = roofGr; g.fill();
    g.strokeStyle='#3a2010'; g.lineWidth=2.5;
    g.beginPath();
    g.moveTo(sx-W*0.025,roofEdge+4); g.lineTo(midX,roofPeak); g.lineTo(sx+sw+W*0.025,roofEdge+4);
    g.stroke();
    g.strokeStyle='rgba(255,160,60,0.18)'; g.lineWidth=1.5;
    g.beginPath(); g.moveTo(sx-W*0.03,roofEdge+5); g.lineTo(sx+sw+W*0.03,roofEdge+5); g.stroke();

    // BACK WALL
    const wall = g.createLinearGradient(0, roofEdge, 0, stallBot);
    wall.addColorStop(0,'#1c1005'); wall.addColorStop(1,'#120c04');
    g.fillStyle = wall; g.fillRect(sx, roofEdge+4, sw, stallBot-roofEdge-4);

    // NOREN strips
    const strips = 9, sw2 = sw/strips;
    for (let i=0;i<strips;i++) {
      const nx = sx + i*sw2 + sw2*0.08, nw = sw2*0.84;
      const ng = g.createLinearGradient(nx, roofEdge+5, nx, norenBot);
      ng.addColorStop(0,'#18154a'); ng.addColorStop(1,'#100e38');
      g.fillStyle = ng; g.fillRect(nx, roofEdge+5, nw, norenBot-roofEdge-5);
      g.strokeStyle='rgba(255,255,255,0.04)'; g.lineWidth=0.8;
      g.beginPath(); g.moveTo(nx,roofEdge+5); g.lineTo(nx,norenBot); g.stroke();
    }
    g.fillStyle='rgba(180,170,240,0.38)';
    g.font = `bold ${Math.floor(H*0.038)}px serif`;
    g.textAlign='center';
    g.fillText('拉', sx+sw*0.28, roofEdge+(norenBot-roofEdge)*0.62);
    g.fillText('麺', sx+sw*0.72, roofEdge+(norenBot-roofEdge)*0.62);

    // POSTS
    g.fillStyle='#311505';
    [sx+W*0.015, sx+sw-W*0.015].forEach(px =>
      g.fillRect(px, roofEdge+4, W*0.014, stallBot-roofEdge-4));

    // COUNTER TOP
    const ctGr = g.createLinearGradient(0,counterY,0,counterY+H*0.048);
    ctGr.addColorStop(0,'#604818'); ctGr.addColorStop(1,'#3c2a0a');
    g.fillStyle = ctGr; g.fillRect(sx-W*0.01, counterY, sw+W*0.02, H*0.048);
    g.fillStyle='rgba(255,200,80,0.14)';
    g.fillRect(sx-W*0.01, counterY, sw+W*0.02, 2);
    g.fillStyle='#28140a';
    g.fillRect(sx-W*0.01, counterY+H*0.048, sw+W*0.02, H*0.065);

    // ITEMS ON COUNTER
    const bowlY = counterY - H*0.022;
    [0.14,0.28,0.62,0.76].forEach((t,i) => {
      const bx = sx+sw*t;
      g.fillStyle='rgba(0,0,0,0.35)';
      g.beginPath(); g.ellipse(bx,bowlY+H*0.015,H*0.032,H*0.007,0,0,Math.PI*2); g.fill();
      g.fillStyle = i%2===0?'#252525':'#2a1a0a';

      g.beginPath(); g.ellipse(bx,bowlY-H*0.008,H*0.028,H*0.008,0,0,Math.PI*2); g.fill();
    });
    [0.44,0.50].forEach(t => {
      const bx=sx+sw*t;
      g.fillStyle='#253318';

    lamps.forEach(lx => drawLantern(g, lx, roofEdge+6, W*0.018, H*0.038));

  function drawLantern(g, x, y, rx, ry) {
    g.strokeStyle='#3a2010'; g.lineWidth=1.5;
    g.beginPath(); g.moveTo(x,y-8); g.lineTo(x,y); g.stroke();
    g.fillStyle='#c03010';
    g.beginPath(); g.ellipse(x,y+ry*0.5,rx,ry*0.52,0,0,Math.PI*2); g.fill();
    const ig=g.createRadialGradient(x,y+ry*0.5,0,x,y+ry*0.5,rx*0.85);
    ig.addColorStop(0,'rgba(255,215,90,0.9)'); ig.addColorStop(1,'rgba(255,100,10,0)');
    g.fillStyle=ig; g.beginPath(); g.ellipse(x,y+ry*0.5,rx*0.85,ry*0.44,0,0,Math.PI*2); g.fill();
    g.strokeStyle='#8a1c08'; g.lineWidth=0.9;
    [-ry*0.14,0,ry*0.14].forEach(dy => {
      g.beginPath(); g.ellipse(x,y+ry*0.5+dy,rx,ry*0.08,0,0,Math.PI*2); g.stroke();
    });
    g.strokeStyle='#c03010'; g.lineWidth=2;
    g.beginPath(); g.moveTo(x,y+ry); g.lineTo(x,y+ry+9); g.stroke();
  }

  function drawLanternGlow(g, T) {
    const { W, lamps, roofEdge } = G;
    lamps.forEach((lx, i) => {
      const pulse = 0.22 + 0.10 * Math.sin(T*1.1 + i*1.3);
      const rg = g.createRadialGradient(lx, roofEdge+10, 0, lx, roofEdge+10, W*0.14);
      rg.addColorStop(0,`rgba(255,160,50,${pulse})`);
      rg.addColorStop(0.45,`rgba(255,100,20,${pulse*0.36})`);
      rg.addColorStop(1,'rgba(0,0,0,0)');
      g.fillStyle = rg;
      g.beginPath(); g.arc(lx, roofEdge+10, W*0.14, 0, Math.PI*2); g.fill();
    });
  }

  let _lastMasterSpeak = 0;

  function spawnMasterSay(text, delay = 1500) {
    const _now2 = performance.now() / 1000;
    if (_now2 - _lastMasterSpeak < 4) return;
    _lastMasterSpeak = _now2;
    const { midX, counterY, H } = G;
    bubbles.push({ x: midX, y: counterY - H*0.10, text, born: performance.now()/1000, life: 2.8, master: true });
    try { if (window._logDialog) window._logDialog(text, 'master'); } catch(_) {}
    const _enM = TRANSLATIONS[text];
    if (_enM) { setTimeout(() => { try { if (window._showSubtitle) window._showSubtitle(_enM); } catch(_) {} }, delay); }
    if (!window._npcVoiceMuted && window.speechSynthesis) {
      setTimeout(() => {
        if (!window.speechSynthesis.speaking && !window.speechSynthesis.pending) {
          const utt = new SpeechSynthesisUtterance(text);
          utt.lang = 'ja-JP'; utt.rate = 1.05; utt.pitch = 0.78; utt.volume = 0.88;
          const v = _masterVoice(); if (v) utt.voice = v;
          window.speechSynthesis.speak(utt);
        }
      }, delay);
    }
  }

  function spawnMasterBubble(dish) {
    spawnMasterSay(MASTER_REPLIES[dish] || 'はい、ただいま！');
  }

  // Exposed so outer game can trigger speech for actual game orders
  window._iifeOrderSpeech = function(dishId) {
    const { counterY, H } = G;
    const occupied = SLOTS.filter(s => s.cu && (s.cu.state === 'sit_in' || s.cu.state === 'sit'));
    const x = occupied.length > 0
      ? occupied[Math.floor(Math.random() * occupied.length)].cu.x
      : G.midX;
    const phrase = DISH_ORDER[dishId] || 'ください！';
    spawnBubble(x, counterY - H*0.28, phrase);
    setTimeout(() => spawnMasterBubble(dishId), 1200);
  };

  window._iifeMasterServe = function(dishId) {
    spawnMasterBubble(dishId);
    // Mark one seated canvas customer as having received their dish
    const seated = SLOTS.filter(s => s.cu && s.cu.state === 'sit' && !s.cu.served);
    if (seated.length) {
      const slot = seated[Math.floor(Math.random() * seated.length)];
      slot.cu.dish  = dishId;
      slot.cu.served = true;
    }
  };

  // Guest-side serve: targets the specific guest character rather than a random customer
  window._iifeServeGuest = function(guestId, dishId) {
    spawnMasterBubble(dishId);
    const slot = SLOTS.find(s => s.cu && s.cu.isPlayer && s.cu.guestId === guestId);
    if (slot) { slot.cu.dish = dishId; slot.cu.served = true; }
  };

  function drawBubbles(g, T) {
    const now = performance.now() / 1000;
    bubbles = bubbles.filter(b => now - b.born < b.life);
    bubbles.forEach(b => {
      const age = now - b.born;
      const t = age / b.life;
      const alpha = t < 0.12 ? t/0.12 : t > 0.70 ? (1-t)/0.30 : 1;
      const by = b.y - age * G.H * 0.018;

      g.save();
      g.globalAlpha = alpha;
      g.font = `bold ${Math.round(G.H*0.022)}px serif`;
      const tw = g.measureText(b.text).width;
      const pad = G.W*0.012, bh = G.H*0.038;

      // Bubble
      const rx = G.H*0.012;
      g.fillStyle = 'rgba(10,8,20,0.88)';
      g.beginPath();
      g.roundRect(b.x - tw/2 - pad, by - bh, tw + pad*2, bh, rx);
      g.fill();
      g.strokeStyle = b.master ? 'rgba(255,110,40,0.75)' : 'rgba(255,200,80,0.55)'; g.lineWidth = 1;
      g.stroke();

      // Tail
      g.fillStyle = 'rgba(10,8,20,0.88)';
      g.beginPath();
      g.moveTo(b.x - G.W*0.006, by);
      g.lineTo(b.x + G.W*0.006, by);
      g.lineTo(b.x, by + G.H*0.012);
      g.closePath(); g.fill();

      // Text
      g.fillStyle = '#fdf0de';
      g.textAlign = 'center'; g.textBaseline = 'middle';
      g.fillText(b.text, b.x, by - bh/2);
      g.restore();
    });
  }

  function slotX(slot) {
    const { sx, sw } = G;
    return sx + sw * slot.t;
  }

  function randomCtype(base) {
    const type = base.type;
    const h = Math.random() * 360;
    let s, l;
    if (type === 'suit')        { s = 6  + Math.random()*28; l = 15 + Math.random()*26; }
    else if (type === 'hoodie') { s = 35 + Math.random()*45; l = 24 + Math.random()*34; }
    else if (type === 'shirt')  { s = 22 + Math.random()*52; l = 22 + Math.random()*36; }
    else if (type === 'kimono') { s = 10 + Math.random()*18; l = 5  + Math.random()*12; }
    else                        { s = 30 + Math.random()*50; l = 28 + Math.random()*36; }
    const ph = Math.random() * 360;
    const ps = type === 'suit' ? 8 + Math.random()*22 : 15 + Math.random()*45;
    const pl = 14 + Math.random()*22;
    const geisha     = !!base.geisha;
    const police     = !!base.police;
    const sumo       = !!base.sumo;
    const politician = !!base.politician;
    let skH = 18 + Math.random()*22, skS = 38 + Math.random()*32, skL = 42 + Math.random()*32;
    if (geisha) { skH = 35; skS = 12; skL = 88; } // white shironuri makeup
    const female = geisha || Math.random() < 0.50;
    const hairPal = ['#090706','#090706','#090706','#1a100a','#2c1a10','#3a1808','#5a2810','#787070','#a09898'];
    const hair = base.hair || hairPal[Math.floor(Math.random()*hairPal.length)];
    const hStyles = female
      ? ['long','long','long','ponytail','ponytail']
      : ['buzz','medium','medium','thin','buzz'];
    const hairStyle = geisha ? 'long' : (police || sumo) ? 'buzz' : hStyles[Math.floor(Math.random()*hStyles.length)];
    const hsl = (hv,sv,lv) => `hsl(${hv|0},${sv|0}%,${lv|0}%)`;
    const _tiePal = ['#7a1818','#1a2858','#2a1858','#1a3820','#786020','#4a1a40','#5a3010'];
    const tieColor = (!police && !sumo && !female && type === 'suit' && (base.tieColor || Math.random() < 0.65))
      ? (base.tieColor || _tiePal[Math.floor(Math.random()*_tiePal.length)])
      : null;
    const skCol = hsl(skH, skS, skL), skDCol = hsl(skH, skS, Math.max(0, skL-16));
    // Police, sumo, and politician preserve specific colors
    if (police || sumo || politician) {
      return {
        type, jacket:base.jacket, jacketD:base.jacketD, pants:base.pants,
        shirt:base.shirt, cuff:base.cuff, skin:skCol, skinD:skDCol,
        hair:base.hair||hair, hairStyle:base.hairStyle||hairStyle,
        tieColor:politician?(base.tieColor||null):null,
        female:false, geisha:false, police, sumo, politician,
      };
    }
    return {
      type,
      jacket:  hsl(h, s, l),
      jacketD: hsl(h, s, Math.max(0, l-14)),
      pants:   hsl(ph, ps, pl),
      shirt:   type === 'suit' ? hsl(40,18,86) : hsl(h, s, l),
      cuff:    type === 'suit' ? hsl(40,14,90) : hsl(h, s, Math.max(0, l-14)),
      skin:    skCol, skinD: skDCol,
      hair, hairStyle, tieColor, female, geisha, police:false, sumo:false, politician:false,
    };
  }

  const ALCOHOL_PICKS = ['beer','beer','beer','beer','beer','beer','sake','sake','sake','sake','sake','sake','shochu','shochu','shochu','shochu','highball','highball','highball','highball','oolong','oolong','yakisoba','yakisoba','flan','pocky','osenbe'];

  function _pickDish() {
    const waiting = window._gameG?.customers?.filter(c => c.state === 'wait' && c.order && ALCOHOL_DISHES.has(c.order.id)) || [];
    if (waiting.length > 0) {
      return waiting[Math.floor(Math.random() * waiting.length)].order.id;
    }
    return ALCOHOL_PICKS[Math.floor(Math.random() * ALCOHOL_PICKS.length)];
  }

  // Stars → rep: 1★=8, 2★=22, 3★=45, 4★=70, 5★=90
  // At 5 stars: orders arrive ~75% faster, +18 extra rounds
  function _repEatMax(base)   { return Math.floor(base * 1.2 * (1 - (_curRep / 100) * 0.75)); }
  function _repRoundsBonus()  { return Math.floor((_curRep / 100) * 18); }

  // ── LLM-GENERATED OUTFITS ── a slow-growing pool of AI-designed ct objects,
  // refreshed periodically while the stall is open (see window._requestLlmOutfit,
  // triggered from openStall/endService). Every field is validated before it's
  // accepted — the canvas renderer expects specific enums/hex colors, and a small
  // local model won't always follow the schema — so a bad response is just discarded
  // rather than risking a broken render. Falls back entirely to the existing
  // procedural randomCtype() pool whenever empty or a request fails.
  const _VALID_CTYPE_TYPES = new Set(['tee', 'shirt', 'suit', 'kimono', 'hoodie']);
  const _VALID_HAIR_STYLES = new Set(['buzz', 'medium', 'long', 'thin', 'ponytail']);
  const LLM_OUTFIT_POOL_MAX = 12;
  let _llmOutfitPool = [];
  function _isHexColor(s) { return typeof s === 'string' && /^#[0-9a-fA-F]{6}$/.test(s); }
  function _validateLlmOutfit(o) {
    if (!o || typeof o !== 'object' || !_VALID_CTYPE_TYPES.has(o.type)) return null;
    for (const f of ['jacket', 'jacketD', 'pants', 'shirt', 'cuff', 'skin', 'skinD', 'hair']) {
      if (!_isHexColor(o[f])) return null;
    }
    return {
      type: o.type, jacket: o.jacket, jacketD: o.jacketD, pants: o.pants,
      shirt: o.shirt, cuff: o.cuff, skin: o.skin, skinD: o.skinD, hair: o.hair,
      hairStyle: _VALID_HAIR_STYLES.has(o.hairStyle) ? o.hairStyle : 'medium',
      female: !!o.female, llmGenerated: true,
    };
  }
  window._requestLlmOutfit = async function() {
    try {
      const resp = await fetch('/api/chat', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          message: 'Generate one now.',
          systemPrompt: 'You generate JSON describing a fictional customer\'s outfit for a Japanese yatai (street food stall) character generator. Respond with ONLY a single valid JSON object — no markdown code fences, no explanation, no extra text before or after. Schema: {"type": one of "tee"|"shirt"|"suit"|"kimono"|"hoodie", "jacket": "#rrggbb" (main outer garment color), "jacketD": "#rrggbb" (darker shade of jacket, for shading), "pants": "#rrggbb", "shirt": "#rrggbb" (inner shirt color), "cuff": "#rrggbb", "skin": "#rrggbb", "skinD": "#rrggbb" (darker skin shade), "hair": "#rrggbb", "hairStyle": one of "buzz"|"medium"|"long"|"thin"|"ponytail", "female": true or false}. Colors MUST be hex codes like #a0522d, never color names. Example of a correctly formatted response: {"type":"suit","jacket":"#2a3b4c","jacketD":"#1a2530","pants":"#14202c","shirt":"#e0e4d8","cuff":"#eaeedc","skin":"#c09870","skinD":"#9a7850","hair":"#0c0808","hairStyle":"buzz","female":false}. Be creative and varied with the palette, type, and hairstyle combination each time — invent a plausible, interesting-looking customer different from the example.',
        }),
      });
      const data = await resp.json();
      let raw = (data.reply || '').trim();
      raw = raw.replace(/^```(?:json)?\s*/i, '').replace(/```\s*$/i, '').trim();
      const outfit = _validateLlmOutfit(JSON.parse(raw));
      if (outfit) {
        _llmOutfitPool.push(outfit);
        if (_llmOutfitPool.length > LLM_OUTFIT_POOL_MAX) _llmOutfitPool.shift();
      }
    } catch (_) { /* discard — procedural pool is always the fallback */ }
  };

  function spawnCustomer() {
    const free = SLOTS.filter(s => !s.cu);
    if (!free.length) return;
    const slot = free[Math.floor(Math.random()*free.length)];

    // Permanent NPCs — guaranteed once per day, skipped if already seated elsewhere
    // right now. Falls through to the normal random pool once used/unavailable.
    G._permanentSeenToday = G._permanentSeenToday || {};
    const seated = new Set(SLOTS.filter(s => s.cu && s.cu.permanentId).map(s => s.cu.permanentId));
    const permanent = _allPermanentNPCs().find(p => !G._permanentSeenToday[p.id] && !seated.has(p.id));

    // ~35% chance to use an AI-generated outfit instead of the procedural randomizer,
    // whenever the pool has anything in it yet.
    const useLlmOutfit = !permanent && _llmOutfitPool.length > 0 && Math.random() < 0.35;
    const ct = permanent ? permanent.ct
      : useLlmOutfit ? _llmOutfitPool[Math.floor(Math.random() * _llmOutfitPool.length)]
      : randomCtype(CTYPES[Math.floor(Math.random()*CTYPES.length)]);
    if (permanent) G._permanentSeenToday[permanent.id] = true;
    if (ct.type === 'kimono' && !ct.geisha) { try { if (window.AUDIO_REF) window.AUDIO_REF.playYakuzaSting(); } catch(_) {} }
    if (ct.geisha) { try { if (window.AUDIO_REF) window.AUDIO_REF.playGeishaMusic(); } catch(_) {} }
    if (ct.sumo) { try { if (window.AUDIO_REF) window.AUDIO_REF.playSumoEntrance(); } catch(_) {} }
    if (ct.police) { try { if (window.AUDIO_REF) window.AUDIO_REF.playPoliceSiren(); } catch(_) {} }
    if (ct.politician) { try { if (window.AUDIO_REF) window.AUDIO_REF.playPoliticianFanfare(); } catch(_) {} }
    if (ct.hostess) { try { if (window.AUDIO_REF) window.AUDIO_REF.playHostessMusic(); } catch(_) {} }
    if (ct.punkGodfather) { try { if (window.AUDIO_REF) window.AUDIO_REF.playPunkAnthem(); } catch(_) {} }
    const tx = slotX(slot);
    slot.cu = {
      state: 'walk_in',
      x: G.W + G.W*0.06,
      targetX: tx,
      ct,
      dish: _pickDish(),
      phase: Math.random()*Math.PI*2,
      name: permanent ? permanent.name : _randName(),
      permanentId: permanent ? permanent.id : null,
      prof: _randProf(),
      interest: _randInt(),
      smoker: Math.random() < 0.28,
      eatTimer: 0,
      eatMax: ct.sumo ? _repEatMax(70000 + Math.floor(Math.random()*30000)) : _repEatMax(60000 + Math.floor(Math.random()*40000)),
      roundsLeft: ct.sumo ? 30 + Math.floor(Math.random() * 20) + _repRoundsBonus() : 18 + Math.floor(Math.random() * 14) + _repRoundsBonus(),
      unhappy: Math.random() < 0.12,
      alcoholCount: ct.sumo ? 2 : 0,
      voiceIdx:   Math.floor(Math.random() * 12),
      voicePitch: 0.72 + Math.random() * 0.62,
      voiceRate:  0.92 + Math.random() * 0.24,
      slot,
    };
  }

  function initCustomers() {
    SLOTS.forEach(s => s.cu = null);
    // Pre-seat 2 customers
    G._permanentSeenToday = G._permanentSeenToday || {};
    [SLOTS[0], SLOTS[2], SLOTS[4]].forEach(slot => {
      const permanent = _allPermanentNPCs().find(p => !G._permanentSeenToday[p.id]);
      const ct = permanent ? permanent.ct : randomCtype(CTYPES[Math.floor(Math.random()*CTYPES.length)]);
      if (permanent) G._permanentSeenToday[permanent.id] = true;
      slot.cu = {
        state: 'sit',
        x: slotX(slot),
        targetX: slotX(slot),
        ct,
        dish: _pickDish(),
        phase: Math.random()*Math.PI*2,
        name: permanent ? permanent.name : _randName(),
        permanentId: permanent ? permanent.id : null,
        prof: _randProf(),
        interest: _randInt(),
        smoker: Math.random() < 0.28,
        eatTimer: Math.floor(Math.random()*300),
        eatMax: 90000 + Math.floor(Math.random()*54000),
        roundsLeft: 14 + Math.floor(Math.random() * 10),
        unhappy: Math.random() < 0.25,
        alcoholCount: 0,
        voiceIdx:   Math.floor(Math.random() * 12),
        voicePitch: 0.72 + Math.random() * 0.62,
        voiceRate:  0.92 + Math.random() * 0.24,
        chatAt: Math.random() < 0.65 ? 300 + Math.floor(Math.random() * 500) : -1,
        slot,
      };
    });
    lastSpawn = -4;
  }

  function updateCustomers(T) {
    if (!window.stallOpen) {
      SLOTS.forEach(s => { s.cu = null; });
      return;
    }
    const { W, H, stallBot } = G;
    const speed = W * 0.003;

    // Spawn cadence — faster at higher reputation
    _curRep = window._gameG?.rep ?? 8;
    const _rep = _curRep;
    const _spawnBase   = Math.max(12, 48 - _rep * 0.36);
    const _spawnJitter = Math.max(6,  18 - _rep * 0.12);
    if (!_isFrozen && T - lastSpawn > _spawnBase + Math.random() * _spawnJitter) {
      spawnCustomer();
      lastSpawn = T;
    }

    // Inter-customer conversations
    if (T - _lastInterChat > 22 + Math.random()*20) {
      const sitters = SLOTS.filter(s => s.cu && s.cu.state === 'sit' && !s.cu.isPlayer);
      if (sitters.length >= 2) {
        _lastInterChat = T;
        const shuffled = sitters.slice().sort(() => Math.random() - 0.5);
        const cuA = shuffled[0].cu, cuB = shuffled[1].cu;
        const pair = CHAT_PAIRS[Math.floor(Math.random() * CHAT_PAIRS.length)];
        const { counterY } = G;
        const lineA = (cuA.alcoholCount || 0) > 7
          ? DRUNK_TALK[Math.floor(Math.random() * DRUNK_TALK.length)] : pair.a;
        spawnBubble(cuA.x, counterY - H*0.28, lineA, { voice: _custVoice(cuA.voiceIdx), pitch: cuA.voicePitch, rate: cuA.voiceRate });
        setTimeout(() => {
          if (cuB.state === 'sit') {
            const lineB = (cuB.alcoholCount || 0) > 7
              ? DRUNK_TALK[Math.floor(Math.random() * DRUNK_TALK.length)] : pair.b;
            spawnBubble(cuB.x, G.counterY - G.H*0.28, lineB, { voice: _custVoice(cuB.voiceIdx), pitch: cuB.voicePitch, rate: cuB.voiceRate });
          }
        }, 2200 + Math.random() * 1200);
      }
    }

    // Politician caucus — 2+ politicians huddle about politics
    if (T - _lastPolChat > 18 + Math.random() * 16) {
      const polSitters = SLOTS.filter(s => s.cu && s.cu.state === 'sit' && !s.cu.isPlayer && s.cu.ct && s.cu.ct.politician);
      if (polSitters.length >= 2) {
        _lastPolChat = T;
        const { counterY } = G;
        // Rotating 3-line exchanges: A opens → B replies → A closes (or a third politician jumps in)
        const _POL_EXCHANGES = [
          { a:'新党を立ち上げましょう！今がチャンスです！', b:'賛成です！名前はどうしますか？', c:'「鹿児島ファースト党」はどうでしょう！' },
          { a:'消費税の廃止を公約にすれば票が取れますよ。', b:'でも財源はどうするんですか？', c:'まず選挙に勝つことが大事ですよ！' },
          { a:'先生、次の選挙は勝てますか？', b:'地盤をしっかり固めればいける！', c:'後援会の拡大が急務ですね。' },
          { a:'桜島の噴火対策、もっと国に訴えなければ！', b:'防災予算の増額を要求しましょう！', c:'地元の声を届けることが使命ですよ。' },
          { a:'野党との連立は考えていますか？', b:'政策が合えば検討の余地はありますよ。', c:'まずは選挙区を守ることが先決です！' },
          { a:'こんな夜台でこっそり党の話をするのは…', b:'いや、最高のブレインストーミングですよ！', c:'ラーメン食べながら政治を語る、これが民主主義！' },
          { a:'大臣ポストを狙うなら今ですよ！', b:'いやいや、地元の声を忘れてはいけません。', c:'足元を固めてから上を目指しましょう！' },
          { a:'選挙公約に屋台の支援を入れましょう！', b:'「夜台文化を守る会」、いい響きですね。', c:'票になりますよ、確実に！' },
        ];
        const ex = _POL_EXCHANGES[Math.floor(Math.random() * _POL_EXCHANGES.length)];
        const cuA = polSitters[0].cu;
        const cuB = polSitters[1].cu;
        const cuC = polSitters.length >= 3 ? polSitters[2].cu : null;

        spawnBubble(cuA.x, counterY - H*0.28, ex.a, { voice: _custVoice(cuA.voiceIdx), pitch: cuA.voicePitch * 0.96, rate: cuA.voiceRate * 0.88 });
        setTimeout(() => {
          if (cuB.state === 'sit') spawnBubble(cuB.x, G.counterY - G.H*0.28, ex.b, { voice: _custVoice(cuB.voiceIdx), pitch: cuB.voicePitch * 0.94, rate: cuB.voiceRate * 0.88 });
        }, 2400 + Math.random()*600);
        setTimeout(() => {
          const cuFinal = (cuC && cuC.state === 'sit') ? cuC : (cuA.state === 'sit' ? cuA : null);
          if (cuFinal) spawnBubble(cuFinal.x, G.counterY - G.H*0.28, ex.c, { voice: _custVoice(cuFinal.voiceIdx), pitch: cuFinal.voicePitch * 0.92, rate: cuFinal.voiceRate * 0.86 });
        }, 4800 + Math.random()*800);
        // Master quietly comments
        const _masterPolLines = [
          '政治家のお客様が多いですね…何かあるのかな。',
          'なんか秘密の会議みたいですね、うちの店で！',
          '政治の話は難しいですが、料理は任せてください！',
        ];
        setTimeout(() => spawnMasterSay(_masterPolLines[Math.floor(Math.random() * _masterPolLines.length)]), 6500);
      }
    }

    // Fights — more likely when drunk
    if (T - _lastFight > 45 + Math.random()*40) {
      const sitters = SLOTS.filter(s => s.cu && s.cu.state === 'sit' && !s.cu.isPlayer && !s.cu.falling);
      if (sitters.length >= 2) {
        // Weight toward drunk customers as instigators
        const weighted = [];
        sitters.forEach(s => {
          const times = (s.cu.alcoholCount || 0) > 7 ? 4 : 1;
          for (let i = 0; i < times; i++) weighted.push(s);
        });
        const slotA = weighted[Math.floor(Math.random() * weighted.length)];
        const others = sitters.filter(s => s !== slotA);
        const slotB = others[Math.floor(Math.random() * others.length)];
        const cuA = slotA.cu, cuB = slotB.cu;
        const { counterY } = G;
        _lastFight = T;

        // A starts it
        spawnBubble(cuA.x, counterY - H*0.28,
          FIGHT_OPENERS[Math.floor(Math.random() * FIGHT_OPENERS.length)],
          { voice: _custVoice(cuA.voiceIdx), pitch: cuA.voicePitch * 1.25, rate: cuA.voiceRate * 1.2 });
        cuA.angry = true;

        // B fires back
        setTimeout(() => {
          if (cuB.state === 'sit') {
            spawnBubble(cuB.x, G.counterY - G.H*0.28,
              FIGHT_REPLIES[Math.floor(Math.random() * FIGHT_REPLIES.length)],
              { voice: _custVoice(cuB.voiceIdx), pitch: cuB.voicePitch * 1.30, rate: cuB.voiceRate * 1.25 });
            cuB.angry = true;
          }
        }, 2000 + Math.random()*500);

        // One escalates then storms out
        setTimeout(() => {
          const loser = Math.random() < 0.5 ? cuA : cuB;
          if (loser.state === 'sit') {
            spawnBubble(loser.x, G.counterY - G.H*0.28,
              FIGHT_ESCALATE[Math.floor(Math.random() * FIGHT_ESCALATE.length)],
              { voice: _custVoice(loser.voiceIdx), pitch: loser.voicePitch * 1.35, rate: loser.voiceRate * 1.3 });
            setTimeout(() => {
              loser.angry = false;
              loser.unhappy = true;
              loser.roundsLeft = 0;
              loser.eatTimer = loser.eatMax + 30;
            }, 1500);
          }
          // Cool down the other one
          setTimeout(() => { cuA.angry = false; cuB.angry = false; }, 5000);
        }, 4500 + Math.random()*1000);
      }
    }

    SLOTS.forEach(slot => {
      const cu = slot.cu;
      if (!cu) return;

      if (cu.state === 'walk_in') {
        cu.x += (cu.targetX - cu.x) * 0.045;
        if (Math.abs(cu.x - cu.targetX) < 2) {
          cu.x = cu.targetX;
          cu.state = 'sit_in';
          cu.sitTimer = 0;
        }
      } else if (cu.state === 'sit_in') {
        if (cu.isPlayer || cu._synced) return;
        cu.sitTimer++;
        if (cu.sitTimer > 40) {
          cu.state = 'sit';
          cu.served = false;
          cu.serveAt = 60 + Math.floor(Math.random() * 40); // frames until food appears
          // Schedule a random chat moment during their stay (65% chance)
          cu.chatAt = Math.random() < 0.65
            ? Math.floor(300 + Math.random() * Math.max(200, cu.eatMax - 600))
            : -1;
        }
      } else if (cu.state === 'sit') {
        // Human players are immortal — clear any hazard flags immediately
        if (cu.isPlayer) { cu.dead = false; cu.puking = false; cu.falling = false; return; }
        // Death animation — overrides everything else
        if (cu.dead) {
          cu.deathTimer = (cu.deathTimer || 0) + 1;
          if (cu.deathTimer >= 280) { slot.cu = null; }
          return;
        }
        // Puke sequence
        if (cu.puking) {
          cu.pukTimer = (cu.pukTimer || 0) + 1;
          const _pt = cu.pukTimer;
          if (_pt === 14) {
            const { counterY } = G;
            spawnBubble(cu.x, counterY - H*0.28,
              PUKE_CRIES[Math.floor(Math.random() * PUKE_CRIES.length)],
              { voice: _custVoice(cu.voiceIdx), pitch: cu.voicePitch * 2.0, rate: 1.8 });
          }
          if (_pt === 45) {
            _pukeFlash = 50;
            try { if (window.AUDIO_REF) window.AUDIO_REF.playPukeSplat(); } catch(_) {}
            setTimeout(() => spawnMasterSay('うわ！大丈夫ですか！！'), 300);
          }
          if (_pt >= 220) { cu.puking = false; cu.state = 'walk_out'; }
          return;
        }
        // Fall animation — runs instead of normal sit logic
        if (cu.falling) {
          cu.fallTimer = (cu.fallTimer || 0) + 1;
          if (cu.fallTimer === 80) {
            // They hit the floor — apologetic exit line
            const { counterY } = G;
            spawnBubble(cu.x, counterY - H*0.28,
              FALL_RECOVER[Math.floor(Math.random() * FALL_RECOVER.length)],
              { voice: _custVoice(cu.voiceIdx), pitch: cu.voicePitch, rate: cu.voiceRate * 0.70 });
          }
          if (cu.fallTimer >= 220) {
            cu.falling = false;
            cu.state = 'walk_out';
          }
          return; // skip all eating/ordering logic
        }
        if (cu._synced) return; // broadcast-synced NPC
        cu.eatTimer += cu.served ? 1 : 4; // slow eat when served, fast tick when waiting
        // Empty-plate impatience — only counts when not yet served
        if (!cu.served && cu.eatTimer > 150) {
          cu.emptyTimer = (cu.emptyTimer || 0) + 1;
          if (cu.emptyTimer === 7200) {
            const { counterY } = G;
            const _nags = ['すみません！まだですか？', 'あの…頼んだんですが…', 'もうちょっとかかりますか？', 'ちょっと！遅くないですか？'];
            spawnBubble(cu.x, counterY - H*0.28, _nags[Math.floor(Math.random()*_nags.length)],
              { voice: _custVoice(cu.voiceIdx), pitch: cu.voicePitch * 1.15, rate: cu.voiceRate * 1.1 });
          }
          if (cu.emptyTimer >= 12000) {
            const { counterY } = G;
            spawnBubble(cu.x, counterY - H*0.28, 'もういいです、帰ります！',
              { voice: _custVoice(cu.voiceIdx), pitch: cu.voicePitch * 1.2, rate: cu.voiceRate * 1.2 });
            cu.state = 'walk_out';
          }
        } else if (cu.served) {
          cu.emptyTimer = 0;
        }
        // cu.served is set by the outer game when the player actually serves the dish
        // Small talk with master
        if (cu.chatAt > 0 && cu.eatTimer === cu.chatAt) {
          cu.chatAt = -1;
          const { counterY } = G;
          const _isDrunkChat = (cu.alcoholCount || 0) > 7;
          const _chatRate = _isDrunkChat ? cu.voiceRate * 0.80 : cu.voiceRate * 0.92;
          const _cx = cu.x, _cy = counterY - H * 0.28, _ct = cu.ct || {};
          const _sayFallback = () => {
            const pool = _isDrunkChat ? DRUNK_TALK : SMALL_TALK;
            const line = pool[Math.floor(Math.random() * pool.length)];
            spawnBubble(_cx, _cy, line, { voice: _custVoice(cu.voiceIdx), pitch: cu.voicePitch, rate: _chatRate, lang: _customerVoiceLang(_ct) });
          };
          // LLM-generated idle chatter, in-character per persona/ct — falls back to the
          // static line pool if the request fails (offline, no LLM backend configured, etc).
          try {
            fetch('/api/chat', {
              method: 'POST', headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                message: _isDrunkChat
                  ? '(You are a little drunk, mumbling something out loud to no one in particular — spontaneous, not responding to anyone.)'
                  : '(Making idle small talk out loud to no one in particular — spontaneous, not responding to anyone.)',
                systemPrompt: _buildCustomerPersona(cu, _ct),
              }),
            }).then(r => r.json()).then(data => {
              const line = (data.reply || '').trim();
              if (!line || cu.state === 'walk_out') { if (line === '') _sayFallback(); return; }
              spawnBubble(_cx, _cy, line, { voice: _custVoice(cu.voiceIdx), pitch: cu.voicePitch, rate: _chatRate, lang: _customerVoiceLang(_ct) });
            }).catch(_sayFallback);
          } catch(_) { _sayFallback(); }
          const _now = performance.now() / 1000;
          if (_now - _lastMasterSmallTalk > 18) {
            _lastMasterSmallTalk = _now;
            setTimeout(() => spawnMasterSay(MASTER_SMALL_TALK[Math.floor(Math.random() * MASTER_SMALL_TALK.length)]), 900);
          }
        }
        if (cu.eatTimer === cu.eatMax && cu.unhappy && !cu.shoutedUnhappy) {
          cu.shoutedUnhappy = true;
          const { counterY } = G;
          const complaint = UNHAPPY_SHOUTS[Math.floor(Math.random()*UNHAPPY_SHOUTS.length)];
          spawnBubble(cu.x, counterY - H*0.28, complaint, { voice: _custVoice(cu.voiceIdx), pitch: cu.voicePitch, rate: cu.voiceRate * 1.1 });
        }
        if (cu.eatTimer >= cu.eatMax + (cu.unhappy ? 25 : 0)) {
          // Shiokara puke — 20% chance
          if (cu.dish === 'shiokara' && Math.random() < 0.20) {
            cu.puking = true;
            cu.pukTimer = 0;
            cu.roundsLeft = 0;
            return;
          }
          // Osenbe choking — rare mishap, not a routine hazard
          if (cu.dish === 'osenbe' && Math.random() < 0.03) {
            cu.dead = true;
            cu.deathTimer = 0;
            cu.roundsLeft = 0;
            _deathFlash = 60;
            try { if (window.AUDIO_REF) window.AUDIO_REF.playChoke(); } catch(_) {}
            const { counterY } = G;
            spawnBubble(cu.x, counterY - H*0.28,
              ['げほっ…おせんべい…のどに…', 'ごほっ…ごほっ…つまった…', 'か、かたい…のどに…ごほっ', 'おせんべい…げほっ…'][Math.floor(Math.random()*4)],
              { voice: _custVoice(cu.voiceIdx), pitch: cu.voicePitch * 0.5, rate: 0.5 });
            setTimeout(() => spawnMasterSay('え！？大丈夫ですか！！おせんべい！！'), 1600);
            return;
          }
          // Fugu poisoning — 10% chance of death
          if (cu.dish === 'fugu' && Math.random() < 0.10) {
            cu.dead = true;
            cu.deathTimer = 0;
            cu.roundsLeft = 0;
            _deathFlash = 60;
            try { if (window.AUDIO_REF) window.AUDIO_REF.playDeathScream(); } catch(_) {}
            const { counterY } = G;
            spawnBubble(cu.x, counterY - H*0.28,
              FUGU_DEATH_CRIES[Math.floor(Math.random() * FUGU_DEATH_CRIES.length)],
              { voice: _custVoice(cu.voiceIdx), pitch: cu.voicePitch * 0.38, rate: 0.45 });
            setTimeout(() => spawnMasterSay('え…大丈夫ですか！？'), 1800);
            return;
          }
          // Count the drink they just finished
          if (ALCOHOL_DISHES.has(cu.dish)) {
            cu.alcoholCount = (cu.alcoholCount || 0) + 1;
            if (cu.alcoholCount === 7) {
              // Getting a buzz — order one more for sure
              cu.roundsLeft += 2 + Math.floor(Math.random() * 4);
            } else if (cu.alcoholCount === 10) {
              // Drunk — settle in for a long night
              cu.roundsLeft += 10 + Math.floor(Math.random() * 7);
            } else if (cu.alcoholCount > 10) {
              // Each drink after that leads to two more — deep in it now
              cu.roundsLeft += 1 + (Math.random() < 0.80 ? 1 : 0);
            }
            // Too drunk — fall off the stool
            if (cu.alcoholCount >= 20 && !cu.falling && Math.random() < 0.55) {
              cu.falling  = true;
              cu.fallTimer = 0;
              cu.roundsLeft = 0;
              const { counterY } = G;
              spawnBubble(cu.x, counterY - H*0.28,
                FALL_SHOUTS[Math.floor(Math.random() * FALL_SHOUTS.length)],
                { voice: _custVoice(cu.voiceIdx), pitch: cu.voicePitch * 1.5, rate: 1.4 });
            }
          }
          const _isDrunk = (cu.alcoholCount || 0) > 7;
          if (cu.roundsLeft > 0) {
            // Still hungry/thirsty — place another order
            cu.roundsLeft--;
            cu.dish = _pickDish();
            cu.eatTimer = 0;
            cu.eatMax = _repEatMax(40000 + Math.floor(Math.random() * 32000));
            cu.served = false;
            cu.emptyTimer = 0;
            cu.serveAt = 60 + Math.floor(Math.random() * 40);
            cu.chatAt = Math.random() < (_isDrunk ? 0.80 : 0.50)
              ? Math.floor(200 + Math.random() * Math.max(100, cu.eatMax - 400))
              : -1;
            const { counterY } = G;
            const phrase = _isDrunk
              ? DRUNK_TALK[Math.floor(Math.random() * DRUNK_TALK.length)]
              : (REORDER[cu.dish] || 'おかわり、ください！');
            const _rate = _isDrunk ? cu.voiceRate * 0.82 : cu.voiceRate;
            spawnBubble(cu.x, counterY - H*0.28, phrase, { voice: _custVoice(cu.voiceIdx), pitch: cu.voicePitch, rate: _rate });
            setTimeout(() => spawnMasterBubble(cu.dish), 700);
          } else {
            cu.state = 'walk_out';
            // A happy customer who finished their whole visit without complaint has a
            // chance to become a recurring regular — capped so "permanent" stays meaningful.
            if (!cu.permanentId && !cu.isPlayer && !cu.unhappy) {
              G.earnedNPCs = G.earnedNPCs || [];
              if (G.earnedNPCs.length < 6 && Math.random() < 0.15) {
                const id = 'earned_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
                G.earnedNPCs.push({ id, name: cu.name, ct: cu.ct });
                try { savePlayerState(); } catch(_) {}
                toast(`${cu.name} loved tonight — they'll be back as a regular!`, 'info');
              }
            }
          }
        }
      } else if (cu.state === 'walk_out') {
        if (cu.isPlayer) { cu.state = 'sit'; cu.x = cu.targetX; return; }
        cu.x += speed;
        if (cu.x > W + W*0.06) {
          slot.cu = null;
        }
      }
    });
  }

  // ── DISH ARTWORK ─────────────────────────────
  function drawFood(g, dish, W, H, cY) {
    // All coords are in the customer's translated space (x=0 = customer centre)
    switch (dish) {

      case 'shoyu':
      case 'tonk': {
        const broth   = dish === 'shoyu' ? '#b8621a' : '#ddd0b0';
        const noodleC = dish === 'shoyu' ? '#e8cc70' : '#f0e8c4';
        // Drop shadow
        g.fillStyle = 'rgba(0,0,0,.28)';
        g.beginPath(); g.ellipse(0, cY-H*.003, W*.027, H*.007, 0, 0, Math.PI*2); g.fill();
        // Bowl body (dark ceramic)
        g.fillStyle = '#161616';
        g.beginPath(); g.ellipse(0, cY-H*.011, W*.026, H*.011, 0, 0, Math.PI*2); g.fill();
        // Inner bowl wall highlight
        g.strokeStyle = '#303030'; g.lineWidth = 1.2;
        g.beginPath(); g.ellipse(0, cY-H*.011, W*.026, H*.011, 0, 0, Math.PI*2); g.stroke();
        // Broth surface
        g.fillStyle = broth;
        g.beginPath(); g.ellipse(0, cY-H*.015, W*.021, H*.007, 0, 0, Math.PI*2); g.fill();
        // Noodle wisps (3 curved strokes)
        g.strokeStyle = noodleC; g.lineWidth = 1.3; g.lineCap = 'round';
        for (let i = 0; i < 3; i++) {
          const nx = -W*.013 + i*W*.011;
          g.beginPath();
          g.moveTo(nx, cY-H*.014);
          g.quadraticCurveTo(nx+W*.005, cY-H*.019, nx+W*.010, cY-H*.014);
          g.stroke();
        }
        // Chashu slice (brown arc)
        g.fillStyle = '#7a3810';
        g.beginPath(); g.ellipse(-W*.009, cY-H*.017, W*.006, H*.003, 0.4, 0, Math.PI*2); g.fill();
        g.strokeStyle='#5a280a'; g.lineWidth=0.6;
        g.beginPath(); g.ellipse(-W*.009, cY-H*.017, W*.006, H*.003, 0.4, 0, Math.PI*2); g.stroke();
        // Negi (green onion) dots
        g.fillStyle = '#4aaa30';
        [[W*.010,-H*.018],[W*.014,-H*.015],[-W*.001,-H*.019]].forEach(([nx,ny]) => {
          g.beginPath(); g.ellipse(nx, cY+ny, W*.002, H*.002, 0, 0, Math.PI*2); g.fill();
        });
        // Naruto (pink/white fishcake)
        g.fillStyle = 'rgba(240,160,160,.85)';
        g.beginPath(); g.arc(W*.012, cY-H*.017, W*.004, 0, Math.PI*2); g.fill();
        g.strokeStyle = 'rgba(210,80,80,.5)'; g.lineWidth = 0.7;
        g.beginPath(); g.arc(W*.012, cY-H*.017, W*.002, 0, Math.PI*2); g.stroke();
        break;
      }

      case 'fugu': {
        // Large flat porcelain plate — white with blue rim
        g.fillStyle = 'rgba(0,0,0,.22)';
        g.beginPath(); g.ellipse(W*.004, cY-H*.001, W*.032, H*.007, 0, 0, Math.PI*2); g.fill();
        g.fillStyle = '#f6f2ee';
        g.beginPath(); g.ellipse(0, cY-H*.005, W*.030, H*.007, 0, 0, Math.PI*2); g.fill();
        // Blue decorative rim line
        g.strokeStyle = 'rgba(60,80,160,.45)'; g.lineWidth = 0.8;
        g.beginPath(); g.ellipse(0, cY-H*.005, W*.028, H*.0062, 0, 0, Math.PI*2); g.stroke();
        // Kikuzukuri — thin translucent slices fanned in a circle
        const _fuguCX = -W*.004, _fuguCY = cY-H*.016;
        const _sliceCount = 10;
        for (let fi = 0; fi < _sliceCount; fi++) {
          const _ang = (fi / _sliceCount) * Math.PI * 2 - Math.PI * 0.5;
          const _rx = W*.013, _ry = H*.005;
          g.save();
          g.translate(_fuguCX, _fuguCY);
          g.rotate(_ang);
          // Translucent petal slice — pale pink-white
          g.fillStyle = `rgba(240,220,215,${0.55 + (fi % 2) * 0.12})`;
          g.beginPath();
          g.ellipse(_rx * 0.55, 0, _rx, _ry, 0, 0, Math.PI * 2);
          g.fill();
          // Subtle pink tint on edge
          g.strokeStyle = 'rgba(200,160,155,.35)'; g.lineWidth = 0.5;
          g.beginPath(); g.ellipse(_rx * 0.55, 0, _rx, _ry, 0, 0, Math.PI * 2); g.stroke();
          g.restore();
        }
        // Centre circle where slices meet
        g.fillStyle = '#f0e8e4';
        g.beginPath(); g.arc(_fuguCX, _fuguCY, W*.004, 0, Math.PI*2); g.fill();
        // Ponzu sauce dish (tiny dark round)
        g.fillStyle = 'rgba(80,40,10,.70)';
        g.beginPath(); g.ellipse(W*.018, cY-H*.010, W*.006, H*.003, 0, 0, Math.PI*2); g.fill();
        g.strokeStyle = 'rgba(120,70,20,.40)'; g.lineWidth = 0.5;
        g.beginPath(); g.ellipse(W*.018, cY-H*.010, W*.006, H*.003, 0, 0, Math.PI*2); g.stroke();
        // Momiji oroshi — tiny red-orange mound
        g.fillStyle = 'rgba(200,70,40,.80)';
        g.beginPath(); g.ellipse(W*.018, cY-H*.013, W*.003, H*.002, 0, 0, Math.PI*2); g.fill();
        // Negi garnish strip
        g.fillStyle = 'rgba(60,150,40,.75)';
        g.fillRect(-W*.026, cY-H*.008, W*.008, H*.0015);
        break;
      }

      case 'miso': {
        // Bowl shadow
        g.fillStyle = 'rgba(0,0,0,.28)';
        g.beginPath(); g.ellipse(0, cY-H*.003, W*.027, H*.007, 0, 0, Math.PI*2); g.fill();
        // Bowl body — cream ceramic
        g.fillStyle = '#e8dcc8';
        g.beginPath(); g.ellipse(0, cY-H*.011, W*.026, H*.011, 0, 0, Math.PI*2); g.fill();
        g.strokeStyle = '#d0c4a8'; g.lineWidth = 1.0;
        g.beginPath(); g.ellipse(0, cY-H*.011, W*.026, H*.011, 0, 0, Math.PI*2); g.stroke();
        // Miso broth — deep amber-orange
        g.fillStyle = '#c46a14';
        g.beginPath(); g.ellipse(0, cY-H*.015, W*.021, H*.007, 0, 0, Math.PI*2); g.fill();
        // Broth shimmer
        g.fillStyle = 'rgba(255,180,60,.22)';
        g.beginPath(); g.ellipse(-W*.007, cY-H*.017, W*.009, H*.003, -0.3, 0, Math.PI*2); g.fill();
        // Noodle wisps
        g.strokeStyle = '#e8cc70'; g.lineWidth = 1.3; g.lineCap = 'round';
        for (let i = 0; i < 3; i++) {
          const nx = -W*.013 + i*W*.011;
          g.beginPath();
          g.moveTo(nx, cY-H*.014);
          g.quadraticCurveTo(nx+W*.005, cY-H*.019, nx+W*.010, cY-H*.014);
          g.stroke();
        }
        // Corn kernels (yellow dots — classic miso topping)
        g.fillStyle = '#f0d020';
        [[-W*.010,cY-H*.019],[W*.002,cY-H*.020],[W*.013,cY-H*.018],[-W*.003,cY-H*.017]].forEach(([kx,ky]) => {
          g.beginPath(); g.ellipse(kx, ky, W*.0030, H*.0025, 0, 0, Math.PI*2); g.fill();
        });
        // Butter pat (small pale yellow square melting on top)
        g.fillStyle = 'rgba(255,235,120,.80)';
        g.beginPath(); g.ellipse(W*.011, cY-H*.020, W*.005, H*.003, 0.3, 0, Math.PI*2); g.fill();
        g.strokeStyle = 'rgba(200,170,40,.40)'; g.lineWidth = 0.5;
        g.beginPath(); g.ellipse(W*.011, cY-H*.020, W*.005, H*.003, 0.3, 0, Math.PI*2); g.stroke();
        // Negi (green onion)
        g.fillStyle = '#4aaa30';
        [[-W*.013,cY-H*.018],[W*.008,cY-H*.020],[-W*.001,cY-H*.021]].forEach(([nx,ny]) => {
          g.beginPath(); g.ellipse(nx, ny, W*.002, H*.002, 0, 0, Math.PI*2); g.fill();
        });
        // Chashu slice
        g.fillStyle = '#7a3810';
        g.beginPath(); g.ellipse(-W*.010, cY-H*.017, W*.006, H*.003, 0.4, 0, Math.PI*2); g.fill();
        g.strokeStyle='#5a280a'; g.lineWidth=0.6;
        g.beginPath(); g.ellipse(-W*.010, cY-H*.017, W*.006, H*.003, 0.4, 0, Math.PI*2); g.stroke();
        break;
      }

      case 'beer': {
        const bw = W*.016, bTop = cY-H*.040, bBot = cY-H*.006;
        // Condensation glow
        g.fillStyle = 'rgba(180,200,255,.06)';
        g.beginPath(); g.ellipse(0, bBot, bw*1.1, H*.005, 0, 0, Math.PI*2); g.fill();
        // Mug body — amber beer fill
        g.fillStyle = 'rgba(200,135,22,.85)';
        g.beginPath();
        g.moveTo(-bw*.88, bTop+H*.010);
        g.lineTo(-bw, bBot); g.lineTo(bw, bBot);
        g.lineTo(bw*.88, bTop+H*.010);
        g.closePath(); g.fill();
        // Light band inside glass
        g.fillStyle = 'rgba(255,200,80,.10)';
        g.beginPath();
        g.moveTo(-bw*.30, bTop+H*.012);
        g.lineTo(-bw*.38, bBot-H*.004);
        g.lineTo(-bw*.20, bBot-H*.004);
        g.lineTo(-bw*.14, bTop+H*.012);
        g.closePath(); g.fill();
        // Foam
        g.fillStyle = 'rgba(248,244,232,.96)';
        g.beginPath(); g.ellipse(0, bTop+H*.007, bw*.88, H*.008, 0, 0, Math.PI*2); g.fill();
        // Foam bubble bumps
        g.fillStyle = '#fff';
        [-bw*.40, 0, bw*.40].forEach(bpx => {
          g.beginPath(); g.arc(bpx, bTop+H*.003, H*.005, 0, Math.PI*2); g.fill();
        });
        // Glass outline
        g.strokeStyle = 'rgba(160,100,10,.55)'; g.lineWidth = 1;
        g.beginPath();
        g.moveTo(-bw*.88, bTop+H*.010);
        g.lineTo(-bw, bBot); g.lineTo(bw, bBot);
        g.lineTo(bw*.88, bTop+H*.010);
        g.stroke();
        // Handle
        g.strokeStyle = 'rgba(160,100,10,.45)'; g.lineWidth = 2;
        g.beginPath();
        g.moveTo(bw, bTop+H*.015);
        g.quadraticCurveTo(bw*1.55, bTop+H*.024, bw, bTop+H*.033);
        g.stroke();
        break;
      }

      case 'edamame': {
        // Small dish
        g.fillStyle = '#e4ddd0';
        g.beginPath(); g.ellipse(0, cY-H*.006, W*.023, H*.007, 0, 0, Math.PI*2); g.fill();
        g.fillStyle = '#d0c8b4';
        g.beginPath(); g.ellipse(0, cY-H*.008, W*.020, H*.005, 0, 0, Math.PI*2); g.fill();
        // Edamame pods
        [[-W*.012,cY-H*.010, -0.4],[W*.001,cY-H*.009, 0.1],[W*.013,cY-H*.011, 0.5],[-W*.005,cY-H*.014, -0.1]].forEach(([px,py,ang]) => {
          g.save(); g.translate(px, py); g.rotate(ang);
          // Pod shell
          g.fillStyle = '#3e8a1a';
          g.beginPath(); g.ellipse(0, 0, W*.011, H*.004, 0, 0, Math.PI*2); g.fill();
          // Stem tip
          g.strokeStyle = '#2e6a10'; g.lineWidth = 0.7;
          g.beginPath(); g.moveTo(W*.010, 0); g.lineTo(W*.014, -H*.002); g.stroke();
          // Bean bumps
          g.fillStyle = '#52aa22';
          [-W*.004, W*.003].forEach(bx => {
            g.beginPath(); g.arc(bx, 0, H*.0025, 0, Math.PI*2); g.fill();
          });
          // Seam line
          g.strokeStyle = 'rgba(30,80,10,.4)'; g.lineWidth = 0.5;
          g.beginPath(); g.moveTo(-W*.009, 0); g.lineTo(W*.009, 0); g.stroke();
          g.restore();
        });
        break;
      }

      case 'yakitori': {
        // Narrow ceramic plate
        g.fillStyle = 'rgba(0,0,0,.25)';
        g.beginPath(); g.ellipse(0, cY-H*.003, W*.026, H*.006, 0, 0, Math.PI*2); g.fill();
        g.fillStyle = '#e8e0d0';
        g.beginPath(); g.ellipse(0, cY-H*.005, W*.025, H*.005, 0, 0, Math.PI*2); g.fill();
        // 3 skewers
        [-W*.010, 0, W*.010].forEach((sx2, i) => {
          const sTop = cY-H*.040, sBot = cY-H*.005;
          // Bamboo stick
          g.strokeStyle = '#c4a434'; g.lineWidth = 1.4;
          g.beginPath(); g.moveTo(sx2, sBot); g.lineTo(sx2-W*.003, sTop); g.stroke();
          // Three charred chicken pieces on each stick
          [0.28, 0.50, 0.72].forEach(frac => {
            const py = sBot + (sTop-sBot)*frac;
            const px = sx2 - W*.003*frac;
            g.fillStyle = ['#6a3810','#5c3010','#7a4018'][i];

  // Food + chopsticks + vomit particles for a seated customer, drawn in the customer's
  // local (x=0-centered), non-rotated coordinate space — extracted so both the original
  // Canvas2D drawCustomer() and the Pixi seated-rig renderer's Canvas2D food overlay can
  // share it. Recomputes armY/shldrY/_eatY from cu/T/W/H/counterY rather than threading
  // them through as extra params, since they're all cheap derived values.
  function drawSeatedExtras(g, cu, T, W, H, counterY) {
    const { state, phase } = cu;
    const shldrY = counterY - H * 0.195;
    const armY = counterY - H * 0.020;
    const _eatPhase = Math.sin(T * 2.2 + phase * 3.1);
    const _eatY = (state === 'sit' && cu.served) ? Math.pow(Math.max(0, _eatPhase), 2) * H * 0.048 : 0;

    if (state === 'sit' && cu.served && !cu.puking) {
      drawFood(g, cu.dish, W, H, counterY);

      const usesChopsticks = cu.dish !== 'beer' && cu.dish !== 'sake' && cu.dish !== 'shochu';
      if (usesChopsticks) {
        const chopA = Math.sin(T*3.5+phase)*H*0.024;
        g.strokeStyle = 'rgba(200,162,80,0.82)'; g.lineWidth = 1.4; g.lineCap = 'round';
        g.beginPath(); g.moveTo(W*0.004, armY-H*0.002 - _eatY); g.lineTo(W*0.014, counterY-H*0.038+chopA); g.stroke();
        g.beginPath(); g.moveTo(W*0.010, armY-H*0.002 - _eatY); g.lineTo(W*0.022, counterY-H*0.036-chopA); g.stroke();
      }
    }

    // Vomit arc + splatter
    if (cu.puking) {
      const _pt = cu.pukTimer || 0;
      const _mX = 0, _mY = shldrY - H*0.088; // approx mouth pos in local space
      const _tX = W*0.038, _tY = counterY - H*0.015; // lands on counter
      const _cpX = W*0.058, _cpY = counterY - H*0.10; // bezier arc control

      // Active vomit stream (frames 28-115)
      if (_pt > 28 && _pt < 115) {
        const _prog = Math.min(1, (_pt - 28) / 35);
        const numDrops = Math.ceil(14 * _prog);
        for (let di = 0; di < numDrops; di++) {
          const t = di / 14;
          const _bX = (1-t)*(1-t)*_mX + 2*(1-t)*t*_cpX + t*t*_tX;
          const _bY = (1-t)*(1-t)*_mY + 2*(1-t)*t*_cpY + t*t*_tY;
          const _sz = W*0.004 + t * W*0.009;
          const _a = 0.75 - t * 0.15;
          g.fillStyle = `rgba(80,${170 + Math.floor(t*30)},30,${_a})`;
          g.beginPath(); g.ellipse(_bX, _bY, _sz, _sz*0.75, 0, 0, Math.PI*2); g.fill();
        }
      }
      // Splatter puddle on counter (persists from frame 55)
      if (_pt > 55 && _pt < 210) {
        const _sA = _pt > 190 ? 0.55 * (1 - (_pt - 190) / 20) : 0.55;
        g.fillStyle = `rgba(70,160,25,${_sA})`;
        g.beginPath(); g.ellipse(_tX, _tY, W*0.020, H*0.004, 0.2, 0, Math.PI*2); g.fill();
        g.beginPath(); g.ellipse(_tX + W*0.014, _tY + H*0.003, W*0.008, H*0.003, -0.3, 0, Math.PI*2); g.fill();
        // Drip drops
        [W*0.022, W*0.034, W*0.048].forEach((px, i) => {
          g.beginPath(); g.arc(px, _tY + H*0.006 + i*H*0.002, W*0.003, 0, Math.PI*2); g.fill();
        });
      }
    }
  }

  function drawCustomer(g, cu, T) {
    const { W, H, counterY, stallBot } = G;
    const { state, x, ct, phase } = cu;
    const _drunkAmt = Math.max(0, (cu.alcoholCount || 0) - 7);

    if (state === 'walk_in' || state === 'walk_out') {
      // ── WALKING — full profile figure ───────────────────────────
      const bH   = H*0.22;
      const hr   = W*0.024;
      const gndY = stallBot - H*0.003;
      const stride  = Math.sin(T*4.5 + phase);
      const strideB = -stride;
      const shldrY  = gndY - bH*0.72;
      const waistY  = gndY - bH*0.44;
      const headCy  = gndY - bH + hr;

      g.save(); g.translate(x, 0);
      if (state === 'walk_out') g.scale(-1, 1);

      // Ground shadow
      g.fillStyle = 'rgba(0,0,0,0.20)';
      g.beginPath(); g.ellipse(0, gndY, W*0.032, H*0.008, 0, 0, Math.PI*2); g.fill();

      // ── BACK LEG ──────────────────────────────────
      const bkKneeX = Math.sin(strideB*0.30)*bH*0.24;
      const bkKneeY = waistY + bH*0.24;
      const bkFootX = bkKneeX + Math.sin(strideB*0.30 - stride*0.20)*bH*0.24;
      if (ct.type !== 'kimono' && !ct.female) {
        g.strokeStyle = ct.pants; g.lineWidth = W*0.018; g.lineCap = 'round';
        g.beginPath(); g.moveTo(W*0.004, waistY); g.lineTo(bkKneeX, bkKneeY); g.stroke();
        g.lineWidth = W*0.015;
        g.beginPath(); g.moveTo(bkKneeX, bkKneeY); g.lineTo(bkFootX, gndY); g.stroke();
        g.fillStyle = '#181212';
        g.beginPath(); g.ellipse(bkFootX+W*0.010, gndY, W*0.014, H*0.005, 0.10, 0, Math.PI*2); g.fill();
      }

      // ── BODY ──────────────────────────────────────
      const _kimonoBot = gndY - H*0.002;
      g.fillStyle = ct.jacket;
      g.beginPath();
      if (ct.type === 'kimono') {
        g.moveTo(-W*0.018, shldrY); g.lineTo(-W*0.028, _kimonoBot);
        g.lineTo(W*0.026, _kimonoBot); g.lineTo(W*0.019, shldrY);
      } else {
        g.moveTo(-W*0.020, shldrY); g.lineTo(-W*0.024, waistY);
        g.lineTo(W*0.022, waistY); g.lineTo(W*0.021, shldrY+H*0.005);
      }
      g.closePath(); g.fill();
      {
        const jsh = g.createLinearGradient(-W*0.024, 0, W*0.022, 0);
        jsh.addColorStop(0, 'rgba(0,0,0,0.28)'); jsh.addColorStop(0.22, 'rgba(0,0,0,0)'); jsh.addColorStop(1, 'rgba(0,0,0,0)');
        g.fillStyle = jsh;
        g.beginPath();
        if (ct.type === 'kimono') {
          g.moveTo(-W*0.018, shldrY); g.lineTo(-W*0.028, _kimonoBot);
          g.lineTo(W*0.026, _kimonoBot); g.lineTo(W*0.019, shldrY);
        } else {
          g.moveTo(-W*0.020, shldrY); g.lineTo(-W*0.024, waistY);
          g.lineTo(W*0.022, waistY); g.lineTo(W*0.021, shldrY+H*0.005);
        }
        g.closePath(); g.fill();
      }
      if (ct.type === 'suit') {
        // Shirt V visible at front
        g.fillStyle = ct.shirt;
        g.beginPath();
        g.moveTo(-W*0.005, shldrY+H*0.005);
        g.lineTo(-W*0.007, waistY-H*0.008);
        g.lineTo(W*0.007, waistY-H*0.008);
        g.lineTo(W*0.012, shldrY+H*0.005);
        g.closePath(); g.fill();
        g.fillStyle = ct.jacketD;
        g.fillRect(-W*0.024, waistY-H*0.007, W*0.046, H*0.010);
        // Tie — hanging blade in profile
        if (ct.tieColor) {
          g.fillStyle = ct.tieColor;
          // Knot
          g.beginPath(); g.ellipse(W*0.002, shldrY+H*0.018, W*0.005, H*0.007, 0.05, 0, Math.PI*2); g.fill();
          // Blade tapers to point at bottom
          g.beginPath();
          g.moveTo(-W*0.002, shldrY+H*0.023);
          g.lineTo(W*0.006, shldrY+H*0.023);
          g.lineTo(W*0.004, waistY-H*0.022);
          g.lineTo(W*0.001, waistY-H*0.017);
          g.lineTo(-W*0.001, waistY-H*0.022);
          g.closePath(); g.fill();
          // Subtle highlight stripe
          g.strokeStyle = 'rgba(255,255,255,0.13)'; g.lineWidth = W*0.0018; g.lineCap = 'round';
          g.beginPath(); g.moveTo(W*0.002, shldrY+H*0.028); g.lineTo(W*0.003, waistY-H*0.028); g.stroke();

  // ── STEAM PARTICLES ──────────────────────────
  let steam = [];
  function mkSteam() {
    const { W, H } = G;
    const cx = W*0.50 + (Math.random()-0.5)*W*0.28;
    return { x:cx, y:H*0.565, vy:-(0.22+Math.random()*0.42),
      vx:(Math.random()-0.5)*0.18, r:3+Math.random()*9,
      life:0, max:85+Math.random()*65 };
  }
  function initSteam() {
    steam = Array.from({length:14}, () => {
      const p=mkSteam(); p.life=Math.floor(Math.random()*p.max); return p;
    });
  }

  // ── RESIZE ───────────────────────────────────
  function resize() {
    c.width = window.innerWidth;
    c.height = window.innerHeight;
    buildOff();
    if (window._pixiResizeCustomerLayer) window._pixiResizeCustomerLayer(G.W, G.H);
    initSteam();
    bubbles = [];
    // Reanchor seated customers
    SLOTS.forEach(slot => {
      if (!slot.cu) return;
      slot.cu.targetX = slotX(slot);
      if (slot.cu.state === 'sit' || slot.cu.state === 'sit_in') {
        slot.cu.x = slot.cu.targetX;
      }
    });
  }

  function drawTyphoon(ctx, T) {

    ctx.fillStyle = `rgba(12,18,38,${fade * 0.30})`;

    ctx.lineWidth = 0.9;
    _RAIN.forEach(d => {
      d.x += d.vx; d.y += d.vy;
      if (d.y > H + 30 || d.x > W + 60) _resetRainDrop(d, W, H, false);

      ctx.moveTo(d.x, d.y);
      ctx.lineTo(d.x - d.vx * 0.55, d.y - d.vy * 0.55);
