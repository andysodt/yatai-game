<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>夜台 — Yatai Master</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --night: #06090f;
  --deep: #0d1420;
  --panel: #111825;
  --wood: #5c3010;
  --wood-l: #7a4520;
  --lantern: #ff8c3a;
  --lantern-glow: rgba(255,140,58,0.12);
  --red: #c0392b;
  --red-l: #e74c3c;
  --cream: #fdf0de;
  --gold: #f0c040;
  --green: #27ae60;
  --teal: #1abc9c;
  --blue: #2980b9;
  --text: #d4c4a8;
  --dim: #786858;
}

html, body {
  height: 100%;
  background: var(--night);
  color: var(--text);
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  overflow: hidden;
  user-select: none;
}

/* ── STARS BG ── */
#stars-canvas {
  position: fixed; inset: 0;
  pointer-events: none;
  z-index: 0;
}

/* ── SCREENS ── */
.screen {
  position: absolute; inset: 0;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  z-index: 10;
  overflow-y: auto;
}

/* ── TITLE ── */
#title-screen {
  text-align: center;
  padding: 40px 24px;
}

.lantern-row {
  font-size: 48px;
  display: flex; gap: 16px; justify-content: center;
  margin-bottom: 20px;
}
.lantern-row span { animation: sway 3s ease-in-out infinite; display: inline-block; }
.lantern-row span:nth-child(2) { animation-delay: -1s; }
.lantern-row span:nth-child(3) { animation-delay: -2s; }
@keyframes sway { 0%,100%{transform:rotate(-5deg)} 50%{transform:rotate(5deg)} }

.title-kanji {
  font-size: 86px; line-height: 1;
  color: var(--lantern);
  text-shadow: 0 0 40px rgba(255,140,58,.9), 0 0 80px rgba(255,140,58,.4);
  margin-bottom: 6px;
}
.title-en {
  font-size: 22px; letter-spacing: 8px;
  color: var(--cream); margin-bottom: 12px;
  text-transform: uppercase;
}
.title-tagline {
  font-size: 14px; color: var(--dim);
  line-height: 1.7; max-width: 380px;
  margin: 0 auto 36px;
}

/* ── BUTTONS ── */
.btn {
  padding: 13px 30px; border: none; border-radius: 4px;
  font-size: 15px; cursor: pointer; font-weight: 700;
  letter-spacing: 0.5px; transition: all .18s;
  display: inline-flex; align-items: center; gap: 8px;
}
.btn-primary { background: var(--red); color: var(--cream); box-shadow: 0 4px 18px rgba(192,57,43,.5); }
.btn-primary:hover { background: var(--red-l); transform: translateY(-2px); box-shadow: 0 6px 24px rgba(231,76,60,.55); }
.btn-wood { background: var(--wood); color: var(--cream); }
.btn-wood:hover { background: var(--wood-l); transform: translateY(-1px); }
.btn-gold { background: var(--gold); color: #111; font-weight: 800; }
.btn-gold:hover { background: #f5d262; transform: translateY(-2px); }
.btn-green { background: var(--green); color: #fff; }
.btn-green:hover { filter: brightness(1.15); }
.btn:disabled { opacity: .3; cursor: not-allowed; transform: none !important; filter: none !important; }
.btn-full { width: 100%; justify-content: center; padding: 16px; font-size: 16px; }

/* ── HUD ── */
#hud {
  position: fixed; top: 0; left: 0; right: 0;
  height: 54px;
  background: rgba(6,9,15,.96);
  border-bottom: 1px solid var(--wood);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 18px; z-index: 200;
}
.hud-brand { font-size: 22px; font-weight: 800; color: var(--lantern); letter-spacing: 2px; }
.hud-stats { display: flex; gap: 18px; }
.hud-stat { display: flex; flex-direction: column; align-items: center; }
.hud-val { font-size: 15px; font-weight: 700; color: var(--cream); }
.hud-val.gold { color: var(--gold); }
.hud-val.orange { color: var(--lantern); }
.hud-label { font-size: 9px; text-transform: uppercase; letter-spacing: 1px; color: var(--dim); }

/* ── TIME BAR ── */
#time-bar-wrap {
  position: fixed; top: 54px; left: 0; right: 0;
  height: 3px; background: rgba(255,255,255,.06); z-index: 200;
}
#time-bar-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--lantern), var(--red));
  transition: width .4s linear;
}

/* ── GAME LAYOUT — horizontal bottom bar ── */
#game-wrap {
  position: fixed; bottom: 0; left: 0; right: 0; top: auto;
  height: 216px;
  display: flex; flex-direction: row; align-items: stretch;
  gap: 6px; padding: 6px 8px;
  background: rgba(4,7,12,.97);
  border-top: 1px solid var(--wood);
  overflow-x: auto; overflow-y: hidden;
  z-index: 10;
}

#card-cook  { flex: 0 0 210px; overflow-y: auto; }
#card-menu  { flex: 1 1 0;    min-width: 200px; overflow-y: auto; }
#card-custs { flex: 0 0 210px; overflow-y: auto; }
#card-stats { flex: 0 0 130px; overflow-y: auto; }

/* ── CARDS ── */
.card {
  background: var(--panel);
  border: 1px solid rgba(255,255,255,.07);
  border-radius: 8px; padding: 8px 10px;
}
.card-title {
  font-size: 9px; text-transform: uppercase; letter-spacing: 1.5px;
  color: var(--dim); margin-bottom: 7px;
  display: flex; align-items: center; gap: 6px;
}
.card-title::after { content:''; flex:1; height:1px; background:rgba(255,255,255,.06); }

/* ── TONIGHT STATS — 2×2 in narrow column ── */
#card-stats #stats-row { display: grid; grid-template-columns: 1fr 1fr; gap: 0; }
#card-stats .stat-cell { padding: 5px 2px; border-right: 1px solid rgba(255,255,255,.05); border-bottom: 1px solid rgba(255,255,255,.05); }
#card-stats .stat-cell:nth-child(2n) { border-right: none; }
#card-stats .stat-cell:nth-last-child(-n+2) { border-bottom: none; }
#card-stats .stat-val { font-size: 15px; }
#card-stats .stat-lbl { font-size: 8px; }

/* ── COOKING SLOTS ── */
#cook-area { display: grid; grid-template-columns: repeat(3,1fr); gap: 5px; }

.cook-slot {
  background: rgba(0,0,0,.3);
  border: 1px dashed rgba(255,255,255,.12);
  border-radius: 6px; padding: 7px 4px;
  text-align: center; min-height: 72px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  transition: all .2s;
  font-family: inherit; color: inherit; width: 100%;
  touch-action: manipulation; -webkit-tap-highlight-color: transparent;
}
.cook-slot.empty { color: var(--dim); font-size: 11px; }
.cook-slot.cooking { border-color: var(--lantern); border-style: solid; background: rgba(255,140,58,.04); }
.cook-slot.ready {
  border-color: var(--green); border-style: solid;
  background: rgba(39,174,96,.05);
  cursor: pointer; animation: pulse-g 1.4s ease-in-out infinite;
}
.cook-slot.ready:hover { background: rgba(39,174,96,.12); transform: scale(1.02); }
@keyframes pulse-g { 0%,100%{box-shadow:0 0 0 0 rgba(39,174,96,.4)} 50%{box-shadow:0 0 0 8px rgba(39,174,96,0)} }

.slot-icon { font-size: 22px; }
.slot-name { font-size: 9px; color: var(--dim); }
.slot-tag { font-size: 10px; font-weight: 700; }
.slot-tag.cooking { color: var(--lantern); }
.slot-tag.ready { color: var(--green); }

.prog-bar { width: 100%; height: 3px; background: rgba(255,255,255,.1); border-radius: 2px; overflow:hidden; margin-top: 2px; }
.prog-fill { height:100%; background: var(--lantern); border-radius: 2px; transition: width .12s linear; }

/* ── MENU ── */
#menu-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); gap: 5px; }

.menu-btn {
  background: rgba(0,0,0,.28);
  border: 1px solid rgba(255,255,255,.09);
  border-radius: 6px; padding: 6px 4px;
  cursor: pointer; text-align: center;
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  transition: all .18s; color: var(--text);
  font-family: inherit; width: 100%;
  touch-action: manipulation; -webkit-tap-highlight-color: transparent;
}
.menu-btn:hover { border-color: var(--lantern); background: rgba(255,140,58,.06); transform: translateY(-1px); }
.menu-btn.no-stock { border-color: rgba(192,57,43,.4); opacity: .45; cursor: not-allowed; transform: none !important; }
.menu-btn.no-slot { opacity: .4; cursor: not-allowed; transform: none !important; }
.menu-btn.locked { opacity: .18; cursor: not-allowed; }
.menu-btn .icon { font-size: 20px; }
.menu-btn .en { font-size: 10px; font-weight: 600; color: var(--cream); }
.menu-btn .jp { font-size: 9px; color: var(--dim); }
.menu-btn .price { font-size: 11px; font-weight: 700; color: var(--gold); }
.menu-btn .stock { font-size: 9px; color: var(--dim); }

/* ── CUSTOMERS ── */
#customer-list { display: flex; flex-direction: column; gap: 5px; }

.cust-card {
  background: rgba(0,0,0,.25);
  border: 1px solid rgba(255,255,255,.08);
  border-radius: 6px; padding: 6px 9px;
  display: flex; align-items: center; gap: 8px;
  transition: all .3s;
}
.cust-card.urgent { border-color: var(--red); animation: urgpulse 1s ease-in-out infinite; }
@keyframes urgpulse { 0%,100%{background:rgba(0,0,0,.25)} 50%{background:rgba(192,57,43,.08)} }
.cust-card.gone { opacity: 0; transform: translateX(60px); }

.cust-icon { font-size: 20px; }
.cust-info { flex: 1; min-width: 0; }
.cust-type { font-size: 9px; color: var(--dim); }
.cust-order { font-size: 11px; color: var(--cream); display: flex; align-items: center; gap: 4px; margin-top: 1px; }

.pat-wrap { min-width: 56px; display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
.pat-bar { width: 56px; height: 3px; background: rgba(255,255,255,.1); border-radius: 2px; overflow:hidden; }
.pat-fill { height:100%; border-radius: 2px; transition: width .5s linear; }
.pat-time { font-size: 9px; color: var(--dim); }

.no-cust { text-align:center; padding: 18px; color: var(--dim); font-size: 13px; }

/* ── TONIGHT STATS ── */
#stats-row { display: flex; gap: 0; }
.stat-cell {
  flex:1; text-align:center; padding: 8px 4px;
  border-right: 1px solid rgba(255,255,255,.05);
}
.stat-cell:last-child { border-right: none; }
.stat-val { font-size: 22px; font-weight: 700; }
.stat-lbl { font-size: 10px; color: var(--dim); text-transform: uppercase; letter-spacing: 1px; }

/* ── PREP SCREEN ── */
#prep-wrap {
  max-width: 640px; width: 100%;
  padding: 24px 16px; display: flex; flex-direction: column; gap: 14px;
}
.prep-hdr { text-align: center; }
.prep-hdr h2 { font-size: 22px; color: var(--cream); margin-bottom: 4px; }
.prep-hdr p { font-size: 13px; color: var(--dim); }
.weather-badge {
  display: inline-flex; align-items: center; gap: 6px;
  background: rgba(255,255,255,.05); border-radius: 20px;
  padding: 5px 14px; font-size: 13px; color: var(--text);
  margin-top: 10px;
}
.money-big { font-size: 32px; font-weight: 800; color: var(--gold); text-align: center; }

.shop-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.shop-item {
  background: var(--panel); border: 1px solid rgba(255,255,255,.07);
  border-radius: 8px; padding: 12px;
  display: flex; align-items: center; gap: 10px;
}
.shop-item.locked { opacity: .28; }
.shop-icon { font-size: 30px; }
.shop-info { flex: 1; }
.shop-name { font-size: 13px; font-weight: 600; color: var(--cream); }
.shop-jp { font-size: 10px; color: var(--dim); }
.shop-price { font-size: 11px; color: var(--gold); margin-top: 3px; }
.shop-stock { font-size: 10px; color: var(--dim); }
.qty-ctrl { display: flex; flex-direction: column; align-items: center; gap: 3px; }
.qty-val { font-size: 17px; font-weight: 700; color: var(--cream); min-width: 20px; text-align: center; }
.qty-btn {
  width: 26px; height: 26px; border: 1px solid rgba(255,255,255,.18);
  background: rgba(255,255,255,.05); color: var(--cream);
  border-radius: 4px; cursor: pointer; font-size: 15px; line-height: 1;
  transition: all .15s;
}
.qty-btn:hover:not(:disabled) { background: rgba(255,255,255,.18); border-color: var(--lantern); }
.qty-btn:disabled { opacity: .25; cursor: not-allowed; }

.cart-summary {
  background: rgba(0,0,0,.3); border-radius: 8px; padding: 14px;
}
.cart-row { display: flex; justify-content: space-between; padding: 6px 0;
  border-bottom: 1px solid rgba(255,255,255,.04); font-size: 13px; }
.cart-row:last-child { border-bottom: none; }
.cart-val { font-weight: 700; color: var(--cream); }
.cart-val.gold { color: var(--gold); }

/* ── REVIEW SCREEN ── */
#review-wrap {
  max-width: 480px; width: 100%;
  padding: 24px 16px; text-align: center;
}
.review-icon { font-size: 48px; margin-bottom: 12px; }
.review-title { font-size: 24px; color: var(--cream); margin-bottom: 4px; }
.review-sub { font-size: 13px; color: var(--dim); margin-bottom: 22px; }
.review-stats {
  background: var(--panel); border-radius: 10px; padding: 18px;
  margin-bottom: 18px; text-align: left;
}
.rev-row { display: flex; justify-content: space-between; padding: 7px 0;
  border-bottom: 1px solid rgba(255,255,255,.05); font-size: 13px; }
.rev-row:last-child { border-bottom: none; }
.rev-val { font-weight: 700; color: var(--cream); }
.rev-val.good { color: var(--gold); }
.rev-val.bad { color: var(--red-l); }
.rev-val.ok { color: var(--teal); }
.unlock-box {
  background: rgba(255,140,58,.08); border: 1px solid var(--lantern);
  border-radius: 8px; padding: 14px; margin-bottom: 18px;
}
.unlock-title { font-size: 14px; font-weight: 700; color: var(--lantern); margin-bottom: 8px; }
.unlock-item { font-size: 13px; color: var(--cream); margin: 4px 0; }

/* ── TOAST / FLOATS ── */
.toast {
  position: fixed; bottom: 226px; left: 50%; transform: translateX(-50%);
  background: rgba(27,188,156,.92); color: #fff;
  padding: 9px 20px; border-radius: 20px; font-size: 13px; font-weight: 600;
  z-index: 999; pointer-events: none; white-space: nowrap;
  animation: toastin .25s ease;
}
.toast.err { background: rgba(192,57,43,.92); }
.toast.info { background: rgba(41,128,185,.88); }
@keyframes toastin { from{opacity:0;transform:translateX(-50%) translateY(12px)} to{opacity:1;transform:translateX(-50%) translateY(0)} }

.float-yen {
  position: fixed; font-size: 16px; font-weight: 700; color: var(--gold);
  pointer-events: none; z-index: 600;
  animation: floatup 1.4s ease forwards;
}
@keyframes floatup { 0%{opacity:1;transform:translateY(0)} 100%{opacity:0;transform:translateY(-55px)} }

/* ── MUTE BUTTON ── */
#mute-btn {
  background: none; border: 1px solid rgba(255,255,255,.15);
  color: var(--text); border-radius: 4px; padding: 3px 8px;
  cursor: pointer; font-size: 16px; line-height: 1;
  transition: all .18s;
}
#mute-btn:hover { border-color: var(--lantern); background: rgba(255,140,58,.08); }

/* ── SCROLLBAR ── */
::-webkit-scrollbar { width: 3px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(255,255,255,.12); border-radius: 2px; }

@media (max-width: 500px) {
  .shop-grid { grid-template-columns: 1fr; }
  #game-wrap { height: 200px; }
  #card-cook { flex: 0 0 175px; }
  #card-custs { flex: 0 0 175px; }
  #card-stats { flex: 0 0 110px; }
  .hud-stats { gap: 8px; }
}
</style>
</head>
<body>

<canvas id="stars-canvas"></canvas>
<div id="root"></div>

<script>
// ─────────────────────────────────────────────
// YATAI SCENE — ANIMATED BACKGROUND
// ─────────────────────────────────────────────
(function() {
  'use strict';
  const c = document.getElementById('stars-canvas');
  const ctx = c.getContext('2d');
  let off = null;

  // ── LIVE GEOMETRY (updated each frame) ──────────────────────
  const G = {};
  function refreshGeo() {
    G.W = c.width; G.H = c.height;
    G.sx = G.W*0.04; G.sw = G.W*0.92;
    G.midX = G.W*0.50;
    G.roofPeak = G.H*0.28; G.roofEdge = G.H*0.40;
    G.norenBot = G.roofEdge + (G.H*0.575 - G.roofEdge)*0.58;
    G.counterY  = G.H*0.575; G.stallBot = G.H*0.69;
    G.lamps = [G.sx+G.sw*0.18, G.sx+G.sw*0.50, G.sx+G.sw*0.82];
  }

  // ── STATIC BACKGROUND (drawn once to offscreen canvas) ──────
  function buildOff() {
    refreshGeo();
    off = document.createElement('canvas');
    off.width = c.width; off.height = c.height;
    const g = off.getContext('2d');
    drawStaticScene(g);
  }

  function drawStaticScene(g) {
    const { W, H, sx, sw, midX, roofPeak, roofEdge, norenBot, counterY, stallBot, lamps } = G;

    // SKY
    const sky = g.createLinearGradient(0, 0, 0, H * 0.72);
    sky.addColorStop(0, '#010306');
    sky.addColorStop(0.55, '#05091a');
    sky.addColorStop(1, '#0a0f22');
    g.fillStyle = sky; g.fillRect(0, 0, W, H);

    // STARS (deterministic so they don't shift on resize)
    for (let i = 0; i < 110; i++) {
      const sx = ((i * 137 + 41) % 997) / 997 * W;
      const sy = ((i * 79  + 23) % 997) / 997 * H * 0.42;
      const sr = i % 5 === 0 ? 1.5 : 0.65;
      const sa = 0.25 + (i % 9) / 18;
      g.fillStyle = `rgba(255,255,255,${sa})`;
      g.beginPath(); g.arc(sx, sy, sr, 0, Math.PI * 2); g.fill();
    }

    // HORIZON CITY GLOW
    const hg = g.createLinearGradient(0, H * 0.28, 0, H * 0.50);
    hg.addColorStop(0, 'rgba(0,0,0,0)');
    hg.addColorStop(0.5, 'rgba(255,90,20,0.045)');
    hg.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = hg; g.fillRect(0, H * 0.28, W, H * 0.22);

    // BUILDING SILHOUETTES
    g.fillStyle = '#020508';
    const bldgs = [
      [0,     0.20, 0.13, 1],
      [0.10,  0.30, 0.09, 1],
      [0.07,  0.14, 0.055,1],
      [0.78,  0.18, 0.13, 1],
      [0.87,  0.27, 0.13, 1],
      [0.82,  0.11, 0.065,1],
    ];
    bldgs.forEach(([x,y,w]) => g.fillRect(x*W, y*H, w*W, H));
    // mid-distance
    g.fillStyle = '#030609';
    [[0.22,0.36,0.07],[0.66,0.33,0.09]].forEach(([x,y,w]) =>
      g.fillRect(x*W, y*H, w*W, H));

    // WINDOWS
    const wc = ['rgba(255,195,70,0.55)','rgba(255,170,50,0.45)','rgba(180,210,255,0.35)'];
    const wins = [
      [0.01,0.22,2,5],[0.82,0.19,2,4],[0.895,0.29,2,3]
    ];
    wins.forEach(([bx,by,cols,rows]) => {
      for (let r=0;r<rows;r++) for (let col=0;col<cols;col++) {
        if ((r*3+col*7)%5 < 3) {
          const wx=bx*W+col*W*0.038, wy=by*H+r*H*0.055;
          const ww=W*0.02, wh=H*0.025;
          g.fillStyle = wc[(r+col)%3];
          g.fillRect(wx,wy,ww,wh);
          const wg=g.createRadialGradient(wx+ww/2,wy+wh/2,0,wx+ww/2,wy+wh/2,ww*2.5);
          wg.addColorStop(0,'rgba(255,170,50,0.14)'); wg.addColorStop(1,'rgba(0,0,0,0)');
          g.fillStyle=wg; g.fillRect(wx-ww,wy-wh,ww*3,wh*3);
        }
      }
    });

    // STREET
    const gr = g.createLinearGradient(0, H*0.68, 0, H);
    gr.addColorStop(0, '#070b14'); gr.addColorStop(1, '#040710');
    g.fillStyle = gr; g.fillRect(0, H*0.68, W, H*0.32);

    // Wet pavement reflection (warm)
    const ref = g.createRadialGradient(W*0.50, H*0.71, 0, W*0.50, H*0.71, W*0.42);
    ref.addColorStop(0, 'rgba(255,130,40,0.09)');
    ref.addColorStop(0.5,'rgba(255,90,20,0.04)');
    ref.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = ref; g.fillRect(0, H*0.68, W, H*0.32);

    // YATAI
    drawYatai(g, W, H);

    // Ground-level fog
    const fog = g.createLinearGradient(0, H*0.66, 0, H*0.80);
    fog.addColorStop(0,'rgba(10,14,28,0)');
    fog.addColorStop(0.45,'rgba(10,14,28,0.18)');
    fog.addColorStop(1,'rgba(8,11,22,0)');
    g.fillStyle = fog; g.fillRect(0, H*0.66, W, H*0.14);
  }

  function drawYatai(g, W, H) {
    const { sx, sw, midX, roofPeak, roofEdge, norenBot, counterY, stallBot, lamps } = G;

    // Interior warmth
    const intGlow = g.createRadialGradient(midX, counterY-H*0.06, 0, midX, counterY, W*0.32);
    intGlow.addColorStop(0,'rgba(255,140,50,0.18)');

    g.moveTo(sx-W*0.025, roofEdge+3);

  let _jaVoices = [];
  function _loadVoices() {

                .filter(v => v.lang.startsWith('ja'));

  function _custVoice(idx) {
    if (!_jaVoices.length) return null;
    const pool = _jaVoices.length > 1 ? _jaVoices.slice(0, -1) : _jaVoices;
    return pool[idx % pool.length];

    return _jaVoices.length ? _jaVoices[_jaVoices.length - 1] : null;

  function drawBubbles(g, T) {
    const now = performance.now() / 1000;
    bubbles = bubbles.filter(b => now - b.born < b.life);
    bubbles.forEach(b => {
      const age = now - b.born;
      const t = age / b.life;
      const alpha = t < 0.12 ? t/0.12 : t > 0.70 ? (1-t)/0.30 : 1;
      const by = b.y - age * G.H * 0.018;

      g.save();
      g.globalAlpha = alpha;
      g.font = `bold ${Math.round(G.H*0.022)}px serif`;
      const tw = g.measureText(b.text).width;
      const pad = G.W*0.012, bh = G.H*0.038;

      g.fillStyle = 'rgba(10,8,20,0.88)';

      g.roundRect(b.x - tw/2 - pad, by - bh, tw + pad*2, bh, rx);

  function randomCtype(base) {
    const type = base.type;
    const h = Math.random() * 360;
    let s, l;
    if (type === 'suit')        { s = 8  + Math.random()*28; l = 16 + Math.random()*24; }
    else if (type === 'hoodie') { s = 38 + Math.random()*38; l = 26 + Math.random()*30; }
    else                        { s = 32 + Math.random()*42; l = 30 + Math.random()*32; }
    const ph = Math.random() * 360;
    const ps = type === 'suit' ? 8 + Math.random()*22 : 15 + Math.random()*45;
    const pl = 14 + Math.random()*22;
    const skH = 18 + Math.random()*22, skS = 38 + Math.random()*32, skL = 42 + Math.random()*32;

    const hsl = (hv,sv,lv) => `hsl(${hv|0},${sv|0}%,${lv|0}%)`;
    return {
      type,
      jacket:  hsl(h, s, l),
      jacketD: hsl(h, s, Math.max(0, l-14)),
      pants:   hsl(ph, ps, pl),
      shirt:   type === 'suit' ? hsl(40,18,86) : hsl(h, s, l),
      cuff:    type === 'suit' ? hsl(40,14,90) : hsl(h, s, Math.max(0, l-14)),

      hair, hairStyle,

  function updateCustomers(T) {
    if (!window.stallOpen) {
      SLOTS.forEach(s => { s.cu = null; });
      return;
    }
    const { W, H, stallBot } = G;
    const speed = W * 0.003;

    // Spawn cadence
    if (T - lastSpawn > 18 + Math.random()*10) {
      spawnCustomer();
      lastSpawn = T;
    }

    SLOTS.forEach(slot => {
      const cu = slot.cu;
      if (!cu) return;

      if (cu.state === 'walk_in') {
        cu.x += (cu.targetX - cu.x) * 0.045;
        if (Math.abs(cu.x - cu.targetX) < 2) {
          cu.x = cu.targetX;
          cu.state = 'sit_in';
          cu.sitTimer = 0;
        }
      } else if (cu.state === 'sit_in') {
        cu.sitTimer++;
        if (cu.sitTimer > 40) {
          cu.state = 'sit';
          cu.served = false;
          cu.serveAt = 60 + Math.floor(Math.random() * 40); // frames until food appears
          // Schedule a random chat moment during their stay (65% chance)
          cu.chatAt = Math.random() < 0.65
            ? Math.floor(300 + Math.random() * Math.max(200, cu.eatMax - 600))
            : -1;
        }
      } else if (cu.state === 'sit') {
        cu.eatTimer++;
        if (!cu.served && cu.eatTimer >= cu.serveAt) cu.served = true;
        // Small talk with master
        if (cu.chatAt > 0 && cu.eatTimer === cu.chatAt) {
          cu.chatAt = -1;
          const { counterY } = G;
          const line = SMALL_TALK[Math.floor(Math.random() * SMALL_TALK.length)];
          spawnBubble(cu.x, counterY - H*0.28, line, { voice: _custVoice(cu.voiceIdx), pitch: cu.voicePitch, rate: cu.voiceRate * 0.92 });
          setTimeout(() => spawnMasterSay(MASTER_SMALL_TALK[Math.floor(Math.random() * MASTER_SMALL_TALK.length)]), 900);
        }
        if (cu.eatTimer === cu.eatMax && cu.unhappy && !cu.shoutedUnhappy) {
          cu.shoutedUnhappy = true;
          const { counterY } = G;
          const complaint = UNHAPPY_SHOUTS[Math.floor(Math.random()*UNHAPPY_SHOUTS.length)];
          spawnBubble(cu.x, counterY - H*0.28, complaint, { voice: _custVoice(cu.voiceIdx), pitch: cu.voicePitch, rate: cu.voiceRate * 1.1 });
        }
        if (cu.eatTimer >= cu.eatMax + (cu.unhappy ? 25 : 0)) {
          if (!cu.unhappy && cu.roundsLeft > 0) {
            // Still hungry — place another order
            cu.roundsLeft--;
            cu.dish = _pickDish();
            cu.eatTimer = 0;
            cu.eatMax = 900 + Math.floor(Math.random() * 700);
            cu.served = false;
            cu.serveAt = 60 + Math.floor(Math.random() * 40);
            cu.chatAt = Math.random() < 0.50
              ? Math.floor(200 + Math.random() * Math.max(100, cu.eatMax - 400))
              : -1;
            const { counterY } = G;
            const phrase = REORDER[cu.dish] || 'おかわり、ください！';
            spawnBubble(cu.x, counterY - H*0.28, phrase, { voice: _custVoice(cu.voiceIdx), pitch: cu.voicePitch, rate: cu.voiceRate });
            setTimeout(() => spawnMasterBubble(cu.dish), 700);
          } else {
            cu.state = 'walk_out';
          }
        }
      } else if (cu.state === 'walk_out') {
        cu.x += speed;
        if (cu.x > W + W*0.06) {
          slot.cu = null;
        }
      }
    });
  }

  // ── DISH ARTWORK ─────────────────────────────
  function drawFood(g, dish, W, H, cY) {
    // All coords are in the customer's translated space (x=0 = customer centre)
    switch (dish) {

      case 'shoyu':
      case 'tonk': {
        const broth   = dish === 'shoyu' ? '#b8621a' : '#ddd0b0';
        const noodleC = dish === 'shoyu' ? '#e8cc70' : '#f0e8c4';
        // Drop shadow
        g.fillStyle = 'rgba(0,0,0,.28)';
        g.beginPath(); g.ellipse(0, cY-H*.003, W*.027, H*.007, 0, 0, Math.PI*2); g.fill();
        // Bowl body (dark ceramic)
        g.fillStyle = '#161616';
        g.beginPath(); g.ellipse(0, cY-H*.011, W*.026, H*.011, 0, 0, Math.PI*2); g.fill();

        g.strokeStyle = '#303030'; g.lineWidth = 1.2;
        g.beginPath(); g.ellipse(0, cY-H*.011, W*.026, H*.011, 0, 0, Math.PI*2); g.stroke();

        g.beginPath(); g.ellipse(0, cY-H*.015, W*.021, H*.007, 0, 0, Math.PI*2); g.fill();

          const nx = -W*.013 + i*W*.011;

        }
        // Chashu slice (brown arc)
        g.fillStyle = '#7a3810';
        g.beginPath(); g.ellipse(-W*.009, cY-H*.017, W*.006, H*.003, 0.4, 0, Math.PI*2); g.fill();

        [[W*.010,-H*.018],[W*.014,-H*.015],[-W*.001,-H*.019]].forEach(([nx,ny]) => {
          g.beginPath(); g.ellipse(nx, cY+ny, W*.002, H*.002, 0, 0, Math.PI*2); g.fill();

        g.lineTo(-bw, bBot); g.lineTo(bw, bBot);

  function drawCustomer(g, cu, T) {
    const { W, H, counterY, stallBot } = G;
    const { state, x, ct, phase } = cu;

    if (state === 'walk_in' || state === 'walk_out') {
      // ── WALKING — full profile figure ───────────────────────────
      const bH   = H*0.22;
      const hr   = W*0.024;
      const gndY = stallBot - H*0.003;
      const stride  = Math.sin(T*4.5 + phase);
      const strideB = -stride;
      const shldrY  = gndY - bH*0.72;
      const waistY  = gndY - bH*0.44;
      const headCy  = gndY - bH + hr;

      g.save(); g.translate(x, 0);
      if (state === 'walk_out') g.scale(-1, 1);

      // Ground shadow
      g.fillStyle = 'rgba(0,0,0,0.20)';
      g.beginPath(); g.ellipse(0, gndY, W*0.032, H*0.008, 0, 0, Math.PI*2); g.fill();

      // ── BACK LEG ──────────────────────────────────
      const bkKneeX = Math.sin(strideB*0.30)*bH*0.24;
      const bkKneeY = waistY + bH*0.24;
      const bkFootX = bkKneeX + Math.sin(strideB*0.30 - stride*0.20)*bH*0.24;
      g.strokeStyle = ct.pants; g.lineWidth = W*0.018; g.lineCap = 'round';
      g.beginPath(); g.moveTo(W*0.004, waistY); g.lineTo(bkKneeX, bkKneeY); g.stroke();
      g.lineWidth = W*0.015;
      g.beginPath(); g.moveTo(bkKneeX, bkKneeY); g.lineTo(bkFootX, gndY); g.stroke();
      // Back shoe
      g.fillStyle = '#181212';
      g.beginPath(); g.ellipse(bkFootX+W*0.010, gndY, W*0.014, H*0.005, 0.10, 0, Math.PI*2); g.fill();

      // ── BODY ──────────────────────────────────────
      g.fillStyle = ct.jacket;
      g.beginPath();
      g.moveTo(-W*0.020, shldrY);
      g.lineTo(-W*0.024, waistY);
      g.lineTo(W*0.022, waistY);
      g.lineTo(W*0.021, shldrY+H*0.005);
      g.closePath(); g.fill();
      {
        const jsh = g.createLinearGradient(-W*0.024, 0, W*0.022, 0);
        jsh.addColorStop(0, 'rgba(0,0,0,0.28)'); jsh.addColorStop(0.22, 'rgba(0,0,0,0)'); jsh.addColorStop(1, 'rgba(0,0,0,0)');
        g.fillStyle = jsh;
        g.beginPath();
        g.moveTo(-W*0.020, shldrY); g.lineTo(-W*0.024, waistY);
        g.lineTo(W*0.022, waistY); g.lineTo(W*0.021, shldrY+H*0.005);
        g.closePath(); g.fill();
      }
      if (ct.type === 'suit') {
        // Shirt V visible at front
        g.fillStyle = ct.shirt;
        g.beginPath();
        g.moveTo(-W*0.005, shldrY+H*0.005);
        g.lineTo(-W*0.007, waistY-H*0.008);
        g.lineTo(W*0.007, waistY-H*0.008);
        g.lineTo(W*0.012, shldrY+H*0.005);
        g.closePath(); g.fill();
        g.fillStyle = ct.jacketD;
        g.fillRect(-W*0.024, waistY-H*0.007, W*0.046, H*0.010);
      } else if (ct.type === 'hoodie') {
        // Hood drape behind neck/shoulder
        g.fillStyle = ct.jacket;
        g.beginPath(); g.ellipse(W*0.004, shldrY-H*0.008, W*0.018, H*0.020, 0.12, 0, Math.PI*2); g.fill();
        g.strokeStyle = ct.jacketD; g.lineWidth = 1;
        g.beginPath(); g.arc(W*0.004, shldrY-H*0.005, W*0.012, Math.PI*1.2, Math.PI*2.1); g.stroke();
        // Rib waistband
        g.fillStyle = ct.jacketD;
        g.fillRect(-W*0.024, waistY-H*0.010, W*0.046, H*0.010);
        // Kangaroo pocket
        const pkT = shldrY+bH*0.38, pkB = waistY-bH*0.05;

        g.beginPath(); g.arc(0, shldrY+H*0.006, W*0.028, Math.PI*0.86, Math.PI*2.14); g.closePath(); g.fill();
        g.fillStyle = ct.jacketD;
        g.beginPath(); g.arc(0, shldrY+H*0.010, W*0.024, Math.PI*0.88, Math.PI*2.12); g.closePath(); g.fill();
      } else {
        // Tee crew neck
        g.fillStyle = ct.jacket;
        g.beginPath(); g.arc(0, shldrY+H*0.005, W*0.020, Math.PI*0.88, Math.PI*2.12); g.closePath(); g.fill();
        g.strokeStyle = ct.jacketD; g.lineWidth = 1;
        g.beginPath(); g.arc(0, shldrY+H*0.005, W*0.020, Math.PI*0.88, Math.PI*2.12); g.stroke();
      }

      // ── NECK ───────────────────────────────────────
      const nW = W*0.016, nTop = shldrY-H*0.045, nBot = shldrY+H*0.010;
      g.fillStyle = ct.skin;
      g.beginPath();
      g.moveTo(-nW, nBot); g.quadraticCurveTo(-nW*0.85, nTop+H*0.012, -nW*0.55, nTop);
      g.lineTo(nW*0.55, nTop); g.quadraticCurveTo(nW*0.85, nTop+H*0.012, nW, nBot);
      g.closePath(); g.fill();
      const nGr = g.createLinearGradient(-nW, 0, nW, 0);
      nGr.addColorStop(0, 'rgba(0,0,0,0.16)'); nGr.addColorStop(0.5, 'rgba(0,0,0,0)'); nGr.addColorStop(1, 'rgba(0,0,0,0.16)');
      g.fillStyle = nGr;
      g.beginPath();
      g.moveTo(-nW, nBot); g.quadraticCurveTo(-nW*0.85, nTop+H*0.012, -nW*0.55, nTop);
      g.lineTo(nW*0.55, nTop); g.quadraticCurveTo(nW*0.85, nTop+H*0.012, nW, nBot);
      g.closePath(); g.fill();

      // ── HEAD — profile facing left ──────────────────
      const hCy = nTop - H*0.040 + headBob;
      const hR  = W*0.033;
      // Back of head
      g.fillStyle = ct.skin;
      g.beginPath(); g.arc(0, hCy, hR, 0, Math.PI*2); g.fill();
      // Ear (right / back side visible in profile)
      g.fillStyle = ct.skin;
      g.beginPath(); g.ellipse(hR*0.62, hCy+hR*0.08, hR*0.14, hR*0.22, 0.12, 0, Math.PI*2); g.fill();
      g.strokeStyle = ct.skinD; g.lineWidth = 0.8;
      g.beginPath(); g.arc(hR*0.62, hCy+hR*0.10, hR*0.08, -Math.PI*0.6, Math.PI*0.3); g.stroke();
      // Profile — forehead → nose → upper lip → chin
      g.fillStyle = ct.skin;
      g.beginPath();
      g.moveTo(-hR*0.32, hCy-hR*0.78);
      g.quadraticCurveTo(-hR*0.92, hCy-hR*0.44, -hR*0.98, hCy-hR*0.06);
      g.quadraticCurveTo(-hR*1.08, hCy+hR*0.12, -hR*1.18, hCy+hR*0.22);
      g.quadraticCurveTo(-hR*1.10, hCy+hR*0.34, -hR*0.96, hCy+hR*0.40);
      g.quadraticCurveTo(-hR*0.98, hCy+hR*0.50, -hR*0.94, hCy+hR*0.55);
      g.quadraticCurveTo(-hR*0.86, hCy+hR*0.72, -hR*0.58, hCy+hR*0.82);
      g.lineTo(-hR*0.08, hCy+hR*0.92); g.closePath(); g.fill();
      // Head shading
      const hLt = g.createRadialGradient(hR*0.18, hCy-hR*0.15, 0, 0, hCy, hR*1.1);
      hLt.addColorStop(0, 'rgba(255,255,255,0.10)'); hLt.addColorStop(0.55, 'rgba(255,255,255,0)'); hLt.addColorStop(1, 'rgba(0,0,0,0.24)');
      g.fillStyle = hLt; g.beginPath(); g.arc(0, hCy, hR*1.05, 0, Math.PI*2); g.fill();
      // Nostril
      g.fillStyle = ct.skinD;
      g.beginPath(); g.ellipse(-hR*1.12, hCy+hR*0.28, hR*0.04, hR*0.03, -0.4, 0, Math.PI*2); g.fill();
      // Eye white
      g.fillStyle = '#f5ede8';
      g.beginPath(); g.ellipse(-hR*0.73, hCy-hR*0.09, hR*0.13, hR*0.09, 0, 0, Math.PI*2); g.fill();
      // Iris
      g.fillStyle = ct.hair === '#949494' || ct.hair === '#a09898' ? '#4a5868' : '#28180e';
      g.beginPath(); g.arc(-hR*0.73, hCy-hR*0.09, hR*0.07, 0, Math.PI*2); g.fill();
      // Pupil
      g.fillStyle = '#080408';
      g.beginPath(); g.arc(-hR*0.73, hCy-hR*0.09, hR*0.04, 0, Math.PI*2); g.fill();
      // Catchlight
      g.fillStyle = 'rgba(255,255,255,0.65)';
      g.beginPath(); g.arc(-hR*0.71, hCy-hR*0.12, hR*0.016, 0, Math.PI*2); g.fill();
      // Upper eyelid arch
      g.strokeStyle = ct.skinD; g.lineWidth = 0.9; g.lineCap = 'round';
      g.beginPath();
      g.moveTo(-hR*0.87, hCy-hR*0.09);
      g.quadraticCurveTo(-hR*0.73, hCy-hR*0.20, -hR*0.59, hCy-hR*0.09);
      g.stroke();
      // Eyebrow
      g.strokeStyle = ct.hair; g.lineWidth = W*0.0035; g.lineCap = 'round';
      g.beginPath(); g.moveTo(-hR*0.90, hCy-hR*0.26); g.lineTo(-hR*0.56, hCy-hR*0.29); g.stroke();
      // Mouth — contented smile while eating
      g.strokeStyle = ct.skinD; g.lineWidth = 0.9; g.lineCap = 'round';
      g.beginPath();
      g.moveTo(-hR*0.96, hCy+hR*0.52);
      g.quadraticCurveTo(-hR*0.80, hCy+hR*0.59, -hR*0.64, hCy+hR*0.52);
      g.stroke();
      // Lower lip shadow
      g.strokeStyle = 'rgba(0,0,0,0.10)'; g.lineWidth = 0.7;
      g.beginPath();
      g.moveTo(-hR*0.90, hCy+hR*0.63);
      g.quadraticCurveTo(-hR*0.78, hCy+hR*0.68, -hR*0.66, hCy+hR*0.64);
      g.stroke();

      // ── HAIR (profile) ─────────────────────────────
      g.fillStyle = ct.hair;
      if (ct.hairStyle === 'long') {
        g.beginPath();
        g.moveTo(-hR*0.28, hCy-hR*0.80);
        g.quadraticCurveTo(hR*0.08, hCy-hR*1.10, hR*0.92, hCy-hR*0.90);
        g.quadraticCurveTo(hR*1.04, hCy-hR*0.55, hR*1.02, hCy+hR*0.60);
        g.quadraticCurveTo(hR*0.92, hCy+hR*1.18, hR*0.52, nTop+H*0.008);
        g.lineTo(hR*0.22, nTop+H*0.008);
        g.quadraticCurveTo(hR*0.68, hCy+hR*0.72, hR*0.62, hCy+hR*0.22);
        g.lineTo(hR*0.50, hCy-hR*0.80); g.closePath(); g.fill();
      } else {
        const topRx = ct.hairStyle === 'thin' ? hR*0.68 : hR*0.98;
        g.beginPath();
        g.moveTo(-hR*0.28, hCy-hR*0.78);
        g.quadraticCurveTo(hR*0.08, hCy-hR*1.08, topRx, hCy-hR*0.88);
        g.quadraticCurveTo(hR*1.04, hCy-hR*0.55, topRx, hCy+hR*0.28);
        g.lineTo(topRx*0.55, hCy+hR*0.28);
        g.quadraticCurveTo(topRx*0.88, hCy-hR*0.42, hR*0.44, hCy-hR*0.76);
        g.closePath(); g.fill();
        if (ct.hairStyle === 'medium') {
          g.beginPath();
          g.moveTo(hR*0.82, hCy-hR*0.62);
          g.quadraticCurveTo(hR*1.05, hCy, hR*0.96, hCy+hR*0.58);
          g.lineTo(hR*0.58, hCy+hR*0.58);
          g.quadraticCurveTo(hR*0.82, hCy+hR*0.12, hR*0.66, hCy-hR*0.48);
          g.closePath(); g.fill();
        }
      }

      if (state === 'sit' && cu.served) {
        drawFood(g, cu.dish, W, H, counterY);

        const usesChopsticks = cu.dish !== 'beer' && cu.dish !== 'sake' && cu.dish !== 'shochu';
        if (usesChopsticks) {
          const chopA = Math.sin(T*3.5+phase)*H*0.024;
          g.strokeStyle = 'rgba(200,162,80,0.82)'; g.lineWidth = 1.4; g.lineCap = 'round';
          g.beginPath(); g.moveTo(W*0.004, armY-H*0.002); g.lineTo(W*0.014, counterY-H*0.038+chopA); g.stroke();
          g.beginPath(); g.moveTo(W*0.010, armY-H*0.002); g.lineTo(W*0.022, counterY-H*0.036-chopA); g.stroke();
        }
      }

      g.restore();
    }
  }

  // ── STEAM PARTICLES ──────────────────────────
  let steam = [];
  function mkSteam() {
    const { W, H } = G;
    const cx = W*0.50 + (Math.random()-0.5)*W*0.28;
    return { x:cx, y:H*0.565, vy:-(0.22+Math.random()*0.42),
      vx:(Math.random()-0.5)*0.18, r:3+Math.random()*9,
      life:0, max:85+Math.random()*65 };
  }
  function initSteam() {
    steam = Array.from({length:14}, () => {
      const p=mkSteam(); p.life=Math.floor(Math.random()*p.max); return p;
    });
  }

  // ── RESIZE ───────────────────────────────────
  function resize() {
    c.width = window.innerWidth;
    c.height = window.innerHeight;
    buildOff();
    initSteam();
    bubbles = [];
    // Reanchor seated customers
    SLOTS.forEach(slot => {
      if (!slot.cu) return;
      slot.cu.targetX = slotX(slot);
      if (slot.cu.state === 'sit' || slot.cu.state === 'sit_in') {
        slot.cu.x = slot.cu.targetX;
      }
    });
  }

  // ── MAIN LOOP ─────────────────────────────────
  let t0 = null;
  function loop(ts) {
    if (!t0) t0 = ts;
    const T = (ts - t0) / 1000;
    const { W, H } = G;

    // Composite static background
    ctx.drawImage(off, 0, 0);

    // Pulsing lantern glow (on top of static scene)
    drawLanternGlow(ctx, T);

    // Update + draw customers
    updateCustomers(T);
    SLOTS.forEach(slot => {
      if (slot.cu) drawCustomer(ctx, slot.cu, T);
    });

    // Speech bubbles (above everything)
    drawBubbles(ctx, T);

    // Steam
    steam.forEach((p, i) => {
      p.x+=p.vx; p.y+=p.vy; p.life++; p.r+=0.06;
      if (p.life>=p.max) steam[i]=mkSteam();
      const frac=p.life/p.max;
      const a=(frac<0.2?frac/0.2:frac>0.7?(1-frac)/0.3:1)*0.10;
      ctx.fillStyle=`rgba(218,208,196,${a})`;
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fill();
    });

    requestAnimationFrame(loop);
  }

  window.addEventListener('resize', resize);
  resize();
  requestAnimationFrame(loop);
})();

// AUDIO SYSTEM
// ─────────────────────────────────────────────
const AUDIO = {
  ctx: null, master: null,
  ambSrc: null, ambGain: null,
  rainSrc: null, rainGain: null,
  melodyTid: null, crowdTid: null,
  muted: false,

  // C major pentatonic, 2 octaves
  SCALE: [261.63,293.66,329.63,392.00,440.00,523.25,587.33,659.25,784.00,880.00],

  init() {
    if (this.ctx) { this.ctx.resume(); return; }
    try {
      this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      this.master = this.ctx.createGain();
      this.master.gain.value = 0.8;
      this.master.connect(this.ctx.destination);
    } catch(e) { console.warn('Web Audio not available'); }
  },

  toggle() {
    this.muted = !this.muted;
    if (this.master)
      this.master.gain.setTargetAtTime(this.muted ? 0 : 0.8, this.ctx.currentTime, 0.3);
    const btn = document.getElementById('mute-btn');
    if (btn) btn.textContent = this.muted ? '🔇' : '🔊';
  },

  _pinkBuf(sec = 5) {
    const sr = this.ctx.sampleRate;
    const buf = this.ctx.createBuffer(2, sr * sec, sr);
    for (let ch = 0; ch < 2; ch++) {
      const d = buf.getChannelData(ch);
      let b0=0,b1=0,b2=0,b3=0,b4=0,b5=0,b6=0;
      for (let i = 0; i < d.length; i++) {
        const w = Math.random()*2-1;
        b0=0.99886*b0+w*0.0555179; b1=0.99332*b1+w*0.0750759;
        b2=0.96900*b2+w*0.1538520; b3=0.86650*b3+w*0.3104856;
        b4=0.55000*b4+w*0.5329522; b5=-0.7616*b5-w*0.0168980;
        d[i]=(b0+b1+b2+b3+b4+b5+b6+w*0.5362)*0.11;
        b6=w*0.115926;
      }
    }
    return buf;
  },

  _whiteBuf(sec = 3) {
    const sr = this.ctx.sampleRate;
    const buf = this.ctx.createBuffer(2, sr * sec, sr);
    for (let ch = 0; ch < 2; ch++) {
      const d = buf.getChannelData(ch);
      for (let i = 0; i < d.length; i++) d[i] = Math.random()*2-1;
    }
    return buf;
  },

  startService(isRainy) {
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    // Street ambient: pink noise → lowpass → gain (fade in over 3s)
    this.ambSrc = this.ctx.createBufferSource();
    this.ambSrc.buffer = this._pinkBuf(5);
    this.ambSrc.loop = true;
    const af = this.ctx.createBiquadFilter();
    af.type = 'lowpass'; af.frequency.value = 620;
    this.ambGain = this.ctx.createGain();
    this.ambGain.gain.setValueAtTime(0, t);
    this.ambGain.gain.setTargetAtTime(0.14, t, 2.5);
    this.ambSrc.connect(af); af.connect(this.ambGain);
    this.ambGain.connect(this.master);
    this.ambSrc.start();
    if (isRainy) this._startRain();
    this._scheduleMelody();
    this._scheduleCrowd();
  },

  stopService() {
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    if (this.ambGain) this.ambGain.gain.setTargetAtTime(0, t, 1.5);
    if (this.rainGain) this.rainGain.gain.setTargetAtTime(0, t, 1.5);
    setTimeout(() => {
      try { this.ambSrc?.stop(); } catch(e){}
      try { this.rainSrc?.stop(); } catch(e){}
      this.ambSrc = null; this.rainSrc = null;
    }, 4500);
    clearTimeout(this.melodyTid);
    clearTimeout(this.crowdTid);
  },

  _startRain() {
    this.rainSrc = this.ctx.createBufferSource();
    this.rainSrc.buffer = this._whiteBuf(4);
    this.rainSrc.loop = true;
    const f = this.ctx.createBiquadFilter();
    f.type = 'bandpass'; f.frequency.value = 4500; f.Q.value = 0.4;
    this.rainGain = this.ctx.createGain();
    this.rainGain.gain.setValueAtTime(0, this.ctx.currentTime);
    this.rainGain.gain.setTargetAtTime(0.09, this.ctx.currentTime, 2);
    this.rainSrc.connect(f); f.connect(this.rainGain);
    this.rainGain.connect(this.master);
    this.rainSrc.start();
  },

  _scheduleMelody() {
    const delay = 3500 + Math.random() * 7000;
    this.melodyTid = setTimeout(() => { this._koto(); this._scheduleMelody(); }, delay);
  },

  _koto() {
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    const freq = this.SCALE[Math.floor(Math.random() * this.SCALE.length)];
    const osc = this.ctx.createOscillator();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(freq, t);
    osc.frequency.setTargetAtTime(freq * 0.978, t + 0.015, 0.25);
    const filt = this.ctx.createBiquadFilter();
    filt.type = 'lowpass'; filt.frequency.value = 1600; filt.Q.value = 2;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(0.052, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.001, t + 1.3);
    osc.connect(filt); filt.connect(g); g.connect(this.master);
    osc.start(t); osc.stop(t + 1.5);
    if (Math.random() < 0.35)
      setTimeout(() => this._koto(), 260 + Math.random() * 340);
  },

  _scheduleCrowd() {
    const delay = 7000 + Math.random() * 13000;
    this.crowdTid = setTimeout(() => {
      const n = 2 + Math.floor(Math.random() * 3);
      for (let i = 0; i < n; i++) setTimeout(() => this._voice(), i * 140);
      this._scheduleCrowd();
    }, delay);
  },

  // Formant synthesis: bandpass noise at F1+F2 frequencies → sounds like muffled voice
  _voice() {
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    const dur = 0.35 + Math.random() * 0.55;
    const sr = this.ctx.sampleRate;
    const len = Math.ceil(sr * (dur + 0.12));
    const buf = this.ctx.createBuffer(1, len, sr);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random()*2-1;
    const src = this.ctx.createBufferSource(); src.buffer = buf;

    const f1 = this.ctx.createBiquadFilter();
    f1.type = 'bandpass'; f1.Q.value = 9;
    f1.frequency.setValueAtTime(300 + Math.random()*500, t);
    f1.frequency.linearRampToValueAtTime(300 + Math.random()*500, t + dur);

    const f2 = this.ctx.createBiquadFilter();
    f2.type = 'bandpass'; f2.Q.value = 11;
    f2.frequency.setValueAtTime(900 + Math.random()*1300, t);
    f2.frequency.linearRampToValueAtTime(900 + Math.random()*1300, t + dur);

    const mix = this.ctx.createGain(); mix.gain.value = 1;
    const env = this.ctx.createGain();
    const vol = 0.026 + Math.random() * 0.016;
    env.gain.setValueAtTime(0, t);
    env.gain.linearRampToValueAtTime(vol, t + 0.04);
    env.gain.setValueAtTime(vol, t + dur - 0.08);
    env.gain.linearRampToValueAtTime(0, t + dur);

    const pan = this.ctx.createStereoPanner();
    pan.pan.value = (Math.random() - 0.5) * 1.6;

    src.connect(f1); src.connect(f2);
    f1.connect(mix); f2.connect(mix);
    mix.connect(env); env.connect(pan); pan.connect(this.master);
    src.start(t); src.stop(t + dur + 0.12);
  },

  playSizzle() {
    if (!this.ctx) return;
    const t = this.ctx.currentTime, sr = this.ctx.sampleRate, dur = 0.45;
    const buf = this.ctx.createBuffer(1, Math.ceil(sr*dur), sr);
    const d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random()*2-1;
    const src = this.ctx.createBufferSource(); src.buffer = buf;
    const f = this.ctx.createBiquadFilter(); f.type='highpass'; f.frequency.value=3500;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(0.13, t); g.gain.exponentialRampToValueAtTime(0.001, t+dur);
    src.connect(f); f.connect(g); g.connect(this.master);
    src.start(t); src.stop(t+dur);
  },

  playReady() {
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    [523.25, 783.99].forEach((freq, i) => {
      const osc = this.ctx.createOscillator();
      osc.type = 'sine'; osc.frequency.value = freq;
      const g = this.ctx.createGain();
      g.gain.setValueAtTime(0, t+i*0.13);
      g.gain.linearRampToValueAtTime(0.1, t+i*0.13+0.012);
      g.gain.exponentialRampToValueAtTime(0.001, t+i*0.13+0.7);
      osc.connect(g); g.connect(this.master);
      osc.start(t+i*0.13); osc.stop(t+i*0.13+0.8);
    });
  },

  playServe() {
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(1046, t);
    osc.frequency.exponentialRampToValueAtTime(880, t+0.08);
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(0.11, t); g.gain.exponentialRampToValueAtTime(0.001, t+0.22);
    osc.connect(g); g.connect(this.master);
    osc.start(t); osc.stop(t+0.25);
  },

  playLeave() {
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    [330, 220].forEach((freq, i) => {
      const osc = this.ctx.createOscillator();
      osc.type = 'sine'; osc.frequency.value = freq;
      const g = this.ctx.createGain();
      g.gain.setValueAtTime(0, t+i*0.18);
      g.gain.linearRampToValueAtTime(0.065, t+i*0.18+0.02);
      g.gain.exponentialRampToValueAtTime(0.001, t+i*0.18+0.45);
      osc.connect(g); g.connect(this.master);
      osc.start(t+i*0.18); osc.stop(t+i*0.18+0.5);
    });
  },

  playArrive() {
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    osc.type = 'sine'; osc.frequency.value = 660;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(0.05, t); g.gain.exponentialRampToValueAtTime(0.001, t+0.4);
    osc.connect(g); g.connect(this.master);
    osc.start(t); osc.stop(t+0.5);
    setTimeout(() => this._voice(), 90 + Math.random()*100);
  },
};

const SERVICE_START = 18 * 60;
const SERVICE_END   = 23 * 60;
const TIME_SPEED    = 0.6; // game-minutes per real second

// ─────────────────────────────────────────────
// STATE

const G = {
  screen: 'title',
  day: 1,

  todayServed: 0,
