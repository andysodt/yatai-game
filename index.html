// Shared by the player-typed chat box and the ambient/idle small-talk generator so
// persona rules never drift between the two.
function _buildCustomerPersona(cu, ct) {
  let persona = 'You are a customer at a Japanese yatai (late-night street food stall) near Sakurajima volcano in Kagoshima. Respond in casual Japanese. Keep it short — 1 or 2 sentences max. Be warm and in-character.';
  if (cu.permanentId === 'gondo_razor') persona = 'You are Gondō "The Razor," an aging godfather of the Japanese punk scene. Decades ago the yakuza cut off your right hand for crossing them, and you wear it like a badge of honor. Gruff, wry, still commands real respect. Reply in rough, blunt Japanese, short.';
  else if (ct.sumo) persona = 'You are a sumo wrestler enjoying a late-night meal at a yatai. You are large, jovial, enthusiastic about food. Reply in casual Japanese, short and lively.';
  else if (ct.geisha) persona = 'You are a geisha relaxing at a yatai after a performance. You are graceful and cultured. Reply in polished Japanese, short and elegant.';
  else if (ct.police) persona = 'You are an off-duty police officer having a drink at a yatai. You are professional but friendly and tired. Reply in casual Japanese, short.';
  else if (ct.politician) persona = 'You are a Japanese politician at a yatai. You are a bit pompous and tend to relate everything to politics or your constituency. Reply in formal Japanese, short.';
  else if (ct.hostess) persona = 'You are a hostess (ホステス) unwinding at a yatai after a long night of work. You are charming, a little flirty, and tired. Reply in casual Japanese, short and warm.';
  else if (ct.type === 'kimono' && !ct.geisha) persona = 'You are a yakuza member eating at a yatai. You are gruff but courteous about food. Reply in terse Japanese, very short.';
  else if (ct.filipino) persona = 'You are a Filipino visitor (OFW or tourist) eating at a yatai in Kagoshima, Japan. Reply primarily in Tagalog, warm and friendly and a little playful — natural Taglish is fine (mixing in a little English or a Japanese food word here and there, the way many Filipinos actually talk), but keep it mostly Tagalog. Keep it short — 1 or 2 sentences max.';
  else if (ct.british) persona = 'You are a British tourist or expat at a yatai in Kagoshima, Japan. Reply in English with a dry, understated British wit — polite, a little self-deprecating, maybe a bit awkwardly enthusiastic about the food or the sake. Keep it short — 1 or 2 sentences max.';
  else if (ct.chinese) persona = 'You are a tourist from China (Hong Kong/Guangdong background) visiting a yatai in Kagoshima, Japan. Reply in Cantonese (粵語/廣東話), written in Cantonese colloquial characters (e.g. 係, 唔, 嘅, 嚟, 呢度), not Mandarin. Warm, chatty, a little curious about Japanese food. Keep it short — 1 or 2 sentences max.';

  // Kagoshima dialect flavor only makes sense for Japanese-speaking personas
  if (!ct.filipino && !ct.british && !ct.chinese) {
    persona += ' Speak with a natural Kagoshima dialect (鹿児島弁) flavor where it fits the mood — sentence endings like ～じゃっど, ～ど, ～っちょ, ～とじゃ, and words like わっぜ (very/a lot), げんね (embarrassing/awkward), よだきい (a hassle) — not every line, just enough to feel like a Kagoshima local. When it fits naturally, bring up local color as a regular would: Sakurajima\'s smoke or ash today, the weather, a local festival, shochu, the news — small talk, not a lecture.';
  }
  return persona;
}
function _customerVoiceLang(ct) {
  return ct.filipino ? 'fil-PH' : ct.british ? 'en-GB' : ct.chinese ? 'zh-HK' : undefined;
}

window.sendChatToCustomer = async function() {
  const inp = document.getElementById('chat-input');
  const btn = document.getElementById('chat-send-btn');
  if (!inp) return;
  const msg = inp.value.trim();
  if (!msg) return;
  inp.value = '';
  if (btn) btn.disabled = true;

  if (window._logDialog) window._logDialog(msg, 'player');

  // Find a seated customer
  const seated = (window._SLOTS || []).filter(s => s.cu && (s.cu.state === 'sit' || s.cu.state === 'sit_in'));
  if (!seated.length) {
    if (window._logDialog) window._logDialog('（お客様はまだいません）', 'master');
    if (btn) btn.disabled = false;
    return;
  }
  const slot = seated[Math.floor(Math.random() * seated.length)];
  const cu = slot.cu;
  const ct = cu.ct || {};
  const persona = _buildCustomerPersona(cu, ct);

  // Show typing indicator
  const feed = document.getElementById('dialog-feed');
  let thinkEl = null;
  if (feed) {
    thinkEl = document.createElement('div');
    thinkEl.className = 'dialog-msg dm-cust';
    thinkEl.innerHTML = '<span class="dm-icon">💭</span><span class="dm-text" style="opacity:.4">…</span>';
    feed.appendChild(thinkEl);
    feed.scrollTop = feed.scrollHeight;
  }

  try {
    const resp = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: msg, systemPrompt: persona }),
    });
    const data = await resp.json();
    const reply = (data.reply || '').trim() || '…';
    if (thinkEl) thinkEl.remove();
    if (window._logDialog) window._logDialog(reply, 'cust');
    if (window._spawnBubbleAuto && cu.x) {
      window._spawnBubbleAuto(cu.x, reply, { pitch: cu.voicePitch, rate: cu.voiceRate, lang: _customerVoiceLang(ct) });
    }
  } catch(e) {
    if (thinkEl) thinkEl.remove();
    if (window._logDialog) window._logDialog('（通信エラー）', 'master');
  } finally {
    if (btn) btn.disabled = false;
  }
};

const VOICE_SYS = (function() {
  const DISH_MAP = {
    // longest phrases first so "pork ramen" beats "ramen"
    'pork ramen': 'tonk', 'tonkotsu ramen': 'tonk', 'tonkotsu': 'tonk',
    'shoyu ramen': 'shoyu', 'soy ramen': 'shoyu', 'ramen': 'shoyu',
    'octopus balls': 'takoyaki', 'octopus': 'takoyaki', 'takoyaki': 'takoyaki',
    'rice wine': 'sake', 'nihonshu': 'sake', 'sake': 'sake',
    'dumplings': 'gyoza', 'dumpling': 'gyoza', 'gyoza': 'gyoza',
    'yakitori': 'yakitori', 'skewers': 'yakitori', 'chicken': 'yakitori',
    'spaghetti': 'napolitan', 'napolitan': 'napolitan', 'pasta': 'napolitan',
    'edamame': 'edamame', 'beans': 'edamame',
    'shochu': 'shochu',
    'beer': 'beer', 'lager': 'beer',
  };

  let active = false, rec = null;
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const supported = !!SR;

  function _init() {
    rec = new SR();
    rec.continuous = true;
    rec.interimResults = false;
    rec.lang = 'en-US';
    rec.onresult = _onResult;
    rec.onend = () => { if (active) { try { rec.start(); } catch(_) {} } };
    rec.onerror = e => {
      if (e.error === 'not-allowed') {
        toast('🎤 Mic access denied', 'err');
        active = false;
        _updateBtn();
      }
    };
  }

  function _onResult(e) {
    if (G.screen !== 'service' || !G.isOpen) return;
    for (let i = e.resultIndex; i < e.results.length; i++) {
      if (!e.results[i].isFinal) continue;
      const raw = e.results[i][0].transcript.trim();
      const text = raw.toLowerCase();

      // Serve/give command
      if (/\b(serve|give|hand over|どうぞ)\b/.test(text)) {
        const ri = G.cookSlots.findIndex(s => s && s.state === 'ready');
        if (ri !== -1) { window.tapSlot(ri); _heard(raw, true); return; }
      }

      // Dish commands — match longest phrase first
      const phrases = Object.keys(DISH_MAP).sort((a, b) => b.length - a.length);
      for (const phrase of phrases) {
        if (text.includes(phrase)) {
          window.cookItem(DISH_MAP[phrase]);
          _heard(raw, true);
          return;
        }
      }

      // Fallback — log unrecognised speech
      _heard(raw, false);
    }
  }

  function _heard(raw, matched) {
    if (window._logDialog) window._logDialog(`"${raw}"`, 'player');
    if (!matched) toast(`🎙️ "${raw}" — not recognised`, 'info');
  }

  function _updateBtn() {
    const btn = document.getElementById('mic-btn');
    if (!btn) return;
    if (!supported) { btn.title = 'Voice not supported in this browser'; btn.style.opacity = '.3'; return; }
    btn.textContent = active ? '🎙️' : '🎤';
    btn.classList.toggle('listening', active);
  }

  return {
    toggle() {
      if (!supported) { toast('🎤 Voice recognition needs Chrome / Edge', 'err'); return; }
      if (!rec) _init();
      active = !active;
      if (active) { try { rec.start(); } catch(_) {} }
      else         { try { rec.stop();  } catch(_) {} }
      _updateBtn();
      toast(active ? '🎙️ Listening — say a dish name to cook it' : '🎤 Mic off', 'info');
    },
    updateBtn: _updateBtn,
  };
})();

function getAccounts() {
  try { return JSON.parse(localStorage.getItem('yatai_accounts') || '[]'); } catch(_) { return []; }
}
function _saveAccount(name) {
  const list = getAccounts();
  if (!list.includes(name)) list.push(name);
  localStorage.setItem('yatai_accounts', JSON.stringify(list));
  localStorage.setItem('yatai_current', name);
}

window.deleteAccount = function(name) {
  if (!confirm(`Delete player "${name}"? Their save (money, day, progress) is gone for good.`)) return;
  try {
    const list = getAccounts().filter(n => n !== name);
    localStorage.setItem('yatai_accounts', JSON.stringify(list));
    localStorage.removeItem('yatai_save_' + name);
    if (localStorage.getItem('yatai_current') === name) localStorage.removeItem('yatai_current');
  } catch(_) {}
  if (G.playerName === name) G.playerName = '';
  fullRender();
};

window.resetGame = function() {
  if (!G.playerName) return;
  try { localStorage.removeItem('yatai_save_' + G.playerName); } catch(_) {}
  G.day = 1; G.money = 10000; G.rep = 8;
  SHOP.forEach(s => { G.inv[s.id] = 0; G.cart[s.id] = 0; });
  G.weather = WEATHER[0];
  G.screen = 'title';
  fullRender();
  toast('Game restarted! 新しい出発！');
};

function savePlayerState() {
  if (!G.playerName) return;
  try {
    const state = {
      day:    G.day,
      money:  G.money,
      rep:    G.rep,
      inv:    Object.assign({}, G.inv),
      weather: G.weather ? G.weather.id : null,
      earnedNPCs: G.earnedNPCs || [],
    };
    localStorage.setItem('yatai_save_' + G.playerName, JSON.stringify(state));
  } catch(_) {}
}

function loadPlayerState(name) {
  try {
    const raw = localStorage.getItem('yatai_save_' + name);
    if (!raw) return false;
    const state = JSON.parse(raw);
    G.day    = state.day    || 1;
    G.money  = state.money  ?? 10000;
    G.rep    = state.rep    ?? 8;
    SHOP.forEach(s => { G.inv[s.id] = state.inv ? (state.inv[s.id] ?? 0) : 0; });
    if (state.weather) G.weather = WEATHER.find(w => w.id === state.weather) || WEATHER[0];
    G.earnedNPCs = Array.isArray(state.earnedNPCs) ? state.earnedNPCs : [];
    return true;
  } catch(_) { return false; }
}

// Ensures G.money/day/rep reflect this player's real save the moment they're signed in —
// not just when they start hosting a stall (window.startGame's own loadPlayerState call
// covers that path; this covers everyone else, e.g. someone who only ever joins/explores
// as a guest and would otherwise be stuck on the raw initial-state default).
function _ensurePlayerMoney(name) {
  const hasSave = loadPlayerState(name);
  if (!hasSave) { G.day = 1; G.money = 10000; G.rep = 8; }
}
const _PLAYER_ICONS = ['🧑','👩','👨','🧑‍💼','🧑‍🎓','🧑‍🎤','🧑‍🏫','🧑‍🚀','🧑‍🎨','🧑‍🔬'];
function _playerIcon(name) {
  const h = name.split('').reduce((a, c) => a + c.charCodeAt(0), 0);
  return _PLAYER_ICONS[h % _PLAYER_ICONS.length];
}

function buildSignIn() {
  const accounts = getAccounts();
  const current = G.playerName;
  const accountBtns = accounts.map(name => {
    const active = name === current;
    const safeName = name.replace(/\\/g,'\\\\').replace(/'/g,"\\'");
    return `<div class="signin-account-btn" style="${active ? 'border-color:rgba(255,140,58,.7);background:rgba(255,140,58,.18)' : ''}">
      <div class="signin-account-click" onclick="window.signInAs('${safeName}')">
        <span style="font-size:18px">${_playerIcon(name)}</span>
        <span class="acct-name">${name}${active ? ' <span style="font-size:10px;color:var(--lantern)">(you)</span>' : ''}</span>
        <span class="acct-arrow">→</span>
      </div>
      <button class="signin-delete-btn" onclick="event.stopPropagation(); window.deleteAccount('${safeName}')" title="Delete this player">🗑️</button>
    </div>`;
  }).join('');

  return `<div class="screen" id="signin-screen" style="justify-content:center;padding:32px 20px">
    <div class="lantern-row"><span>🏮</span><span>🏮</span><span>🏮</span></div>
    <div class="title-kanji" style="font-size:48px">夜台</div>
    <div class="title-en" style="margin-bottom:28px">Yatai Master</div>
    ${accounts.length > 0 ? `
      <div class="signin-section">
        <div class="signin-label">Who's playing?</div>
        <div class="signin-accounts">${accountBtns}</div>
      </div>
      <div class="signin-or">— or create a new player —</div>
    ` : `<div style="font-size:13px;color:var(--dim);margin-bottom:20px;text-align:center">Pick a name — you'll show up as a customer<br>at your friends' stalls!</div>`}
    <div class="signin-section">
      <div class="signin-label">${accounts.length > 0 ? 'New player' : 'Your name'}</div>
      <div class="signin-row">
        <input id="signin-input" class="signin-input" type="text" maxlength="20" placeholder="Enter a name…"
          onkeydown="if(event.key==='Enter')window.submitSignIn()" autocomplete="off" />
        <button class="btn btn-primary" onclick="window.submitSignIn()" style="white-space:nowrap">Join →</button>
      </div>
      <div id="signin-err" class="signin-err"></div>
    </div>
  </div>`;
}

window.signInAs = function(name) {
  try { localStorage.setItem('yatai_current', name); } catch(_) {}
  G.playerName = name;
  _ensurePlayerMoney(name);
  G.screen = 'title';
  fullRender();
};

window.submitSignIn = function() {
  const input = document.getElementById('signin-input');
  const err   = document.getElementById('signin-err');
  if (!input) return;
  const name = input.value.trim();
  if (!name) { err.textContent = 'Please enter a name.'; return; }
  const existing = getAccounts().find(n => n.toLowerCase() === name.toLowerCase());
  if (existing) { window.signInAs(existing); return; }
  _saveAccount(name);
  G.playerName = name;
  _ensurePlayerMoney(name);
  G.screen = 'title';
  fullRender();
};

window.switchPlayer = function() {
  G.screen = 'signin';
  fullRender();
};

// ─────────────────────────────────────────────
// MULTIPLAYER — PeerJS P2P
// ─────────────────────────────────────────────
// Reserved code for the shared, ownerless "street" hangout — auto-created server-side
// on first join. Must match PLAZA_CODE in api/room.js and server.js.
const PLAZA_CODE = 'PLAZA1';
// Reserved code for the shared, ownerless Pachinko Palace. Must match PACHINKO_CODE
// in api/room.js and server.js.
const PACHINKO_CODE = 'PACHIN1';
// Reserved code for the shared, ownerless Beach. Must match BEACH_CODE in
// api/room.js and server.js.
const BEACH_CODE = 'BEACH1';
const MP = {
  // HTTP-polling multiplayer — no PeerJS, no third-party connections
  peer: null,        // legacy compat (unused)
  masterConn: null,  // legacy compat (unused)
  role: null,        // 'master' | 'customer'
  roomCode: '',
  myName: '',
  myGuestId: null,
  peers: {},         // guestId → { name, guestId }
  myOrder: null,
  myOrderStatus: 'none',
  _wasInWaitQueue: false,
  stateData: null,
  _pollTimer: null,
  _broadcastTimer: null,
  _patTimer: null,
  _pollSince: 0,
  _chatLog: [],
  _dialogLog: [],
  _pendingServed: {},
  _pendingChat: [],
  _lastOrderTs: {},    // guestId → ts of last processed order (dedup guard)
  _seenOrderIds: {},   // orderId → true, absolute dedup by unique nonce per order
  _selectedItem: null, // item tapped but not yet confirmed
  _confirmLock: false, // true for 700ms after selection to block ghost clicks
  _subtitleSeq: 0,
  _lastSubtitleSeq: 0,
  _subtitleQueue: [],
  _subtitlePlaying: false,
  _peerPositions: {},  // guestId → {xFrac, facing, moving, ts} — street hangout, from room GET
  _hostStreetPos: null, // host's own street position, set by the street IIFE when role==='master'

  _randCode() {
    const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    let s = '';
    for (let i = 0; i < 6; i++) s += chars[Math.floor(Math.random() * chars.length)];
    return s;
  },

  async _post(code, body) {
    try {
      const r = await fetch('/api/room?code=' + code, {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body),
      });
      return await r.json();
    } catch(e) { return { ok: false, error: e.message }; }
  },

  async _get(code, since) {
    try {
      const r = await fetch('/api/room?code=' + code + '&since=' + (since || 0));
      return await r.json();
    } catch(e) { return { ok: false }; }
  },

  // ── MASTER ──
  async initMaster(roomCode) {
    this.role = 'master';
    this.roomCode = roomCode;
    this.myName = G.playerName || 'Master';
    this.peers = {};
    this._pendingServed = {};
    this._pendingChat = [];
    this._lastOrderTs = {};
    this._seenOrderIds = {};
    this._pollSince = Date.now();
    const res = await this._post(roomCode, { type: 'create', name: this.myName });
    if (!res.ok) { toast('Failed to create room', 'err'); G.screen = 'multilobby'; fullRender(); return; }
    G.screen = 'multihost'; fullRender();
    this._pollTimer = setInterval(() => this._masterPoll(), 1000);
  },

  async _masterPoll() {
    const data = await this._get(this.roomCode, this._pollSince);
    if (!data.ok) return;
    const newSince = data.ts || Date.now();
    // Use max of room.ts and any message ts so _pollSince always covers all delivered messages
    let maxMsgTs = newSince;
    for (const msg of (data.messages || [])) { if (msg.ts > maxMsgTs) maxMsgTs = msg.ts; }
    console.error('[HOST POLL]', 'msgs:', (data.messages||[]).length, 'since:', this._pollSince, 'types:', (data.messages||[]).map(m=>m.type+':'+m.ts).join(','));
    for (const msg of (data.messages || [])) {
      if (msg.ts <= this._pollSince) { console.error('[HOST SKIP TS]', msg.type, 'ts:', msg.ts, '<= since:', this._pollSince); continue; }
      if (msg.type === 'join') {
        if (!this.peers[msg.guestId]) {
          this.peers[msg.guestId] = { name: msg.name, guestId: msg.guestId };
          toast(`${msg.name} joined!`);
          if (G.isOpen) this._spawnRealCustomer(msg.guestId, msg.name);
          try { if (window._seatSelf) window._seatSelf(msg.guestId, msg.name); } catch(_) {}
        }
      } else if (msg.type === 'leave') {
        const p = this.peers[msg.guestId];
        if (p) {
          delete this.peers[msg.guestId];
          toast(`${p.name} left`, 'warn');
          const idx = G.customers.findIndex(c => c.peerId === msg.guestId);
          if (idx !== -1) G.customers.splice(idx, 1);
          try { if (window._unseatGuestPlayer) window._unseatGuestPlayer(msg.guestId); } catch(_) {}
        }
      } else if (msg.type === 'order') {
        console.error('[HOST RECV ORDER]', JSON.stringify(msg));
        if (!G.isOpen) { console.error('[HOST ORDER DROP] stall not open'); continue; }
        const peer = this.peers[msg.guestId];
        if (!peer) { console.error('[HOST ORDER DROP] no peer for guestId', msg.guestId, 'peers:', Object.keys(this.peers)); continue; }
        const item = MENU.find(m => m.id === msg.itemId);
        if (!item) { console.error('[HOST ORDER DROP] unknown itemId', msg.itemId); continue; }
        // Nonce-based absolute dedup: each order has a unique orderId
        if (msg.orderId && this._seenOrderIds[msg.orderId]) { console.error('[HOST ORDER DEDUP skip]', msg.orderId); continue; }
        if (msg.orderId) this._seenOrderIds[msg.orderId] = true;
        // Timestamp dedup fallback (for orders sent before nonce was added)
        const _prevOrderTs = this._lastOrderTs[msg.guestId] || 0;
        if (!msg.orderId && msg.ts <= _prevOrderTs) { continue; }
        if (!msg.orderId) this._lastOrderTs[msg.guestId] = msg.ts;
        let c = G.customers.find(cu => cu.peerId === msg.guestId);
        if (c && (c.state === 'wait' || c.state === 'served')) { console.error('[HOST ORDER DROP] still working through current order', msg.guestId, c.state); continue; }
        if (!c) c = this._spawnRealCustomer(msg.guestId, peer.name);
        if (c) {
          c.order = item; c.state = 'wait';
          toast(`${peer.name} ordered ${item.icon} ${item.en}!`, 'info');
          try { const mg = document.getElementById('menu-grid'); if (mg) mg.innerHTML = buildMenuItems(); } catch(_) {}
          try { const cl = document.getElementById('customer-list'); if (cl) cl.innerHTML = buildCustList(); } catch(_) {}
          // Serve immediately if a matching ready slot already exists
          for (let _si = 0; _si < G.cookSlots.length; _si++) {
            const _s = G.cookSlots[_si];
            if (_s && _s.item && _s.state === 'ready' && _s.item.id === item.id) { autoServe(_si); break; }
          }
        }
      } else if (msg.type === 'chat') {
        if (window._logDialog) window._logDialog(`${msg.name}: ${msg.text}`, 'cust');
        this._pendingChat.push({ from: msg.name, text: msg.text, guestId: msg.guestId });
        if (window._streetHandleChat) { try { window._streetHandleChat(msg.guestId, msg.name, msg.text); } catch(_) {} }
      } else if (msg.type === 'ct') {
        // Guest sent their own clothing — store it so all views match
        if (msg.guestId && msg.data && msg.data.ct) {
          try { if (window._setGuestCt) window._setGuestCt(msg.guestId, msg.data.ct); } catch(_) {}
        }
      } else if (msg.type === 'rtc-signal' && msg.to === '__host__') {
        // Voice chat signaling addressed to the host specifically — peer-to-peer,
        // bypasses the state broadcast entirely.
        if (window._vcHandleSignal) { try { window._vcHandleSignal(msg.guestId, msg.kind, msg.payload); } catch(_) {} }
      }
    }
    this._pollSince = maxMsgTs;
    // Voice chat — sync connections against everyone currently known to be in the room.
    if (window._vcSyncRoster) {
      try { window._vcSyncRoster(['__host__', ...Object.keys(this.peers)]); } catch(_) {}
    }
    // Catch any guests registered in the room that we missed
    for (const g of (data.guests || [])) {
      if (!this.peers[g.guestId]) {
        this.peers[g.guestId] = { name: g.name, guestId: g.guestId };
        if (G.isOpen) this._spawnRealCustomer(g.guestId, g.name);
        try { if (window._seatSelf) window._seatSelf(g.guestId, g.name); } catch(_) {}
      }
    }
    // Street hangout — latest known position per guest, folded into the next broadcast
    this._peerPositions = data.positions || {};
    if (window._streetSyncPlayers) { try { window._streetSyncPlayers(this._streetPlayers()); } catch(_) {} }
    // Always keep the roster current
    this._renderHostPlayers();
  },

  // Street hangout — host + all known guest positions/appearance, folded into every
  // broadcast so guests (and the host's own street render) can draw everyone. Cheap to
  // compute even when nobody's on the street screen.
  _streetPlayers() {
    const players = [];
    if (this._hostStreetPos) {
      players.push({
        id: '__host__', name: G.playerName || 'Host',
        ct: window._getGuestCt ? window._getGuestCt('__host__') : null,
        ...this._hostStreetPos,
      });
    }
    for (const [gid, p] of Object.entries(this._peerPositions || {})) {
      players.push({
        id: gid, name: (this.peers[gid] && this.peers[gid].name) || 'Guest',
        ct: window._getGuestCt ? window._getGuestCt(gid) : null,
        ...p,
      });
    }
    return players;
  },

  startBroadcastLoop() {
    clearInterval(this._broadcastTimer);
    this._broadcastTimer = setInterval(() => {
      const chat = this._pendingChat.splice(0);
      const players = this._streetPlayers();
      if (!G.isOpen) {
        // Stall not open yet — still let street hangout work pre-open.
        this._post(this.roomCode, { type: 'state', data: {
          isOpen: false, hostName: G.playerName || '夜台',
          peers: Object.values(this.peers).map(p => ({ name: p.name, guestId: p.guestId })),
          players, chat,
        }});
        return;
      }
      // Keep all known guest figures alive on the host canvas
      for (const p of Object.values(this.peers)) {
        try { if (window._seatSelf) window._seatSelf(p.guestId, p.name); } catch(_) {}
      }
      const served = Object.assign({}, this._pendingServed);
      // _pendingServed is cleared by notifyServed's own 6s timeout — don't clear here
      const _subtitlesSnap = window._takeSubtitles ? window._takeSubtitles() : [];
      if (_subtitlesSnap.length) this._subtitleSeq++;
      const state = {
        customers: G.customers.map(c => ({
          id: c.id, jp: c.jp, en: c.en, icon: c.icon, peerId: c.peerId || null,
          order: c.order ? { en: c.order.en, icon: c.order.icon, name: c.order.name } : null,
          patLeft: Math.round(c.patLeft), patMax: c.patMax, state: c.state,
        })),
        cookSlots: G.cookSlots.map(s => s && s.item ? { en: s.item.en, icon: s.item.icon, progress: s.progress, state: s.state } : null),
        menu: (G.unlockedMenu || []).map(item => {
          const si = (typeof SHOP !== 'undefined' ? SHOP : []).find(s => s.forItem === item.id);
          const stock = si ? (G.inv[si.id] || 0) : 0;
          const w = G.customers.filter(c => c.state === 'wait' && c.order && c.order.id === item.id).length;
          return { id: item.id, en: item.en, name: item.name, icon: item.icon, price: item.price, stock, waiting: w };
        }),
        money: G.money, timeStr: G.timeStr, isOpen: G.isOpen, day: G.day,
        hostName: G.playerName || '夜台',
        timePct: (G.gameTime - SERVICE_START) / (SERVICE_END - SERVICE_START),
        rep: G.rep, stars: G.stars,
        stats: { served: G.todayServed, earned: G.todayEarned, lost: G.todayLost },
        weather: G.weather ? { icon: G.weather.icon, name: G.weather.name } : null,
        tvOn: window._tvGetOn ? window._tvGetOn() : false,
        subtitlesOn: (() => { const cb = document.getElementById('subtitle-cb'); return cb ? cb.checked : false; })(),
        activeEvents: window._getEventState ? window._getEventState() : null,
        slotState: window._getSlotState ? window._getSlotState() : [],
        speech: window._takePendingSpeech ? window._takePendingSpeech() : [],
        events: window._takeEvents ? window._takeEvents() : [],
        dialog: (G.dialogLog || []).slice(-30),
        dialogDelta: window._takeDialogDelta ? window._takeDialogDelta() : [],
        subtitles: _subtitlesSnap,
        subtitleSeq: this._subtitleSeq,
        peers: Object.values(this.peers).map(p => ({ name: p.name, guestId: p.guestId })),
        served, chat, players,
      };
      this._post(this.roomCode, { type: 'state', data: state });
    }, G.screen === 'street' ? 500 : 2000);
  },

  stopBroadcastLoop() { clearInterval(this._broadcastTimer); },

  notifyServed(peerId, itemId) {
    if (peerId && itemId) {
      this._pendingServed[peerId] = itemId;
      setTimeout(() => { delete this._pendingServed[peerId]; }, 6000);
    }
  },

  _renderHostPlayers() {
    const ps = Object.values(this.peers);
    const rowHtml = ps.map(p => `<div class="multi-player-row"><span class="mp-icon">🧑</span><span>${p.name}</span><span class="mp-role">Customer</span></div>`).join('');
    const emptyHtml = '<div style="color:var(--dim);font-size:12px;text-align:center;padding:8px 0">Waiting for players…</div>';
    const lobby = document.getElementById('multi-host-players');
    if (lobby) lobby.innerHTML = ps.length ? rowHtml : emptyHtml;
    const roster = document.getElementById('player-roster');
    if (roster) {
      roster.innerHTML = ps.length
        ? `<div style="font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:1px;margin-bottom:4px">Players Online</div>${rowHtml}`
        : '';
    }
    const codeEl = document.getElementById('mp-room-code-hud');
    if (codeEl) codeEl.textContent = this.roomCode;
  },

  _spawnRealCustomer(peerId, name) {
    const existing = G.customers.find(cu => cu.peerId === peerId);
    if (existing) return existing;
    const pat = 320 + Math.random() * 80;
    const c = { id: G.nextId++, type: 'player', jp: name, en: name, icon: '🧑', order: null, patMax: pat, patLeft: pat, state: 'seated', isPlayer: true, peerId };
    G.customers.push(c);
    return c;
  },

  // ── CUSTOMER ──
  async joinRoom(roomCode, myName) {
    this.role = 'customer';
    this.roomCode = roomCode;
    this.myName = myName;
    this.myOrder = null;
    this.myOrderStatus = 'none';
    this._chatLog = [];
    this._dialogLog = [];
    this._lastSubtitleSeq = 0;
    this._subtitleQueue = [];
    this._subtitlePlaying = false;
    this._pollSince = Date.now();
    const el = document.getElementById('multi-join-status');
    if (el) el.innerHTML = '<div class="multi-connecting"><span>⏳</span> Connecting…</div>';
    const res = await this._post(roomCode, { type: 'join', name: myName });
    if (!res.ok) {
      const errEl = document.getElementById('multi-join-err');
      const msg = res.error === 'room not found' ? 'Room not found — check the code.' : 'Failed: ' + (res.error || 'unknown');
      if (errEl) errEl.textContent = msg; else toast(msg, 'err');
      return;
    }
    this.myGuestId = res.guestId;
    window.stallOpen = true;
    try { if (window._freezeSpawning) window._freezeSpawning(); } catch(_) {}
    try { if (window._seatSelf) window._seatSelf(res.guestId, myName); } catch(_) {}
    // Tell the host our clothing so everyone sees the same appearance
    try {
      const selfCt = window._getGuestCt && window._getGuestCt(res.guestId);
      if (selfCt) this._post(roomCode, { type: 'msg', guestId: res.guestId, data: { type: 'ct', ct: selfCt } });
    } catch(_) {}
    G.screen = 'customer'; fullRender();
    this._pollTimer = setInterval(() => this._customerPoll(), 1500);
    this._startPatTicker();
    this._startCookTicker();
  },

  // ── SHARED VENUES (Plaza, Pachinko Palace, ...) ── lighter sibling of joinRoom(): no
  // stall to seat into, no cook/patience tickers — these are ownerless shared spaces,
  // ordinary yatai rooms are unaffected. Any reserved venue room code works here.
  async joinVenue(code) {
    this.role = 'customer';
    this.roomCode = code;
    this.myName = G.playerName || 'Guest';
    this._chatLog = [];
    this._dialogLog = [];
    this._pollSince = Date.now();
    const res = await this._post(code, { type: 'join', name: this.myName });
    if (!res.ok) { toast('Could not reach the street — try again.', 'err'); return; }
    this.myGuestId = res.guestId;
    try {
      const selfCt = window._ensureGuestCt && window._ensureGuestCt(res.guestId);
      if (selfCt) this._post(code, { type: 'msg', guestId: res.guestId, data: { type: 'ct', ct: selfCt } });
    } catch(_) {}
    G.screen = 'street'; fullRender();
  },

  _triggerServed(itemId) {
    if (this.myOrderStatus === 'served' || !this.myOrder) return;
    this.myOrderStatus = 'served';
    this._wasInWaitQueue = false;
    this._renderCustomerOrder();
    toast('Your order is ready! いただきます！');
    try { AUDIO.init(); AUDIO.playArrive && AUDIO.playArrive(); } catch(_) {}
    // Show food animation on the guest's own canvas character
    const _dishId = itemId || (this.myOrder && this.myOrder.id);
    try { if (window._iifeServeGuest && this.myGuestId) window._iifeServeGuest(this.myGuestId, _dishId); } catch(_) {}
    const _orderId = this.myOrder && this.myOrder.id;
    setTimeout(() => {
      // Only clear if no new order has been placed since we were served
      if (this.myOrder && this.myOrder.id === _orderId) {
        this.myOrder = null; this.myOrderStatus = 'none'; this._orderSentAt = null; this._wasInWaitQueue = false; this._selectedItem = null;
        window._custOrderLock = true;
        setTimeout(() => { window._custOrderLock = false; }, 2000);
        this._renderCustomerOrder();
        if (this.stateData) this._renderCustomerState();
      }
    }, SERVE_LINGER_MS);
  },

  async _customerPoll() {
    const data = await this._get(this.roomCode, this._pollSince);
    if (!data.ok) return;
    // Use server timestamp (same as host) so messages posted during response transit aren't missed
    const newSince = data.ts || Date.now();
    // Check messages first — durable served notifications live here
    for (const msg of (data.messages || [])) {
      if (msg.type === 'served' && msg.guestId === this.myGuestId) {
        this._triggerServed(msg.itemId);
      } else if (msg.type === 'rtc-signal' && msg.to === this.myGuestId) {
        // Voice chat signaling addressed to us — peer-to-peer, same in every room type.
        if (window._vcHandleSignal) { try { window._vcHandleSignal(msg.guestId, msg.kind, msg.payload); } catch(_) {} }
      }
    }
    this._pollSince = newSince;
    if (data.state) {
      this.stateData = data.state;
      this._renderCustomerState();
      // Fallback: served flag in broadcast state (only if order is still active)
      if (data.state.served && data.state.served[this.myGuestId] && this.myOrder) {
        this._triggerServed(data.state.served[this.myGuestId]);
      }
      // Chat from broadcast
      for (const m of (data.state.chat || [])) {
        this._chatLog.push(m);
        if (this._chatLog.length > 20) this._chatLog.shift();
        // Street hangout — skip our own relayed echo (already shown optimistically on send)
        if (window._streetHandleChat && m.guestId !== this.myGuestId) {
          try { window._streetHandleChat(m.guestId, m.from, m.text); } catch(_) {}
        }
      }
      this._renderCustomerChat();
      this._renderCustomerPeers(data.guests || []);
      // Street hangout — sync everyone's positions (no-op when not on the street screen)
      if (window._streetSyncPlayers) { try { window._streetSyncPlayers(data.state.players); } catch(_) {} }
      // Voice chat — the host is a real human participant in a private yatai room.
      if (window._vcSyncRoster) {
        try { window._vcSyncRoster(['__host__', ...(data.guests || []).map(g => g.guestId)]); } catch(_) {}
      }
    } else if (this.roomCode === PLAZA_CODE || this.roomCode === PACHINKO_CODE || this.roomCode === BEACH_CODE) {
      // Shared venues have no host, so there's no state.chat/state.players relay to read
      // (data.state is always null here — nobody ever posts type:'state' for an ownerless
      // room). Read the raw, master-independent copies the server already stores for every
      // 'msg'/'pos' POST.
      for (const msg of (data.messages || [])) {
        if (msg.type === 'ct' && msg.guestId && msg.data && msg.data.ct) {
          try { if (window._setGuestCt) window._setGuestCt(msg.guestId, msg.data.ct); } catch(_) {}
        } else if (msg.type === 'chat') {
          this._chatLog.push({ from: msg.name, text: msg.text });
          if (this._chatLog.length > 20) this._chatLog.shift();
          if (window._streetHandleChat && msg.guestId !== this.myGuestId) {
            try { window._streetHandleChat(msg.guestId, msg.name, msg.text); } catch(_) {}
          }
        }
      }
      if (window._streetSyncPlayers) {
        const guestNames = {};
        for (const g of (data.guests || [])) guestNames[g.guestId] = g.name;
        // Read appearance from the persistent server-side map (data.ct), not the local
        // _getGuestCt cache — a peer who joined before you started polling would otherwise
        // never be learned, since their one-time 'ct' message already aged out of data.messages.
        const players = Object.entries(data.positions || {}).map(([gid, p]) => ({
          id: gid, name: guestNames[gid] || 'Guest',
          ct: (data.ct && data.ct[gid]) || (window._getGuestCt ? window._getGuestCt(gid) : null),
          ...p,
        }));
        try { window._streetSyncPlayers(players); } catch(_) {}
      }
      // Voice chat — no host in a shared venue, roster is just the guest list.
      if (window._vcSyncRoster) {
        try { window._vcSyncRoster((data.guests || []).map(g => g.guestId)); } catch(_) {}
      }
    }
  },

  sendOrder(itemId) {
    if (!this.myGuestId) return;
    this.myOrderStatus = 'waiting';
    this._orderSentAt = Date.now();
    this._wasInWaitQueue = false;
    this._renderCustomerOrder();
    const orderId = Math.random().toString(36).slice(2, 14) + Math.random().toString(36).slice(2, 8);
    console.error('[SEND ORDER] itemId:', itemId, 'guestId:', this.myGuestId, 'orderId:', orderId, new Error().stack);
    this._post(this.roomCode, { type: 'msg', guestId: this.myGuestId, data: { type: 'order', itemId, name: this.myName, orderId } });
  },

  sendChat(text) {
    if (!this.myGuestId) return;
    this._chatLog.push({ from: 'You', text });
    if (this._chatLog.length > 20) this._chatLog.shift();
    this._renderCustomerChat();
    this._post(this.roomCode, { type: 'msg', guestId: this.myGuestId, data: { type: 'chat', text, name: this.myName } });
  },

  // Host has no incoming message path (nothing to POST-to-self) — just queue it directly
  // for the next broadcast, same as a relayed guest chat would be by the time it reaches here.
  hostSendChat(text) {
    if (!text) return;
    this._pendingChat.push({ from: this.myName || G.playerName || 'Host', text, guestId: '__host__' });
  },

  _renderCustomerState() {
    if (!this.stateData) return;
    const { timeStr, timePct } = this.stateData;
    if (timePct != null) window._serviceTimePct = Math.min(1, Math.max(0, timePct));
    if (this.stateData.tvOn != null && window._tvSetOn) window._tvSetOn(this.stateData.tvOn);
    if (this.stateData.subtitlesOn != null) { const sel = document.getElementById('subtitle'); if (sel) sel.style.display = this.stateData.subtitlesOn ? '' : 'none'; }
    if (window._applyEventState) try { window._applyEventState(this.stateData.activeEvents || null); } catch(_) {}
    // When the host ends service, evict all NPC slots and clear speech/order state
    if (this.stateData.isOpen === false && this._wasOpen) {
      if (window._syncSlots) window._syncSlots(new Array(8).fill(null));
      if (window._clearBubbles) window._clearBubbles();
      this.myOrder = null; this.myOrderStatus = 'none';
      this._wasInWaitQueue = false; this._orderSentAt = null;
      if (this._cookTickerRaf) { cancelAnimationFrame(this._cookTickerRaf); this._cookTickerRaf = null; }
      if (this._patTimer) { clearInterval(this._patTimer); this._patTimer = null; }
      // Turn off TV and clear night-dimming
      if (window._tvSetOn) window._tvSetOn(false);
      window._serviceTimePct = 0;
      this._renderCustomerOrder();
    }
    this._wasOpen = !!this.stateData.isOpen;
    // Sync canvas stall with host, then guarantee our own seat is visible
    if (this.stateData.isOpen !== false && this.stateData.slotState && window._syncSlots) {
      window._syncSlots(this.stateData.slotState);
      if (this.myGuestId && window._seatSelf) window._seatSelf(this.myGuestId, this.myName || '');
    }
    if (this.stateData.speech && window._replaySpeechBubble) {
      for (const s of this.stateData.speech) window._replaySpeechBubble(s.xFrac != null ? s.xFrac : (s.x || 0.5), s.text, s.pitch, s.rate, s.voiceIdx);
    }
    if (this.stateData.events) {
      for (const e of this.stateData.events) toast(e.msg, e.type);
    }
    if (this.stateData.subtitles && this.stateData.subtitles.length &&
        this.stateData.subtitleSeq !== undefined &&
        this.stateData.subtitleSeq !== this._lastSubtitleSeq) {
      this._lastSubtitleSeq = this.stateData.subtitleSeq;
      for (const t of this.stateData.subtitles) this._enqueueSubtitle(t);
    }
    // HUD
    // hud-master shows the guest's own name — don't overwrite it with the host's name
    const dayEl = document.getElementById('hud-day');
    if (dayEl && this.stateData.day != null) dayEl.textContent = 'Day ' + this.stateData.day;
    const timeEl = document.getElementById('hud-time');
    if (timeEl && timeStr) timeEl.textContent = timeStr;
    // Guest's own money, not the host's broadcast state.money (that's the yatai master's
    // earnings) — same "don't overwrite with the host's data" rule as hud-master above.
    const moneyEl = document.getElementById('hud-money');
    if (moneyEl) moneyEl.textContent = '¥' + Number(G.money).toLocaleString();
    // No rep/stars shown as a guest — that's the yatai master's own reputation, not
    // something meaningful to display for someone just visiting as a customer.
    // Time bar
    const bar = document.getElementById('time-bar-fill');
    if (bar && timePct != null) bar.style.width = (Math.min(1, Math.max(0, timePct)) * 100) + '%';
    // Menu grid from broadcast — only rebuild when data actually changes to avoid mobile ghost taps
    const menuEl = document.getElementById('menu-grid');
    if (menuEl && this.stateData.menu && this.stateData.menu.length) {
      const hasOrder = !!this.myOrder;
      const menuKey = (hasOrder ? '1' : '0') + '|' + this.stateData.menu.map(i => `${i.id}:${i.stock}:${i.waiting}`).join(',');
      if (menuEl._menuKey !== menuKey) {
        menuEl._menuKey = menuKey;
        menuEl.innerHTML = this.stateData.menu.map(item => {
          const noStock = item.stock <= 0;
          const cls = noStock ? 'no-stock' : '';
          const isSelected = MP._selectedItem && MP._selectedItem.id === item.id;
        const selCls = isSelected ? ' selected-item' : '';
        return `<button class="menu-btn cmi-btn ${cls}${selCls}" onclick="window.custSelect('${item.id}','${item.icon}','${item.en}')" ${hasOrder || noStock ? 'disabled' : ''}>
            <div class="icon">${item.icon}</div>
            <div class="en">${item.en}</div>
            <div class="jp">${item.name}</div>
            <div class="price">¥${item.price}</div>
            <div class="stock">${item.stock > 0 ? item.stock + ' left' : 'Out of stock'}</div>
            ${item.waiting > 0 ? `<div style="font-size:10px;font-weight:700;color:var(--red-l);margin-top:1px">${item.waiting} waiting</div>` : ''}
          </button>`;
        }).join('');
      }
    }
    // Customer waiting list — identical to host buildCustList()
    const custBox = document.getElementById('customer-list');
    if (custBox) {
      const allWaiting = (this.stateData.customers || []).filter(c => c.state === 'wait' && c.order);
      const myEntry = allWaiting.find(c => c.peerId === this.myGuestId);
      const others  = allWaiting.filter(c => c.peerId !== this.myGuestId);
      const myCard = myEntry ? (() => {
        const orderStr = `${myEntry.order.icon} ${myEntry.order.en} <span style="color:var(--dim);font-size:11px">${myEntry.order.name||''}</span>`;
        return `<div class="cust-card" style="border-color:rgba(255,200,80,.5);background:rgba(255,200,80,.07)">
          <div class="cust-icon">⭐</div>
          <div class="cust-info">
            <div class="cust-type" style="color:var(--gold)">Your order</div>
            <div class="cust-order">${orderStr}</div>
          </div>
          <div class="pat-wrap"><div style="font-size:10px;color:var(--teal)">⏳ In queue</div></div>
        </div>`;
      })() : '';
      if (!myCard && !others.length) {
        custBox.innerHTML = '<div class="no-cust">No customers right now</div>';
      } else {
        custBox.innerHTML = myCard + others.map(c => {
          const pct = (c.patLeft / c.patMax) * 100;
          const col = pct > 55 ? '#27ae60' : pct > 28 ? '#f39c12' : '#e74c3c';
          const urgent = pct < 25 ? 'urgent' : '';
          const orderStr = c.order ? `${c.order.icon} ${c.order.en} <span style="color:var(--dim);font-size:11px">${c.order.name||''}</span>` : '—';
          return `<div class="cust-card ${urgent}">
            <div class="cust-icon">${c.icon}</div>
            <div class="cust-info">
              <div class="cust-type">${c.jp || c.en}${c.jp && c.jp !== c.en ? ' · ' + c.en : ''}</div>
              <div class="cust-order">${orderStr}</div>
            </div>
            <div class="pat-wrap">
              <div class="pat-bar"><div class="pat-fill" style="width:${pct}%;background:${col}"></div></div>
              <div class="pat-time">${Math.ceil(c.patLeft)}s</div>
            </div>
          </div>`;
        }).join('');
      }
    }
    // Stats row — identical to host buildStatsRow()
    const statsEl = document.getElementById('stats-row');
    if (statsEl && this.stateData.stats) {
      const s = this.stateData.stats;
      const w = this.stateData.weather || {};
      statsEl.innerHTML = `
        <div class="stat-cell"><div class="stat-val" style="color:var(--gold)">¥${Number(s.earned).toLocaleString()}</div><div class="stat-lbl">Earned</div></div>
        <div class="stat-cell"><div class="stat-val" style="color:var(--green)">${s.served}</div><div class="stat-lbl">Served</div></div>
        <div class="stat-cell"><div class="stat-val" style="color:var(--red-l)">${s.lost}</div><div class="stat-lbl">Left</div></div>
        <div class="stat-cell"><div class="stat-val" style="color:var(--teal)">${w.icon||'🌙'}</div><div class="stat-lbl">${w.name||''}</div></div>`;
    }
    // Seed from snapshot on first join; append delta entries on subsequent polls
    if (!this._dialogLog.length && this.stateData.dialog && this.stateData.dialog.length) {
      this._dialogLog = this.stateData.dialog.slice();
    }
    if (this.stateData.dialogDelta && this.stateData.dialogDelta.length) {
      this._dialogLog.push(...this.stateData.dialogDelta);
      if (this._dialogLog.length > 60) this._dialogLog = this._dialogLog.slice(-60);
      this._renderCustomerChat();
    }
    // Secondary served detection: watch for our customer state changing or disappearing
    if (this.myOrderStatus === 'waiting' && this.myOrder && this.myGuestId && this.stateData.customers) {
      const myCustomer = this.stateData.customers.find(c => c.peerId === this.myGuestId);
      if (myCustomer && myCustomer.state === 'wait') {
        this._wasInWaitQueue = true;
      }
      if (myCustomer && myCustomer.state === 'served') {
        // Customer explicitly marked served — fire regardless of _wasInWaitQueue
        this._triggerServed(this.myOrder && this.myOrder.id);
      } else if (this._wasInWaitQueue && !myCustomer) {
        // Was in queue, customer now gone from server list
        this._triggerServed(this.myOrder && this.myOrder.id);
      }
    }
    // Safety: if order has been waiting >45s with no response, unblock so guest can retry
    if (this.myOrderStatus === 'waiting' && this._orderSentAt && Date.now() - this._orderSentAt > 45000) {
      this.myOrder = null; this.myOrderStatus = 'none'; this._orderSentAt = null; this._wasInWaitQueue = false; this._selectedItem = null;
      window._custOrderLock = true;
      setTimeout(() => { window._custOrderLock = false; }, 2000);
      this._renderCustomerOrder();
      toast('No response from kitchen — try ordering again', 'warn');
    }
    if (this.stateData.peers) this._renderCustomerPeers(this.stateData.peers);
    // Always refresh order status box so it stays in sync with myOrder/myOrderStatus
    this._renderCustomerOrder();
  },

  _renderCustomerOrder() {
    const box = document.getElementById('cp-order-status');
    if (!box) return;
    // Active order takes priority
    if (this.myOrder) {
      const configs = {
        waiting: { icon: '⏳', label: 'Order sent — waiting for kitchen…', bg: 'rgba(255,255,255,.06)', border: 'rgba(255,255,255,.12)', color: 'var(--dim)' },
        served:  { icon: '🎉', label: 'Served! いただきます！',            bg: 'rgba(255,200,80,.10)', border: 'rgba(255,200,80,.35)', color: 'var(--gold)' },
      };
      const cfg = configs[this.myOrderStatus] || configs.waiting;
      box.innerHTML = `<div style="background:${cfg.bg};border:1.5px solid ${cfg.border};border-radius:8px;padding:10px 12px;display:flex;align-items:center;gap:10px;margin-bottom:10px">
        <span style="font-size:28px">${this.myOrder.icon}</span>
        <div style="flex:1"><div style="font-weight:700;font-size:14px">${this.myOrder.en}</div>
        <div style="color:${cfg.color};font-size:12px;margin-top:2px">${cfg.icon} ${cfg.label}</div></div>
      </div>`;
      return;
    }
    // Item selected — modal is handled separately; show a small indicator here
    if (this._selectedItem) {
      box.innerHTML = `<div style="background:rgba(80,200,120,.10);border:1.5px solid rgba(80,200,120,.4);border-radius:8px;padding:8px 12px;margin-bottom:8px;display:flex;align-items:center;gap:8px">
        <span style="font-size:22px">${this._selectedItem.icon}</span>
        <div style="flex:1;font-size:13px;font-weight:600;color:rgba(80,220,130,.9)">${this._selectedItem.en} selected</div>
        <button onclick="window.custShowOrderModal()" style="background:rgba(80,200,120,.25);border:1.5px solid rgba(80,200,120,.6);border-radius:7px;color:#7fffb0;font-weight:700;font-size:12px;padding:6px 12px;cursor:pointer;font-family:inherit">Order →</button>
        <button onclick="window.custCancelSelect()" style="background:rgba(255,255,255,.06);border:1.5px solid rgba(255,255,255,.15);border-radius:7px;color:var(--dim);font-size:12px;padding:6px 10px;cursor:pointer;font-family:inherit">✕</button>
      </div>`;
      return;
    }
    box.innerHTML = `<div style="font-size:12px;color:var(--dim);text-align:center;padding:6px 0 10px;letter-spacing:.3px">Tap a menu item to select</div>`;
  },

  _renderCustomerChat() {
    const feed = document.getElementById('dialog-feed');
    if (!feed) return;
    const dialogHtml = (this._dialogLog || []).map(m => {
      const icon = m.speaker === 'master' ? '🧑‍🍳' : m.speaker === 'player' ? '🎙️' : '👤';
      return `<div class="dialog-msg dm-${m.speaker}"><span class="dm-icon">${icon}</span><span class="dm-text">${m.text}</span></div>`;
    }).join('');
    const chatHtml = this._chatLog.map(m => `<div class="dialog-msg"><span class="dm-icon">${m.from === 'You' ? '🎙️' : '🧑'}</span><span class="dm-text"><b>${m.from}:</b> ${m.text}</span></div>`).join('');
    feed.innerHTML = dialogHtml + chatHtml;
    feed.scrollTop = feed.scrollHeight;
  },

  _renderCustomerPeers(players) {
    const el = document.getElementById('cp-peers');
    if (!el) return;
    const list = players || [];
    if (!list.length) { el.innerHTML = '<div style="color:var(--dim);font-size:12px">No other players yet</div>'; return; }
    el.innerHTML = list.map(p => {
      const isSelf = p.guestId === this.myGuestId;
      return `<div style="font-size:12px;display:flex;align-items:center;gap:6px;padding:3px 0${isSelf ? ';color:var(--teal)' : ''}"><span>🧑</span><span>${p.name}${isSelf ? ' <span style="font-size:10px;opacity:.7">(you)</span>' : ''}</span></div>`;
    }).join('');
    const title = el.closest('.card')?.querySelector('.card-title');
    if (title) title.textContent = `🧑 Players (${list.length})`;
  },

  _enqueueSubtitle(text) {
    this._subtitleQueue.push(text);
    if (!this._subtitlePlaying) this._drainSubtitleQueue();
  },

  _drainSubtitleQueue() {
    if (!this._subtitleQueue.length) { this._subtitlePlaying = false; return; }
    this._subtitlePlaying = true;
    const text = this._subtitleQueue.shift();
    if (window._showSubtitle) window._showSubtitle(text);
    const dur = Math.min(12000, 5600 + text.length * 104) + 200;
    setTimeout(() => this._drainSubtitleQueue(), dur);
  },

  _startCookTicker() {
    if (this._cookTickerRaf) cancelAnimationFrame(this._cookTickerRaf);
    let last = performance.now();
    const tick = (now) => {
      if (this.role !== 'customer') return;
      const dt = Math.min(0.1, (now - last) / 1000); last = now;
      const slots = this.stateData?.cookSlots;
      if (slots) {
        slots.forEach((s, i) => {
          if (s && s.state === 'cooking') {
            s.progress = Math.min(1, (s.progress || 0) + dt / 30);
            const fill = document.querySelector(`#cook-area .cook-slot:nth-child(${i+1}) .prog-fill`);
            if (fill) fill.style.width = Math.round(s.progress * 100) + '%';
          }
        });
      }
      this._cookTickerRaf = requestAnimationFrame(tick);
    };
    this._cookTickerRaf = requestAnimationFrame(tick);
  },

  _startPatTicker() {
    clearInterval(this._patTimer);
    this._patTimer = setInterval(() => {
      if (!this.stateData || !this.stateData.customers) return;
      let changed = false;
      for (const c of this.stateData.customers) {
        if (c.state === 'wait' && c.patLeft > 0) { c.patLeft = Math.max(0, c.patLeft - 1); changed = true; }
      }
      if (!changed) return;
      const custBox = document.getElementById('customer-list');
      if (!custBox) return;
      const waiting = this.stateData.customers.filter(c => c.state === 'wait' && c.order);
      custBox.querySelectorAll('.cust-card').forEach((card, i) => {
        const c = waiting[i]; if (!c) return;
        const pct = (c.patLeft / c.patMax) * 100;
        const col = pct > 55 ? '#27ae60' : pct > 28 ? '#f39c12' : '#e74c3c';
        const fill = card.querySelector('.pat-fill'); if (fill) { fill.style.width = pct + '%'; fill.style.background = col; }
        const tim = card.querySelector('.pat-time'); if (tim) tim.textContent = Math.ceil(c.patLeft) + 's';
        card.classList.toggle('urgent', pct < 25);
      });
    }, 1000);
  },

  destroy() {
    try { if (window.stopStreetLoop) window.stopStreetLoop(); } catch(_) {}
    try { if (window._vcTeardownAll) window._vcTeardownAll(); } catch(_) {}
    clearInterval(this._pollTimer);
    clearInterval(this._broadcastTimer);
    clearInterval(this._patTimer);
    if (this._cookTickerRaf) cancelAnimationFrame(this._cookTickerRaf);
    this._pollTimer = null; this._broadcastTimer = null; this._patTimer = null; this._cookTickerRaf = null;
    if (this.role === 'master') this._post(this.roomCode, { type: 'close' }).catch(() => {});
    else if (this.role === 'customer' && this.myGuestId) this._post(this.roomCode, { type: 'leave', guestId: this.myGuestId }).catch(() => {});
    try { if (window._unfreezeSpawning) window._unfreezeSpawning(); } catch(_) {}
    if (G.screen !== 'service') window.stallOpen = false;
    this.role = null; this.roomCode = ''; this.myGuestId = null; this.peers = {};
    this.peer = null; this.masterConn = null; this._lastOrderTs = {}; this._seenOrderIds = {}; this._selectedItem = null; this._confirmLock = false;
    this.stateData = null;
  },
};

// ── PACHINKO MINIGAME ── entirely local: no server sync, no effect on other players in
// the room — money changes hit this player's own G.money/save, same as normal stall
// earnings. Real ball-drop physics: gravity, a staggered pin field, and genuine
// circle-circle collision resolve which pocket the ball lands in — the outcome isn't
// picked in advance, it falls out of the simulation.
(function() {
  'use strict';
  const BET = 100;
  // Pockets sized by relative weight, not equal width — like a real machine's start
  // chucker, the jackpot gate is a small physical target flanked by wide "out" lanes.
  // Weights tuned against a 20,000-drop simulation of this exact physics (see
  // scratchpad/pachinko_rebalance.js) to land on ~2% jackpot rate and ~84% RTP — the
  // naive first pass (equal-ish weights) let the ball's natural center-bunching produce
  // a 7% jackpot rate and a 260% RTP, which would pay players more than they bet on average.
  const POCKETS = [
    { mult: 0,   label: 'MISS',    w: 30 },
    { mult: 0.5, label: '0.5x',    w: 14 },
    { mult: 1.5, label: '1.5x',    w: 4.5 },
    { mult: 4,   label: '4x',      w: 1.5 },
    { mult: 20,  label: 'JACKPOT', tag: '★', w: 2 },
    { mult: 4,   label: '4x',      w: 1.5 },
    { mult: 1.5, label: '1.5x',    w: 4.5 },
    { mult: 0.5, label: '0.5x',    w: 14 },
    { mult: 0,   label: 'MISS',    w: 30 },
  ];
  const TOTAL_W = POCKETS.reduce((a, p) => a + p.w, 0);

  const BALL_R = 6, PIN_R = 4, GRAVITY = 0.32, RESTITUTION = 0.42, WALL_RESTITUTION = 0.7;
  const POCKET_H = 34, MAX_FRAMES = 900, STUCK_LIMIT = 90;
  const TRAIL_LEN = 6;

  // ── PixiJS rendering — retained-mode scene graph instead of clear+redraw-everything
  // Canvas2D each frame. Static visuals (board, pins, pockets, tulip) are built once per
  // resize; the physics loop below only ever moves the ball/trail sprites' x/y, and
  // Pixi's own ticker composites the changed scene each frame.
  let canvasEl = null, app = null, cw = 0, ch = 0, pins = [];
  let pinTexture = null, ballTexture = null;
  let boardLayer = null, pinLayer = null, ballSprite = null, trailSprites = [];
  let ball = null, playing = false, rafId = null, frameCount = 0;
  let lastProgressY = 0, stuckFrames = 0;

  function _radialTexture(size, stops) {
    const c = document.createElement('canvas');
    c.width = size; c.height = size;
    const g2 = c.getContext('2d');
    const grad = g2.createRadialGradient(size * 0.38, size * 0.38, size * 0.05, size * 0.5, size * 0.5, size * 0.5);
    stops.forEach(([off, col]) => grad.addColorStop(off, col));
    g2.fillStyle = grad;
    g2.beginPath(); g2.arc(size / 2, size / 2, size / 2, 0, Math.PI * 2); g2.fill();
    return PIXI.Texture.from(c);
  }

  function buildPins() {
    pins = [];
    const rows = 9;
    const topMargin = 40;
    const rowGap = (ch - POCKET_H - topMargin - 16) / rows;
    const colGap = 28;
    for (let r = 0; r < rows; r++) {
      const y = topMargin + r * rowGap;
      const offset = (r % 2 === 0) ? 0 : colGap / 2;
      const cols = Math.floor((cw - 20) / colGap);
      for (let c = 0; c <= cols; c++) {
        // A tiny random offset per pin breaks the grid's perfect symmetry — without it
        // a ball landing dead-center on a pin has nothing to deflect it sideways and can
        // bounce vertically on the same pin indefinitely instead of falling past it.
        const x = 10 + offset + c * colGap + (Math.random() - 0.5) * 3;
        if (x > 12 && x < cw - 12) pins.push({ x, y: y + (Math.random() - 0.5) * 3 });
      }
    }
  }

  function pocketBounds() {
    let x = 0;
    return POCKETS.map(p => {
      const width = (p.w / TOTAL_W) * cw;
      const b = { x0: x, x1: x + width, mult: p.mult, label: p.label, tag: p.tag };
      x += width;
      return b;
    });
  }

  function initPixi() {
    if (app) return;
    ballTexture = _radialTexture(32, [[0, '#ffffff'], [0.5, '#ffcf5c'], [1, '#d98c00']]);
    pinTexture = _radialTexture(24, [[0, '#ffffff'], [0.4, '#d8dbe2'], [1, '#7a7e88']]);
    app = new PIXI.Application({ view: canvasEl, backgroundAlpha: 1, antialias: true, resolution: 1 });
    boardLayer = new PIXI.Container();
    pinLayer = new PIXI.Container();
    app.stage.addChild(boardLayer, pinLayer);
    ballSprite = new PIXI.Sprite(ballTexture);
    ballSprite.anchor.set(0.5);
    ballSprite.width = ballSprite.height = BALL_R * 2;
    ballSprite.visible = false;
    for (let i = 0; i < TRAIL_LEN; i++) {
      const t = new PIXI.Sprite(ballTexture);
      t.anchor.set(0.5);
      t.width = t.height = BALL_R * 1.4;
      t.alpha = 0; t.tint = 0xffcf5c;
      pinLayer.addChild(t);
      trailSprites.push(t);
    }
    pinLayer.addChild(ballSprite);
  }

  // Rebuilds every static visual (board bg, guide rings, tulip, pockets, pins) — cheap
  // enough to redo whenever the modal opens or the stage resizes, since it only runs
  // once per resize, never per physics frame.
  function rebuildBoard() {
    const rect = canvasEl.parentElement.getBoundingClientRect();
    cw = Math.max(1, Math.round(rect.width));
    ch = Math.max(1, Math.round(rect.height));
    app.renderer.resize(cw, ch);
    buildPins();

    boardLayer.removeChildren();
    const g = new PIXI.Graphics();
    // Deep green felt board, approximated vignette via layered translucent rects
    g.beginFill(0x0a1c12).drawRect(0, 0, cw, ch).endFill();
    g.beginFill(0x0f2418, 0.5).drawRect(0, 0, cw, ch * 0.7).endFill();
    // Faint concentric guide rings, like the etched lanes on a real board
    g.lineStyle(1, 0xffffff, 0.035);
    for (let ring = 1; ring <= 3; ring++) g.drawCircle(cw / 2, ch * 0.42, ring * 46);
    g.lineStyle(0);
    boardLayer.addChild(g);

    const bounds = pocketBounds();

    // Decorative "start chucker" tulip marker above the jackpot pocket
    const jackpotB = bounds.find(b => b.mult === 20);
    if (jackpotB) {
      const jx = (jackpotB.x0 + jackpotB.x1) / 2, jy = ch - POCKET_H - 26;
      const glow = new PIXI.Graphics();
      for (let i = 4; i >= 1; i--) glow.beginFill(0xffd25a, 0.12).drawCircle(jx, jy, i * 5.5).endFill();
      boardLayer.addChild(glow);
      const tulip = new PIXI.Graphics();
      tulip.lineStyle(1.5, 0xffd35c, 1);
      tulip.beginFill(0x3a2c10);
      for (let i = 0; i < 6; i++) {
        const a = (i / 6) * Math.PI * 2 - Math.PI / 2;
        const r = i % 2 === 0 ? 9 : 5;
        const px = jx + Math.cos(a) * r, py = jy + Math.sin(a) * r;
        i === 0 ? tulip.moveTo(px, py) : tulip.lineTo(px, py);
      }
      tulip.closePath(); tulip.endFill();
      boardLayer.addChild(tulip);
    }

    // Pockets — chrome dividers instead of thin lines, gold glow under the jackpot
    const pk = new PIXI.Graphics();
    bounds.forEach(b => {
      const isJackpot = b.mult === 20;
      pk.beginFill(isJackpot ? 0xffc83c : (b.mult === 0 ? 0x000000 : 0xffffff), isJackpot ? 0.30 : (b.mult === 0 ? 0.25 : 0.05));
      pk.drawRect(b.x0, ch - POCKET_H, b.x1 - b.x0, POCKET_H);
      pk.endFill();
      pk.beginFill(0xe6e6f0, 0.9);
      pk.drawRect(b.x0 - 1, ch - POCKET_H, 2, POCKET_H);
      pk.endFill();
      const label = new PIXI.Text(b.tag || b.label, {
        fontFamily: 'sans-serif', fontSize: isJackpot ? 10 : 9, fontWeight: isJackpot ? 'bold' : 'normal',
        fill: isJackpot ? 0xffe9a8 : 0xffffff, align: 'center',
      });
      label.alpha = isJackpot ? 1 : 0.7;
      label.anchor.set(0.5);
      label.position.set((b.x0 + b.x1) / 2, ch - POCKET_H / 2);
      boardLayer.addChild(label);
    });
    boardLayer.addChild(pk);

    // Pins — sprites sharing one metallic texture, positioned once (no per-frame redraw)
    pinLayer.removeChildren();
    pins.forEach(p => {
      const shadow = new PIXI.Graphics();
      shadow.beginFill(0x000000, 0.35).drawCircle(p.x + 0.6, p.y + 0.8, PIN_R).endFill();
      pinLayer.addChild(shadow);
      const s = new PIXI.Sprite(pinTexture);
      s.anchor.set(0.5);
      s.width = s.height = PIN_R * 2;
      s.position.set(p.x, p.y);
      pinLayer.addChild(s);
    });
    trailSprites.forEach(t => pinLayer.addChild(t));
    pinLayer.addChild(ballSprite);

    // Glass sheen — a faint diagonal highlight sweep, like light off the cover glass
    const sheen = new PIXI.Graphics();
    sheen.beginFill(0xffffff, 0.05);
    sheen.moveTo(0, 0).lineTo(cw * 0.22, 0).lineTo(0, ch * 0.3).closePath();
    sheen.endFill();
    sheen.beginFill(0xffffff, 0.04);
    sheen.moveTo(cw * 0.5, ch).lineTo(cw, ch * 0.35).lineTo(cw, ch * 0.55).lineTo(cw * 0.68, ch).closePath();
    sheen.endFill();
    app.stage.addChild(sheen);
  }

  // Updates only what actually moves each physics tick — the ball sprite and its trail.
  function updateBallVisual(trail) {
    if (!ball) { ballSprite.visible = false; return; }
    ballSprite.visible = true;
    ballSprite.position.set(ball.x, ball.y);
    for (let i = 0; i < trailSprites.length; i++) {
      const t = trail[i];
      if (t) { trailSprites[i].visible = true; trailSprites[i].position.set(t.x, t.y); trailSprites[i].alpha = (i / trail.length) * 0.3; }
      else trailSprites[i].visible = false;
    }
  }

  // Two half-gravity substeps per frame for collision stability at this ball speed/pin
  // spacing — a single full step could tunnel through a pin at higher fall speeds.
  function stepPhysics() {
    for (let sub = 0; sub < 2; sub++) {
      ball.vy += GRAVITY * 0.5;
      ball.vy = Math.max(-8, Math.min(8, ball.vy));
      ball.vx = Math.max(-6, Math.min(6, ball.vx));
      ball.x += ball.vx * 0.5;
      ball.y += ball.vy * 0.5;
      if (ball.x - BALL_R < 0) { ball.x = BALL_R; ball.vx = Math.abs(ball.vx) * WALL_RESTITUTION; }
      if (ball.x + BALL_R > cw) { ball.x = cw - BALL_R; ball.vx = -Math.abs(ball.vx) * WALL_RESTITUTION; }
      for (const p of pins) {
        const dx = ball.x - p.x, dy = ball.y - p.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        const minDist = BALL_R + PIN_R;
        if (dist < minDist && dist > 0.001) {
          const nx = dx / dist, ny = dy / dist;
          ball.x += nx * (minDist - dist);
          ball.y += ny * (minDist - dist);
          const dot = ball.vx * nx + ball.vy * ny;
          ball.vx -= (1 + RESTITUTION) * dot * nx;
          ball.vy -= (1 + RESTITUTION) * dot * ny;
          // Real pin contacts aren't perfectly specular — a firm sideways kick keeps
          // every drop genuinely unpredictable and stops a near-dead-center hit from
          // just bouncing straight up and down on the same pin forever.
          ball.vx += (Math.random() - 0.5) * 2.4;
        }
      }
    }
    frameCount++;
    // Belt-and-suspenders: if the ball hasn't made downward progress in a while (e.g.
    // trapped bouncing between two pins), give it a firm shove rather than let it hang.
    if (ball.y > lastProgressY + 2) { lastProgressY = ball.y; stuckFrames = 0; }
    else if (++stuckFrames > STUCK_LIMIT) {
      ball.vy += 2.5; ball.vx += (Math.random() - 0.5) * 5;
      stuckFrames = 0;
    }
    return (ball.y + BALL_R >= ch - POCKET_H) || frameCount > MAX_FRAMES;
  }

  function settledPocket() {
    const bounds = pocketBounds();
    return bounds.find(b => ball.x >= b.x0 && ball.x < b.x1) || bounds[bounds.length - 1];
  }

  let ballTrail = [];
  function loop() {
    const landed = stepPhysics();
    ballTrail.unshift({ x: ball.x, y: ball.y });
    if (ballTrail.length > TRAIL_LEN) ballTrail.length = TRAIL_LEN;
    updateBallVisual(ballTrail);
    if (landed) {
      ball.vx = 0; ball.vy = 0; ball.y = ch - POCKET_H + BALL_R - 2;
      updateBallVisual(ballTrail);
      setTimeout(() => finishPlay(settledPocket()), 500);
      return;
    }
    rafId = requestAnimationFrame(loop);
  }

  function updateMoneyDisplays() {
    const hud = document.getElementById('hud-money');
    if (hud) hud.textContent = '¥' + Number(G.money).toLocaleString();
    const pk = document.getElementById('pk-money');
    if (pk) pk.textContent = '¥' + Math.max(0, Math.round(G.money)).toLocaleString();
  }

  function finishPlay(pocket) {
    const payout = Math.round(BET * pocket.mult);
    G.money += payout;
    updateMoneyDisplays();
    savePlayerState();
    const resultEl = document.getElementById('pk-result');
    if (resultEl) {
      if (payout > BET) {
        resultEl.textContent = `${pocket.label}! +¥${payout}`;
        resultEl.className = 'pk-result pk-win';
        toast(`🎰 ${pocket.label}! +¥${payout}`, 'info');
      } else if (payout > 0) {
        resultEl.textContent = `${pocket.label} — ¥${payout} back`;
        resultEl.className = 'pk-result';
      } else {
        resultEl.textContent = 'Miss — try again?';
        resultEl.className = 'pk-result pk-lose';
      }
    }
    playing = false;
    ball = null;
    const btn = document.getElementById('pk-play-btn');
    if (btn) { btn.disabled = false; btn.textContent = `Play — ¥${BET}`; }
    updateBallVisual(ballTrail);
  }

  window._openPachinkoModal = function(machine) {
    const modal = document.getElementById('pachinko-modal');
    if (!modal) return;
    const nameEl = document.getElementById('pk-machine-name');
    if (nameEl) nameEl.textContent = '🎰 ' + ((machine && machine.name) || 'Machine');
    const resultEl = document.getElementById('pk-result');
    if (resultEl) { resultEl.textContent = ''; resultEl.className = 'pk-result'; }
    if (rafId) cancelAnimationFrame(rafId);
    ball = null;
    ballTrail = [];
    playing = false;
    modal.classList.add('visible');
    if (!canvasEl) canvasEl = document.getElementById('pk-canvas');
    initPixi();
    rebuildBoard();
    updateBallVisual(ballTrail);
    updateMoneyDisplays();
    const btn = document.getElementById('pk-play-btn');
    if (btn) { btn.disabled = false; btn.textContent = `Play — ¥${BET}`; }
  };

  window._closePachinkoModal = function() {
    const modal = document.getElementById('pachinko-modal');
    if (modal) modal.classList.remove('visible');
    if (rafId) cancelAnimationFrame(rafId);
    playing = false;
  };

  window._pachinkoPlay = function() {
    if (playing) return;
    if (G.money < BET) { toast('Not enough ¥!', 'err'); return; }
    playing = true;
    const btn = document.getElementById('pk-play-btn');
    if (btn) btn.disabled = true;
    const resultEl = document.getElementById('pk-result');
    if (resultEl) { resultEl.textContent = ''; resultEl.className = 'pk-result'; }
    G.money -= BET;
    updateMoneyDisplays();
    // Launch point varies each play — with a symmetric pin field a fixed center drop
    // would statistically favor the middle far too strongly (binomial bunching).
    const launchX = cw * (0.3 + Math.random() * 0.4);
    ball = { x: launchX, y: 14, vx: (Math.random() - 0.5) * 1.5, vy: 0 };
    frameCount = 0; lastProgressY = ball.y; stuckFrames = 0; ballTrail = [];
    loop();
  };
})();

// ── PIXI CHARACTER RIG (in-progress incremental port) ──────────────────────
// drawCustomer() (~1370 lines of procedural Canvas2D) is being ported to native
// PIXI.Graphics one case at a time rather than all at once — too large/risky to
// safely rewrite in a single pass. NOT wired into the live game loop yet; this
// module is self-contained and only reachable via window._previewPixiCustomer()
// for visual verification until each piece is confirmed correct.
//
// Milestone 1 (current): walking rig, default case only — tee shirt, non-female,
// no special flags (missing hand / police / sumo / geisha / hostess), buzz/medium/
// thin hairstyle, neutral mouth. Everything else still falls through to the
// original drawCustomer via _pixiCanHandle()'s false cases.
//
// Known simplification: PixiJS 7's Graphics has no native gradient fill (that's a
// v8 feature). Subtle shading gradients (head highlight, jacket shading) are
// approximated as a flat semi-transparent overlay on the shadow side rather than
// a true gradient — a deliberate, flagged tradeoff, not an oversight.
(function() {
  'use strict';

  function hex(cssColor, fallback) {
    if (typeof cssColor === 'string' && cssColor[0] === '#') {
      let h = cssColor.slice(1);
      if (h.length === 3) h = h.split('').map(c => c + c).join('');
      const n = parseInt(h, 16);
      if (!isNaN(n)) return n;
    }
    return fallback === undefined ? 0xffffff : fallback;
  }

  // Vanilla PIXI.Graphics has no rotated-ellipse primitive — approximate with a
  // polygon of points around a unit circle, scaled and rotated.
  function ellipsePoints(cx, cy, rx, ry, rot, segments) {
    segments = segments || 20;
    const pts = [];
    const cos = Math.cos(rot || 0), sin = Math.sin(rot || 0);
    for (let i = 0; i <= segments; i++) {
      const a = (i / segments) * Math.PI * 2;
      const ex = Math.cos(a) * rx, ey = Math.sin(a) * ry;
      pts.push(cx + ex * cos - ey * sin, cy + ex * sin + ey * cos);
    }
    return pts;
  }
  function fillEllipse(g, cx, cy, rx, ry, rot, color, alpha) {
    g.lineStyle({ width: 0 }); g.beginFill(color, alpha === undefined ? 1 : alpha);
    g.drawPolygon(ellipsePoints(cx, cy, rx, ry, rot));
    g.endFill();
  }
  function strokeSeg(g, width, color, cap, alpha) {
    g.lineStyle({ width, color, alpha: alpha === undefined ? 1 : alpha, cap: cap ? PIXI.LINE_CAP.ROUND : PIXI.LINE_CAP.BUTT, join: PIXI.LINE_JOIN.ROUND });
  }

  // fall back to the original Canvas2D drawCustomer() in that case.
  window._pixiCanHandle = function(cu) {
    // Full walking rig (Milestones 1-3) and full seated/back-view rig (Milestone 5)
    // are both covered now: all clothing types, female variant, missing-hand stump,
    // drunk tint, frown/talk mouth, geisha/hostess makeup, all hairstyles, police
    // cap, sumo chonmage, head-turn illusion, death/puke/fall/drunk-sway. Food/
    // chopsticks/vomit particles stay on Canvas2D (window._drawSeatedExtras),
    // composited by the caller — see _pixiRenderCustomerLayer.
    return cu.state === 'walk_in' || cu.state === 'walk_out' || cu.state === 'sit' || cu.state === 'sit_in';
  };

  // Draws the walking rig (walk_in/walk_out) into a single flat Graphics — no
  // sub-transforms needed since nothing in this rig squishes/rotates independently
  // of the whole figure.
  function _drawWalkingRigPixi(g, cu, T, geo) {
    // `geo` is the scene's live W/H/stallBot geometry (the yatai-scene IIFE's own
    // local G, distinct from the global game-state G) — the real render loop passes
    // it explicitly; the debug preview harness falls back to the global G it pokes.
    const { W, H, stallBot } = geo || G;
    const { state, x, ct, phase } = cu;
    g.clear();
    g.position.set(x, 0);
    g.scale.set(state === 'walk_out' ? -1 : 1, 1);

    const bH = H * 0.22;
    const hr = W * 0.024;
    const gndY = stallBot - H * 0.003;

    const waistY = gndY - bH * 0.44;
    const headCy = gndY - bH + hr;
    const _drunkAmt = Math.max(0, (cu.alcoholCount || 0) - 7);

    // Ground shadow
    fillEllipse(g, 0, gndY, W * 0.032, H * 0.008, 0, 0x000000, 0.20);

    // ── BACK LEG ──
    const bkKneeX = Math.sin(strideB * 0.30) * bH * 0.24;
    const bkKneeY = waistY + bH * 0.24;
    const bkFootX = bkKneeX + Math.sin(strideB * 0.30 - stride * 0.20) * bH * 0.24;
    const pantsHex = hex(ct.pants);

    g.moveTo(W * 0.004, waistY).lineTo(bkKneeX, bkKneeY);
    strokeSeg(g, W * 0.015, pantsHex, true);
    g.moveTo(bkKneeX, bkKneeY).lineTo(bkFootX, gndY);

      g.moveTo(-W * 0.018, shldrY).lineTo(-W * 0.028, _kimonoBot).lineTo(W * 0.026, _kimonoBot).lineTo(W * 0.019, shldrY).closePath();
    } else {

    }

    } else {

    if (ct.type === 'suit') {

        g.moveTo(-W * 0.002, shldrY + H * 0.023).lineTo(W * 0.006, shldrY + H * 0.023).lineTo(W * 0.004, waistY - H * 0.022)

      if (ct.politician) {

        g.lineStyle({ width: 0 }); g.beginFill(rosetteHex); g.drawCircle(_rx, _ry, _rr * 0.20); g.endFill();
      }
    } else if (ct.type === 'hoodie') {
      fillEllipse(g, W * 0.004, shldrY - H * 0.008, W * 0.018, H * 0.020, 0.12, jacketHex, 1);
      strokeSeg(g, 1, jacketDHex, false);
      g.arc(W * 0.004, shldrY - H * 0.005, W * 0.012, Math.PI * 1.2, Math.PI * 2.1);

      const _bkLX = Math.sin(strideB * 0.22) * bH * 0.10;

      const skinHexLeg = hex(ct.skin);
      strokeSeg(g, W * 0.011, skinHexLeg, true);
      g.moveTo(_bkLX + W * 0.002, skirtBot).lineTo(_bkLX + W * 0.006, gndY - H * 0.002);

      g.moveTo(_frLX - W * 0.002, skirtBot).lineTo(_frLX + W * 0.006, gndY - H * 0.002);
      const shoeHex = ct.hostess ? 0xc01068 : 0x181212;
      fillEllipse(g, _bkLX + W * 0.008, gndY, W * 0.012, H * 0.004, 0.10, shoeHex, 1);
      fillEllipse(g, _frLX + W * 0.010, gndY, W * 0.014, H * 0.004, 0.10, shoeHex, 1);
      if (ct.hostess) {
        fillEllipse(g, _frLX + W * 0.013, gndY - H * 0.006, W * 0.005, H * 0.008, -0.3, 0xb00858, 1);
        g.lineStyle({ width: 0 }); g.beginFill(0xb00858); g.drawRect(_frLX + W * 0.016, gndY - H * 0.014, W * 0.003, H * 0.014); g.endFill();
        const _sSeeds = [0.12, 0.37, 0.58, 0.81, 0.24, 0.69, 0.45, 0.92, 0.05, 0.76];
        _sSeeds.forEach((s, idx) => {
          const _sx = (s - 0.5) * W * 0.05;
          const _sy = waistY + (skirtBot - waistY) * ((idx % 5) * 0.20 + 0.10);
          const _sa = 0.5 + 0.5 * Math.sin(T * 3.8 + phase + idx * 1.2);
          fillEllipse(g, _sx, _sy, W * 0.006, W * 0.006, 0, 0xfff0c8, _sa * 0.70);

        });

    } else {
      // Geta sandal peeking from kimono hem
      const _gtX = Math.sin(stride * 0.25) * W * 0.006;
      fillEllipse(g, _gtX, gndY, W * 0.014, H * 0.004, 0.05, 0x3a2810, 1);

    }

    // ── ARMS ──
    const bkArmA = strideB * 0.38;
    const bkElbX = Math.sin(bkArmA) * bH * 0.20 + W * 0.008;
    const bkElbY = shldrY + bH * 0.20;

    strokeSeg(g, W * 0.013, armCol, true);
    g.moveTo(W * 0.012, shldrY + H * 0.006).lineTo(bkElbX, bkElbY);

    g.moveTo(bkElbX, bkElbY).lineTo(bkElbX + Math.sin(bkArmA * 0.5) * bH * 0.18, Math.min(bkElbY + bH * 0.18, waistY + H * 0.02));

    const frArmA = stride * 0.38;

    if (!ct.missingRightHand) {
      strokeSeg(g, W * 0.013, armCol, true);
      g.moveTo(frElbX, frElbY).lineTo(frElbX + Math.sin(frArmA * 0.5) * bH * 0.18 - W * 0.004, Math.min(frElbY + bH * 0.18, waistY + H * 0.02));
    } else {

      // hand always renders on whichever arm is "front." Bandaged stump instead
      // of a forearm.
      strokeSeg(g, W * 0.020, 0xe8e0d0, true);
      g.moveTo(frElbX, frElbY).lineTo(frElbX + Math.sin(frArmA * 0.5) * bH * 0.03, frElbY + bH * 0.03);
