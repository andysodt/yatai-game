    // ── NECK ──
    g.lineStyle({ width: 0 }); g.beginFill(hex(ct.skin));
    g.drawRect(-W * 0.010, shldrY - H * 0.018, W * 0.018, H * 0.026);
    g.endFill();

    // ── HEAD (profile facing left) ──
    const skinHex = hex(ct.skin), skinDHex = hex(ct.skinD);
    fillEllipse(g, 0, headCy, hr, hr, 0, skinHex, 1);
    fillEllipse(g, hr * 0.62, headCy + hr * 0.08, hr * 0.14, hr * 0.22, 0.12, skinHex, 1);
    strokeSeg(g, 0.8, skinDHex, false);
    g.arc(hr * 0.62, headCy + hr * 0.10, hr * 0.08, -Math.PI * 0.6, Math.PI * 0.3);
    g.lineStyle({ width: 0 }); g.beginFill(skinHex);
    g.moveTo(-hr * 0.32, headCy - hr * 0.78)
      .quadraticCurveTo(-hr * 0.92, headCy - hr * 0.44, -hr * 0.98, headCy - hr * 0.06)
      .quadraticCurveTo(-hr * 1.08, headCy + hr * 0.12, -hr * 1.18, headCy + hr * 0.22)
      .quadraticCurveTo(-hr * 1.10, headCy + hr * 0.34, -hr * 0.96, headCy + hr * 0.40)
      .quadraticCurveTo(-hr * 0.98, headCy + hr * 0.50, -hr * 0.94, headCy + hr * 0.55)
      .quadraticCurveTo(-hr * 0.86, headCy + hr * 0.72, -hr * 0.58, headCy + hr * 0.82)
      .lineTo(-hr * 0.08, headCy + hr * 0.92).closePath();
    g.endFill();
    // Head shading approximation (flat overlay on the shadow side, no gradient)
    g.lineStyle({ width: 0 }); g.beginFill(0x000000, 0.10);
    g.drawPolygon(ellipsePoints(-hr * 0.15, headCy + hr * 0.1, hr * 0.85, hr * 0.95, 0));
    g.endFill();
    // Nostril — tints red as drunkenness rises
    const nostrilHex = _drunkAmt > 0 ? 0xc85050 : skinDHex;
    const nostrilAlpha = _drunkAmt > 0 ? Math.min(0.80, 0.45 + _drunkAmt * 0.15) : 1;
    fillEllipse(g, -hr * 1.12, headCy + hr * 0.28, hr * 0.04, hr * 0.03, -0.4, nostrilHex, nostrilAlpha);
    // Eye white / iris / pupil / catchlight
    fillEllipse(g, -hr * 0.73, headCy - hr * 0.09, hr * 0.13, hr * 0.09, 0, 0xf5ede8, 1);
    const irisHex = (ct.hair === '#949494' || ct.hair === '#a09898') ? 0x4a5868 : 0x28180e;
    g.lineStyle({ width: 0 }); g.beginFill(irisHex); g.drawCircle(-hr * 0.73, headCy - hr * 0.09, hr * 0.07); g.endFill();
    g.lineStyle({ width: 0 }); g.beginFill(0x080408); g.drawCircle(-hr * 0.73, headCy - hr * 0.09, hr * 0.04); g.endFill();
    g.lineStyle({ width: 0 }); g.beginFill(0xffffff, 0.65); g.drawCircle(-hr * 0.71, headCy - hr * 0.12, hr * 0.016); g.endFill();
    // Upper eyelid arch
    strokeSeg(g, 0.9, skinDHex, true);
    g.moveTo(-hr * 0.87, headCy - hr * 0.09).quadraticCurveTo(-hr * 0.73, headCy - hr * 0.20, -hr * 0.59, headCy - hr * 0.09);
    const hairHex = hex(ct.hair, 0x0c0808);
    if (ct.female) {
      strokeSeg(g, hr * 0.07, hairHex, true);
      [[-hr * 0.84, 0], [-hr * 0.76, hr * 0.05], [-hr * 0.68, hr * 0.08], [-hr * 0.61, hr * 0.04]].forEach(([lx, oy]) => {
        g.moveTo(lx, headCy - hr * 0.17 + oy).lineTo(lx - hr * 0.025, headCy - hr * 0.26 + oy);
      });
    }
    // Eyebrow
    strokeSeg(g, W * 0.0035, hairHex, true);
    g.moveTo(-hr * 0.90, headCy - hr * 0.26).lineTo(-hr * 0.56, headCy - hr * 0.29);
    // Mouth — smile when happy, frown when leaving unhappy, wobbles while talking
    const frown = cu.unhappy && state === 'walk_out';
    const _tkFw = (T < (cu.talkUntil || 0)) ? Math.abs(Math.sin(T * 19 + cu.phase * 5)) * hr * 0.10 : 0;
    strokeSeg(g, hr * 0.13, skinDHex, true);
    if (frown) {
      g.moveTo(-hr * 0.96, headCy + hr * 0.56).quadraticCurveTo(-hr * 0.80, headCy + hr * 0.50, -hr * 0.64, headCy + hr * 0.55);
    } else {
      g.moveTo(-hr * 0.96, headCy + hr * 0.52).quadraticCurveTo(-hr * 0.80, headCy + hr * 0.59 + _tkFw, -hr * 0.64, headCy + hr * 0.52);
    }
    if (_tkFw > 0.01 && !frown) {
      g.lineStyle({ width: 0 }); g.beginFill(0x280a05, 0.50);
      g.moveTo(-hr * 0.92, headCy + hr * 0.54).quadraticCurveTo(-hr * 0.78, headCy + hr * 0.58 + _tkFw, -hr * 0.66, headCy + hr * 0.54).closePath();
      g.endFill();
    }
    // Lower lip shadow
    strokeSeg(g, hr * 0.08, 0x000000, false, 0.18);
    g.moveTo(-hr * 0.90, headCy + hr * 0.63).quadraticCurveTo(-hr * 0.78, headCy + hr * 0.68 + _tkFw * 0.5, -hr * 0.66, headCy + hr * 0.64);
    if (ct.geisha) {
      // Red lips

      g.moveTo(-hr * 0.93, headCy + hr * 0.53).quadraticCurveTo(-hr * 0.79, headCy + hr * 0.60 + _tkFw, -hr * 0.66, headCy + hr * 0.53);
      // Kanzashi pin in hair
      strokeSeg(g, hr * 0.05, 0xd4a020, false);
      g.moveTo(-hr * 0.12, headCy - hr * 0.80).lineTo(-hr * 0.08, headCy - hr * 1.30);
      fillEllipse(g, -hr * 0.08, headCy - hr * 1.32, hr * 0.07, hr * 0.07, 0, 0xe8b830, 1);
      fillEllipse(g, -hr * 0.08, headCy - hr * 1.32, hr * 0.04, hr * 0.04, 0, 0xff4060, 1);
    }
    if (ct.hostess) {
      // Glossy pink lips
      strokeSeg(g, hr * 0.17, 0xe00858, true);
      g.moveTo(-hr * 0.93, headCy + hr * 0.53).quadraticCurveTo(-hr * 0.79, headCy + hr * 0.61 + _tkFw, -hr * 0.66, headCy + hr * 0.53);
      // Lip gloss highlight

      // Eye shadow (smoky)

      // Eyelash curl

    // ── HAIR (profile) ──
    if (ct.hairStyle === 'long') {
      // Flows from crown down past shoulder to waist
      g.lineStyle({ width: 0 }); g.beginFill(hairHex);
      g.moveTo(-hr * 0.28, headCy - hr * 0.80)
        .quadraticCurveTo(hr * 0.08, headCy - hr * 1.10, hr * 0.92, headCy - hr * 0.90)
        .quadraticCurveTo(hr * 1.04, headCy - hr * 0.55, hr * 1.02, headCy + hr * 0.60)
        .bezierCurveTo(hr * 1.00, waistY - bH * 0.10, hr * 0.80, waistY + bH * 0.02, hr * 0.60, waistY + bH * 0.08)
        .lineTo(hr * 0.28, waistY + bH * 0.08)
        .bezierCurveTo(hr * 0.50, waistY - bH * 0.05, hr * 0.68, headCy + hr * 0.72, hr * 0.62, headCy + hr * 0.22)
        .lineTo(hr * 0.50, headCy - hr * 0.80)
        .closePath();
      g.endFill();
      // Subtle strand highlight
      strokeSeg(g, hr * 0.06, 0xffffff, true, 0.08);
      g.moveTo(hr * 0.80, headCy - hr * 0.50)
        .bezierCurveTo(hr * 0.92, headCy + hr * 0.40, hr * 0.76, waistY - bH * 0.12, hr * 0.52, waistY + bH * 0.02);
    } else if (ct.hairStyle === 'ponytail') {
      // Short cap on top + long tied tail down the back
      const topRx = hr * 0.92;
      g.lineStyle({ width: 0 }); g.beginFill(hairHex);
      g.moveTo(-hr * 0.28, headCy - hr * 0.78)
        .quadraticCurveTo(hr * 0.08, headCy - hr * 1.08, topRx, headCy - hr * 0.88)
        .quadraticCurveTo(hr * 1.04, headCy - hr * 0.55, topRx, headCy + hr * 0.28)
        .lineTo(topRx * 0.55, headCy + hr * 0.28)
        .quadraticCurveTo(topRx * 0.88, headCy - hr * 0.42, hr * 0.44, headCy - hr * 0.76)
        .closePath();
      g.endFill();
      // Tie band
      fillEllipse(g, hr * 0.72, headCy + hr * 0.32, hr * 0.11, hr * 0.07, 0.3, hex(ct.jacketD), 1);
      // Tail — flowing ribbon from tie to waist
      g.lineStyle({ width: 0 }); g.beginFill(hairHex);
      g.moveTo(hr * 0.64, headCy + hr * 0.28)
        .bezierCurveTo(hr * 1.10, headCy + hr * 0.80, hr * 1.00, waistY - bH * 0.08, hr * 0.72, waistY + bH * 0.06)
        .lineTo(hr * 0.44, waistY + bH * 0.06)
        .bezierCurveTo(hr * 0.62, waistY - bH * 0.12, hr * 0.58, headCy + hr * 0.60, hr * 0.52, headCy + hr * 0.34)
        .closePath();
      g.endFill();
      // Strand highlight on tail
      strokeSeg(g, hr * 0.05, 0xffffff, true, 0.09);
      g.moveTo(hr * 0.88, headCy + hr * 0.60)
        .bezierCurveTo(hr * 0.96, waistY - bH * 0.20, hr * 0.78, waistY - bH * 0.04, hr * 0.60, waistY + bH * 0.02);
    } else {
      const topRx = ct.hairStyle === 'thin' ? hr * 0.68 : hr * 0.98;
      g.lineStyle({ width: 0 }); g.beginFill(hairHex);
      g.moveTo(-hr * 0.28, headCy - hr * 0.78)
        .quadraticCurveTo(hr * 0.08, headCy - hr * 1.08, topRx, headCy - hr * 0.88)
        .quadraticCurveTo(hr * 1.04, headCy - hr * 0.55, topRx, headCy + hr * 0.28)
        .lineTo(topRx * 0.55, headCy + hr * 0.28)

      g.endFill();

      g.endFill();
      g.lineStyle({ width: 0 }); g.beginFill(jacketDHex2);
      g.moveTo(-hr * 0.26, headCy - hr * 0.72).quadraticCurveTo(-hr * 0.54, headCy - hr * 0.62, -hr * 0.44, headCy - hr * 0.52).quadraticCurveTo(-hr * 0.22, headCy - hr * 0.62, -hr * 0.22, headCy - hr * 0.70).closePath();
      g.endFill();
      g.lineStyle({ width: 0 }); g.beginFill(0xf0f2ee, 0.82);
      g.drawRect(-hr * 0.24, headCy - hr * 0.80, hr * 1.22, hr * 0.11);
      g.endFill();
      fillEllipse(g, hr * 0.28, headCy - hr * 0.86, hr * 0.10, hr * 0.10, 0, 0xc8960a, 1);
      fillEllipse(g, hr * 0.28, headCy - hr * 0.86, hr * 0.06, hr * 0.06, 0, 0xf0c020, 1);
    }
    // Sumo chonmage
    if (ct.sumo) {
      fillEllipse(g, hr * 0.60, headCy - hr * 1.06, hr * 0.20, hr * 0.11, 0.2, hairHex, 1);
      fillEllipse(g, hr * 0.62, headCy - hr * 1.18, hr * 0.10, hr * 0.16, -0.15, hairHex, 1);
    }
  }

  // ── Seated / back-view rig (sit_in, sit) ────────────────────────────────────
  // Unlike the walking rig, this one genuinely needs sub-transforms: the head-turn
  // illusion squishes just the head (profile vs front-face), and death/puke/fall/
  // drunk-sway rotate the whole body around a pivot WITHOUT affecting food (drawn
  // separately, see below). PIXI.Graphics can carry only one flat transform, so
  // `slot` here is a small {root, body, head} tree: `root` (a Container) carries
  // the rotation-state transform, `body` is a plain child Graphics, and `head` is
  // a second child Graphics with its OWN position/pivot/scale for the squish —
  // mirroring the original's nested canvas save/translate/scale/restore calls
  // directly, one Pixi transform per canvas transform, rather than hand-multiplying
  // every coordinate in the head section.
  //
  // Food/chopsticks/vomit particles are NOT ported here — original drawFood() is
  // itself ~1200 lines covering dozens of dishes. Left on Canvas2D: the render loop
  // calls window._drawSeatedExtras() directly on the main ctx, translated to the
  // customer's x position, layered on top of the Pixi-rendered body every frame.
  // This is faithful to the original's own structure, where food is drawn in the
  // OUTER (non-rotated) frame after the inner rotation save/restore — i.e. food was
  // already logically separate from the rotating body, even in the Canvas2D version.
  function _drawSeatedRigPixi(slot, cu, T, geo) {
    const { W, H, stallBot, counterY } = geo || G;
    const { state, x, ct, phase } = cu;
    const _drunkAmt = Math.max(0, (cu.alcoholCount || 0) - 7);
    const root = slot.root, g = slot.body, hg = slot.head;
    g.clear(); hg.clear();
    hg.visible = true;
    // The walking rig positions/flips `body` directly (g.position.set(x,0),
    // g.scale.set(±1,1)) since it doesn't use root at all. A pooled slot that
    // rendered a walking customer last frame and a seated one this frame would
    // otherwise leave that stale transform on `body` while `head` gets fully
    // repositioned every frame — body and head then visibly disagree on where
    // the customer is. All seated positioning goes through `root`, so body's
    // own transform must stay neutral.
    g.position.set(0, 0);
    g.scale.set(1, 1);
    g.pivot.set(0, 0);
    g.rotation = 0;

    const seatY  = counterY + H*0.048;
    const shldrY = counterY - H*0.195;
    const waistY = counterY + H*0.006;
    const armY   = counterY - H*0.020;
    const _eatPhase = Math.sin(T * 2.2 + phase * 3.1);
    const _eatY = (state === 'sit' && cu.served) ? Math.pow(Math.max(0, _eatPhase), 2) * H * 0.048 : 0;
    const _puffCycle = (cu.smoker && state === 'sit') ? Math.sin(T * 0.55 + phase * 2.1) : -1;
    const _smokeRaise = Math.pow(Math.max(0, _puffCycle), 2) * H * 0.15;
    const _lAY = armY - _smokeRaise;
    const headBob = state === 'sit' ? Math.sin(T*2.8+phase)*H*0.004 : 0;

    // ── Root transform: x position + rotation-state pivot/angle/alpha ──
    let pivotY = 0, angle = 0, alpha = 1;
    if (cu.dead) {
      const _dt = cu.deathTimer || 0;
      angle = Math.min(0.68, (_dt / 50) * 0.68);
      pivotY = seatY - H*0.04;
      if (_dt > 100) alpha = Math.max(0, 1 - (_dt - 100) / 180);
    } else if (cu.puking) {
      const _pt = cu.pukTimer || 0;
      let _lean = 0;
      if (_pt < 20)       _lean = (_pt / 20) * 0.40;
      else if (_pt < 50)  _lean = 0.40 + Math.sin((_pt - 20) * 0.55) * 0.14;
      else if (_pt < 120) _lean = 0.44;
      else if (_pt < 180) _lean = 0.44 * Math.max(0, 1 - (_pt - 120) / 60);
      if (_lean > 0.01) { pivotY = seatY - H*0.02; angle = _lean; }
      if (_pt > 190) alpha = Math.max(0, 1 - (_pt - 190) / 30);
    } else if (cu.falling) {
      const _ft = cu.fallTimer || 0;
      let _fallAngle;
      if (_ft < 55) _fallAngle = Math.sin((_ft / 55) * Math.PI * 0.5) * 1.45;
      else if (_ft < 150) _fallAngle = 1.45 + Math.sin(_ft * 0.18) * 0.06;
      else _fallAngle = 1.45 * Math.max(0, 1 - (_ft - 150) / 70);
      pivotY = seatY + H*0.055;
      angle = _fallAngle;
    } else if (_drunkAmt > 0) {
      angle = Math.sin(T * 0.9 + phase * 1.4) * Math.min(_drunkAmt * 0.07, 0.22);
      pivotY = counterY + H*0.048;
    }
    root.position.set(x, pivotY);
    root.pivot.set(0, pivotY);
    root.rotation = angle;
    root.alpha = alpha;

    // ── STOOL ──
    fillEllipse(g, 0, seatY, W*0.020, H*0.006, 0, 0x5a3818, 1);
    g.lineStyle({ width: 0 }); g.beginFill(0x2a1408);
    [-W*0.013, W*0.013].forEach(lx => g.drawRect(lx-W*0.003, seatY+H*0.006, W*0.006, H*0.074));
    g.drawRect(-W*0.013, seatY+H*0.042, W*0.026, H*0.005);
    g.endFill();

    // ── PANTS LEGS / KIMONO FABRIC (dangling) ──
    const pantsHex = hex(ct.pants);
    if (ct.type !== 'kimono' && !ct.female) {
      g.lineStyle({ width: 0 }); g.beginFill(pantsHex);
      g.moveTo(-W*0.024, seatY-H*0.002)
        .bezierCurveTo(-W*0.027, seatY+H*0.028, -W*0.029, seatY+H*0.052, -W*0.024, seatY+H*0.070)
        .lineTo(-W*0.010, seatY+H*0.070)
        .bezierCurveTo(-W*0.008, seatY+H*0.052, -W*0.007, seatY+H*0.028, -W*0.008, seatY-H*0.002)
        .closePath();
      g.endFill();
      g.lineStyle({ width: 0 }); g.beginFill(0x000000, 0.14);
      g.moveTo(-W*0.024, seatY-H*0.002)
        .bezierCurveTo(-W*0.027, seatY+H*0.028, -W*0.029, seatY+H*0.052, -W*0.024, seatY+H*0.070)
        .lineTo(-W*0.010, seatY+H*0.070)
        .bezierCurveTo(-W*0.008, seatY+H*0.052, -W*0.007, seatY+H*0.028, -W*0.008, seatY-H*0.002)
        .closePath();
      g.endFill();

        hg.moveTo(-hR*0.28, hCy+hR*0.67).quadraticCurveTo(0, hCy+hR*0.78 + _tkF, hR*0.28, hCy+hR*0.67).closePath();
        hg.endFill();
      }
      strokeSeg(hg, hR*0.09, 0x000000, false, 0.18);
      hg.moveTo(-hR*0.22, hCy+hR*0.73).quadraticCurveTo(0, hCy+hR*0.84 + _tkF*0.6, hR*0.22, hCy+hR*0.73);
      if (ct.geisha) {
        strokeSeg(hg, hR*0.16, 0xc01828, true);
        hg.moveTo(-hR*0.28, hCy+hR*0.65).quadraticCurveTo(0, hCy+hR*0.80 + _tkF, hR*0.28, hCy+hR*0.65);
        strokeSeg(hg, hR*0.05, 0xd4a020, false);
        hg.moveTo(hR*0.30, hCy-hR*1.02).lineTo(hR*0.36, hCy-hR*1.50);
        fillEllipse(hg, hR*0.36, hCy-hR*1.52, hR*0.07, hR*0.07, 0, 0xe8b830, 1);
        fillEllipse(hg, hR*0.36, hCy-hR*1.52, hR*0.04, hR*0.04, 0, 0xff4060, 1);
      }
      // Hair front
      if (ct.hairStyle === 'long') {
        hg.lineStyle({ width: 0 }); hg.beginFill(hairHex);
        hg.moveTo(-hR*0.82, hCy-hR*0.12)
          .quadraticCurveTo(-hR*0.96, hCy-hR*0.60, -hR*0.80, hCy-hR*0.90)
          .quadraticCurveTo(-hR*0.44, hCy-hR*1.12, 0, hCy-hR*1.10)
          .quadraticCurveTo(hR*0.44, hCy-hR*1.12, hR*0.80, hCy-hR*0.90)
          .quadraticCurveTo(hR*0.96, hCy-hR*0.60, hR*0.82, hCy-hR*0.12).closePath();
        hg.endFill();
      } else {
        const _fW = ct.hairStyle === 'thin' ? hR*0.58 : hR*0.84;
        hg.lineStyle({ width: 0 }); hg.beginFill(hairHex);
        hg.moveTo(-_fW, hCy-hR*0.26)
          .quadraticCurveTo(-hR*0.90, hCy-hR*0.72, -hR*0.68, hCy-hR*0.92)
          .quadraticCurveTo(-hR*0.28, hCy-hR*1.10, 0, hCy-hR*1.08)
          .quadraticCurveTo(hR*0.28, hCy-hR*1.10, hR*0.68, hCy-hR*0.92)
          .quadraticCurveTo(hR*0.90, hCy-hR*0.72, _fW, hCy-hR*0.26).closePath();
        hg.endFill();
      }
      if (ct.police) {
        hg.lineStyle({ width: 0 }); hg.beginFill(jacketHex);
        hg.moveTo(-hR*0.88,hCy-hR*0.72).quadraticCurveTo(0,hCy-hR*0.82,hR*0.88,hCy-hR*0.72).lineTo(hR*0.76,hCy-hR*1.06).quadraticCurveTo(0,hCy-hR*1.14,-hR*0.76,hCy-hR*1.06).closePath();
        hg.endFill();
        hg.lineStyle({ width: 0 }); hg.beginFill(0xf0f2ee, 0.82);
        hg.moveTo(-hR*0.90,hCy-hR*0.76).quadraticCurveTo(0,hCy-hR*0.86,hR*0.90,hCy-hR*0.76).lineTo(hR*0.90,hCy-hR*0.86).quadraticCurveTo(0,hCy-hR*0.96,-hR*0.90,hCy-hR*0.86).closePath();
        hg.endFill();
        hg.lineStyle({ width: 0 }); hg.beginFill(jacketDHex);
        hg.moveTo(-hR*0.88,hCy-hR*1.06).quadraticCurveTo(0,hCy-hR*1.16,hR*0.88,hCy-hR*1.06).lineTo(hR*0.72,hCy-hR*1.16).quadraticCurveTo(0,hCy-hR*1.24,-hR*0.72,hCy-hR*1.16).closePath();
        hg.endFill();
        fillEllipse(hg, 0,hCy-hR*0.91,hR*0.11,hR*0.11,0,0xc8960a,1);
        fillEllipse(hg, 0,hCy-hR*0.91,hR*0.07,hR*0.07,0,0xf0c020,1);
      }
      if (ct.sumo) {
        fillEllipse(hg, 0,hCy-hR*1.12,hR*0.18,hR*0.10,0,hairHex,1);
        fillEllipse(hg, 0,hCy-hR*1.24,hR*0.09,hR*0.16,0,hairHex,1);
      }
    }

    // Name tag above head — drawn as a persistent child Text on the body Graphics
    // (not the head child, since it must NOT squish with the head-turn), cached and
    // reused across frames rather than recreated (Graphics.clear() doesn't touch
    // child display objects, so a fresh PIXI.Text every frame would leak).
    const showName = !!(cu.name && !cu.falling && (cu.isPlayer || cu.permanentId || T < (cu.nameShownUntil || 0)));
    if (showName) {
      if (!slot._nameText) {
        slot._nameText = new PIXI.Text('', {
          fontFamily: 'sans-serif', fontWeight: 'bold', align: 'center',
          dropShadow: true, dropShadowColor: 0x000000, dropShadowDistance: 1, dropShadowAlpha: 0.55,
        });
        slot._nameText.anchor.set(0.5, 1);
        g.addChild(slot._nameText);
      }
      const _nY = shldrY - H*0.14;
      const nameHex = cu.isPlayer ? 0x50dcff : (cu.permanentId ? 0xffc85a : ((cu.alcoholCount||0) > 7 ? 0xffa078 : 0xfff0c8));
      slot._nameText.text = cu.name;
      slot._nameText.style.fontSize = Math.round(W*0.018);
      slot._nameText.style.fill = nameHex;
      slot._nameText.position.set(0, _nY);
      slot._nameText.visible = true;

      if (cu.isPlayer) {
        if (!slot._crownText) {
          slot._crownText = new PIXI.Text('👤', { fontFamily: 'sans-serif', align: 'center' });
          slot._crownText.anchor.set(0.5, 1);
          g.addChild(slot._crownText);
        }
        slot._crownText.style.fontSize = Math.round(W*0.013);
        slot._crownText.position.set(0, _nY - H*0.022);
        slot._crownText.visible = true;
      } else if (slot._crownText) {
        slot._crownText.visible = false;
      }
    } else {
      if (slot._nameText) slot._nameText.visible = false;
      if (slot._crownText) slot._crownText.visible = false;
    }
  }

  // Dispatches to the walking or seated rig based on state. `slot` is either a bare
  // PIXI.Graphics (walking-only callers) or a {root, body, head} tree (seated-capable
  // callers) — see _pixiRenderCustomerLayer and _previewPixiCustomer for how each is built.
  window._drawCustomerPixi = function(slot, cu, T, geo) {
    const isWalking = cu.state === 'walk_in' || cu.state === 'walk_out';
    if (isWalking) {
      const g = slot.body || slot;
      if (slot.head) { slot.head.clear(); slot.head.visible = false; }
      // _drawWalkingRigPixi positions itself via g.position.set(x,0) internally —
      // the root (if any) must stay neutral or the x-offset would double-apply.
      if (slot.root) { slot.root.position.set(0, 0); slot.root.pivot.set(0, 0); slot.root.rotation = 0; slot.root.alpha = 1; }
      _drawWalkingRigPixi(g, cu, T, geo);
    } else {
      // Seated rig always needs the full {root, body, head} tree — both real
      // callers (the live layer and the preview harness) build one.
      _drawSeatedRigPixi(slot, cu, T, geo);
    }
  };

  // ── Live compositing layer — renders walking-state customers via Pixi into an
  // offscreen transparent WebGL surface, then the main Canvas2D render loop
  // drawImage()s that surface at the exact point it used to call drawCustomer()
  // directly. This keeps the existing single-canvas z-order (background → customers
  // → wet-effects → speech bubbles) intact without touching Pixi's own DOM/stacking,
  // and avoids per-customer readback cost — one GPU render + one drawImage per frame,
  // not one per customer. Seated customers (not yet ported — see task 41) always fall
  // back to the original drawCustomer() on the main canvas, drawn separately by the
  // caller for any slot this layer skips.
  let _layerApp = null;
  const _layerPool = []; // one persistent PIXI.Graphics per SLOTS index, reused every frame
  let _layerW = 0, _layerH = 0;

  function _ensureLayer(w, h) {
    if (!_layerApp) {
      _layerApp = new PIXI.Application({ width: w, height: h, backgroundAlpha: 0, antialias: true, autoStart: false });
    }
    if (w !== _layerW || h !== _layerH) {
      _layerApp.renderer.resize(w, h);
      _layerW = w; _layerH = h;
    }
    return _layerApp;
  }

  window._pixiResizeCustomerLayer = function(w, h) {
    if (typeof PIXI === 'undefined') return;
    _ensureLayer(w, h);
  };

  window._pixiCustomerLayerView = function() {
    return _layerApp ? _layerApp.view : null;
  };

  // Each pool entry is a {root, body, head} tree (root: Container carrying the
  // rotation-state transform for seated customers; body/head: child Graphics —
  // see _drawSeatedRigPixi). Walking customers only use `body`; `root`/`head` are
  // reset to neutral/hidden for them by _drawCustomerPixi's dispatcher.
  function _ensureSlot(app, i) {
    let slot = _layerPool[i];
    if (!slot) {
      const root = new PIXI.Container();
      const body = new PIXI.Graphics();
      const head = new PIXI.Graphics();
      root.addChild(body);
      root.addChild(head);
      app.stage.addChild(root);
      slot = { root, body, head };
      _layerPool[i] = slot;
    }
    return slot;
  }

  window._pixiRenderCustomerLayer = function(slots, geo, T) {
    if (typeof PIXI === 'undefined') return false;
    const app = _ensureLayer(geo.W || 1, geo.H || 1);
    let drewAny = false;
    for (let i = 0; i < slots.length; i++) {
      const cu = slots[i].cu;
      const eligible = cu && window._pixiCanHandle(cu);
      const slot = _ensureSlot(app, i);
      if (eligible) {
        slot.root.visible = true;
        window._drawCustomerPixi(slot, cu, T, geo);
        drewAny = true;
      } else {
        slot.root.visible = false;
      }
    }
    app.renderer.render(app.stage);
    return drewAny;
  };

  // ── Debug preview harness — NOT part of the live game, just for visually
  // verifying each milestone against the original before wiring anything in. ──
  let _previewApp = null, _previewSlot = null;
  window._previewPixiCustomer = function(ct, state, extraCu) {
    let canvasEl = document.getElementById('pixi-preview-canvas');
    if (!canvasEl) {
      canvasEl = document.createElement('canvas');
      canvasEl.id = 'pixi-preview-canvas';
      canvasEl.style.cssText = 'position:fixed;top:10px;left:10px;z-index:99999;background:#274060;border:2px solid #fff;';
      canvasEl.width = 260; canvasEl.height = 320;
      document.body.appendChild(canvasEl);
    }
    if (!_previewApp) {
      _previewApp = new PIXI.Application({ view: canvasEl, backgroundAlpha: 1, antialias: true });
      const root = new PIXI.Container();
      const body = new PIXI.Graphics();
      const head = new PIXI.Graphics();
      root.addChild(body); root.addChild(head);
      _previewApp.stage.addChild(root);
      _previewSlot = { root, body, head };
    }
    const fakeCu = Object.assign({ state: state || 'walk_in', x: 130, ct: ct, phase: 0 }, extraCu || {});
    let t = 0;
    _previewApp.ticker.remove(_previewApp._customTick);
    _previewApp._customTick = () => { t += 0.05; window._drawCustomerPixi(_previewSlot, fakeCu, t); };
    _previewApp.ticker.add(_previewApp._customTick);
  };
  window._previewPixiClose = function() {
    const el = document.getElementById('pixi-preview-canvas');
    if (el) el.remove();
    if (_previewApp) { _previewApp.destroy(true); _previewApp = null; _previewSlot = null; }
  };
})();

// ── VOICE CHAT — real-time WebRTC audio between everyone in the current room ──
// Signaling rides the existing room message relay (type:'msg', data:{type:'rtc-signal',...})
// — no server changes, and no PeerJS (loaded but genuinely unused elsewhere in this file;
// RTCPeerConnection/getUserMedia are native browser APIs needing no library). Once connected,
// audio flows directly peer-to-peer; the only third party involved is a public STUN server
// (address discovery only — no audio or data ever passes through it).
(function() {
  'use strict';
  const ICE_SERVERS = [{ urls: 'stun:stun.l.google.com:19302' }];
  let localStream = null;
  let enabled = false;
  let audioCtx = null;
  let speakingTimer = null;
  const peerConnections = new Map(); // peerId -> RTCPeerConnection
  const audioEls = new Map();        // peerId -> <audio>
  const analysers = new Map();       // peerId -> { analyser, data }

  function myId() {
    return MP.role === 'master' ? '__host__' : MP.myGuestId;
  }

  // Deterministic initiator rule — whoever has the "greater" id always makes the offer,
  // the other always waits to answer. Avoids both sides racing to offer at once.
  function shouldInitiate(peerId) {
    return myId() > peerId;
  }

  function sendSignal(to, kind, payload) {
    try {
      MP._post(MP.roomCode, { type: 'msg', guestId: myId(), data: { type: 'rtc-signal', to, kind, payload } });
    } catch (_) {}
  }

  function attachRemoteAudio(peerId, stream) {
    let el = audioEls.get(peerId);
    if (!el) {
      el = document.createElement('audio');
      el.autoplay = true;
      const container = document.getElementById('voice-audio-container');
      if (container) container.appendChild(el);
      audioEls.set(peerId, el);
    }
    el.srcObject = stream;
  }

  function setupAnalyser(key, stream) {
    try {
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      const source = audioCtx.createMediaStreamSource(stream);
      const analyser = audioCtx.createAnalyser();
      analyser.fftSize = 512;
      source.connect(analyser);
      analysers.set(key, { analyser, data: new Uint8Array(analyser.frequencyBinCount) });
    } catch (_) {}
  }

  function ensurePeerConnection(peerId) {
    let pc = peerConnections.get(peerId);
    if (pc) return pc;
    pc = new RTCPeerConnection({ iceServers: ICE_SERVERS });
    peerConnections.set(peerId, pc);

    pc.onicecandidate = (e) => { if (e.candidate) sendSignal(peerId, 'ice', e.candidate.toJSON()); };
    pc.ontrack = (e) => { attachRemoteAudio(peerId, e.streams[0]); setupAnalyser(peerId, e.streams[0]); };

    if (shouldInitiate(peerId)) {
      pc.onnegotiationneeded = async () => {
        try {
          const offer = await pc.createOffer();
          await pc.setLocalDescription(offer);
          sendSignal(peerId, 'offer', { type: pc.localDescription.type, sdp: pc.localDescription.sdp });
        } catch (_) {}
      };
    }

    // Add local tracks regardless of who initiates — whichever side ends up creating
    // the offer/answer, both need their own tracks already attached beforehand for
    // WebRTC to negotiate bidirectional audio in that single exchange.
    if (localStream) localStream.getTracks().forEach(track => pc.addTrack(track, localStream));

    return pc;
  }

  function teardownPeer(peerId) {
    const pc = peerConnections.get(peerId);
    if (pc) { try { pc.close(); } catch(_) {} peerConnections.delete(peerId); }
    const el = audioEls.get(peerId);
    if (el) { el.srcObject = null; el.remove(); audioEls.delete(peerId); }
    analysers.delete(peerId);
  }

  function teardownAll() {
    for (const peerId of Array.from(peerConnections.keys())) teardownPeer(peerId);
  }

  function startSpeakingMeter() {
    if (!localStream) return;
    setupAnalyser('self', localStream);
    speakingTimer = setInterval(() => {
      const entry = analysers.get('self');
      if (!entry) return;
      entry.analyser.getByteFrequencyData(entry.data);
      let sum = 0;
      for (let i = 0; i < entry.data.length; i++) sum += entry.data[i];
      const speaking = (sum / entry.data.length) > 12;
      document.querySelectorAll('.vc-btn').forEach(btn => btn.classList.toggle('vc-speaking', speaking));
    }, 150);
  }

  function stopSpeakingMeter() {
    if (speakingTimer) { clearInterval(speakingTimer); speakingTimer = null; }
    analysers.delete('self');
  }

  function setButtonsLive(live) {
    document.querySelectorAll('.vc-btn').forEach(btn => {
      btn.classList.toggle('vc-live', live);
      btn.textContent = live ? '🎙️ Voice On' : '🎙️ Voice Chat';
    });
  }

  // Called every poll cycle (host and customer alike) with the full list of participant
  // ids currently in the room — creates connections for anyone new, tears down anyone
  // who's left. A no-op whenever voice chat isn't enabled.
  window._vcSyncRoster = function(currentPeerIds) {
    if (!enabled) return;
    const me = myId();
    const seen = new Set();
    for (const peerId of currentPeerIds) {
      if (!peerId || peerId === me) continue;
      seen.add(peerId);
      if (!peerConnections.has(peerId)) ensurePeerConnection(peerId);
    }
    for (const peerId of Array.from(peerConnections.keys())) {
      if (!seen.has(peerId)) teardownPeer(peerId);
    }
  };

  // Routes an incoming rtc-signal message (already filtered to ones addressed to us)
  // to the right peer connection, creating it fresh if this is the first we've heard
  // from this peer.
  window._vcHandleSignal = async function(fromId, kind, payload) {
    if (!enabled || !fromId) return;
    if (kind === 'offer' && peerConnections.has(fromId)) {
      // This app never renegotiates a live connection, so a fresh offer from a peer we
      // already have one for means their side reconnected (e.g. toggled voice off/on) —
      // our old connection is stale and won't accept a second offer cleanly. Start clean.
      teardownPeer(fromId);
    }
    const pc = ensurePeerConnection(fromId);
    try {
      if (kind === 'offer') {
        await pc.setRemoteDescription(payload);
        const answer = await pc.createAnswer();
        await pc.setLocalDescription(answer);
        sendSignal(fromId, 'answer', { type: pc.localDescription.type, sdp: pc.localDescription.sdp });
      } else if (kind === 'answer') {
        await pc.setRemoteDescription(payload);
      } else if (kind === 'ice') {
        await pc.addIceCandidate(payload).catch(() => {});
      }
    } catch (_) {}
  };

  window._vcTeardownAll = function() {
    enabled = false;
    stopSpeakingMeter();
    teardownAll();
    if (localStream) { try { localStream.getTracks().forEach(t => t.stop()); } catch(_) {} localStream = null; }
    setButtonsLive(false);
  };

  window.toggleVoiceChat = async function() {
    if (enabled) { window._vcTeardownAll(); return; }
    if (!MP.roomCode) { toast('Join a room first.', 'err'); return; }
    try {
      localStream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } });
    } catch (e) {
      toast('Microphone access denied or unavailable.', 'err');
      return;
    }
    enabled = true;
    startSpeakingMeter();
    setButtonsLive(true);
    // The next poll tick (host or customer, within ~400-1500ms) will call
    // _vcSyncRoster with the real current roster and connect to everyone already here.
  };
})();

// ── STREET HANGOUT — shared avatar scene ──
// Self-contained: deliberately does NOT declare its own `const G`, since a decorative
// background IIFE earlier in this file already shadows the real global `G` (game state,
// G.screen etc) with a local geometry object of the same name in its own scope. Reading
// the real `G` here (this scope) is safe; a new local `G` here would NOT be.
(function() {
  'use strict';
  const sc = document.getElementById('street-canvas');
  const sctx = sc.getContext('2d');
  let active = false, rafId = null, lastT = 0;
  let self_ = null;                 // { id, x, targetX, facing, moving, phase, animT, ct, name }
  let remote = {};                  // id -> same shape as self_
  let bubbles = [];                 // { id, x, y, text, born, life } — own array, not the stall's
  const held = { left: false, right: false };
  let lastPosSentAt = 0, lastSentXFrac = null, lastSentMoving = null;
  let directory = [];           // [{code, hostName, isOpen, guestCount}] — Plaza mode only
  let directoryTimer = null;
  const PACHINKO_MACHINES = ['Sakura Slots', 'Dragon’s Fortune', 'Lucky Cat'];

  function resize() { sc.width = window.innerWidth; sc.height = window.innerHeight; }

  function boundsX() { return [sc.width * 0.05, sc.width * 0.95]; }

  function ensureSelf() {
    const isHost = MP.role === 'master';
    const key = isHost ? '__host__' : MP.myGuestId;
    const ct = (window._ensureGuestCt && window._ensureGuestCt(key)) || null;
    const [lo, hi] = boundsX();
    const x = lo + (hi - lo) * 0.5;
    self_ = {
      id: key, x, targetX: x, facing: 'right', moving: false,
      phase: Math.random() * Math.PI * 2, animT: 0, ct,
      name: isHost ? (G.playerName || 'Host') : (MP.myName || 'Guest'),
    };
  }

  function spawnStreetBubble(id, x, text) {
    bubbles = bubbles.filter(b => b.id !== id); // one live bubble per avatar
    bubbles.push({ id, x, y: sc.height * 0.60, text, born: performance.now() / 1000, life: 3.2 });
  }

  function updateAvatar(a, dt) {
    const ease = a === self_ ? 0.15 : 0.08; // local = responsive, remote = smoothed over network gaps
    a.x += (a.targetX - a.x) * ease;
    a.moving = Math.abs(a.targetX - a.x) > 1.5;
    if (a.moving) a.facing = a.targetX > a.x ? 'right' : 'left';
    a.animT += dt * (a.moving ? 1 : 0.25); // slow idle sway vs. full walk-cycle speed
  }

  function drawAvatar(a) {
    if (!a.ct || !window._drawWalkFigure) return;
    const state = a.facing === 'right' ? 'walk_in' : 'walk_out';
    window._drawWalkFigure(sctx, { x: a.x, ct: a.ct, phase: a.phase, state, unhappy: false, alcoholCount: 0 }, a.animT);
    sctx.save();
    sctx.font = `bold ${Math.round(sc.height * 0.016)}px sans-serif`;
    sctx.textAlign = 'center';
    sctx.fillStyle = 'rgba(255,255,255,.85)';
    sctx.fillText(a.name || '', a.x, sc.height * 0.42);
    sctx.restore();
  }

  // Visual technique ported from this file's stall-side drawBubbles() (rounded rect + tail
  // + fade). Deliberately NOT calling the stall's real spawnBubble/drawBubbles — those also
  // trigger Japanese speechSynthesis TTS and log into the stall's own dialogue system, which
  // would speak players' typed chat aloud and pollute an unrelated log.
  function drawStreetBubbles() {
    const now = performance.now() / 1000;
    bubbles = bubbles.filter(b => now - b.born < b.life);
    bubbles.forEach(b => {
      const owner = b.id === self_?.id ? self_ : remote[b.id];
      const x = owner ? owner.x : b.x;
      const age = now - b.born;
      const t = age / b.life;
      const alpha = t < 0.12 ? t / 0.12 : t > 0.70 ? (1 - t) / 0.30 : 1;
      const by = sc.height * 0.34 - age * sc.height * 0.018;

      sctx.save();
      sctx.globalAlpha = alpha;
      sctx.font = `bold ${Math.round(sc.height * 0.022)}px serif`;
      const tw = sctx.measureText(b.text).width;
      const pad = sc.width * 0.012, bh = sc.height * 0.038;

      sctx.fillStyle = 'rgba(10,8,20,0.88)';
      sctx.beginPath();
      sctx.roundRect(x - tw / 2 - pad, by - bh, tw + pad * 2, bh, sc.height * 0.012);
      sctx.fill();
      sctx.strokeStyle = 'rgba(255,200,80,0.55)';
      sctx.lineWidth = 1;
      sctx.stroke();

      sctx.fillStyle = 'rgba(10,8,20,0.88)';
      sctx.beginPath();
      sctx.moveTo(x - sc.width * 0.006, by);
      sctx.lineTo(x + sc.width * 0.006, by);
      sctx.lineTo(x, by + sc.height * 0.012);
      sctx.closePath(); sctx.fill();

      sctx.fillStyle = '#fdf0de';
      sctx.textAlign = 'center'; sctx.textBaseline = 'middle';
      sctx.fillText(b.text, x, by - bh / 2);
      sctx.restore();
    });
  }

  // Entrance markers, evenly spaced along the sidewalk — Plaza mode only. Each yatai in the
  // directory gets a fixed slot rather than trying to route/collide-detect around avatars.
  function entranceX(i, n) {
    const [lo, hi] = boundsX();
    return lo + (hi - lo) * ((i + 1) / (n + 1));
  }

  const ENTRANCE_ICONS = { pachinko: '🎰', beach: '🏖️', yatai: '🏮' };

  function drawEntrances() {
    if (MP.roomCode !== PLAZA_CODE) return;
    const y = sc.height * 0.55;
    directory.forEach((r, i) => {
      const x = entranceX(i, directory.length);
      sctx.save();
      sctx.globalAlpha = r.isOpen ? 1 : 0.45;
      sctx.font = `${Math.round(sc.height * 0.05)}px sans-serif`;
      sctx.textAlign = 'center';
      sctx.fillText(ENTRANCE_ICONS[r.type] || '🏮', x, y);
      sctx.font = `bold ${Math.round(sc.height * 0.016)}px sans-serif`;
      sctx.fillStyle = '#fdf0de';
      sctx.fillText(r.hostName, x, y + sc.height * 0.035);
      sctx.font = `${Math.round(sc.height * 0.013)}px sans-serif`;
      sctx.fillStyle = r.isOpen ? 'rgba(140,255,160,.85)' : 'rgba(255,255,255,.5)';
      sctx.fillText(r.isOpen ? `Open · ${r.guestCount} inside` : 'Preparing…', x, y + sc.height * 0.058);
      sctx.restore();
    });
  }

  // entranceHitTest(cx) → matching directory entry, or null. Generous horizontal hit box
  // since entrances are just text/emoji, not a hard-edged sprite.
  function entranceHitTest(cx) {
    if (MP.roomCode !== PLAZA_CODE || !directory.length) return null;
    const hitW = sc.width * 0.06;
    for (let i = 0; i < directory.length; i++) {
      const x = entranceX(i, directory.length);
      if (Math.abs(cx - x) <= hitW) return directory[i];
    }
    return null;
  }

  // Pachinko machine props — Palace mode only, same evenly-spaced-slot idea as entrances.
  function machineX(i) {
    const [lo, hi] = boundsX();
    return lo + (hi - lo) * ((i + 1) / (PACHINKO_MACHINES.length + 1));
  }

  function drawMachines() {
    if (MP.roomCode !== PACHINKO_CODE) return;
    const y = sc.height * 0.55;
    PACHINKO_MACHINES.forEach((name, i) => {
      const x = machineX(i);
      sctx.save();
      sctx.font = `${Math.round(sc.height * 0.05)}px sans-serif`;
      sctx.textAlign = 'center';
      sctx.fillText('🎰', x, y);
      sctx.font = `bold ${Math.round(sc.height * 0.016)}px sans-serif`;
      sctx.fillStyle = '#fdf0de';
      sctx.fillText(name, x, y + sc.height * 0.035);
      sctx.font = `${Math.round(sc.height * 0.013)}px sans-serif`;
      sctx.fillStyle = 'rgba(255,200,80,.8)';
      sctx.fillText('Tap to play', x, y + sc.height * 0.058);
      sctx.restore();
    });
  }

  function machineHitTest(cx) {
    if (MP.roomCode !== PACHINKO_CODE) return null;
    const hitW = sc.width * 0.06;
    for (let i = 0; i < PACHINKO_MACHINES.length; i++) {
      if (Math.abs(cx - machineX(i)) <= hitW) return { index: i, name: PACHINKO_MACHINES[i] };
    }
    return null;
  }

  // Purely decorative — a sand band along the bottom (over the same Kagoshima Bay/
  // Sakurajima photo every street scene already uses) plus a few umbrella/palm props,
  // so the Beach reads distinctly from the Plaza without needing a new background asset.
  const BEACH_PROPS = ['🏖️', '🌴', '⛱️', '🌴', '🏖️'];
  function drawBeachProps() {
    if (MP.roomCode !== BEACH_CODE) return;
    sctx.save();
    const sandY = sc.height * 0.82;
    const grad = sctx.createLinearGradient(0, sandY, 0, sc.height);
    grad.addColorStop(0, 'rgba(230,205,150,0)');
    grad.addColorStop(0.25, 'rgba(230,205,150,.55)');
    grad.addColorStop(1, 'rgba(200,170,110,.7)');
    sctx.fillStyle = grad;
    sctx.fillRect(0, sandY, sc.width, sc.height - sandY);
    sctx.restore();
    const y = sc.height * 0.30;
    sctx.save();
    sctx.font = `${Math.round(sc.height * 0.06)}px sans-serif`;
    sctx.textAlign = 'center';
    sctx.globalAlpha = 0.9;
    BEACH_PROPS.forEach((icon, i) => {
      const x = entranceX(i, BEACH_PROPS.length);
      sctx.fillText(icon, x, y);
    });
    sctx.restore();
  }

  window._streetRefreshDirectory = async function() {
    if (MP.roomCode !== PLAZA_CODE) return;
    try {
      const r = await fetch('/api/room?list=1');
      const data = await r.json();
      if (data.ok) directory = (data.rooms || []).sort((a, b) => a.code < b.code ? -1 : 1);
    } catch (_) {}
  };

  function sendSelfPos() {
    if (MP.role !== 'customer') return; // host's own pos is folded into its own broadcast instead
    const now = performance.now();
    const xFrac = self_.x / sc.width;
    if (now - lastPosSentAt < 200) return;
    if (lastSentXFrac !== null && Math.abs(xFrac - lastSentXFrac) < 0.005 && self_.moving === lastSentMoving) return;
    lastPosSentAt = now; lastSentXFrac = xFrac; lastSentMoving = self_.moving;
    try {
      MP._post(MP.roomCode, { type: 'pos', guestId: MP.myGuestId, xFrac, facing: self_.facing, moving: self_.moving });
    } catch (_) {}
  }

  function loop(ts) {
    if (!active) return;
    const T = ts / 1000;
    const dt = Math.min(0.1, T - (lastT || T));
    lastT = T;
    if (held.left) self_.targetX = Math.max(boundsX()[0], self_.x - 60);
    if (held.right) self_.targetX = Math.min(boundsX()[1], self_.x + 60);
    updateAvatar(self_, dt);
    for (const a of Object.values(remote)) updateAvatar(a, dt);
    sctx.clearRect(0, 0, sc.width, sc.height);
    drawEntrances();
    drawMachines();
    drawBeachProps();
    for (const a of Object.values(remote)) drawAvatar(a);
    drawAvatar(self_);
    drawStreetBubbles();
    sendSelfPos();
    if (MP.role === 'master') {
      MP._hostStreetPos = { xFrac: self_.x / sc.width, facing: self_.facing, moving: self_.moving };
    }
    rafId = requestAnimationFrame(loop);
  }

  window.startStreetLoop = function() {
    if (active) return;
    resize();
    ensureSelf();
    active = true;
    sc.style.display = 'block';
    lastT = 0;
    if (MP.role === 'master') {
      clearInterval(MP._pollTimer);
      MP._pollTimer = setInterval(() => MP._masterPoll(), 400);
      if (MP.startBroadcastLoop) MP.startBroadcastLoop();
    }
    if (MP.role === 'customer') {
      clearInterval(MP._pollTimer);
      MP._pollTimer = setInterval(() => MP._customerPoll(), 450);
    }
    if (MP.roomCode === PLAZA_CODE) {
      directory = [];
      window._streetRefreshDirectory();
      directoryTimer = setInterval(() => window._streetRefreshDirectory(), 3000);
    }
    rafId = requestAnimationFrame(loop);
  };

  window.stopStreetLoop = function() {
    if (!active) return;
    active = false;
    if (rafId) cancelAnimationFrame(rafId);
    rafId = null;
    sc.style.display = 'none';
    remote = {};
    bubbles = [];
    if (directoryTimer) { clearInterval(directoryTimer); directoryTimer = null; }
    if (MP.role === 'master') {
      clearInterval(MP._pollTimer);
      MP._pollTimer = setInterval(() => MP._masterPoll(), 1000);
      if (MP.startBroadcastLoop) MP.startBroadcastLoop();
    }
    if (MP.role === 'customer') {
      clearInterval(MP._pollTimer);
      MP._pollTimer = setInterval(() => MP._customerPoll(), 1500);
    }
  };

  // Called from MP._masterPoll / MP._customerPoll with the latest `players` array from the
  // room broadcast. No-op (harmless) when the street screen isn't active.
  window._streetSyncPlayers = function(players) {
    if (!active || !players) return;
    const seen = {};
    const [lo, hi] = boundsX();
    for (const p of players) {
      if (self_ && p.id === self_.id) continue; // never let network echo override local control
      seen[p.id] = true;
      const x = lo + (hi - lo) * Math.min(1, Math.max(0, p.xFrac ?? 0.5));
      let a = remote[p.id];
      if (!a) {
        a = remote[p.id] = {
          id: p.id, x, targetX: x, facing: p.facing || 'right', moving: false,
          phase: Math.random() * Math.PI * 2, animT: 0, ct: p.ct, name: p.name,
        };
      }
      a.targetX = x;
      a.facing = p.facing || a.facing;
      if (p.ct) a.ct = p.ct;
      if (p.name) a.name = p.name;
    }
    for (const id of Object.keys(remote)) if (!seen[id]) delete remote[id]; // player left
  };

  window._streetHandleChat = function(id, name, text) {
    if (!active) return;
    const owner = (self_ && id === self_.id) ? self_ : remote[id];
    if (owner) spawnStreetBubble(id, owner.x, text);
  };

  window.streetSendChat = function() {
    const inp = document.getElementById('street-chat-input');
    if (!inp || !self_) return;
    const text = inp.value.trim();
    if (!text) return;
    inp.value = '';
    try {
      if (MP.role === 'master') { if (MP.hostSendChat) MP.hostSendChat(text); }
      else if (MP.sendChat) MP.sendChat(text);
    } catch (_) {}
    spawnStreetBubble(self_.id, self_.x, text); // optimistic local echo
  };

  window.goStreet = function() {
    if (!MP.roomCode) return; // only meaningful inside an active room session
    MP._preStreetScreen = G.screen;
    G.screen = 'street';
    fullRender();
  };

  // Single button for the host HUD that works whether or not a multiplayer room is
  // active: hosting guests right now peeks at the street without disconnecting them
  // (goStreet); otherwise (solo play, no room) there's no session to preserve, so join
  // the shared Plaza directly like a guest would (goExploreStreet).
  window.goStreetAny = function() {
    if (MP.role === 'master' && MP.roomCode) { window.goStreet(); return; }
    window.goExploreStreet();
  };

  // Leave whatever room you're currently in (if any — MP.destroy() is a safe no-op
  // otherwise) and join the shared Plaza to browse every open yatai.
  window.goExploreStreet = function() {
    MP.destroy();
    MP.joinVenue(PLAZA_CODE);
  };

  // Leave the Plaza and join a specific yatai's room — reuses joinRoom() completely
  // unchanged, so seating, screen switch, and normal stall polling all just work.
  window._enterYatai = function(code) {
    MP.destroy();
    MP.joinRoom(code, MP.myName || G.playerName || 'Guest');
  };
  // Leave the Plaza and join the Pachinko Palace — another shared venue, same pattern.
  window._enterPachinko = function() {
    MP.destroy();
    MP.joinVenue(PACHINKO_CODE);
  };
  // Leave the Plaza and join the Beach — another shared venue, same pattern.
  window._enterBeach = function() {
    MP.destroy();
    MP.joinVenue(BEACH_CODE);
  };
  window.leaveStreet = function() {
    if (MP.roomCode === PLAZA_CODE) {
      // Leaving the shared directory doesn't preserve "wherever you came from" — you
      // fully left that room's session already (see goExploreStreet/_enterYatai).
      MP.destroy();
      G.screen = 'multilobby';
      fullRender();
      return;
    }
    if (MP.roomCode === PACHINKO_CODE || MP.roomCode === BEACH_CODE) {
      // You got here from the Plaza, so leaving returns you there too.
      MP.destroy();
      MP.joinVenue(PLAZA_CODE);
      return;
    }
    G.screen = MP._preStreetScreen || (MP.role === 'master' ? 'service' : 'customer');
    fullRender();
  };

  window.addEventListener('resize', () => { if (active) resize(); });

  window.addEventListener('keydown', e => {
    if (G.screen !== 'street') return;
    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') held.left = true;
    if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') held.right = true;
  });
  window.addEventListener('keyup', e => {
    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') held.left = false;
    if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') held.right = false;
  });
  window.addEventListener('click', e => {
    if (G.screen !== 'street' || !self_) return;
    if (e.target.closest && e.target.closest('#street-overlay')) return; // don't walk when tapping chat/back
    if (e.target.closest && e.target.closest('#pachinko-modal')) return; // don't let clicks inside the play modal fall through to the canvas beneath
    const rect = sc.getBoundingClientRect();
    const cx = (e.clientX - rect.left) * (sc.width / rect.width);
    const hit = entranceHitTest(cx);
    if (hit) {
      if (hit.type === 'pachinko') window._enterPachinko();
      else if (hit.type === 'beach') window._enterBeach();
      else window._enterYatai(hit.code);
      return;
    }
    const mHit = machineHitTest(cx);
    if (mHit) { window._openPachinkoModal(mHit); return; }
    const [lo, hi] = boundsX();
    self_.targetX = Math.min(hi, Math.max(lo, cx));
  });
})();

// ── SCREEN SWITCH ──
// Override fullRender to handle multiplayer screens (this declaration wins over the earlier one)


// Single canonical fullRender — handles all screens + YouTube TV overlay
function fullRender() {
  stopLoop();
  try { if (window.stopStreetLoop) window.stopStreetLoop(); } catch(_) {} // safe no-op if street wasn't active
  const root = document.getElementById('root');
  if (!root) return;
  switch (G.screen) {
    case 'signin':     root.innerHTML = buildSignIn(); setTimeout(() => { const el = document.getElementById('signin-input'); if (el) el.focus(); }, 80); break;
    case 'title':      root.innerHTML = buildMultiLobby(); break;
    case 'prep':       root.innerHTML = buildPrepShell(); break;
    case 'service':    root.innerHTML = buildServiceShell();
      setTimeout(() => VOICE_SYS.updateBtn(), 0);
      break;
    case 'review':     root.innerHTML = buildReview(); break;
    case 'multilobby': root.innerHTML = buildMultiLobby(); break;
    case 'multihost':  root.innerHTML = buildMultiHost(); break;
    case 'customer':   root.innerHTML = buildCustomerView(); break;
    case 'street':     root.innerHTML = buildStreetView(); if (window.startStreetLoop) window.startStreetLoop(); break;
    default:           root.innerHTML = buildTitle();
  }
}
</script>
<script>
if (location.hostname === 'localhost' || location.hostname === '127.0.0.1') {
  (function() {
    var _lrFails = 0;
    function connect() {
      var es = new EventSource('/api/livereload');
      es.onmessage = function(e) { if (e.data === 'reload') location.reload(); };
      es.onerror = function() {
        es.close();
        _lrFails++;
        if (_lrFails > 2) return; // stop retrying if endpoint is absent
        setTimeout(connect, 3000);
      };
    }
    connect();
  })();
}
</script>
</body>
