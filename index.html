  function drawWetCustomers(ctx, T) {
    if (!_typhoon) return;
    const { W, H, counterY } = G;
    const age = T - _typhoon.startT;
    const dur = 26;
    if (age > dur) return;
    const fade = age < 3 ? age / 3 : age > dur - 5 ? (dur - age) / 5 : 1;
    if (fade < 0.05) return;

    const topY  = counterY - H * 0.24;
    const botY  = counterY + H * 0.05;
    const figH  = botY - topY;
    const figW  = W * 0.065;

    ctx.save();
    ctx.lineCap = 'round';

    SLOTS.forEach(slot => {
      const cu = slot.cu;
      if (!cu || (cu.state !== 'sit' && cu.state !== 'sit_in')) return;

      // Wet sheen — horizontal gradient tinted blue across the figure
      const sheenA = fade * 0.14;
      const sh = ctx.createLinearGradient(cu.x - figW * 0.6, 0, cu.x + figW * 0.6, 0);
      sh.addColorStop(0,   `rgba(110,180,255,0)`);
      sh.addColorStop(0.3, `rgba(110,180,255,${sheenA})`);
      sh.addColorStop(0.7, `rgba(110,180,255,${sheenA})`);
      sh.addColorStop(1,   `rgba(110,180,255,0)`);
      ctx.fillStyle = sh;
      ctx.fillRect(cu.x - figW * 0.6, topY, figW * 1.2, figH);

      // Drip streaks — 5 streams that continuously fall down the figure
      ctx.lineWidth = W * 0.003;
      for (let d = 0; d < 5; d++) {
        const xFrac    = (d / 4) - 0.5;
        const dx       = xFrac * figW;
        const dripFrac = ((T * 0.85 + d * 0.2 + (cu.phase || 0)) % 1);
        const dripY    = topY + dripFrac * figH;
        const dripLen  = H * 0.028;
        const edgeFade = 1 - Math.abs(xFrac) * 1.6;
        if (edgeFade <= 0) continue;
        ctx.beginPath();
        ctx.moveTo(cu.x + dx, dripY);
        ctx.lineTo(cu.x + dx, Math.min(dripY + dripLen, botY));
        ctx.strokeStyle = `rgba(165,215,255,${fade * 0.55 * edgeFade})`;
        ctx.stroke();
      }

      // Splash drops — small pulses at head and shoulder level
      for (let s = 0; s < 4; s++) {
        const sp = (T * 5.1 + s * 1.571 + (cu.phase || 0) * 2) % (Math.PI * 2);
        const sa = fade * 0.45 * Math.max(0, Math.sin(sp)) ** 2;
        if (sa < 0.04) continue;
        const sx = cu.x + (s - 1.5) * figW * 0.28;
        const sy = topY + H * 0.04 + (s % 2) * H * 0.035;
        ctx.beginPath();
        ctx.arc(sx, sy, W * 0.0035, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(180,220,255,${sa})`;
        ctx.fill();
      }
    });

    ctx.restore();

    const x = W * (0.88 - progress * 0.55);

// AUDIO SYSTEM

const AUDIO = {
  ctx: null, master: null,
  ambSrc: null, ambGain: null,
  rainSrc: null, rainGain: null,
  melodyTid: null, crowdTid: null,
  bgmEl: null, bgmNode: null, bgmGain: null,
  muted: false,

  // C major pentatonic, 2 octaves
  SCALE: [261.63,293.66,329.63,392.00,440.00,523.25,587.33,659.25,784.00,880.00],

  init() {
    if (this.ctx) { this.ctx.resume(); return; }
    try {
      this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      this.master = this.ctx.createGain();
      this.master.gain.value = 0.8;
      this.master.connect(this.ctx.destination);
    } catch(e) { console.warn('Web Audio not available'); }
  },

  toggle() {
    this.muted = !this.muted;
    if (this.master)
      this.master.gain.setTargetAtTime(this.muted ? 0 : 0.8, this.ctx.currentTime, 0.3);
    const btn = document.getElementById('mute-btn');
    if (btn) btn.textContent = this.muted ? '🔇' : '🔊';
  },

  _pinkBuf(sec = 5) {
    const sr = this.ctx.sampleRate;
    const buf = this.ctx.createBuffer(2, sr * sec, sr);
    for (let ch = 0; ch < 2; ch++) {
      const d = buf.getChannelData(ch);
      let b0=0,b1=0,b2=0,b3=0,b4=0,b5=0,b6=0;
      for (let i = 0; i < d.length; i++) {
        const w = Math.random()*2-1;
        b0=0.99886*b0+w*0.0555179; b1=0.99332*b1+w*0.0750759;
        b2=0.96900*b2+w*0.1538520; b3=0.86650*b3+w*0.3104856;
        b4=0.55000*b4+w*0.5329522; b5=-0.7616*b5-w*0.0168980;
        d[i]=(b0+b1+b2+b3+b4+b5+b6+w*0.5362)*0.11;
        b6=w*0.115926;
      }
    }
    return buf;
  },

  _whiteBuf(sec = 3) {
    const sr = this.ctx.sampleRate;
    const buf = this.ctx.createBuffer(2, sr * sec, sr);
    for (let ch = 0; ch < 2; ch++) {
      const d = buf.getChannelData(ch);
      for (let i = 0; i < d.length; i++) d[i] = Math.random()*2-1;
    }
    return buf;
  },

  startService(isRainy) {
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    // Background music — looping MP3 routed through master gain
    if (!this.bgmEl) {
      this.bgmEl = new Audio('bg.mp3');
      this.bgmEl.loop = true;
      this.bgmNode = this.ctx.createMediaElementSource(this.bgmEl);
      this.bgmGain = this.ctx.createGain();
      this.bgmNode.connect(this.bgmGain);
      this.bgmGain.connect(this.master);
    }
    this.ctx.resume().then(() => {
      this.bgmGain.gain.setValueAtTime(0, this.ctx.currentTime);
      this.bgmGain.gain.setTargetAtTime(0.22, this.ctx.currentTime, 3.5);
      this.bgmEl.currentTime = 0;
      this.bgmEl.play().catch(e => console.warn('bgm play failed:', e));
    });
    // Street ambient: pink noise → lowpass → gain (fade in over 3s)
    this.ambSrc = this.ctx.createBufferSource();
    this.ambSrc.buffer = this._pinkBuf(5);
    this.ambSrc.loop = true;
    const af = this.ctx.createBiquadFilter();
    af.type = 'lowpass'; af.frequency.value = 620;
    this.ambGain = this.ctx.createGain();
    this.ambGain.gain.setValueAtTime(0, t);
    this.ambGain.gain.setTargetAtTime(0.14, t, 2.5);
    this.ambSrc.connect(af); af.connect(this.ambGain);
    this.ambGain.connect(this.master);
    this.ambSrc.start();
    if (isRainy) this._startRain();
    this._scheduleMelody();
    this._scheduleCrowd();
  },

  stopService() {
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    if (this.ambGain) this.ambGain.gain.setTargetAtTime(0, t, 1.5);
    if (this.rainGain) this.rainGain.gain.setTargetAtTime(0, t, 1.5);
    if (this.bgmGain) this.bgmGain.gain.setTargetAtTime(0, t, 2.0);
    setTimeout(() => {
      try { this.ambSrc?.stop(); } catch(e){}
      try { this.rainSrc?.stop(); } catch(e){}
      try { this.bgmEl?.pause(); } catch(e){}
      this.ambSrc = null; this.rainSrc = null;
    }, 4500);
    clearTimeout(this.melodyTid);
    clearTimeout(this.crowdTid);
  },

  _startRain() {
    this.rainSrc = this.ctx.createBufferSource();
    this.rainSrc.buffer = this._whiteBuf(4);
    this.rainSrc.loop = true;
    const f = this.ctx.createBiquadFilter();
    f.type = 'bandpass'; f.frequency.value = 4500; f.Q.value = 0.4;
    this.rainGain = this.ctx.createGain();
    this.rainGain.gain.setValueAtTime(0, this.ctx.currentTime);
    this.rainGain.gain.setTargetAtTime(0.09, this.ctx.currentTime, 2);
    this.rainSrc.connect(f); f.connect(this.rainGain);
    this.rainGain.connect(this.master);
    this.rainSrc.start();
  },

  _scheduleMelody() {
    const delay = 3500 + Math.random() * 7000;
    this.melodyTid = setTimeout(() => { this._koto(); this._scheduleMelody(); }, delay);
  },

  _koto() {
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    const freq = this.SCALE[Math.floor(Math.random() * this.SCALE.length)];
    const osc = this.ctx.createOscillator();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(freq, t);
    osc.frequency.setTargetAtTime(freq * 0.978, t + 0.015, 0.25);
    const filt = this.ctx.createBiquadFilter();
    filt.type = 'lowpass'; filt.frequency.value = 1600; filt.Q.value = 2;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(0.052, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.001, t + 1.3);
    osc.connect(filt); filt.connect(g); g.connect(this.master);
    osc.start(t); osc.stop(t + 1.5);
    if (Math.random() < 0.35)
      setTimeout(() => this._koto(), 260 + Math.random() * 340);
  },

  _scheduleCrowd() {
    const delay = 7000 + Math.random() * 13000;
    this.crowdTid = setTimeout(() => {
      const n = 2 + Math.floor(Math.random() * 3);
      for (let i = 0; i < n; i++) setTimeout(() => this._voice(), i * 140);
      this._scheduleCrowd();
    }, delay);
  },

  // Formant synthesis: bandpass noise at F1+F2 frequencies → sounds like muffled voice
  _voice() {
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    const dur = 0.35 + Math.random() * 0.55;
    const sr = this.ctx.sampleRate;
    const len = Math.ceil(sr * (dur + 0.12));
    const buf = this.ctx.createBuffer(1, len, sr);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random()*2-1;
    const src = this.ctx.createBufferSource(); src.buffer = buf;

    const f1 = this.ctx.createBiquadFilter();
    f1.type = 'bandpass'; f1.Q.value = 9;
    f1.frequency.setValueAtTime(300 + Math.random()*500, t);
    f1.frequency.linearRampToValueAtTime(300 + Math.random()*500, t + dur);

    const f2 = this.ctx.createBiquadFilter();
    f2.type = 'bandpass'; f2.Q.value = 11;
    f2.frequency.setValueAtTime(900 + Math.random()*1300, t);
    f2.frequency.linearRampToValueAtTime(900 + Math.random()*1300, t + dur);

    const mix = this.ctx.createGain(); mix.gain.value = 1;
    const env = this.ctx.createGain();
    const vol = 0.026 + Math.random() * 0.016;
    env.gain.setValueAtTime(0, t);
    env.gain.linearRampToValueAtTime(vol, t + 0.04);
    env.gain.setValueAtTime(vol, t + dur - 0.08);
    env.gain.linearRampToValueAtTime(0, t + dur);

    const pan = this.ctx.createStereoPanner();
    pan.pan.value = (Math.random() - 0.5) * 1.6;

    src.connect(f1); src.connect(f2);
    f1.connect(mix); f2.connect(mix);
    mix.connect(env); env.connect(pan); pan.connect(this.master);
    src.start(t); src.stop(t + dur + 0.12);
  },

  playSizzle() {
    if (!this.ctx) return;
    const t = this.ctx.currentTime, sr = this.ctx.sampleRate, dur = 0.45;
    const buf = this.ctx.createBuffer(1, Math.ceil(sr*dur), sr);
    const d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random()*2-1;
    const src = this.ctx.createBufferSource(); src.buffer = buf;
    const f = this.ctx.createBiquadFilter(); f.type='highpass'; f.frequency.value=3500;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(0.13, t); g.gain.exponentialRampToValueAtTime(0.001, t+dur);
    src.connect(f); f.connect(g); g.connect(this.master);
    src.start(t); src.stop(t+dur);
  },

  playReady() {
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    [523.25, 783.99].forEach((freq, i) => {
      const osc = this.ctx.createOscillator();
      osc.type = 'sine'; osc.frequency.value = freq;
      const g = this.ctx.createGain();
      g.gain.setValueAtTime(0, t+i*0.13);
      g.gain.linearRampToValueAtTime(0.1, t+i*0.13+0.012);
      g.gain.exponentialRampToValueAtTime(0.001, t+i*0.13+0.7);
      osc.connect(g); g.connect(this.master);
      osc.start(t+i*0.13); osc.stop(t+i*0.13+0.8);
    });
  },

  playServe() {
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(1046, t);
    osc.frequency.exponentialRampToValueAtTime(880, t+0.08);
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(0.11, t); g.gain.exponentialRampToValueAtTime(0.001, t+0.22);

    osc.start(t); osc.stop(t+0.25);
  },

  playLeave() {
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    [330, 220].forEach((freq, i) => {
      const osc = this.ctx.createOscillator();
      osc.type = 'sine'; osc.frequency.value = freq;
      const g = this.ctx.createGain();
      g.gain.setValueAtTime(0, t+i*0.18);
      g.gain.linearRampToValueAtTime(0.065, t+i*0.18+0.02);
      g.gain.exponentialRampToValueAtTime(0.001, t+i*0.18+0.45);
      osc.connect(g); g.connect(this.master);
      osc.start(t+i*0.18); osc.stop(t+i*0.18+0.5);
    });
  },

  playArrive() {
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    osc.type = 'sine'; osc.frequency.value = 660;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(0.05, t); g.gain.exponentialRampToValueAtTime(0.001, t+0.4);
    osc.connect(g); g.connect(this.master);
    osc.start(t); osc.stop(t+0.5);
    setTimeout(() => this._voice(), 90 + Math.random()*100);
  },

  playDeathScream() {
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    // Sawtooth scream — high pitch plummeting to low groan
    const saw = this.ctx.createOscillator();
    saw.type = 'sawtooth';
    saw.frequency.setValueAtTime(880, t);
    saw.frequency.linearRampToValueAtTime(1200, t + 0.08);
    saw.frequency.exponentialRampToValueAtTime(120, t + 1.4);
    const sawG = this.ctx.createGain();
    sawG.gain.setValueAtTime(0, t);
    sawG.gain.linearRampToValueAtTime(0.22, t + 0.05);
    sawG.gain.setValueAtTime(0.22, t + 0.9);
    sawG.gain.exponentialRampToValueAtTime(0.001, t + 1.6);
    // Sine layer for body
    const sine = this.ctx.createOscillator();

    sine.frequency.exponentialRampToValueAtTime(90, t + 1.4);
    const sineG = this.ctx.createGain();
    sineG.gain.setValueAtTime(0.12, t);
    sineG.gain.exponentialRampToValueAtTime(0.001, t + 1.5);
    // Distortion / waveshaper for rasp
    const ws = this.ctx.createWaveShaper();
    const curve = new Float32Array(256);
    for (let i = 0; i < 256; i++) { const x = (i*2/255)-1; curve[i] = (Math.PI + 180) * x / (Math.PI + 180 * Math.abs(x)); }
    ws.curve = curve;
    saw.connect(sawG); sawG.connect(ws); ws.connect(this.master);

      gn.gain.setValueAtTime(vol, t + delay); gn.gain.exponentialRampToValueAtTime(0.001, t + delay + 0.10);
      n.connect(filt); filt.connect(gn); gn.connect(this.master);

      // Pitched croak underneath each pulse

  playYakuzaSting() {
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    // ── MASSIVE TAIKO STRIKE ──

    const nBuf = this._whiteBuf(0.9);

    // Second lighter echo hit
    const n2 = this.ctx.createBufferSource(); n2.buffer = this._whiteBuf(0.5);

    n2.connect(f2); f2.connect(g2); g2.connect(this.master);
    n2.start(t + 0.55); n2.stop(t + 1.1);
    // ── OMINOUS BRASS CHORD — minor cluster ──
    [55, 65.4, 82.4, 98].forEach((freq, i) => {
      const osc = this.ctx.createOscillator();
      osc.type = 'sawtooth'; osc.frequency.setValueAtTime(freq, t + 0.08);

      gn.gain.setValueAtTime(0.001, t + 0.08);
      gn.gain.linearRampToValueAtTime(0.28 - i * 0.04, t + 0.4);
      gn.gain.linearRampToValueAtTime(0.001, t + 3.8);
      osc.connect(filt); filt.connect(gn); gn.connect(this.master);
      osc.start(t + 0.08); osc.stop(t + 4.0);
    });
    // ── DESCENDING KOTO PHRASE — louder ──
    [[220, 0.22], [196, 0.50], [174.6, 0.78], [138.6, 1.06]].forEach(([freq, delay]) => {
      const osc = this.ctx.createOscillator();
      osc.type = 'sawtooth'; osc.frequency.setValueAtTime(freq, t + delay);
      const filt = this.ctx.createBiquadFilter();
      filt.type = 'bandpass'; filt.frequency.value = freq * 2.2; filt.Q.value = 8;
      const gn = this.ctx.createGain();
      gn.gain.setValueAtTime(0.55, t + delay); gn.gain.exponentialRampToValueAtTime(0.001, t + delay + 0.32);
      osc.connect(filt); filt.connect(gn); gn.connect(this.master);
      osc.start(t + delay); osc.stop(t + delay + 0.36);
    });
    // ── DEEP TENSION DRONE ──
    const drone = this.ctx.createOscillator();
    drone.type = 'sine'; drone.frequency.setValueAtTime(55, t + 1.2);
    const dG = this.ctx.createGain();
    dG.gain.setValueAtTime(0.001, t + 1.2); dG.gain.linearRampToValueAtTime(0.35, t + 2.2); dG.gain.linearRampToValueAtTime(0.001, t + 4.5);
    drone.connect(dG); dG.connect(this.master);

  playPoliceSiren() {
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    // Japanese police siren: pi-po (ピーポー) alternating ~960Hz / ~770Hz
    // Route through bandpass to mimic a car speaker/distance
    const sirenOsc = this.ctx.createOscillator();
    sirenOsc.type = 'square';
    // Frequency automation: 4 cycles of pi (960) → po (770)
    const hiF = 960, loF = 770, cycleLen = 0.42;
    sirenOsc.frequency.setValueAtTime(hiF, t);
    for (let i = 0; i < 5; i++) {
      const base = t + i * cycleLen;
      sirenOsc.frequency.setValueAtTime(hiF, base);
      sirenOsc.frequency.linearRampToValueAtTime(loF, base + cycleLen * 0.48);
      sirenOsc.frequency.setValueAtTime(loF, base + cycleLen * 0.50);
      sirenOsc.frequency.linearRampToValueAtTime(hiF, base + cycleLen * 0.98);
    }
    // Bandpass: mimics loudspeaker resonance of a distant siren
    const bpFilt = this.ctx.createBiquadFilter();
    bpFilt.type = 'bandpass'; bpFilt.frequency.value = 860; bpFilt.Q.value = 1.4;
    // Slight waver — Doppler-like pitch wobble
    const waverOsc = this.ctx.createOscillator();
    waverOsc.type = 'sine'; waverOsc.frequency.value = 3.8;
    const waverGain = this.ctx.createGain(); waverGain.gain.value = 14;
    waverOsc.connect(waverGain); waverGain.connect(sirenOsc.frequency);
    // Amplitude envelope: fade in, hold, fade out
    const sirenGain = this.ctx.createGain();
    sirenGain.gain.setValueAtTime(0, t);
    sirenGain.gain.linearRampToValueAtTime(0.28, t + 0.18);
    sirenGain.gain.setValueAtTime(0.28, t + cycleLen * 4.5);
    sirenGain.gain.linearRampToValueAtTime(0, t + cycleLen * 5 + 0.2);
    sirenOsc.connect(bpFilt); bpFilt.connect(sirenGain); sirenGain.connect(this.master);
    const dur = cycleLen * 5 + 0.25;
    sirenOsc.start(t); sirenOsc.stop(t + dur);
    waverOsc.start(t); waverOsc.stop(t + dur);
  },

  playSumoEntrance() {
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    // Three heavy stomps — accelerating
    [0, 0.30, 0.55].forEach((delay, i) => {
      const scale = 1 - i * 0.12;
      const nSrc = this.ctx.createBufferSource();
      nSrc.buffer = this._whiteBuf(0.5);
      const nFilt = this.ctx.createBiquadFilter();
      nFilt.type = 'lowpass'; nFilt.frequency.setValueAtTime(130, t + delay);
      const nGain = this.ctx.createGain();
      nGain.gain.setValueAtTime(scale * 1.3, t + delay); nGain.gain.exponentialRampToValueAtTime(0.001, t + delay + 0.28);
      nSrc.connect(nFilt); nFilt.connect(nGain); nGain.connect(this.master);
      nSrc.start(t + delay); nSrc.stop(t + delay + 0.35);
      const osc = this.ctx.createOscillator();
      osc.type = 'sine'; osc.frequency.setValueAtTime(95 - i * 8, t + delay);
      osc.frequency.exponentialRampToValueAtTime(36, t + delay + 0.22);
      const oscG = this.ctx.createGain();
      oscG.gain.setValueAtTime(scale * 1.6, t + delay); oscG.gain.exponentialRampToValueAtTime(0.001, t + delay + 0.28);
      osc.connect(oscG); oscG.connect(this.master);
      osc.start(t + delay); osc.stop(t + delay + 0.32);
    });
    // Big final slam at 0.78s
    const sNoise = this.ctx.createBufferSource(); sNoise.buffer = this._whiteBuf(0.8);
    const sFilt = this.ctx.createBiquadFilter(); sFilt.type = 'lowpass'; sFilt.frequency.setValueAtTime(200, t + 0.78);
    const sGain = this.ctx.createGain();
    sGain.gain.setValueAtTime(2.2, t + 0.78); sGain.gain.exponentialRampToValueAtTime(0.001, t + 1.55);
    sNoise.connect(sFilt); sFilt.connect(sGain); sGain.connect(this.master);
    sNoise.start(t + 0.78); sNoise.stop(t + 1.6);
    const bigThud = this.ctx.createOscillator();
    bigThud.type = 'sine'; bigThud.frequency.setValueAtTime(130, t + 0.78);
    bigThud.frequency.exponentialRampToValueAtTime(28, t + 1.20);
    const bigG = this.ctx.createGain();
    bigG.gain.setValueAtTime(2.6, t + 0.78); bigG.gain.exponentialRampToValueAtTime(0.001, t + 1.45);
    bigThud.connect(bigG); bigG.connect(this.master);
    bigThud.start(t + 0.78); bigThud.stop(t + 1.5);
    // Crowd gasp/murmur
    const crowd = this.ctx.createBufferSource(); crowd.buffer = this._whiteBuf(2.0);
    const cFilt = this.ctx.createBiquadFilter(); cFilt.type = 'bandpass'; cFilt.frequency.value = 700; cFilt.Q.value = 0.7;
    const cGain = this.ctx.createGain();
    cGain.gain.setValueAtTime(0.001, t + 0.9); cGain.gain.linearRampToValueAtTime(0.18, t + 1.5); cGain.gain.linearRampToValueAtTime(0.001, t + 3.0);
    crowd.connect(cFilt); cFilt.connect(cGain); cGain.connect(this.master);
    crowd.start(t + 0.9); crowd.stop(t + 3.2);
  },

  playPunkAnthem() {
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    const dist = this.ctx.createWaveShaper();
    const curve = new Float32Array(256);
    for (let i = 0; i < 256; i++) { const x = i / 128 - 1; curve[i] = Math.tanh(x * 6); }
    dist.curve = curve; dist.oversample = '4x';
    const distGain = this.ctx.createGain();
    distGain.gain.value = 0.45;
    dist.connect(distGain); distGain.connect(this.master);
    // Three-chord power-chord riff — root + fifth, fast eighth notes
    const riff = [82.41, 82.41, 110.00, 82.41, 98.00, 82.41, 110.00, 73.42];
    riff.forEach((freq, i) => {
      const dt = t + i * 0.11;
      [freq, freq * 1.5].forEach((f, j) => {
        const osc = this.ctx.createOscillator();
        osc.type = 'sawtooth'; osc.frequency.setValueAtTime(f, dt);
        const g = this.ctx.createGain();
        g.gain.setValueAtTime(j === 0 ? 0.5 : 0.3, dt);
        g.gain.exponentialRampToValueAtTime(0.001, dt + 0.1);
        osc.connect(g); g.connect(dist);
        osc.start(dt); osc.stop(dt + 0.11);
      });
    });
    // Snare/hihat pattern
    for (let i = 0; i < 8; i++) {
      const dt = t + i * 0.11;
      const n = this.ctx.createBufferSource(); n.buffer = this._whiteBuf(0.06);
      const f = this.ctx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = i % 2 === 1 ? 1800 : 4000;
      const g = this.ctx.createGain();
      g.gain.setValueAtTime(i % 2 === 1 ? 0.5 : 0.18, dt);
      g.gain.exponentialRampToValueAtTime(0.001, dt + 0.05);
      n.connect(f); f.connect(g); g.connect(this.master);
      n.start(dt); n.stop(dt + 0.06);
    }
    // Kick on the downbeats
    [0, 0.44].forEach(delay => {
      const dt = t + delay;
      const kick = this.ctx.createOscillator();
      kick.type = 'sine'; kick.frequency.setValueAtTime(140, dt); kick.frequency.exponentialRampToValueAtTime(45, dt + 0.12);
      const kg = this.ctx.createGain();
      kg.gain.setValueAtTime(1.0, dt); kg.gain.exponentialRampToValueAtTime(0.001, dt + 0.15);
      kick.connect(kg); kg.connect(this.master);
      kick.start(dt); kick.stop(dt + 0.16);
    });
  },

  playEarthquake() {
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    const dur = 8;
    // Spike master gain for earthquake impact, then restore
    this.master.gain.cancelScheduledValues(t);
    this.master.gain.setValueAtTime(0.8, t);
    this.master.gain.linearRampToValueAtTime(2.8, t + 0.08);
    this.master.gain.linearRampToValueAtTime(2.0, t + 1.0);
    this.master.gain.linearRampToValueAtTime(1.4, t + 3.0);
    this.master.gain.linearRampToValueAtTime(0.8, t + dur);
    // Initial ground crack — massive sharp low thud
    const crackBuf = this._whiteBuf(0.3);
    const crackSrc = this.ctx.createBufferSource(); crackSrc.buffer = crackBuf;
    const crackFilt = this.ctx.createBiquadFilter(); crackFilt.type = 'lowpass'; crackFilt.frequency.value = 80;
    const crackGain = this.ctx.createGain();
    crackGain.gain.setValueAtTime(8.0, t); crackGain.gain.exponentialRampToValueAtTime(0.001, t + 0.28);
    crackSrc.connect(crackFilt); crackFilt.connect(crackGain); crackGain.connect(this.master);
    crackSrc.start(t); crackSrc.stop(t + 0.3);
    // Second impact hit at 0.1s
    const crack2Buf = this._whiteBuf(0.2);
    const crack2Src = this.ctx.createBufferSource(); crack2Src.buffer = crack2Buf;
    const crack2Filt = this.ctx.createBiquadFilter(); crack2Filt.type = 'lowpass'; crack2Filt.frequency.value = 60;
    const crack2Gain = this.ctx.createGain();
    crack2Gain.gain.setValueAtTime(0.001, t); crack2Gain.gain.linearRampToValueAtTime(6.0, t + 0.1);
    crack2Gain.gain.exponentialRampToValueAtTime(0.001, t + 0.35);
    crack2Src.connect(crack2Filt); crack2Filt.connect(crack2Gain); crack2Gain.connect(this.master);
    crack2Src.start(t); crack2Src.stop(t + 0.4);
    // Sustained deep rumble — very loud
    const rumbleBuf = this._whiteBuf(dur);
    const rumbleSrc = this.ctx.createBufferSource(); rumbleSrc.buffer = rumbleBuf;
    const rumbleFilt = this.ctx.createBiquadFilter(); rumbleFilt.type = 'lowpass'; rumbleFilt.frequency.value = 55;
    const rumbleGain = this.ctx.createGain();
    rumbleGain.gain.setValueAtTime(0.001, t);
    rumbleGain.gain.linearRampToValueAtTime(5.5, t + 0.5);
    rumbleGain.gain.linearRampToValueAtTime(4.5, t + 4.0);
    rumbleGain.gain.linearRampToValueAtTime(0.001, t + dur);
    rumbleSrc.connect(rumbleFilt); rumbleFilt.connect(rumbleGain); rumbleGain.connect(this.master);
    rumbleSrc.start(t); rumbleSrc.stop(t + dur);
    // Mid-frequency rattle — things falling off shelves
    const rattleBuf = this._whiteBuf(dur);
    const rattleSrc = this.ctx.createBufferSource(); rattleSrc.buffer = rattleBuf;
    const rattleFilt = this.ctx.createBiquadFilter(); rattleFilt.type = 'bandpass'; rattleFilt.frequency.value = 400; rattleFilt.Q.value = 1.5;
    const rattleGain = this.ctx.createGain();
    rattleGain.gain.setValueAtTime(0.001, t);
    rattleGain.gain.linearRampToValueAtTime(2.0, t + 0.4);
    rattleGain.gain.linearRampToValueAtTime(1.0, t + 3.5);
    rattleGain.gain.linearRampToValueAtTime(0.001, t + dur);
    rattleSrc.connect(rattleFilt); rattleFilt.connect(rattleGain); rattleGain.connect(this.master);
    rattleSrc.start(t); rattleSrc.stop(t + dur);
    // Sub-bass oscillator boom — massive
    const sub = this.ctx.createOscillator();
    sub.type = 'sine'; sub.frequency.setValueAtTime(28, t);
    const subGain = this.ctx.createGain();
    subGain.gain.setValueAtTime(7.0, t); subGain.gain.exponentialRampToValueAtTime(0.001, t + 1.8);
    sub.connect(subGain); subGain.connect(this.master);
    sub.start(t); sub.stop(t + 1.9);
    // Second sub-bass pulse
    const sub2 = this.ctx.createOscillator();
    sub2.type = 'sine'; sub2.frequency.setValueAtTime(38, t + 0.3);
    const sub2Gain = this.ctx.createGain();
    sub2Gain.gain.setValueAtTime(0.001, t); sub2Gain.gain.linearRampToValueAtTime(4.5, t + 0.5);
    sub2Gain.gain.exponentialRampToValueAtTime(0.001, t + 2.5);
    sub2.connect(sub2Gain); sub2Gain.connect(this.master);
    sub2.start(t); sub2.stop(t + 2.6);
  },

  playEruptionRumble() {
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    const dur = 26;
    // Deep earth rumble — very low filtered noise
    const rumbleBuf = this._whiteBuf(dur);
    const rumbleSrc = this.ctx.createBufferSource(); rumbleSrc.buffer = rumbleBuf;
    const rumbleFilt = this.ctx.createBiquadFilter();
    rumbleFilt.type = 'lowpass'; rumbleFilt.frequency.setValueAtTime(45, t);

    rumbleGain.gain.linearRampToValueAtTime(0.85, t + 3.0);
    rumbleGain.gain.linearRampToValueAtTime(0.70, t + 14);
    rumbleGain.gain.linearRampToValueAtTime(0.001, t + dur);
    rumbleSrc.connect(rumbleFilt); rumbleFilt.connect(rumbleGain); rumbleGain.connect(this.master);
    rumbleSrc.start(t); rumbleSrc.stop(t + dur);
    // Mid roar — eruption body
    const roarBuf = this._whiteBuf(dur);
    const roarSrc = this.ctx.createBufferSource(); roarSrc.buffer = roarBuf;
    const roarFilt = this.ctx.createBiquadFilter();
    roarFilt.type = 'bandpass'; roarFilt.frequency.setValueAtTime(220, t); roarFilt.Q.value = 0.5;
    const roarGain = this.ctx.createGain();
    roarGain.gain.setValueAtTime(0.001, t);
    roarGain.gain.linearRampToValueAtTime(0.65, t + 2.0);
    roarGain.gain.linearRampToValueAtTime(0.40, t + 16);
    roarGain.gain.linearRampToValueAtTime(0.001, t + dur);
    roarSrc.connect(roarFilt); roarFilt.connect(roarGain); roarGain.connect(this.master);
    roarSrc.start(t); roarSrc.stop(t + dur);
    // Initial blast thud
    const blastBuf = this._whiteBuf(1.2);
    const blastSrc = this.ctx.createBufferSource(); blastSrc.buffer = blastBuf;
    const blastFilt = this.ctx.createBiquadFilter();
    blastFilt.type = 'lowpass'; blastFilt.frequency.setValueAtTime(100, t);
    const blastGain = this.ctx.createGain();
    blastGain.gain.setValueAtTime(1.5, t); blastGain.gain.exponentialRampToValueAtTime(0.001, t + 1.1);
    blastSrc.connect(blastFilt); blastFilt.connect(blastGain); blastGain.connect(this.master);
    blastSrc.start(t); blastSrc.stop(t + 1.2);

  playRocketLaunch() {
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    const dur = 6.0;
    // Main roar — broadband noise filtered to rocket exhaust
    const roarBuf = this._whiteBuf(dur);
    const roarSrc = this.ctx.createBufferSource();
    roarSrc.buffer = roarBuf;
    const roarFilt = this.ctx.createBiquadFilter();
    roarFilt.type = 'bandpass'; roarFilt.frequency.setValueAtTime(180, t); roarFilt.Q.value = 0.6;
    const roarFilt2 = this.ctx.createBiquadFilter();
    roarFilt2.type = 'highpass'; roarFilt2.frequency.setValueAtTime(60, t);
    const roarGain = this.ctx.createGain();
    roarGain.gain.setValueAtTime(0.001, t);
    roarGain.gain.linearRampToValueAtTime(1.35, t + 1.2);
    roarGain.gain.linearRampToValueAtTime(1.05, t + 3.0);
    roarGain.gain.linearRampToValueAtTime(0.001, t + dur);
    roarSrc.connect(roarFilt); roarFilt.connect(roarFilt2); roarFilt2.connect(roarGain); roarGain.connect(this.master);
    roarSrc.start(t); roarSrc.stop(t + dur);
    // Deep bass rumble — ground shake
    const rumbleBuf = this._whiteBuf(dur);
    const rumbleSrc = this.ctx.createBufferSource();
    rumbleSrc.buffer = rumbleBuf;
    const rumbleFilt = this.ctx.createBiquadFilter();
    rumbleFilt.type = 'lowpass'; rumbleFilt.frequency.setValueAtTime(55, t);
    const rumbleGain = this.ctx.createGain();
    rumbleGain.gain.setValueAtTime(0.001, t);
    rumbleGain.gain.linearRampToValueAtTime(1.125, t + 0.8);
    rumbleGain.gain.linearRampToValueAtTime(0.75, t + 3.5);
    rumbleGain.gain.linearRampToValueAtTime(0.001, t + dur);
    rumbleSrc.connect(rumbleFilt); rumbleFilt.connect(rumbleGain); rumbleGain.connect(this.master);
    rumbleSrc.start(t); rumbleSrc.stop(t + dur);
    // High crackle — ignition pop then sustained hiss
    const crackleBuf = this._whiteBuf(dur);
    const crackleSrc = this.ctx.createBufferSource();
    crackleSrc.buffer = crackleBuf;
    const crackleFilt = this.ctx.createBiquadFilter();
    crackleFilt.type = 'highpass'; crackleFilt.frequency.setValueAtTime(2200, t);
    const crackleGain = this.ctx.createGain();

    crackleGain.gain.exponentialRampToValueAtTime(0.225, t + 0.3);

    crackleSrc.connect(crackleFilt); crackleFilt.connect(crackleGain); crackleGain.connect(this.master);
    crackleSrc.start(t); crackleSrc.stop(t + dur);
    // Initial ignition thud
    const thudBuf = this._whiteBuf(0.5);
    const thudSrc = this.ctx.createBufferSource();
    thudSrc.buffer = thudBuf;
    const thudFilt = this.ctx.createBiquadFilter();
    thudFilt.type = 'lowpass'; thudFilt.frequency.setValueAtTime(90, t);
    const thudGain = this.ctx.createGain();
    thudGain.gain.setValueAtTime(1.5, t); thudGain.gain.exponentialRampToValueAtTime(0.001, t + 0.45);
    thudSrc.connect(thudFilt); thudFilt.connect(thudGain); thudGain.connect(this.master);
    thudSrc.start(t); thudSrc.stop(t + 0.5);
  },

  playPukeSplat() {
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    // Wet splat: filtered white noise burst
    const src = this.ctx.createBufferSource();
    src.buffer = this._whiteBuf(1);
    const f = this.ctx.createBiquadFilter();

    src.start(t); src.stop(t+0.55);
  },

let rafId = null, lastTs = null, lastRender = 0;

function startLoop() {
  lastTs = null; lastRender = 0;
  let lastAutoSave = 0;
  function tick(ts) {
    const dt = lastTs ? Math.min((ts - lastTs) / 1000, 0.12) : 0;
    lastTs = ts;
    try { if (G.screen === 'service' && G.isOpen) updateService(dt); } catch(e) { console.error('update err', e); }
    try { if (ts - lastRender >= 80) { lastRender = ts; renderService(); } } catch(e) { console.error('render err', e); }
    if (ts - lastAutoSave >= 60000) { lastAutoSave = ts; try { savePlayerState(); } catch(_) {} }
    rafId = requestAnimationFrame(tick);
  }
  rafId = requestAnimationFrame(tick);
}

function stopLoop() {
  if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
  lastTs = null;
}

function updateService(dt) {
  G.gameTime += dt * TIME_SPEED;
  window._serviceTimePct = Math.min(1, Math.max(0, (G.gameTime - SERVICE_START) / (SERVICE_END - SERVICE_START)));
  if (G.gameTime >= SERVICE_END) { endService(); return; }

  // cooking
  for (let i = 0; i < G.cookSlots.length; i++) {
    const s = G.cookSlots[i];
    if (s && s.state === 'cooking') {
      s.elapsed += dt;
      s.progress = Math.min(s.elapsed / (s.item.cook * COOK_TIME_MULT), 1);
      if (s.progress >= 1) {
        s.state = 'ready';
        s.readyAt = s.elapsed;
        toast(`${s.item.icon} ${s.item.en} is ready!`, 'info');
        AUDIO.playReady();
        autoServe(i);
        try { const area = document.getElementById('cook-area'); if (area) area.innerHTML = buildCookSlots(); } catch(_) {}
      }
    } else if (s && s.state === 'ready') {
      s.elapsed += dt;
      if (s.elapsed - s.readyAt >= 60) {
        toast(`${s.item.icon} ${s.item.en} went cold — discarded`, 'err');
        G.cookSlots[i] = null;
        try { const area = document.getElementById('cook-area'); if (area) area.innerHTML = buildCookSlots(); } catch(_) {}
        try { const mg = document.getElementById('menu-grid'); if (mg) mg.innerHTML = buildMenuItems(); } catch(_) {}
      }
    }
  }

  // spawn customers
  G.spawnTimer -= dt;
  if (G.spawnTimer <= 0) {
    const base = 12 + Math.random() * 24;
    G.spawnTimer = base / (G.weather?.custMult || 1);
    try { spawnCust(); } catch(e) { console.error('spawn err', e); }
  }

  // patience
  for (let i = G.customers.length - 1; i >= 0; i--) {
    const c = G.customers[i];
    if (c.state === 'wait') {
      if (c.isPlayer || c.peerId) continue; // human players manage their own ordering, no timeout
      c.patLeft -= dt * 0.4;
      if (c.patLeft <= 0) {
        c.state = 'gone';
        G.todayLost++;
        G.rep = Math.max(0, G.rep - 5);
        AUDIO.playLeave();
        toast(`${c.icon} ${c.en} left unhappy`, 'err');
        try { const mg = document.getElementById('menu-grid'); if (mg) mg.innerHTML = buildMenuItems(); } catch(_) {}
        setTimeout(() => {
          const idx = G.customers.indexOf(c);
          if (idx !== -1) G.customers.splice(idx, 1);
        }, 600);
      }
    }
  }

  // Auto cook — fill free slots for waiting customers
  if (G.autoCook) {
    const inPipeline = {};
    G.cookSlots.forEach(s => { if (s) inPipeline[s.item.id] = (inPipeline[s.item.id] || 0) + 1; });
    let started = false;
    for (const c of G.customers) {
      if (c.state !== 'wait' || !c.order) continue;
      const id = c.order.id;
      if (inPipeline[id] > 0) { inPipeline[id]--; continue; }
      const freeIdx = G.cookSlots.findIndex(s => s === null);
      if (freeIdx === -1) break;
      const shopItem = SHOP.find(s => s.forItem === id);
      if (!shopItem || G.inv[shopItem.id] <= 0) continue;
      G.inv[shopItem.id]--;
      G.cookSlots[freeIdx] = { item: c.order, state: 'cooking', elapsed: 0, progress: 0 };
      inPipeline[id] = (inPipeline[id] || 0) + 1;
      started = true;
      try { AUDIO.playSizzle(); } catch(_) {}
    }
    if (started) {
      try { const el = document.getElementById('cook-area'); if (el) el.innerHTML = buildCookSlots(); } catch(_) {}
      try { const el = document.getElementById('menu-grid'); if (el) el.innerHTML = buildMenuItems(); } catch(_) {}
    }
  }
}

function autoServe(slotIdx) {
  const slot = G.cookSlots[slotIdx];
  if (!slot || slot.state !== 'ready') return;
  const cust = G.customers.find(c => c.state === 'wait' && c.order && c.order.id === slot.item.id);
  if (cust) doServe(cust, slotIdx);
}

function doServe(cust, slotIdx) {
  const slot = G.cookSlots[slotIdx];
  const price = Math.round(slot.item.price * (G.weather?.tipMult || 1));
  cust.state = 'served';
  G.cookSlots[slotIdx] = null;
  G.money += price;
  G.todayEarned += price;
  G.todayServed++;
  G.rep = Math.min(100, G.rep + 1);
  AUDIO.playServe();
  floatYen(`+¥${price}`);
  try { if (window._iifeMasterServe) window._iifeMasterServe(slot.item.id); } catch(_) {}
  if (cust.peerId) {
    try { MP.notifyServed(cust.peerId, slot.item.id); } catch(_) {}
    // Post a durable message so the guest's poll loop reliably picks it up
    try { MP._post(MP.roomCode, { type: 'msg', guestId: cust.peerId, data: { type: 'served', itemId: slot.item.id } }); } catch(_) {}
  }
  try { const area = document.getElementById('cook-area'); if (area) area.innerHTML = buildCookSlots(); } catch(_) {}
  try { const mg = document.getElementById('menu-grid'); if (mg) mg.innerHTML = buildMenuItems(); } catch(_) {}
  setTimeout(() => {
    if (cust.isPlayer || cust.peerId) {
      // Human player — remove from queue; they'll send another order if they want more
      const idx = G.customers.indexOf(cust);
      if (idx !== -1) G.customers.splice(idx, 1);
      return;
    }
    if (!cust.reordered && Math.random() < 0.35) {
      const claimed = {};
      G.customers.filter(c => c.state === 'wait' && c.order).forEach(c => { claimed[c.order.id] = (claimed[c.order.id] || 0) + 1; });
      const available = MENU.filter(m => {
        const s = SHOP.find(x => x.forItem === m.id);
        return s && G.inv[s.id] - (claimed[m.id] || 0) > 0;
      });
      if (available.length > 0) {
        cust.order = available[Math.floor(Math.random() * available.length)];
        cust.patLeft = cust.patMax * 0.75;
        cust.reordered = true;
        cust.state = 'wait';
        console.error('[NPC REORDER]', cust.en, 'reordered', cust.order.en);
        AUDIO.playArrive();
        toast(`${cust.icon} ${cust.en} wants another round! ${cust.order.icon}`, 'info');
        const rid = cust.order.id;
        if (window._iifeOrderSpeech) setTimeout(() => { try { window._iifeOrderSpeech(rid); } catch(_) {} }, 400);
        try { const cl = document.getElementById('customer-list'); if (cl) cl.innerHTML = buildCustList(); } catch(_) {}
        try { const mg = document.getElementById('menu-grid'); if (mg) mg.innerHTML = buildMenuItems(); } catch(_) {}
        // Serve immediately if matching food is already ready
        for (let si = 0; si < G.cookSlots.length; si++) {
          const s = G.cookSlots[si];
          if (s && s.item && s.state === 'ready' && s.item.id === cust.order.id) { autoServe(si); break; }
        }
        return;
      }
    }
    const idx = G.customers.indexOf(cust);
    if (idx !== -1) G.customers.splice(idx, 1);
  }, SERVE_LINGER_MS);
}

function spawnCust() {
  const waitingList = G.customers.filter(c => c.state === 'wait');
  if (waitingList.length >= 4) return;

  // Count how many of each item are already claimed by waiting customers
  const claimed = {};
  waitingList.filter(c => c.order).forEach(c => { claimed[c.order.id] = (claimed[c.order.id] || 0) + 1; });

  const canOrder = pid => {
    const m = MENU.find(x => x.id === pid);
    if (!m || m.day > G.day) return false;
    const s = SHOP.find(x => x.forItem === pid);
    if (!s) return false;
    return G.inv[s.id] - (claimed[pid] || 0) > 0;
  };

  const type = CUST_TYPES[Math.floor(Math.random() * CUST_TYPES.length)];
  const avail = type.prefs.filter(canOrder);

  let order;
  if (avail.length > 0) {
    order = MENU.find(m => m.id === avail[Math.floor(Math.random() * avail.length)]);
  }
  if (!order) {
    const any = MENU.filter(m => canOrder(m.id));
    if (!any.length) return;
    order = any[Math.floor(Math.random() * any.length)];
  }
  if (!order) return;

  const pat = type.patience * (0.85 + Math.random() * 0.3);
  console.error('[NPC SPAWN]', type.en, 'ordered', order.en);
  G.customers.push({
    id: G.nextId++,
    type: type.type, jp: type.jp, en: type.en, icon: type.icon,
    order, patMax: pat, patLeft: pat, state: 'wait'
  });
  AUDIO.playArrive();
  if (order && window._iifeOrderSpeech) setTimeout(() => { try { window._iifeOrderSpeech(order.id); } catch(_) {} }, 400);
  try { const mg = document.getElementById('menu-grid'); if (mg) mg.innerHTML = buildMenuItems(); } catch(_) {}
  for (let si = 0; si < G.cookSlots.length; si++) {
    const _rs = G.cookSlots[si];
    if (_rs && _rs.item && _rs.state === 'ready' && _rs.item.id === order.id) { autoServe(si); break; }
  }
}

  const c01  = t => Math.max(0, Math.min(1, t));
  const ph   = (s, e, T) => eo3(c01((T - s) / (e - s)));

  function finish() {

  const STARS = Array.from({length:90}, (_,i) => ({
    x: ((i*137+41)%997)/997,
    y: ((i*79+23)%997)/997 * 0.55,
    r: i%5===0 ? 1.4 : 0.55,
    a: 0.2 + (i%9)/18,
  }));

  function drawScene(T, offsetX) {
    const CX = W*0.50 + offsetX;
    const sw = Math.min(W*0.60, 420);
    const sx = CX - sw/2, ex = CX + sw/2;
    const roofPeak = H*0.26, eaveY = H*0.39;
    const counterY = H*0.57, baseY = H*0.67, wheelCY = H*0.715;
    const wheelR = H*0.046;

    // Ground
    g.fillStyle = '#09080a';
    g.fillRect(0, wheelCY + wheelR*0.6, W, H - wheelCY - wheelR*0.6);
    g.strokeStyle = 'rgba(60,40,20,0.25)'; g.lineWidth = 1;
    g.beginPath(); g.moveTo(0, wheelCY + wheelR*0.6); g.lineTo(W, wheelCY + wheelR*0.6); g.stroke();

    // ── WHEELS ──
    const wheelXs = [sx + sw*0.14, ex - sw*0.14];
    const spokeA = offsetX * 0.025;
    wheelXs.forEach(wx => {
      g.fillStyle = 'rgba(0,0,0,0.35)';
      g.beginPath(); g.ellipse(wx+3, wheelCY + wheelR*0.15, wheelR*1.05, wheelR*0.28, 0, 0, Math.PI*2); g.fill();
      g.fillStyle = '#18100a';
      g.beginPath(); g.arc(wx, wheelCY, wheelR, 0, Math.PI*2); g.fill();
      g.strokeStyle = '#3a2008'; g.lineWidth = 2.5;
      g.beginPath(); g.arc(wx, wheelCY, wheelR, 0, Math.PI*2); g.stroke();
      for (let sp=0;sp<6;sp++) {
        const a = spokeA + sp*Math.PI/3;
        g.strokeStyle = '#2e1a08'; g.lineWidth = 1.5;
        g.beginPath(); g.moveTo(wx,wheelCY); g.lineTo(wx+Math.cos(a)*wheelR*0.82, wheelCY+Math.sin(a)*wheelR*0.82); g.stroke();
      }
      g.fillStyle = '#6a3a14'; g.beginPath(); g.arc(wx,wheelCY,wheelR*0.13,0,Math.PI*2); g.fill();
    });

    // ── CART BODY ──
    g.fillStyle = '#1e1006';
    g.fillRect(sx, baseY, sw, wheelCY - baseY + wheelR*0.2);
    g.fillStyle = '#2a1808';
    g.fillRect(sx - 4, counterY + H*0.025, sw + 8, baseY - counterY - H*0.025);
    // Vertical planks
    g.strokeStyle = 'rgba(60,35,12,0.6)'; g.lineWidth = 1;
    for (let pl=1;pl<5;pl++) {
      const px = sx + sw*pl/5;
      g.beginPath(); g.moveTo(px, counterY+H*0.03); g.lineTo(px, baseY); g.stroke();
    }

    // ── COUNTER ──
    g.fillStyle = '#3d2008';
    g.beginPath();
    g.moveTo(sx - 6, counterY);
    g.lineTo(ex + 6, counterY);
    g.lineTo(ex + 6, counterY + H*0.028);
    g.lineTo(sx - 6, counterY + H*0.028);
    g.closePath(); g.fill();
    g.fillStyle = '#5c3212';
    g.fillRect(sx-6, counterY, sw+12, H*0.006);

    // ── INTERIOR GLOW (fades as lights go out) ──
    const lightFade = Math.max(0, 1 - ph(0.8, 2.5, T));
    if (lightFade > 0) {
      const ig = g.createLinearGradient(sx, eaveY, sx, counterY);
      ig.addColorStop(0, `rgba(255,180,60,${lightFade*0.18})`);
      ig.addColorStop(1, `rgba(255,140,30,${lightFade*0.06})`);
      g.fillStyle = ig;
      g.fillRect(sx+2, eaveY, sw-4, counterY-eaveY);
    }

    // ── SIDE POSTS ──
    g.fillStyle = '#2a1608';
    g.fillRect(sx, eaveY, sw*0.045, counterY - eaveY);
    g.fillRect(ex - sw*0.045, eaveY, sw*0.045, counterY - eaveY);

    // ── NOREN ──
    const norenRise = ph(2.2, 3.8, T);
    const norenTopY = eaveY + H*0.008;
    const norenBotY = lr(counterY - H*0.015, norenTopY + H*0.005, norenRise);
    if (norenBotY > norenTopY + 4) {
      const panelW = sw * 0.27, gap = sw * 0.035;
      const totalPW = 3*panelW + 2*gap;
      const npx = CX - totalPW/2;
      [0,1,2].forEach(pi => {
        const px = npx + pi*(panelW+gap);
        const col = pi===1 ? '#a01818' : '#8a1212';
        g.fillStyle = col;
        g.beginPath();
        g.moveTo(px, norenTopY);
        g.lineTo(px+panelW, norenTopY);
        g.lineTo(px+panelW, norenBotY - H*0.008);
        g.quadraticCurveTo(px+panelW*0.5, norenBotY+H*0.006, px, norenBotY - H*0.008);
        g.closePath(); g.fill();
        // White stripe near top
        g.fillStyle = 'rgba(255,240,220,0.15)';
        g.fillRect(px, norenTopY, panelW, H*0.005);
        if (pi===1) {
          g.fillStyle = 'rgba(255,220,140,0.85)';
          g.font = `bold ${Math.round((norenBotY-norenTopY)*0.55)}px serif`;
          g.textAlign = 'center';
          g.fillText('夜台', px+panelW/2, (norenTopY+norenBotY)*0.5 + (norenBotY-norenTopY)*0.18);
        }
      });
      // Noren rod
      g.strokeStyle = '#7a5020'; g.lineWidth = 3;
      g.beginPath(); g.moveTo(npx - 4, norenTopY); g.lineTo(npx+totalPW+4, norenTopY); g.stroke();
    }

    // ── ROOF ──
    // Underside
    g.fillStyle = '#1a0e06';
    g.beginPath();
    g.moveTo(sx - sw*0.06, eaveY);
    g.lineTo(CX, roofPeak);
    g.lineTo(ex + sw*0.06, eaveY);
    g.closePath(); g.fill();
    // Top surface
    g.fillStyle = '#221208';
    g.beginPath();
    g.moveTo(sx - sw*0.06, eaveY - H*0.008);
    g.lineTo(CX, roofPeak - H*0.01);
    g.lineTo(ex + sw*0.06, eaveY - H*0.008);
    g.closePath(); g.fill();
    // Ridge cap
    g.fillStyle = '#3a2010';
    g.fillRect(CX - sw*0.04, roofPeak - H*0.018, sw*0.08, H*0.018);
    // Eave edge
    g.strokeStyle = '#5c3010'; g.lineWidth = 3;
    g.beginPath(); g.moveTo(sx - sw*0.07, eaveY); g.lineTo(ex + sw*0.07, eaveY); g.stroke();
    // Roof tiles (horizontal lines)
    g.strokeStyle = 'rgba(80,48,18,0.45)'; g.lineWidth = 1;
    for (let ti=1; ti<7; ti++) {
      const t2 = ti/7;
      const ty = lr(roofPeak, eaveY, t2);
      const tx = sw*0.5 * t2;
      g.beginPath(); g.moveTo(CX-tx - sw*0.06*t2, ty); g.lineTo(CX+tx + sw*0.06*t2, ty); g.stroke();
    }

    // ── LANTERNS ──
    const lampXs = [CX - sw*0.32, CX, CX + sw*0.32];
    const dimTimes = [1.4, 0.7, 1.9];
    lampXs.forEach((lx, li) => {
      const dimT = dimTimes[li];
      const lAl = Math.max(0, 1 - ph(dimT, dimT+0.55, T));
      const ly = eaveY - H*0.075;
      const lr2 = H*0.038;

      // Hanging cord
      g.strokeStyle = 'rgba(80,50,20,0.55)'; g.lineWidth = 1.2;
      g.beginPath(); g.moveTo(lx, eaveY - H*0.004); g.lineTo(lx, ly - lr2); g.stroke();

      // Glow halo
      if (lAl > 0.05) {
        const gl = g.createRadialGradient(lx, ly, 0, lx, ly, lr2*5);
        gl.addColorStop(0, `rgba(255,130,30,${lAl*0.38})`);
        gl.addColorStop(0.5, `rgba(255,90,10,${lAl*0.10})`);
        gl.addColorStop(1, 'rgba(0,0,0,0)');
        g.beginPath(); g.arc(lx, ly, lr2*5, 0, Math.PI*2);
        g.fillStyle = gl; g.fill();
      }

      // Body
      const bodyR = lAl > 0 ? Math.round(lr(30, 220, lAl)) : 40;
      const bodyG2 = lAl > 0 ? Math.round(lr(12, 80, lAl)) : 15;
      const bodyB  = lAl > 0 ? Math.round(lr(5,  18, lAl)) : 8;
      g.fillStyle = `rgb(${bodyR},${bodyG2},${bodyB})`;
      g.beginPath(); g.ellipse(lx, ly, lr2*0.62, lr2, 0, 0, Math.PI*2); g.fill();

      // Ribs
      g.strokeStyle = 'rgba(20,8,2,0.6)'; g.lineWidth = 0.9;
      for (let rb=-2;rb<=2;rb++) {
        const ry2 = ly + rb*lr2*0.38;
        const rw = lr2*0.62 * Math.sqrt(1 - Math.pow(rb*0.38,2));
        g.beginPath(); g.moveTo(lx-rw, ry2); g.lineTo(lx+rw, ry2); g.stroke();
      }

      // Top & bottom caps
      g.fillStyle = '#7a4010';
      g.beginPath(); g.ellipse(lx, ly-lr2+H*0.002, lr2*0.3, H*0.006, 0, 0, Math.PI*2); g.fill();
      g.beginPath(); g.ellipse(lx, ly+lr2-H*0.002, lr2*0.3, H*0.006, 0, 0, Math.PI*2); g.fill();

      // 夜 kanji
      if (lAl > 0.2) {
        g.fillStyle = `rgba(255,210,80,${lAl*0.92})`;
        g.font = `bold ${Math.round(lr2*0.82)}px serif`;
        g.textAlign = 'center';
        g.fillText('夜', lx, ly + lr2*0.30);
      }
    });

    // ── CLOSING TEXT ──
    const txtA = Math.min(1, ph(0.2,0.9,T)) * Math.max(0, 1-ph(4.2,5.0,T));
    if (txtA > 0) {
      g.save(); g.globalAlpha = txtA;
      g.fillStyle = 'rgba(255,200,100,0.95)';
      g.font = `bold ${Math.round(H*0.072)}px serif`;
      g.textAlign = 'center';
      g.shadowColor = 'rgba(255,120,20,0.7)'; g.shadowBlur = 28;
      g.fillText('閉店', W*0.5, H*0.165);
      g.shadowBlur = 0;
      g.font = `${Math.round(H*0.024)}px serif`;
      g.fillStyle = 'rgba(200,170,110,0.75)';
      g.fillText('Thank you for tonight', W*0.5, H*0.215);
      g.restore();
    }
  }

  function frame(ts) {
    if (done) return;
    if (!t0) t0 = ts;
    const T = (ts - t0) / 1000;
    if (T >= TOTAL) { finish(); return; }

    // Dark overlay — photo shows through, fades to black at end
    const skyFade = ph(6.8, 8.2, T);
    const overlayA = (0.70 + 0.30 * skyFade).toFixed(2);
    g.fillStyle = `rgba(1,3,8,${overlayA})`;
    g.fillRect(0, 0, W, H);

    // Stars
    STARS.forEach(s => {
      const twink = s.a * (0.7 + 0.3*Math.sin(T*1.8 + s.x*6));
      g.fillStyle = `rgba(255,255,255,${(twink*(1-skyFade)).toFixed(2)})`;
      g.beginPath(); g.arc(s.x*W, s.y*H, s.r, 0, Math.PI*2); g.fill();
    });

    // Stall slides right starting at t=4.2
    const slide = ph(4.2, 7.2, T);
    const offsetX = slide * W * 1.35;

    drawScene(T, offsetX);

    // Final fade to black
    if (T > 6.8) {
      g.fillStyle = `rgba(0,0,0,${ph(6.8, 8.0, T)})`;
      g.fillRect(0, 0, W, H);
    }

    requestAnimationFrame(frame);
  }

  requestAnimationFrame(frame);
}

function endService() {
  G.isOpen = false;
  window.stallOpen = false;
  window._serviceTimePct = 0;
  stopLoop();
  AUDIO.stopService();
  clearInterval(window._llmOutfitTimer);
  savePlayerState();
  // Clear host canvas bubbles, turn off TV
  if (window._clearBubbles) window._clearBubbles();
  try { if (window._tvSetOn) { window._tvSetOn(false); const _tvb = document.getElementById('tv-btn'); if (_tvb) _tvb.style.opacity = '0.35'; } } catch(_) {}
  G.customers = [];
  G.cookSlots = G.cookSlots.map(() => null);
  // Flush MP state and send terminal broadcast so guests clear their NPC/order/speech state
  if (typeof MP !== 'undefined') {
    MP._pendingServed = {};
    MP.stopBroadcastLoop();
    if (MP._post && MP.roomCode) {
      try {
        MP._post(MP.roomCode, { type: 'state', data: { isOpen: false, slotState: [], customers: [], cookSlots: [], menu: [], speech: [], events: [], dialog: [], dialogDelta: [] } });
      } catch(_) {}
    }
  }
  playOutro(() => {
    G.screen = 'review';
    fullRender();
    if (window._startReviewAutoAdvance) window._startReviewAutoAdvance();
  });
}

// ─────────────────────────────────────────────
// ACTIONS (called from HTML onclick)
// ─────────────────────────────────────────────
// ─────────────────────────────────────────────
// INTRO CUTSCENE
// ─────────────────────────────────────────────
function playIntro(onDone) {
  const _KAG = 'sakurajima.jpg';
  const bgEl = document.createElement('div');
  bgEl.style.cssText = `position:fixed;inset:0;z-index:499;background:url('${_KAG}') center/cover no-repeat;`;
  document.body.appendChild(bgEl);

  const ic = document.createElement('canvas');
  ic.style.cssText = 'position:fixed;inset:0;z-index:500;pointer-events:all;';
  ic.width = window.innerWidth; ic.height = window.innerHeight;
  document.body.appendChild(ic);

  const skipBtn = document.createElement('button');
  skipBtn.textContent = 'SKIP ›';
  skipBtn.style.cssText = 'position:fixed;bottom:28px;right:24px;z-index:501;' +
    'background:rgba(0,0,0,.42);color:rgba(255,255,255,.40);' +
    'border:1px solid rgba(255,255,255,.15);border-radius:4px;' +
    'padding:7px 16px;font-size:12px;letter-spacing:1px;cursor:pointer;font-family:inherit;';
  document.body.appendChild(skipBtn);

  const g = ic.getContext('2d');
  const W = ic.width, H = ic.height;
  let t0 = null, done = false, doneFired = false;
  const TOTAL = 13.5;

  const eo3 = t => 1 - Math.pow(1 - t, 3);
  const lr   = (a, b, t) => a + (b - a) * t;
  const c01  = t => Math.max(0, Math.min(1, t));
  const ph   = (s, e, T) => eo3(c01((T - s) / (e - s)));

  function finish() {
    if (done) return; done = true;
    if (!doneFired) { doneFired = true; onDone(); }
    let a = 1;
    const id = setInterval(() => {
      a -= 0.06;
      const op = Math.max(0, a).toFixed(2);
      ic.style.opacity = op; bgEl.style.opacity = op;
      if (a <= 0) { clearInterval(id); ic.remove(); skipBtn.remove(); bgEl.remove(); }
    }, 16);
  }
  skipBtn.onclick = finish;

  function drawStars(alpha) {
    for (let i = 0; i < 110; i++) {
      const sx = ((i*137+41)%997)/997*W, sy = ((i*79+23)%997)/997*H*0.42;
      const sr = i%5===0?1.5:0.65, sa = (0.25+(i%9)/18)*alpha;
      g.fillStyle = `rgba(255,255,255,${sa.toFixed(2)})`;
      g.beginPath(); g.arc(sx,sy,sr,0,Math.PI*2); g.fill();
    }
  }

  function drawBldgs() {
    g.fillStyle = '#020508';
    [[0,.20,.13],[.10,.30,.09],[.07,.14,.055],[.78,.18,.13],[.87,.27,.13],[.82,.11,.065]]
      .forEach(([x,y,w]) => g.fillRect(x*W,y*H,w*W,H));
    g.fillStyle = '#030609';
    [[.22,.36,.07],[.66,.33,.09]].forEach(([x,y,w]) => g.fillRect(x*W,y*H,w*W,H));
  }

  function drawRoad() {
    const gr = g.createLinearGradient(0,H*.68,0,H);
    gr.addColorStop(0,'#070b14'); gr.addColorStop(1,'#040710');
    g.fillStyle = gr; g.fillRect(0,H*.68,W,H*.32);
    const rf = g.createRadialGradient(W*.5,H*.71,0,W*.5,H*.71,W*.42);
    rf.addColorStop(0,'rgba(255,130,40,.06)'); rf.addColorStop(1,'rgba(0,0,0,0)');
    g.fillStyle = rf; g.fillRect(0,H*.68,W,H*.32);
  }

  function drawWheel(cx, cy, r, rot) {
    g.save();
    g.fillStyle = '#2a1408'; g.beginPath(); g.arc(cx,cy,r,0,Math.PI*2); g.fill();
    g.strokeStyle = '#5c3010'; g.lineWidth = r*.22;
    g.beginPath(); g.arc(cx,cy,r,0,Math.PI*2); g.stroke();
    g.strokeStyle = '#4a2808'; g.lineWidth = r*.09;
    for (let i = 0; i < 8; i++) {
      const a = rot + i/8*Math.PI*2;
      g.beginPath(); g.moveTo(cx,cy); g.lineTo(cx+Math.cos(a)*r*.88, cy+Math.sin(a)*r*.88); g.stroke();
    }
    g.fillStyle = '#7a3818'; g.beginPath(); g.arc(cx,cy,r*.14,0,Math.PI*2); g.fill();
    g.restore();
  }

  function drawCartYatai(cx, gndY, rollPh, setupPh) {
    const cW      = lr(W*.20, W*.88, setupPh);
    const wr      = H*.048;
    const bodyH   = H*.22;
    const bodyTop = gndY - bodyH;
    const roofEdgeY = bodyTop;
    const roofPeakY = lr(bodyTop - H*.025, bodyTop - H*.19, setupPh);
    const wRot    = -(rollPh * W * 1.2) / (wr * 2);

    // Wheels (fade out as stall unfolds)
    const wfa = c01(1 - setupPh*3.5);
    if (wfa > 0) {
      g.globalAlpha = wfa;
      drawWheel(cx - cW*.44, gndY - wr, wr, wRot);
      drawWheel(cx + cW*.44, gndY - wr, wr, wRot);
      g.globalAlpha = 1;
    }

    // Tow pole (fades as cart stops)
    const pfa = c01(1 - rollPh*1.6 - setupPh*5);
    if (pfa > 0) {
      g.globalAlpha = pfa;
      g.strokeStyle = '#5c3010'; g.lineWidth = W*.008; g.lineCap = 'round';
      g.beginPath(); g.moveTo(cx-cW*.44, gndY-H*.08); g.lineTo(cx-cW*.44-W*.18, gndY-H*.035); g.stroke();
      g.globalAlpha = 1;
    }

    // Back wall
    const wall = g.createLinearGradient(0,bodyTop,0,gndY);
    wall.addColorStop(0,'#1c1005'); wall.addColorStop(1,'#120c04');
    g.fillStyle = wall; g.fillRect(cx-cW*.50, bodyTop, cW, bodyH);

    // Tarp/cover (canvas wrap when folded)
    const tfa = c01(1 - setupPh*8);
    if (tfa > 0) {
      g.globalAlpha = tfa;
      g.fillStyle = '#2a3a28';
      g.beginPath(); g.moveTo(cx-cW*.50,roofEdgeY); g.lineTo(cx,roofPeakY+H*.01); g.lineTo(cx+cW*.50,roofEdgeY); g.closePath(); g.fill();
      g.strokeStyle = '#c8a860'; g.lineWidth = 1.5;
      [-cW*.30, 0, cW*.30].forEach(dx => {
        g.beginPath(); g.moveTo(cx+dx,roofEdgeY); g.lineTo(cx+dx*.35,roofPeakY+H*.006); g.stroke();
      });
      g.globalAlpha = 1;
    }

    // Roof (rises as stall opens)
    const roofGr = g.createLinearGradient(0,roofPeakY,0,roofEdgeY);
    roofGr.addColorStop(0,'#180e04'); roofGr.addColorStop(1,'#281605');
    g.fillStyle = roofGr;
    g.beginPath(); g.moveTo(cx-cW*.52,roofEdgeY); g.lineTo(cx,roofPeakY); g.lineTo(cx+cW*.52,roofEdgeY); g.closePath(); g.fill();
    g.strokeStyle = '#3a2010'; g.lineWidth = 2.5;
    g.beginPath(); g.moveTo(cx-cW*.52,roofEdgeY); g.lineTo(cx,roofPeakY); g.lineTo(cx+cW*.52,roofEdgeY); g.stroke();

    // Interior warm glow
    if (setupPh > .25) {
      const ia = c01((setupPh-.25)/.30);
      const ctrY = bodyTop + bodyH*.54;
      const ig = g.createRadialGradient(cx,ctrY-H*.04,0,cx,ctrY,cW*.44);
      ig.addColorStop(0,`rgba(255,140,50,${(.15*ia).toFixed(2)})`); ig.addColorStop(1,'rgba(0,0,0,0)');
      g.fillStyle = ig; g.fillRect(cx-cW*.5,roofEdgeY,cW,bodyH);
    }

    // NOREN strips drop in
    if (setupPh > .32) {
      const np = c01((setupPh-.32)/.44);
      const nH = lr(0, H*.13, np);
      const strips = 9, sw2 = cW/strips;
      for (let i = 0; i < strips; i++) {
        const nx = cx-cW*.50+i*sw2+sw2*.08, nw = sw2*.84;
        const ng2 = g.createLinearGradient(nx,roofEdgeY,nx,roofEdgeY+nH);
        ng2.addColorStop(0,'#18154a'); ng2.addColorStop(1,'#100e38');
        g.fillStyle = ng2; g.fillRect(nx,roofEdgeY,nw,nH);
        g.strokeStyle = 'rgba(255,255,255,.04)'; g.lineWidth = .8;
        g.beginPath(); g.moveTo(nx,roofEdgeY); g.lineTo(nx,roofEdgeY+nH); g.stroke();
      }
      if (np > .58 && nH > 0) {
        g.globalAlpha = c01((np-.58)/.42) * .40;
        g.fillStyle = 'rgba(180,170,240,1)';
        g.font = `bold ${Math.floor(nH*.55)}px serif`;
        g.textAlign = 'center';
        g.fillText('拉', cx-cW*.22, roofEdgeY+nH*.65);
        g.fillText('麺', cx+cW*.22, roofEdgeY+nH*.65);
        g.globalAlpha = 1;
      }
    }

    // Counter top extends outward
    if (setupPh > .40) {
      const cp = c01((setupPh-.40)/.35);
      g.globalAlpha = cp;
      const ctrY = bodyTop + bodyH*.54;
      const ctGr = g.createLinearGradient(0,ctrY,0,ctrY+H*.04);
      ctGr.addColorStop(0,'#604818'); ctGr.addColorStop(1,'#3c2a0a');
      g.fillStyle = ctGr; g.fillRect(cx-cW*.52, ctrY, cW*1.04, H*.04);
      g.fillStyle = 'rgba(255,200,80,.14)'; g.fillRect(cx-cW*.52, ctrY, cW*1.04, 2);
      g.globalAlpha = 1;
    }

    // Support posts
    if (setupPh > .15) {
      g.globalAlpha = c01((setupPh-.15)/.25);
      g.fillStyle = '#311505';
      [cx-cW*.47, cx+cW*.47].forEach(px => g.fillRect(px-W*.007, roofEdgeY, W*.012, bodyH+H*.04));
      g.globalAlpha = 1;
    }

    // Lanterns light up one by one
    [cx-cW*.36, cx, cx+cW*.36].forEach((lx, i) => {
      const ls = .60 + i*.13;
      const lp = c01((setupPh-ls)/.18);
      if (lp <= 0) return;
      const ly = roofEdgeY, lrx = W*.016, lry = H*.032;
      g.globalAlpha = lp;
      g.strokeStyle = '#3a2010'; g.lineWidth = 1.5;
      g.beginPath(); g.moveTo(lx,ly-8); g.lineTo(lx,ly); g.stroke();
      g.fillStyle = '#c03010';
      g.beginPath(); g.ellipse(lx,ly+lry*.5,lrx,lry*.52,0,0,Math.PI*2); g.fill();
      const ig2 = g.createRadialGradient(lx,ly+lry*.5,0,lx,ly+lry*.5,lrx*.85);
      ig2.addColorStop(0,'rgba(255,215,90,.90)'); ig2.addColorStop(1,'rgba(255,100,10,0)');
      g.fillStyle = ig2; g.beginPath(); g.ellipse(lx,ly+lry*.5,lrx*.85,lry*.44,0,0,Math.PI*2); g.fill();
      const glowR = W*.10*lp;
      const gr2 = g.createRadialGradient(lx,ly,0,lx,ly,glowR);
      gr2.addColorStop(0,`rgba(255,160,50,${(.22*lp).toFixed(2)})`); gr2.addColorStop(1,'rgba(0,0,0,0)');
      g.fillStyle = gr2; g.beginPath(); g.arc(lx,ly,glowR,0,Math.PI*2); g.fill();
      g.globalAlpha = 1;
    });
  }

  function drawMaster(cx, gndY, walking, T, faceRight) {
    const bH = H*.17;
    const stride = walking ? Math.sin(T*5.5)*.32 : 0;
    const waistY = gndY - bH*.42, shldrY = gndY - bH*.70;
    const headCy = gndY - bH + W*.018;
    const hr = W*.019;

    g.save(); g.translate(cx, 0);
    if (faceRight) g.scale(-1, 1);

    // Back leg
    const bkKX = Math.sin(-stride*.3)*bH*.22, bkKY = waistY+bH*.22;
    g.strokeStyle = '#1a1a2a'; g.lineWidth = W*.013; g.lineCap = 'round';
    g.beginPath(); g.moveTo(W*.003,waistY); g.lineTo(bkKX,bkKY); g.stroke();
    g.lineWidth = W*.010;
    g.beginPath(); g.moveTo(bkKX,bkKY); g.lineTo(bkKX+Math.sin(-stride*.15)*bH*.22, gndY); g.stroke();
    g.fillStyle = '#120e0e';
    g.beginPath(); g.ellipse(bkKX+Math.sin(-stride*.15)*bH*.22+W*.009, gndY, W*.012,H*.005,.1,0,Math.PI*2); g.fill();

    // Body + apron
    g.fillStyle = '#1e2850';
    g.beginPath(); g.moveTo(-W*.015,shldrY); g.lineTo(-W*.017,waistY); g.lineTo(W*.017,waistY); g.lineTo(W*.015,shldrY); g.closePath(); g.fill();
    g.fillStyle = '#ddd8c8';
    g.beginPath(); g.moveTo(-W*.007,shldrY+H*.022); g.lineTo(-W*.007,waistY); g.lineTo(W*.007,waistY); g.lineTo(W*.007,shldrY+H*.022); g.closePath(); g.fill();

    // Front leg
    const frKX = Math.sin(stride*.3)*bH*.22, frKY = waistY+bH*.22;
    g.strokeStyle = '#1a1a2a'; g.lineWidth = W*.015; g.lineCap = 'round';
    g.beginPath(); g.moveTo(-W*.003,waistY+H*.003); g.lineTo(frKX,frKY); g.stroke();
    g.lineWidth = W*.012;
    g.beginPath(); g.moveTo(frKX,frKY); g.lineTo(frKX+Math.sin(stride*.15)*bH*.22, gndY); g.stroke();
    g.fillStyle = '#120e0e';
    g.beginPath(); g.ellipse(frKX+Math.sin(stride*.15)*bH*.22+W*.010, gndY, W*.014,H*.005,.1,0,Math.PI*2); g.fill();

    // Arms
    g.strokeStyle = '#1e2850'; g.lineWidth = W*.011; g.lineCap = 'round';
    const aA = stride*.30, fwdX = walking ? -W*.04 : 0;
    g.beginPath(); g.moveTo(W*.009,shldrY+H*.008); g.lineTo(W*.009+Math.sin(-aA)*bH*.16, waistY+H*.01); g.stroke();
    g.beginPath(); g.moveTo(-W*.009,shldrY+H*.008); g.lineTo(-W*.009+Math.sin(aA)*bH*.16+fwdX, waistY+H*.01); g.stroke();

    // Neck
    g.fillStyle = '#c09870'; g.fillRect(-W*.007, shldrY-H*.013, W*.014, H*.020);

    // Head (profile facing left)
    g.fillStyle = '#c09870'; g.beginPath(); g.arc(0,headCy,hr,0,Math.PI*2); g.fill();
    g.beginPath();
    g.moveTo(-hr*.30,headCy-hr*.80);
    g.quadraticCurveTo(-hr*.90,headCy-hr*.42,-hr*1.0,headCy-hr*.04);
    g.quadraticCurveTo(-hr*1.14,headCy+hr*.20,-hr*.92,headCy+hr*.48);
    g.quadraticCurveTo(-hr*.86,headCy+hr*.72,-hr*.56,headCy+hr*.84);
    g.lineTo(-hr*.08,headCy+hr*.92); g.closePath(); g.fill();
    // Hachimaki headband
    g.fillStyle = '#c03010';
    g.beginPath();
    g.moveTo(-hr*.30,headCy-hr*.76);
    g.quadraticCurveTo(hr*.10,headCy-hr*1.04,hr*.90,headCy-hr*.84);
    g.lineTo(hr*.90,headCy-hr*.63);
    g.quadraticCurveTo(hr*.10,headCy-hr*.83,-hr*.30,headCy-hr*.55);
    g.closePath(); g.fill();
    // Eye
    g.fillStyle = '#28180e'; g.beginPath(); g.arc(-hr*.72,headCy-hr*.08,hr*.07,0,Math.PI*2); g.fill();

    g.restore();
  }

  let ttsDone = false;
  function maybeTTS() {
    if (ttsDone || !window.speechSynthesis) return;
    ttsDone = true;
    const utt = new SpeechSynthesisUtterance('いらっしゃいませ！');
    utt.lang = 'ja-JP'; utt.rate = 0.90; utt.pitch = 0.82; utt.volume = 0.85;
    const voices = (window.speechSynthesis.getVoices()||[]).filter(v=>v.lang.startsWith('ja'));
    if (voices.length) utt.voice = voices[voices.length-1];
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(utt);
  }

  function frame(T) {
    g.clearRect(0,0,W,H);

    // Dark overlay — Kagoshima photo shows through from behind
    g.fillStyle = 'rgba(1,3,8,0.74)';
    g.fillRect(0,0,W,H);
    drawStars(c01(T/1.5));

    // Horizon glow
    const hg = g.createLinearGradient(0,H*.28,0,H*.50);
    hg.addColorStop(0,'rgba(0,0,0,0)'); hg.addColorStop(.5,'rgba(255,90,20,.04)'); hg.addColorStop(1,'rgba(0,0,0,0)');
    g.fillStyle = hg; g.fillRect(0,H*.28,W,H*.22);

    drawRoad();

    const gndY = H*.69;

    // ── CART ROLLING IN + SETUP ──────────────────
    if (T >= 2.0) {
      const rollPh  = ph(2.0, 7.0, T);
      const cartX   = lr(W*1.22, W*.50, rollPh);
      const setupPh = ph(7.0, 10.8, T);

      drawCartYatai(cartX, gndY, rollPh, setupPh);

      // Master ahead of cart while rolling, transitions behind counter during setup
      const mSep    = lr(W*.20, 0, c01((T-6.6)/.80));
      const mX      = cartX - mSep;
      const rolling = rollPh < .96;
      const mSetPh  = c01((setupPh-.55)/.30);

      if (mSetPh < .85) {
        g.globalAlpha = 1 - c01((mSetPh-.50)/.35);
        drawMaster(mX, gndY, rolling, T, false);
        g.globalAlpha = 1;
      }
      if (mSetPh > .10) {
        g.globalAlpha = c01((mSetPh-.10)/.45);
        drawMaster(W*.50, gndY, false, T, true);
        g.globalAlpha = 1;
      }
    }

    // ── TITLE (0 – 3.5s) ─────────────────────────
    if (T < 3.5) {
      const ta = T < 1.2 ? c01(T/.90) : c01(1-(T-2.5)/1.0);
      if (ta > 0) {
        g.save();
        g.globalAlpha = ta;
        g.shadowColor = 'rgba(255,140,58,.85)'; g.shadowBlur = 32;
        g.fillStyle = '#ff8c3a';
        g.font = `bold ${Math.floor(H*.088)}px serif`;
        g.textAlign = 'center'; g.textBaseline = 'middle';
        g.fillText('夜台', W*.50, H*.40);
        g.shadowBlur = 0;
        g.font = `${Math.floor(H*.022)}px 'Segoe UI',sans-serif`;
        g.fillStyle = 'rgba(253,240,222,.60)';
        g.fillText('YATAI MASTER', W*.50, H*.40+H*.10);
        g.restore();
      }
    }

    // ── GREETING (10.2 – 11.8s) ──────────────────
    if (T > 10.2) {
      const ta = c01((T-10.2)/.80) * c01(1-(T-11.6)/.90);
      if (ta > 0) {
        maybeTTS();
        g.save();
        g.globalAlpha = ta;
        g.shadowColor = 'rgba(255,140,58,.50)'; g.shadowBlur = 20;
        g.fillStyle = '#fdf0de';
        g.font = `bold ${Math.floor(H*.044)}px serif`;
        g.textAlign = 'center'; g.textBaseline = 'middle';
        g.fillText('いらっしゃいませ！', W*.50, H*.22);
        g.shadowBlur = 0;
        g.font = `${Math.floor(H*.018)}px 'Segoe UI',sans-serif`;
        g.fillStyle = 'rgba(253,240,222,.42)';
        g.fillText('Welcome — your stall is open', W*.50, H*.22+H*.055);
        g.restore();
      }
    }

    // ── FADE TO PREP ──────────────────────────────
    if (T > 12.0) {
      g.fillStyle = `rgba(2,4,10,${c01((T-12.0)/1.4).toFixed(2)})`;
      g.fillRect(0,0,W,H);
    }
  }

  function tick(ts) {
    if (done) return;
    if (!t0) t0 = ts;
    const T = (ts - t0) / 1000;
    if (T >= TOTAL) { finish(); return; }
    if (T >= 11.8 && !doneFired) { doneFired = true; onDone(); }
    frame(T);
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

window.startGame = function() {
  AUDIO.init();
  // Chrome silently drops speak() calls that aren't rooted in a user gesture until the
  // engine has been "unlocked" by one real gesture-triggered speak() — this is that gesture.
  try { if (window.speechSynthesis) window.speechSynthesis.speak(new SpeechSynthesisUtterance('')); } catch(_) {}
  SHOP.forEach(s => { G.cart[s.id] = 0; });
  const hasSave = loadPlayerState(G.playerName);
  if (!hasSave) {
    G.day = 1; G.money = 10000; G.rep = 8;
    SHOP.forEach(s => { G.inv[s.id] = 0; });
    G.weather = WEATHER[0];
  }
  playIntro(() => {
    G.screen = 'prep';
    fullRender();
    if (window._startPrepAutoOpen) window._startPrepAutoOpen();
  });
};

window.adjustCart = function(id, delta) {
  const item = SHOP.find(s => s.id === id);
  if (!item) return;
  const spent = SHOP.reduce((n, s) => n + (G.cart[s.id] || 0) * s.price, 0);
  if (delta > 0 && G.money - spent < item.price) { toast('Not enough ¥!','err'); return; }
  G.cart[id] = Math.max(0, (G.cart[id] || 0) + delta);
  renderPrep();
};

window.openStall = function() {
  let cost = 0;
  SHOP.forEach(s => {
    const q = G.cart[s.id] || 0;
    if (q > 0) { G.inv[s.id] += q * s.qty; cost += q * s.price; G.cart[s.id] = 0; }
  });
  G.money -= cost;
  G.todayEarned = 0; G.todayServed = 0; G.todayLost = 0;
  G.dialogLog = [];
  G.gameTime = SERVICE_START;
  G.customers = [];
  G.cookSlots = [null, null, null];
  G.spawnTimer = 10;
  G.screen = 'service';
  G.isOpen = true;
  window.stallOpen = true;
  fullRender();
  // Restore the subtitle overlay to match whatever the player last had it set to,
  // rather than always forcing it off — same idea as the TV restore just below.
  const _subEl = document.getElementById('subtitle');
  if (_subEl) _subEl.style.display = G.subtitlesOn ? '' : 'none';
  startLoop();
  AUDIO.startService(G.weather?.id === 'rainy');
  // TV gets forced off between nights (endService, so its audio doesn't bleed into the
  // review/prep screens) without touching G.tvOn — restore the player's actual preference.
  if (window._tvSetOn) window._tvSetOn(!!G.tvOn);
  // endService() stops the host's broadcast loop when the night ends (MP.stopBroadcastLoop)
  // and nothing else restarts it — without this, day 2+ guests are stuck seeing whatever
  // the final "stall closed" broadcast said, forever, even though the host is actively
  // serving. Safe to call every day: startBroadcastLoop() clears any existing timer first.
  if (typeof MP !== 'undefined' && MP.roomCode && MP.startBroadcastLoop) MP.startBroadcastLoop();
  // Seed the AI-outfit pool right away, then keep it topped up while open.
  if (window._requestLlmOutfit) {
    window._requestLlmOutfit();
    clearInterval(window._llmOutfitTimer);
    window._llmOutfitTimer = setInterval(() => window._requestLlmOutfit(), 25000);
  }
};

window.cookItem = function(id) {
  const item = MENU.find(m => m.id === id);
  if (!item) return;
  const shopItem = SHOP.find(s => s.forItem === id);
  if (!shopItem || G.inv[shopItem.id] <= 0) { toast('Out of stock!', 'err'); return; }
  const empty = G.cookSlots.findIndex(s => s === null);
  if (empty === -1) { toast('All slots busy!', 'err'); return; }
  G.inv[shopItem.id]--;
  G.cookSlots[empty] = { item, state:'cooking', elapsed:0, progress:0 };
  toast(`${item.icon} Preparing ${item.en}…`, 'info');
  try { AUDIO.playSizzle(); } catch(_) {}
  try { const el = document.getElementById('cook-area'); if (el) el.innerHTML = buildCookSlots(); } catch(_) {}
  try { const el = document.getElementById('menu-grid'); if (el) el.innerHTML = buildMenuItems(); } catch(_) {}
};

window.tapSlot = function(i) {
  const slot = G.cookSlots[i];
  if (!slot || slot.state !== 'ready') return;
  const cust = G.customers.find(c => c.state === 'wait' && c.order && c.order.id === slot.item.id);
  if (cust) {
    doServe(cust, i);
  } else {
    G.cookSlots[i] = null;
    toast(`${slot.item.icon} Discarded — no one waiting`, 'info');
  }
  try { const el = document.getElementById('cook-area'); if (el) el.innerHTML = buildCookSlots(); } catch(_) {}
};

window.toggleMute = function() { AUDIO.toggle(); };

window.toggleAutoCook = function(cb) {
  G.autoCook = cb.checked;
};

window.toggleSubtitles = function(cb) {
  G.subtitlesOn = cb.checked;
  const el = document.getElementById('subtitle');
  if (el) el.style.display = cb.checked ? '' : 'none';
};

window.nextDay = function() {
  G.day++;
  G._permanentSeenToday = {}; // permanent NPCs (e.g. Gondō) can appear again today
  const r = Math.random();
  if (r < 0.05 && G.day > 2) G.weather = WEATHER[3];
  else if (r < 0.20) G.weather = WEATHER[2];
  else if (r < 0.40) G.weather = WEATHER[1];
  else G.weather = WEATHER[0];
  savePlayerState();
  G.screen = 'prep';
  fullRender();
  if (window._startPrepAutoOpen) window._startPrepAutoOpen();
};

// Called from game loop — fast partial update
function renderService() {
  if (G.screen !== 'service') return;

  // HUD
  const hudTime = document.getElementById('hud-time');
  const hudMoney = document.getElementById('hud-money');
  const hudRep = document.getElementById('hud-rep');
  if (hudTime) hudTime.textContent = G.timeStr;
  if (hudMoney) hudMoney.textContent = `¥${G.money.toLocaleString()}`;
  if (hudRep) hudRep.textContent = '⭐'.repeat(G.stars) + '☆'.repeat(5 - G.stars);

  // Time bar
  const tf = document.getElementById('time-bar-fill');
  if (tf) {
    const pct = (G.gameTime - SERVICE_START) / (SERVICE_END - SERVICE_START);
    tf.style.width = `${Math.min(pct * 100, 100)}%`;
  }

  // Cook slots — only update progress bars in-place; full rebuild happens on state changes
  for (let i = 0; i < G.cookSlots.length; i++) {
    const s = G.cookSlots[i];
    if (s && s.state === 'cooking') {
      const bar = document.getElementById('slot-prog-' + i);
      if (bar) bar.style.width = (s.progress * 100) + '%';
    }
  }

  // Customers
  try { const cl = document.getElementById('customer-list'); if (cl) cl.innerHTML = buildCustList(); } catch(_) {}

  // Player roster
  try { const pr = document.getElementById('player-roster'); if (pr) pr.innerHTML = buildPlayerRoster(); } catch(_) {}

  // Stats
  const sr = document.getElementById('stats-row');
  if (sr) sr.innerHTML = buildStatsRow();
}

function renderPrep() {
  // Quick re-render prep screen in-place
  const root = document.getElementById('root');
  root.innerHTML = buildPrepShell();
}

function buildPrepShell() {
  const spent = SHOP.reduce((n, s) => n + (G.cart[s.id] || 0) * s.price, 0);
  const remaining = G.money - spent;
  const w = G.weather || WEATHER[0];

  const shopHtml = SHOP.map(item => {
    const menuItem = MENU.find(m => m.id === item.forItem);
    const unlocked = menuItem && menuItem.day <= G.day;
    const qty = G.cart[item.id] || 0;
    const curStock = G.inv[item.id] || 0;
    const canBuy = remaining >= item.price;

    if (!unlocked) return `
      <div class="shop-item locked">
        <div class="shop-icon">${item.icon}</div>
        <div class="shop-info">
          <div class="shop-name">${item.name}</div>
          <div class="shop-jp">${item.jp}</div>
          <div class="shop-price">Unlocks Day ${menuItem?.day || '?'}</div>
        </div>
      </div>`;

    return `
      <div class="shop-item">
        <div class="shop-icon">${item.icon}</div>
        <div class="shop-info">
          <div class="shop-name">${item.name}</div>
          <div class="shop-jp">${item.jp}</div>
          <div class="shop-price">¥${item.price} → ${item.qty} serving${item.qty > 1 ? 's' : ''}</div>
          <div class="shop-stock${curStock === 0 ? ' out' : curStock < 10 ? ' low' : ''}">Stock: ${curStock + qty * item.qty}</div>
        </div>
        <div class="qty-ctrl">
          <button class="qty-btn" onclick="adjustCart('${item.id}',1)" ${!canBuy?'disabled':''}>+</button>
          <span class="qty-val">${qty}</span>
          <button class="qty-btn" onclick="adjustCart('${item.id}',-1)" ${qty<=0?'disabled':''}>−</button>
        </div>
      </div>`;
  }).join('');

  return `<div class="screen">
    <div id="prep-wrap">
      <div class="prep-hdr">
        <h2>🌅 Day ${G.day} — Morning Prep</h2>
        <p>Purchase ingredients before evening service</p>
        <div class="weather-badge">${w.icon} ${w.name}${w.desc ? ' — ' + w.desc : ''}</div>
      </div>

      <div class="money-big">¥${G.money.toLocaleString()}</div>

      <div class="shop-grid">${shopHtml}</div>

      <div class="cart-summary">
        <div class="cart-row"><span>Spent</span><span class="cart-val gold">¥${spent.toLocaleString()}</span></div>
        <div class="cart-row"><span>Remaining</span><span class="cart-val">¥${remaining.toLocaleString()}</span></div>
      </div>

      ${G.day > 1 ? `<div style="text-align:center; font-size:12px; color:var(--dim)">
        Reputation: ${'⭐'.repeat(G.stars)}${'☆'.repeat(5-G.stars)} (${G.rep}/100)
      </div>` : ''}

      <button class="btn btn-primary btn-full" onclick="openStall()">🏮 Open for Evening Service →</button>
      <div id="prep-countdown" style="margin-top:8px;font-size:11px;opacity:.55;text-align:center"></div>
    </div>
  </div>`;
}

// Auto-opens the stall 30s after the prep screen appears. Ticks look up the countdown
// element fresh each second (rather than caching it) since adjustCart() re-renders the
// whole prep shell on every +/- click; a stale G.screen check (set by openStall() or by
// leaving the screen) cancels it either way.
window._startPrepAutoOpen = function() {
  let secondsLeft = 30;
  const tick = () => {
    const el = document.getElementById('prep-countdown');
    if (G.screen !== 'prep' || !el) return;
    if (secondsLeft <= 0) { openStall(); return; }
    el.textContent = `Auto-opening in ${secondsLeft}s…`;
    secondsLeft--;
    setTimeout(tick, 1000);
  };
  tick();
};

window.autoRestock = function() {
  const TARGET = 10;
  let totalCost = 0;
  const purchases = [];
  for (const item of G.unlockedMenu) {
    const si = SHOP.find(s => s.forItem === item.id);
    if (!si) continue;
    const cur = G.inv[si.id] || 0;
    if (cur >= TARGET) continue;
    const batches = Math.ceil((TARGET - cur) / si.qty);
    const cost = batches * si.price;
    if (G.money - totalCost < cost) continue;
    totalCost += cost;
    purchases.push({ si, batches });
  }
  if (!purchases.length) { toast('All stocked to 10+', 'info'); return; }
  for (const { si, batches } of purchases) G.inv[si.id] = Math.min(99, (G.inv[si.id] || 0) + batches * si.qty);
  G.money -= totalCost;
  toast(`Restocked! -¥${totalCost.toLocaleString()}`, 'info');
  const mg = document.getElementById('menu-grid'); if (mg) mg.innerHTML = buildMenuItems();
  const mon = document.getElementById('hud-money'); if (mon) mon.textContent = '¥' + G.money.toLocaleString();
};

function buildMenuItems() {
  const hasEmpty = G.cookSlots.some(s => s === null);
  const waiting = {};
  G.customers.filter(c => c.state === 'wait' && c.order).forEach(c => {
    waiting[c.order.id] = (waiting[c.order.id] || 0) + 1;
  });
  return G.unlockedMenu.filter(item => {
    const si = SHOP.find(s => s.forItem === item.id);
    return si ? G.inv[si.id] > 0 : false;
  }).map(item => {
    const si = SHOP.find(s => s.forItem === item.id);
    const stock = si ? G.inv[si.id] : 0;
    const canCook = stock > 0 && hasEmpty;
    const w = waiting[item.id] || 0;
    const cls = !hasEmpty ? 'no-slot' : '';
    return `<button class="menu-btn ${cls}" data-cook="${item.id}" onclick="window.cookItem('${item.id}')">
      <div class="icon">${item.icon}</div>
      <div class="en">${item.en}</div>
      <div class="jp">${item.name}</div>
      <div class="price">¥${item.price}</div>
      <div class="stock">${stock} left</div>
      ${w > 0 ? `<div style="font-size:10px;font-weight:700;color:var(--red-l);margin-top:1px">${w} waiting</div>` : ''}

  }).join('');
}

// Auto-advances to the next day 30s after the review screen appears, so the player
// doesn't have to sit on the summary screen — a manual click on "Start Day" (which
// changes G.screen away from 'review') cancels it.
window._startReviewAutoAdvance = function() {
  let secondsLeft = 30;
  const tick = () => {
    const el = document.getElementById('review-countdown');
    if (G.screen !== 'review' || !el) return; // cancelled — manually advanced or navigated away
    if (secondsLeft <= 0) { nextDay(); return; }
    el.textContent = `Auto-continuing in ${secondsLeft}s…`;
    secondsLeft--;
    setTimeout(tick, 1000);
  };
  tick();
};
